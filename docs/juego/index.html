<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guardia virtual de ¡Vaya Turno!: el juego de cartas de triage en UCI, contra la máquina o entre dos en el mismo teléfono.">
<meta name="theme-color" content="#0a5860">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="¡Vaya Turno!">
<link rel="stylesheet" href="tipos/tipos.css">
<title>Guardia Virtual</title>

<style>
/* Tablero de una sola cara: modo claro fijo a propósito — se juega bajo la
   luz del control de enfermería. Nada hereda el tema del navegador. */
:root{
  --mesa:#dfe7ea; --lejos:#d5e0e4; --cerca:#f2f7f8; --paper:#ffffff;
  --ink:#16242e; --ink-2:#4c6675; --ink-3:#87a0ad;
  --line:#c7d6db; --line-2:#e3ecef;
  --acc:#0d6e78; --acc-ink:#ffffff; --acc-soft:#d5e9eb;
  --vida:#c0492f; --ok:#237a5b; --warn:#96660d; --basura:#7f52bb;
  --resp:#3d7ea6; --card:#b03d29; --neuro:#7a5ba6; --metab:#2f8f6b; --quir:#8a6a2f;
  --sombra:0 1px 2px rgba(22,36,46,.08), 0 3px 10px rgba(22,36,46,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(130% 100% at 50% 0%, #e6edf0 0%, var(--mesa) 52%, #ccd9d3 100%) fixed;
     color:var(--ink);
     font-family:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
     font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;
     overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;
     display:flex;flex-direction:column;background:var(--mesa)}

/* iconos de tipo: SVG, no emoji — el emoji de radiografía y el de personal
   sanitario no existen en muchos teléfonos y salían como cuadrado */
.ico{display:inline-flex;align-items:center;justify-content:center;
     width:1em;height:1em;flex:none;vertical-align:-.14em}
.ico svg{width:100%;height:100%;display:block}
.t-IMAGEN{color:#3d7ea6} .t-FARMACOS{color:#b03d29}
.t-PERSONAL{color:#2f8f6b} .t-PROCEDIMIENTOS{color:#7a5ba6}
.t-COMODIN{color:#8a6a2f}

/* ── barra superior ─────────────────────────────────────────────────── */
.estado{flex:none;background:var(--paper);border-bottom:1px solid var(--line);
        padding:7px 10px;display:flex;align-items:center;gap:8px}
.ronda{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
       color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ronda b{color:var(--ink);font-size:14px}
.fase-chip{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
           background:var(--acc);color:var(--acc-ink);padding:3px 7px;border-radius:99px;
           white-space:nowrap}
.espacio{flex:1}
.icono-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
           background:var(--cerca);font-size:15px;line-height:1;flex:none}
.guia{flex:none;background:var(--acc-soft);border-bottom:1px solid var(--line);
      padding:7px 10px;font-size:12.5px;line-height:1.3}

/* ── zonas ──────────────────────────────────────────────────────────── */
.zona{padding:7px 10px}
.zona.lejos{background:linear-gradient(180deg,#cdd9de,var(--lejos) 60%);
            border-bottom:1px solid var(--line);
            box-shadow:inset 0 -10px 16px -14px rgba(22,36,46,.35)}
.zona.cerca{background:linear-gradient(180deg,#e9f1f2,var(--cerca) 45%);
            flex:1;display:flex;flex-direction:column}
.jugador-linea{display:flex;align-items:center;gap:7px;margin-bottom:6px;
               font-size:11px;color:var(--ink-2)}
.jugador-linea b{color:var(--ink);font-size:13px;font-weight:700}
.marca{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
       font-variant-numeric:tabular-nums;white-space:nowrap}
.marca.al{color:var(--ok)} .marca.su{color:var(--warn)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}

/* ── banda central: la mesa compartida ──────────────────────────────── */
.centro{flex:none;background:var(--mesa);border-top:1px solid var(--line);
        border-bottom:1px solid var(--line);padding:6px 10px 8px}
.centro-info{display:flex;align-items:center;gap:8px;margin-bottom:6px;
             font-family:"IBM Plex Mono",monospace;font-size:9.5px;
             letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.centro-info .sep{flex:1;height:1px;background:var(--line)}
.pizarra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prot{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px;text-align:left;box-shadow:var(--sombra);display:flex;
      flex-direction:column;gap:3px;min-height:92px;position:relative}
.prot.no{opacity:.5}
.prot.puede{border-color:var(--acc);animation:compable 2.4s ease-in-out infinite}
@keyframes compable{
  0%,100%{box-shadow:0 0 0 0 rgba(13,110,120,0),var(--sombra)}
  50%{box-shadow:0 0 0 3px rgba(13,110,120,.18),var(--sombra)}}
.prot-cab{display:flex;align-items:center;gap:4px}
/* la gema de coste: el "maná" de la Pizarra */
.coste{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;
       width:19px;height:19px;border-radius:99px;flex:none;
       display:inline-flex;align-items:center;justify-content:center;
       background:linear-gradient(180deg,#118491,#0a5860);color:#fff;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(9,25,32,.25)}
.prot.no .coste{background:var(--ink-3);box-shadow:none}
.prot-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
           letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prot-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.prot-txt{font-size:8.5px;line-height:1.25;color:var(--ink-2)}

/* ── cama ───────────────────────────────────────────────────────────── */
.cama{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px 6px 6px 8px;position:relative;overflow:hidden;
      box-shadow:var(--sombra);text-align:left;width:100%;display:block}
.cama.vacia{background:transparent;border-style:dashed;box-shadow:none;
            color:var(--ink-3);text-align:center;padding:16px 4px;font-size:10px;
            letter-spacing:.1em;text-transform:uppercase;min-height:70px}
.cama.est{border-color:var(--ok);background:#f4fbf8}
.cama.blanco{border-color:var(--acc);cursor:pointer;
             animation:respira 1.1s ease-in-out infinite}
@keyframes respira{
  0%,100%{box-shadow:0 0 0 2px var(--acc-soft),var(--sombra)}
  50%{box-shadow:0 0 0 4px rgba(13,110,120,.34),0 4px 14px rgba(13,110,120,.22)}}
.cama.sobre{box-shadow:0 0 0 3px var(--acc),0 6px 18px rgba(13,110,120,.3);
            transform:translateY(-2px) scale(1.02);animation:none}
.raya{position:absolute;left:0;top:0;bottom:0;width:3px}
.cama-cab{display:flex;align-items:flex-start;gap:4px}
.pnom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11.5px;
      line-height:1.12;flex:1;min-height:26px}
.faltan{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:700;
        color:var(--acc);line-height:1;flex:none;font-variant-numeric:tabular-nums}
.faltan.cero{color:var(--ok)}
.grav{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
      color:var(--ink-3);display:block;margin-top:2px}
/* semáforo de gravedad: chip de color junto al nombre */
.gchip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;
       font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
       color:#fff;flex:none;line-height:1;margin-top:1px}
.g-I{background:#237a5b} .g-II{background:#b57e14}
.g-III{background:#c0492f} .g-ROJO{background:#7c1310}
.corazones{display:flex;gap:1px;align-items:center;margin:4px 0 5px;flex-wrap:wrap}
.cz{display:inline-flex;width:11px;height:11px;color:var(--vida);flex:none}
.cz svg{width:100%;height:100%;display:block}
.cong{display:inline-flex;align-items:center;gap:2px;font-size:7.5px;font-weight:700;
      letter-spacing:.04em;text-transform:uppercase;color:var(--ok);margin-left:4px}
.cong svg{width:7px;height:7px;flex:none}
.num{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
     color:var(--ink-2);margin-left:4px;font-variant-numeric:tabular-nums}
.reqs{display:flex;flex-direction:column;gap:2.5px}
.req{display:flex;align-items:center;gap:3px;font-size:9px;line-height:1}
.req .ico{font-size:12.5px}
.casillas{display:flex;gap:1.5px;flex-wrap:wrap;flex:1}
.cas{width:6px;height:6px;border-radius:1.5px;border:1px solid var(--ink-3);flex:none}
.cas.full{background:var(--acc);border-color:var(--acc)}
.cas.extra{background:var(--ink-3);border-color:var(--ink-3)}
.resta{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
       color:var(--ink);min-width:9px;text-align:right;font-variant-numeric:tabular-nums}
.resta.ok{color:var(--ok)}
.sellos{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.sello{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       padding:1.5px 4px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.sello.ok{color:var(--ok)} .sello.bas{color:var(--basura)}
.sello.esc{color:var(--acc)} .sello.pro{color:var(--ok);border-style:dashed}
.cama-btn{display:block;width:100%;margin-top:5px;padding:5px 4px;border-radius:6px;
          background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:700;
          text-align:center}
.cama-btn.sec{background:var(--cerca);color:var(--ink-2);border:1px solid var(--line)}

/* ── tu papeleo ─────────────────────────────────────────────────────── */
.tira{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;
      padding-top:8px;border-top:1px dashed var(--line)}
.ficha{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
       padding:4px 8px;border-radius:99px;background:var(--paper);
       border:1px solid var(--line);color:var(--ink-2)}
.ficha.sum{color:var(--warn);border-color:var(--warn)}
.ficha.pro{color:var(--acc);border-color:var(--acc)}
.ficha b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.tira .vacio{font-size:10px;color:var(--ink-3);font-style:italic}

/* ── pie: mano + acciones ───────────────────────────────────────────── */
/* v0.39: la mano flota SOBRE el tablero (estilo Pocket): sin panel sólido,
   el juego se ve debajo y solo las cartas y los controles reciben el dedo */
.pie{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;
     background:transparent;z-index:45;pointer-events:none}
.pie::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;
     background:linear-gradient(180deg,transparent,rgba(22,36,46,.12));
     pointer-events:none;z-index:-1}
.pie .acciones,.pie .mano-rot{pointer-events:auto}
/* el tablero reserva solo una franja abajo: el resto queda a la vista */
.app{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}

/* mientras arrastras una carta, la mano se aparta para despejar tus camas */
body.arrastrando .pie .mano,body.arrastrando .pie .mano-rot,
body.arrastrando .pie .acciones{opacity:0;pointer-events:none;
     transition:opacity .15s ease}

/* la mano plegada: una pastilla para volver a abrirla */
.mano-cerrada{display:flex;justify-content:flex-end;padding:0 10px 10px;
     pointer-events:none}
.mano-cerrada button{pointer-events:auto;display:flex;align-items:center;gap:7px;
     padding:9px 14px;border-radius:99px;background:var(--paper);
     border:1px solid var(--line);box-shadow:0 4px 16px rgba(22,36,46,.18);
     font-weight:700;font-size:12.5px}
.mano-rot{margin:2px 8px 4px;padding:4px 8px 4px 12px;font-size:10px;
          font-weight:700;letter-spacing:.09em;text-transform:uppercase;
          color:var(--ink-2);display:flex;gap:6px;align-items:center;
          white-space:nowrap;background:rgba(255,255,255,.88);
          -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
          border:1px solid var(--line);border-radius:99px;
          box-shadow:0 2px 10px rgba(22,36,46,.1)}
.mano-rot span{flex:1;height:1px;background:var(--line-2)}
/* Las indicaciones son LA moneda del turno: se ven grandes, y cada gasto
   se anima desde la cama donde ocurrió hasta el contador. */
.indic-caja{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;
            border-radius:99px;background:var(--acc-soft);color:var(--ink);
            letter-spacing:.02em;text-transform:none;font-size:11.5px;
            font-weight:700;border:1px solid rgba(13,110,120,.28)}
.indic-caja i{width:14px;height:14px;border-radius:99px;flex:none;
            background:radial-gradient(circle at 34% 30%,#3ea7b0,var(--acc) 62%,#0a5860);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 1px 2px rgba(9,25,32,.3)}
.indic-caja i.off{background:transparent;box-shadow:none;
            border:2px dashed rgba(13,110,120,.35)}
.indic-caja i.apaga{animation:apagaIndic .5s cubic-bezier(.3,1,.4,1) forwards}
@keyframes apagaIndic{
  0%{transform:scale(1.5);box-shadow:0 0 0 6px rgba(13,110,120,.3)}
  60%{transform:scale(.85)}
  100%{transform:scale(1);background:transparent;box-shadow:none;
       border:2px dashed rgba(13,110,120,.35)}}
.indic-caja.vacio{background:#fbeee0;border-color:#d9a441;color:#7a5209}
.indic-caja.vacio i.off{border-color:rgba(122,82,9,.35)}

/* la ficha que viaja de la cama al contador */
.ficha-indic{position:fixed;z-index:84;width:20px;height:20px;border-radius:99px;
            margin:-10px 0 0 -10px;pointer-events:none;
            background:radial-gradient(circle at 34% 30%,#5fc2ca,var(--acc) 60%,#0a5860);
            box-shadow:0 0 0 4px rgba(13,110,120,.22), 0 4px 12px rgba(9,25,32,.35);
            transition:transform .5s cubic-bezier(.5,0,.6,.5), opacity .5s ease}

/* cada acción dice lo que cuesta, como las gemas de la Pizarra */
.cama-btn .precio{display:inline-block;width:9px;height:9px;border-radius:99px;
            background:currentColor;margin-left:6px;vertical-align:middle;
            opacity:.85}
.mano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
      padding:8px;margin:0 8px;pointer-events:auto;
      background:rgba(255,255,255,.93);border:1px solid var(--line);
      border-radius:12px;box-shadow:0 6px 22px rgba(22,36,46,.16);
      -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (max-width:349px){.mano{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ── la mano en abanico (v0.37) ──────────────────────────────────────
   Las cartas se solapan en arco; deslizas para navegar y la del centro
   crece hasta ser legible de verdad. La cuadrícula sigue existiendo:
   sirve para comparar las 6 de un vistazo y para marcar descartes.   */
.mano.abanico{display:block;position:relative;height:192px;padding:0;margin:0;
              overflow:visible;background:none;border:0;box-shadow:none;
              -webkit-backdrop-filter:none;backdrop-filter:none;
              pointer-events:none;
              /* touch-action none: en el teléfono el navegador se quedaba con
                 el gesto (pan) y el hojeo nunca recibía los pointermove */
              touch-action:none}
.mano.abanico .ranura{pointer-events:auto;touch-action:none}
.ranura{position:absolute;left:50%;bottom:16px;width:118px;
        transform:translateX(calc(-50% + var(--x))) translateY(var(--y))
                  rotate(var(--a)) scale(var(--s));
        transform-origin:50% 135%;will-change:transform;
        transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .2s ease;
        z-index:var(--z)}
/* mientras el dedo está abajo, las cartas lo siguen 1:1 — sin animación
   intermedia, que era lo que se sentía trabado */
.mano.abanico.vivo .ranura{transition:opacity .2s ease}
.ranura.lejos{opacity:0;pointer-events:none}
.abanico .carta{width:100%;min-height:132px;padding:8px}
.abanico .carta .carta-nom{font-size:13px}
.abanico .carta .carta-tipo{font-size:8.5px}
.abanico .carta .etiq{font-size:8.5px;padding:2px 5px}
.abanico .carta .carta-pie{font-size:9.5px}
.ranura.foco .carta{box-shadow:0 10px 26px rgba(22,36,46,.26),
                               0 3px 8px rgba(22,36,46,.14)}
.ranura.foco .carta.no{opacity:.55}
/* la pista de que hay más cartas a los lados */
.abanico-borde{display:none}
.puntos-mano{position:absolute;left:0;right:0;bottom:0;z-index:41;display:flex;
             gap:4px;justify-content:center;pointer-events:none}
.puntos-mano i{width:5px;height:5px;border-radius:99px;background:var(--line)}
.puntos-mano i.on{background:var(--acc);width:14px}
.mano-modo{margin-left:auto;font-size:13px;line-height:1;color:var(--ink-2);
           border:1px solid var(--line);border-radius:8px;width:30px;height:24px;
           background:var(--cerca);flex:none}

/* ── la carta en grande ──────────────────────────────────────────── */
/* el avatar como carta activa (estilo TCG Pocket, invertido) */
.activo{display:flex;align-items:center;gap:9px;margin-top:8px;position:relative;
        background:var(--paper);border:1px solid var(--line);border-radius:10px;
        padding:8px 10px 8px 13px;box-shadow:var(--sombra);overflow:hidden}
.activo .raya{background:var(--acc)}
.activo-rol{font-family:"IBM Plex Mono",monospace;font-size:8px;font-weight:600;
            letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.activo-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:14.5px;
            line-height:1.1}
.activo-info{flex:1;min-width:0}
.av-chip{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;
         color:var(--ink);background:var(--paper);border:1px solid var(--line);
         border-radius:7px;padding:2.5px 8px;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;max-width:40vw;box-shadow:var(--sombra)}

/* recursos jugados como energías: una ficha de color por carta puesta */
.energias{display:flex;gap:2.5px;flex-wrap:wrap;margin:0 0 4px;align-items:center}
.energia{width:8.5px;height:8.5px;border-radius:99px;flex:none;
         box-shadow:inset 0 -1.5px 1.5px rgba(0,0,0,.28),
                    inset 0 1px 1px rgba(255,255,255,.5),
                    0 0 0 1px rgba(22,36,46,.12)}
.energia.brote{animation:brote .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes brote{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.energias .mas{font-family:"IBM Plex Mono",monospace;font-size:8px;
               color:var(--ink-3);font-weight:700}

/* la Pizarra vive en un cajón: el centro queda para los mazos */
.btn-pizarra{display:flex;align-items:center;gap:7px;width:100%;padding:8px 11px;
             border-radius:9px;border:1px solid var(--line);background:var(--paper);
             box-shadow:var(--sombra);font-weight:700;font-size:12.5px}
.btn-pizarra .gemas{display:flex;gap:3px;margin-left:auto}
.btn-pizarra.puede{border-color:var(--acc);animation:compable 2.4s ease-in-out infinite}
.btn-pizarra .flecha{color:var(--ink-3);font-size:14px}

/* ── la rueda de personajes: carrusel circular sin tope ──────────────
   Los 3 giran sobre un eje vertical; deslizas y da la vuelta completa. */
.rueda{position:relative;height:270px;margin:4px 0 10px;perspective:800px;
       touch-action:none;overflow:hidden}
.rueda .op.av-carta{position:absolute;left:50%;top:6px;width:232px;
       margin-left:-116px;padding:14px 14px 12px;text-align:left;
       background:var(--paper);border:1px solid var(--line);border-radius:13px;
       box-shadow:0 8px 24px rgba(22,36,46,.16);
       transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
       will-change:transform}
.rueda.viva .op.av-carta{transition:none}
.av-rol{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
        letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}

/* plegar la mano vive APARTE de la mano: botón redondo, arriba a la
   derecha del abanico, lejos de las cartas y de los otros controles */
.btn-plegar{position:absolute;right:8px;top:-14px;width:42px;height:42px;
       border-radius:99px;background:rgba(255,255,255,.94);z-index:44;

       font-size:16px;line-height:1;color:var(--ink-2);pointer-events:auto}

.grande{background:var(--paper);border-radius:14px;border:1px solid var(--line);
        border-left:5px solid var(--line);padding:14px;
        box-shadow:0 10px 30px rgba(22,36,46,.2)}
.grande .g-cab{display:flex;align-items:center;gap:6px;
               font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
               letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grande .g-cab .ico{font-size:19px}
.grande h3{font-family:Petrona,Georgia,serif;font-size:23px;line-height:1.1;
           margin:6px 0 8px;font-weight:700}
.grande .g-etiqs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.grande .g-etiqs .etiq{font-size:10px;padding:3px 8px}
.grande .g-txt{font-size:13px;line-height:1.45;color:var(--ink-2)}
.grande .g-warn{margin-top:10px;padding:9px 11px;border-radius:9px;

.grande .g-frase{margin-top:10px;font-family:Petrona,Georgia,serif;
                 font-style:italic;font-size:13px;color:var(--ink-3);line-height:1.4}
.grande-nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.grande-nav .cual{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;
                  font-size:11px;color:var(--ink-3)}
.nav-btn{width:42px;height:42px;border-radius:99px;border:1px solid var(--line);
         background:var(--cerca);font-size:17px;line-height:1;flex:none}
.nav-btn:disabled{opacity:.35}
.carta{width:auto;background:var(--paper);border:1px solid var(--line);
       border-left-width:3px;
       border-radius:8px;padding:6px;text-align:left;box-shadow:var(--sombra);
       display:flex;flex-direction:column;gap:2px;min-height:104px;
       transition:transform .14s ease, box-shadow .14s ease;touch-action:none}
@media (hover:hover){
  .carta:not(.no):not(.sel):hover{transform:translateY(-4px);
    box-shadow:0 6px 16px rgba(22,36,46,.16), 0 2px 5px rgba(22,36,46,.1)}}
.carta.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 8px 18px rgba(13,110,120,.22);
           transform:translateY(-6px)}
/* reparto: las recién robadas entran en cascada */
.carta.nueva{animation:repartir .42s cubic-bezier(.22,1.2,.36,1) backwards;
             animation-delay:calc(var(--i,0)*60ms)}
@keyframes repartir{
  0%{opacity:0;transform:translateY(26px) rotate(2.5deg) scale(.92)}
  100%{opacity:1;transform:none}}
.carta.no{opacity:.38}
.carta.fantasmal{opacity:.25}
/* arte de carta: aparece solo si cartas/arte/<id>.* existe */
.carta .arte{height:44px;border-radius:5px;margin:-2px -2px 2px;
             background-size:cover;background-position:center top;flex:none}
.abanico .carta .arte{height:58px}
.grande .g-arte{height:160px;border-radius:10px;margin-bottom:10px;
                background-size:cover;background-position:center 25%}
.av-carta .av-arte{height:92px;border-radius:9px;margin:-4px -4px 8px;
                   background-size:cover;background-position:center 20%}
.pfoto{width:24px;height:24px;border-radius:6px;flex:none;
       background-size:cover;background-position:center;margin-right:1px}
.carta-cab{display:flex;align-items:center;gap:3px}
.carta-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;

.carta-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.etiq{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;padding:1.5px 4px;border-radius:99px;
      border:1px solid currentColor;align-self:flex-start;white-space:nowrap}
.etiq.w{color:var(--warn)} .etiq.s{color:var(--ok)}
.etiq.x2{color:var(--acc)} .etiq.r{color:var(--quir)}
.carta-pie{margin-top:auto;font-size:8.5px;color:var(--ink-3);line-height:1.2}

/* el naipe que sigue al dedo */
.fantasma{position:fixed;left:0;top:0;z-index:90;pointer-events:none;
          width:104px;opacity:.94;transform-origin:center;
          box-shadow:0 12px 28px rgba(22,36,46,.35);border-radius:8px;
          rotate:-4deg}

.acciones{display:flex;gap:6px;padding:0 10px 10px}
.pie .acciones .btn{box-shadow:0 4px 14px rgba(22,36,46,.18)}
.pie .acciones .btn:not(.pri){background:rgba(246,250,250,.95);
     -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn{flex:1;padding:11px 8px;border-radius:8px;border:1px solid var(--line);
     background:var(--cerca);font-weight:600;font-size:13px;text-align:center;
     transition:transform .12s ease, box-shadow .12s ease, filter .12s ease}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,#118491,var(--acc) 55%,#0a5860);
         color:var(--acc-ink);border-color:#0a5860;
         box-shadow:0 2px 6px rgba(13,110,120,.32), inset 0 1px 0 rgba(255,255,255,.22)}
.btn:not(:disabled):active{transform:translateY(1px) scale(.985);filter:brightness(.96)}
@media (hover:hover){
  .btn:not(:disabled):hover{transform:translateY(-1px)}
  .btn.pri:not(:disabled):hover{box-shadow:0 4px 12px rgba(13,110,120,.4), inset 0 1px 0 rgba(255,255,255,.22)}
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.chico{flex:none;padding:7px 10px;font-size:11.5px}

/* ── hojas y modales ────────────────────────────────────────────────── */
.velo{position:fixed;inset:0;z-index:60;background:rgba(14,26,33,.6);
      display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--paper);border-radius:16px 16px 0 0;max-width:600px;width:100%;
       max-height:88vh;overflow-y:auto;padding:16px 14px 22px;
       box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.modal h2{font-size:16px;margin:0 0 4px}
.modal p{font-size:13px;color:var(--ink-2);margin:0 0 12px;line-height:1.4}
.tirador{width:34px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.opciones{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.op{width:100%;text-align:left;padding:10px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--cerca)}
.op b{display:block;font-family:Petrona,Georgia,serif;font-size:14.5px}
.op small{color:var(--ink-2);font-size:11px;display:block;margin-top:2px}
.op.sel{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.marcador{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}
.mtile{background:var(--cerca);border:1px solid var(--line);border-radius:9px;padding:8px}
.mtile .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;
          font-variant-numeric:tabular-nums;line-height:1}
.mtile .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
          color:var(--ink-3);margin-top:3px}
.bloque{margin-bottom:14px}
.bloque h3{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
           color:var(--ink-3);margin:0 0 6px}
.log{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.45;
     max-height:200px;overflow-y:auto;color:var(--ink-2);
     border:1px solid var(--line);border-radius:8px;padding:8px}
.log div{padding:1.5px 0;border-bottom:1px solid var(--line-2)}
.log .r{color:var(--ink);font-weight:600;padding-top:6px}
.log .m{color:var(--vida)} .log .a{color:var(--ok)}
.nota{font-size:11px;color:var(--ink-3);line-height:1.4}

.franja{position:fixed;left:0;right:0;top:36%;z-index:80;text-align:center;
        background:var(--acc);color:#fff;padding:16px 0;pointer-events:none;
        font-family:Petrona,Georgia,serif;font-size:27px;font-weight:700;
        letter-spacing:.08em;box-shadow:0 10px 34px rgba(9,25,32,.35);
        animation:franja 1.6s ease forwards}
@keyframes franja{0%{opacity:0;transform:translateY(10px)}14%{opacity:1;transform:none}
                  78%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.franja{animation:none}}

.prot-mios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;
           margin-top:8px}
.prot-btn{margin-top:auto;padding:6px 4px;border-radius:6px;background:var(--acc);
          color:var(--acc-ink);font-size:10px;font-weight:700;text-align:center;
          letter-spacing:.03em}
.prot-btn.no{background:var(--cerca);color:var(--ink-3);border:1px solid var(--line)}

.ficha.hab{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
.ficha.hab.no{background:var(--cerca);color:var(--ink-3);border-color:var(--line)}
.hab-desc{margin-top:7px;padding:9px 11px;border-radius:9px;background:var(--paper);
          box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;line-height:1.4;
          color:var(--ink-2)}
.hab-desc b{color:var(--ink)}

.cortina{position:fixed;inset:0;z-index:70;background:var(--acc);color:#fff;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:14px;padding:24px;text-align:center}
.cortina h2{font-family:Petrona,Georgia,serif;font-size:26px;margin:0}
.cortina p{font-size:14px;opacity:.85;margin:0;max-width:22em}
.cortina .btn{flex:none;background:#fff;color:var(--acc);border-color:#fff;
              padding:13px 28px;font-size:15px}

/* ── pulso de juego (v0.34): la mesa responde a lo que pasa ─────────── */
.cama.golpe{animation:golpe .42s ease}
@keyframes golpe{
  0%,100%{transform:none}
  18%{transform:translateX(-4px) rotate(-.7deg)}
  40%{transform:translateX(3px) rotate(.5deg)}
  62%{transform:translateX(-2px)} 80%{transform:translateX(1px)}}
.cama.progreso{animation:progreso .55s ease}
@keyframes progreso{
  0%{box-shadow:0 0 0 0 rgba(13,110,120,.4),var(--sombra)}
  60%{box-shadow:0 0 0 5px rgba(13,110,120,.16),var(--sombra)}
  100%{box-shadow:0 0 0 0 rgba(13,110,120,0),var(--sombra)}}
.cama.recien-ok{animation:celebra .9s ease}
@keyframes celebra{
  0%{box-shadow:0 0 0 0 rgba(35,122,91,.55),var(--sombra)}
  55%{box-shadow:0 0 0 7px rgba(35,122,91,.18),var(--sombra)}
  100%{box-shadow:0 0 0 0 rgba(35,122,91,0),var(--sombra)}}
.pop-num{position:absolute;right:6px;top:26px;z-index:5;pointer-events:none;
         font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;
         padding:2px 7px;border-radius:99px;color:#fff;white-space:nowrap;
         box-shadow:0 2px 8px rgba(9,25,32,.3);
         animation:popnum 1.05s ease forwards}
.pop-num.mal{background:var(--vida)}
.pop-num.bien{background:var(--ok)}
@keyframes popnum{
  0%{opacity:0;transform:translateY(4px) scale(.6)}
  18%{opacity:1;transform:translateY(0) scale(1.12)}
  30%{transform:scale(1)} 72%{opacity:1;transform:translateY(-8px)}
  100%{opacity:0;transform:translateY(-16px)}}

/* ── LA CEREMONIA DEL ALTA (v0.44): el punto se gana con bombos ──────
   El equivalente a anotar el punto en un TCG: la carta del paciente se
   presenta, cae el timbre de ALTA y la moneda vuela a tu marcador. */
.altafx{position:fixed;inset:0;z-index:82;display:flex;justify-content:center;
        align-items:flex-start;padding-top:15vh;pointer-events:none}
.fa-carta{pointer-events:auto;position:relative;width:216px;background:var(--paper);
        border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
        box-shadow:0 0 0 4px rgba(35,122,91,.25), 0 24px 70px rgba(9,25,32,.5);
        overflow:hidden;animation:faEntra .45s cubic-bezier(.2,1.2,.3,1),
                                  faSale .4s ease calc(var(--dur) - .4s) forwards}
@keyframes faEntra{0%{transform:translateY(34px) scale(.7);opacity:0}
                   100%{transform:none;opacity:1}}
@keyframes faSale{to{transform:translateY(-44px) scale(.92);opacity:0}}
.fa-carta::after{content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.55) 47%,
                   rgba(255,255,255,.55) 52%,transparent 66%);
        transform:translateX(-110%);animation:brillo .9s ease .45s forwards}
.fa-arte{height:104px;border-radius:9px;margin:-4px -4px 9px;
         background-size:cover;background-position:center 22%}
.fa-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:19px;
        line-height:1.12}
.fa-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
        letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
        margin-top:5px}
.sello-alta{position:absolute;right:8px;top:10px;transform:rotate(9deg);
        font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:15px;
        letter-spacing:.12em;color:var(--ok);border:3px solid var(--ok);
        border-radius:7px;padding:3px 9px;background:rgba(244,251,248,.9);
        animation:sello .38s cubic-bezier(.2,1.6,.4,1) .3s backwards}
@keyframes sello{0%{transform:rotate(-14deg) scale(2.4);opacity:0}
                 100%{transform:rotate(9deg) scale(1);opacity:1}}
/* el espejo del alta: la Celestial — carta en penumbra, timbre rojo de
   SUMARIO y la moneda gris que cae en vez de volar */
.fa-carta.celestial{background:#2b3239;border-color:#454f57;color:#e8edf0;
        box-shadow:0 0 0 4px rgba(124,19,16,.35), 0 24px 70px rgba(0,0,0,.6)}
.fa-carta.celestial::after{background:linear-gradient(180deg,transparent,
        rgba(0,0,0,.42));transform:none;animation:aparecer .8s ease}
.fa-carta.celestial .fa-sub{color:#93a2ac}
.sello-alta.rojo{color:#e05545;border-color:#e05545;
        background:rgba(43,50,57,.88);transform:rotate(-8deg);
        animation:selloRojo .38s cubic-bezier(.2,1.6,.4,1) .3s backwards}
@keyframes selloRojo{0%{transform:rotate(10deg) scale(2.4);opacity:0}
                     100%{transform:rotate(-8deg) scale(1);opacity:1}}
.moneda.gris{color:#2b3239;
        background:radial-gradient(circle at 34% 30%,#e8edf0,#aeb9c0 58%,#78868f);
        box-shadow:inset 0 -2px 4px rgba(20,26,30,.4), inset 0 2px 3px rgba(255,255,255,.6),
                   0 6px 18px rgba(9,25,32,.35)}
.moneda{position:fixed;left:50%;top:26%;z-index:83;width:48px;height:48px;
        margin:-24px 0 0 -24px;border-radius:99px;display:flex;align-items:center;
        justify-content:center;font-family:"IBM Plex Mono",monospace;
        font-weight:700;font-size:16px;color:#5c4102;
        background:radial-gradient(circle at 34% 30%,#ffe9a8,#f4c542 58%,#c99a1f);
        box-shadow:inset 0 -2px 4px rgba(92,65,2,.4), inset 0 2px 3px rgba(255,255,255,.7),
                   0 6px 18px rgba(9,25,32,.35);
        transition:transform .62s cubic-bezier(.45,.05,.75,.4), opacity .62s ease;
        animation:monedaNace .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes monedaNace{0%{transform:scale(0)}100%{transform:scale(1)}}
.pop-marca{animation:gasto .5s ease}

/* la jugada de la IA se revela al centro: se lee la carta antes de seguir */
.revelada{position:fixed;left:0;right:0;top:13%;z-index:76;display:flex;
          flex-direction:column;align-items:center;gap:9px;
          animation:aparecer .16s ease}
.revelada.fuera{opacity:0;transition:opacity .16s ease}
.revelada .carta.rev{width:172px;min-height:0;box-shadow:0 20px 55px rgba(9,25,32,.5);
          animation:revCae .36s cubic-bezier(.2,1.15,.32,1);pointer-events:none}
.revelada .carta.rev .carta-nom{font-size:14px}
.revelada .carta.rev .carta-tipo{font-size:8.5px}
.revelada .carta.rev .carta-pie{font-size:9.5px}
.revelada .prot.rev{width:196px;box-shadow:0 20px 55px rgba(9,25,32,.5);
          animation:revCae .36s cubic-bezier(.2,1.15,.32,1);pointer-events:none}
.revelada .prot.rev .prot-nom{font-size:14px}
.revelada .prot.rev .prot-txt{font-size:10.5px}
@keyframes revCae{0%{transform:translateY(-30px) rotate(-5deg) scale(.78);opacity:0}
                  100%{transform:none;opacity:1}}
.rev-txt{background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;
         padding:7px 15px;border-radius:99px;max-width:88vw;text-align:center;
         box-shadow:0 8px 26px rgba(9,25,32,.4)}
.rev-txt b{color:#ffd9a8}

/* avisos flotantes: altas, muertes y sabotajes no se pierden en la bitácora */
#avisos{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:85;
        display:flex;flex-direction:column;gap:6px;align-items:center;
        pointer-events:none;width:min(92vw,420px)}
.aviso{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:99px;
       background:var(--ink);color:#fff;box-shadow:0 6px 20px rgba(9,25,32,.35);
       animation:aviso 2.6s ease forwards;max-width:100%;text-align:center}
.aviso.ok{background:var(--ok)} .aviso.mal{background:#5c1d10}
.aviso.warn{background:#6b4a09}
@keyframes aviso{
  0%{opacity:0;transform:translateY(-10px) scale(.92)}
  10%{opacity:1;transform:none} 82%{opacity:1}
  100%{opacity:0;transform:translateY(-8px)}}

/* entradas: hojas, velo y cortina */
.velo{animation:aparecer .22s ease}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
.modal{animation:subir .3s cubic-bezier(.2,.9,.3,1)}
@keyframes subir{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.cortina{animation:aparecer .28s ease}
.opciones .op{animation:subir .34s cubic-bezier(.2,.9,.3,1) backwards}
.opciones .op:nth-child(2){animation-delay:70ms}
.opciones .op:nth-child(3){animation-delay:140ms}
.op{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
@media (hover:hover){.op:hover{border-color:var(--acc);transform:translateY(-1px)}}

/* la franja pasa con un brillo, como un banner de ronda */
.franja{overflow:hidden}
.franja::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 46%,
             rgba(255,255,255,.28) 52%,transparent 68%);
  transform:translateX(-100%);animation:brillo 1.2s ease .15s forwards}
@keyframes brillo{to{transform:translateX(100%)}}

/* turno de la IA: que se note que está pensando */
.fase-chip.ia-chip{background:var(--ink-2);animation:pensando 1.2s ease-in-out infinite}
@keyframes pensando{0%,100%{opacity:1}50%{opacity:.55}}

.indic-caja.gasto{animation:gasto .4s ease}
@keyframes gasto{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

.mtile.gana{border-color:var(--acc);background:linear-gradient(180deg,#eef8f7,var(--cerca));
            box-shadow:0 0 0 1.5px var(--acc), 0 4px 14px rgba(13,110,120,.18)}
.mtile.gana .n{color:var(--acc)}
.mtile{animation:subir .34s cubic-bezier(.2,.9,.3,1) backwards}
.mtile:nth-child(2){animation-delay:60ms}
.mtile:nth-child(3){animation-delay:120ms}
.mtile:nth-child(4){animation-delay:180ms}

.portada{padding:30px 16px 20px}
.portada h1{font-family:Petrona,Georgia,serif;font-weight:700;font-size:30px;
            line-height:1.05;margin:0}
.portada .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
              letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.portada p{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:14px 0 0}
.pie-app{padding:12px 14px 22px;font-size:10.5px;color:var(--ink-3);
         line-height:1.4;text-align:center}
.instalar{margin-top:14px;padding:12px 13px;border:1.5px dashed var(--acc);
  border-radius:12px;background:var(--acc-soft)}
.instalar .ins-txt{font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:9px}
.instalar .ins-txt b{font-family:Petrona,Georgia,serif;font-size:14px}
.instalar .btn.pri{width:100%}
.ios-ic{display:inline-block;border:1px solid var(--ink-2);border-radius:4px;
  padding:0 5px;font-size:11px;line-height:1.5}

/* ── el coach del tutorial ─────────────────────────────────────────── */
#tuto{position:fixed;inset:0;z-index:400;pointer-events:none}
.tuto-anillo{position:fixed;border:2.5px solid var(--acc);border-radius:14px;
  box-shadow:0 0 0 4px rgba(17,132,145,.18), 0 0 22px rgba(17,132,145,.35);
  animation:tutoPulso 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tutoPulso{
  0%,100%{box-shadow:0 0 0 4px rgba(17,132,145,.18), 0 0 22px rgba(17,132,145,.35)}
  50%{box-shadow:0 0 0 8px rgba(17,132,145,.08), 0 0 30px rgba(17,132,145,.5)}}
.tuto-burbuja{position:fixed;left:12px;right:12px;max-width:420px;margin:0 auto;
  background:var(--papel,#fffdf8);border:1.5px solid var(--acc);border-radius:14px;
  padding:13px 14px 11px;box-shadow:0 10px 34px rgba(22,36,46,.28);
  pointer-events:auto;animation:subir .3s cubic-bezier(.2,.9,.3,1)}
.tuto-burbuja .paso{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.tuto-burbuja h3{font-family:Petrona,Georgia,serif;font-size:16.5px;margin:0 0 5px}
.tuto-burbuja p{font-size:12.5px;line-height:1.45;color:var(--ink-2);margin:0}
.tuto-burbuja .tuto-pie{display:flex;align-items:center;gap:10px;margin-top:10px}
.tuto-burbuja .btn.pri{flex:none;padding:8px 16px;font-size:12.5px}
.tuto-burbuja .tuto-haz{font-size:11.5px;color:var(--acc);font-weight:600;
  animation:tutoGuino 1.4s ease-in-out infinite}
@keyframes tutoGuino{0%,100%{opacity:1}50%{opacity:.45}}
.tuto-burbuja .tuto-salta{margin-left:auto;background:none;border:none;
  font-size:10.5px;color:var(--ink-3);text-decoration:underline;padding:4px}

/* El artefacto arma su propio <head>, así que el viewport se inyecta desde

if(!document.querySelector('meta[name="viewport"]')){
  const mv = document.createElement("meta");
  mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}

   atraparlo ANTES de que se pinte la portada y guardarlo para el botón. */

             NEURO:["🧠 Neuro","var(--neuro)"],METAB:["🧪 Metab","var(--metab)"],
             QUIR:["🔪 Quir","var(--quir)"]};

// se compra durante el Pase de Visita, que es cuando de verdad la miras.

               ["fin","Fin de Guardia"]];

/* aviso flotante — vive fuera de #app, sobrevive a los re-render */
function aviso(cls, html){
  let c = document.getElementById("avisos");
  if(!c){ c = document.createElement("div"); c.id = "avisos"; document.body.appendChild(c); }
  const t = document.createElement("div");
  t.className = "aviso "+cls; t.innerHTML = html;
  c.appendChild(t);
  while(c.children.length > 3) c.firstChild.remove();
  setTimeout(()=>t.remove(), 2650);
}

const uid = (()=>{ let n=0; return ()=> ++n; })();
function baraja(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function copiasDe(lista){ const out=[]; lista.forEach(c=>{ for(let i=0;i<(+c.copias||1);i++) out.push({...c,uid:uid()}); }); return out; }

/* ══ construir partida ══════════════════════════════════════════════ */
function nuevaPartida(modo, nombres, tuto){
  const mazoP = baraja(copiasDe(D.pacientes));
  const mazoG = baraja(copiasDe(D.recursos));
  const mazoA = baraja(copiasDe(D.acciones));
  const avat  = baraja(D.personajes.slice());
  const jug = nombres.map((nom,i)=>({
    nombre:nom, ia: modo==="ia" && i===1,
    avatar: null, mano:[], camas:[null,null,null],
    altas:[], muertos:[], sumarios:0,
    protocolos:[], coloc:INDICACIONES, compraHecha:false, accionHecha:false,
    roboMod:0, sinFarmacos:false, colocMod:0, habP:false, habT:false, pena:0
  }));
  jug.forEach(j=>{ if(j.ia) j.avatar = avat.pop(); });
  G = { modo, ronda:1, turno:0, fase:0, mazoP, mazoG, descG:[], mazoA, descA:[],
        pizarra:[], sumariosLibres:6, log:[], fin:false, pendiente:null,
        bloqueoAcciones:0, ultimaAccion:null, ultimaComp:null,
        canjeAvatar:null, iniciado:false };
  // 2 pacientes por jugador, la tercera cama parte vacía
  jug.forEach(j=>{ for(let i=0;i<2;i++) j.camas[i] = nuevaCama(G.mazoP.pop()); });
  G.jug = jug;
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  for(let i=0;i<3;i++){ const a=G.mazoA.pop(); if(a) G.pizarra.push(a); }
  jug.forEach(j=>{ for(let i=0;i<ROBO;i++) robar(j); });
  anota("r", `RONDA 1 · empieza ${jug[0].nombre}`);
  G.avatarPool = avat;
  G.iniciado = true;
  if(tuto) G.tuto = {i:0};
  UI.vidaPrev = {}; UI.okPrev = {}; UI.reqPrev = {}; UI.colocPrev = null;
  siguienteAvatar();
}

/* Al inicio se revelan 3 avatares por jugador humano; elige 1 y los otros
   vuelven al fondo de la pila. */
function siguienteAvatar(){
  const i = G.jug.findIndex(j=>!j.avatar);
  if(i < 0){ G.pendiente = null; entrarFase(0); return; }
  G.pendiente = {tipo:"avatar", jugador:i,
                 ops: G.avatarPool.splice(-3, 3)};
  UI.avPos = 0;
  if(!G.jug[i].ia) mostrarFranja("SELECCIONA TU PERSONAJE", 3400);
  guardar(); render();
}
function resolverAvatar(elegido){
  const p = G.pendiente;
  G.jug[p.jugador].avatar = elegido;
  G.avatarPool.unshift(...p.ops.filter(o=>o!==elegido));
  anota("", `${G.jug[p.jugador].nombre} será ${elegido.nombre}.`);
  siguienteAvatar();
}

function nuevaCama(p){
  if(!p) return null;
  return { p, uid:uid(), vida:p.vida, vidaMax:p.vida,
           pide:{...p.pide}, tiene:{IMAGEN:0,FARMACOS:0,PERSONAL:0,PROCEDIMIENTOS:0},
           puestos:[], basura:[], protege:[], estable:false, estableDesde:null,
           atacada:false, escudo:false, extraDeterioro:0 };
}

function robar(j){
  if(!G.mazoG.length){
    if(!G.descG.length) return null;
    G.mazoG = baraja(G.descG); G.descG = [];
    anota("", "Se acabó el Mazo de Guardia: se baraja el descarte.");
  }
  const c = G.mazoG.pop();
  if(c){ j.mano.push(c); if(!j.ia) UI.nuevas.add(c.uid); }
  return c;
}
function anota(cls, txt){ G.log.push({cls, txt, r:G.ronda}); }

const yo   = ()=> G.jug[G.turno];
const otros= ()=> G.jug.filter((_,i)=>i!==G.turno);
/* el dueño de la cámara: contra la IA siempre el humano. Antes el tablero
   se daba vuelta en el turno de la IA — y con el turno pausado (v0.43) su
   mano quedaba a la vista en el abanico. En hotseat sigue rotando. */
const vista = ()=> (G.modo==="ia" && yo().ia) ? G.jug.find(j=>!j.ia) : yo();
function falta(c,t){ return Math.max(0, c.pide[t]-c.tiene[t]); }
function faltanTotal(c){ return TIPOS.reduce((s,t)=>s+falta(c,t),0); }
function limiteMano(j){ return Math.max(1, MANO_MAX - j.sumarios); }

function revisar(c, ronda){
  const completo = faltanTotal(c)===0;
  if(completo && !c.estable){ c.estable=true; c.estableDesde=ronda; }
  else if(!completo && c.estable){ c.estable=false; c.estableDesde=null; }
}

/* aporte de una carta sobre una cama: 2 si sinergia o Cirujano, si no 1 */
function aporte(carta, cama, tipoElegido){
  if(carta.sistema && carta.sistema===cama.p.sistema) return 2;
  if(carta.cirujano && (tipoElegido||carta.tipo)==="PERSONAL") return 2;
  return 1;
}
/* ¿esta carta sirve al paciente? (define tratamiento vs basura) */
function leSirve(carta, cama){
  if(carta.comodin) return TIPOS.some(t=>falta(cama,t)>0);
  if(carta.sistema && carta.sistema===cama.p.sistema && falta(cama,carta.tipo)>0) return true;
  return TIPOS.includes(carta.tipo) && falta(cama,carta.tipo)>0;
}
function puedeColocarPropia(carta, cama){
  if(!cama) return false;
  if(carta.restriccion==="PERSONAL" && cama.tiene.PERSONAL===0) return false;
  if(yo().sinFarmacos && carta.tipo==="FARMACOS") return false;
  return leSirve(carta, cama);
}
function puedeSabotear(carta, cama){
  return carta.warn && cama && !cama.atacada && !cama.escudo;
}

/* ══ colocar ════════════════════════════════════════════════════════ */
function colocar(carta, cama, duenio, esSabotaje){
  const j = yo();
  j.mano.splice(j.mano.indexOf(carta),1);
  let tipo = carta.tipo;
  if(carta.comodin){
    tipo = TIPOS.filter(t=>falta(cama,t)>0)
                .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || "FARMACOS";
  }
  const sirve = leSirve(carta, cama);

  if(esSabotaje && !sirve){
    cama.basura.push(carta);
    anota("m", `${j.nombre} tira ${carta.nombre} sobre ${cama.p.nombre} (${duenio.nombre}): basura clínica.`);
  } else {
    const ap = aporte(carta, cama, tipo);
    cama.tiene[tipo] += ap;
    // se guarda QUÉ aportó: sin esto no se puede retirar ni mover un recurso
    // ya colocado (Vacaciones, Reunión Clínica, Hay Que Repetirlo…)
    carta.puestoTipo = tipo; carta.puestoAp = ap;
    cama.puestos.push(carta);
    if(carta.previene) cama.protege.push(carta.previene);
    const doble = ap===2 ? " ×2" : "";
    anota("", esSabotaje
      ? `${j.nombre} le pone ${carta.nombre} a ${cama.p.nombre} (${duenio.nombre}) — le sirve${doble}.`
      : `${j.nombre} trata a ${cama.p.nombre} con ${carta.nombre}${doble}.`);
  }
  if(esSabotaje) cama.atacada = true;

  if(carta.warn) complicar(carta, cama, duenio);
  revisar(cama, G.ronda);
  G.descG.push(carta);

  j.coloc--;
  if(carta.restriccion==="TURNO"){ j.coloc = 0; anota("", "La Resonancia con Cupo cierra el Pase de Visita."); }
}

/* COLOCAR NUNCA MATA: piso universal de 1 ❤️ */
function complicar(carta, cama, duenio){
  const nom = carta.compNombre;
  if(nom && cama.protege.includes(nom)){
    anota("a", `🛡️ ${nom} prevenida en ${cama.p.nombre}.`);
    aviso("ok", `🛡️ ${esc(nom)} prevenida en ${esc(cama.p.nombre)}`);
    return;
  }
  const antes = cama.vida;
  cama.vida = Math.max(1, cama.vida - 1);
  // ventana de RESPUESTA: la última complicación resuelta se puede anular
  if(cama.vida < antes)
    G.ultimaComp = {cama:cama.uid, nombre:nom, paciente:cama.p.nombre, ronda:G.ronda};
  if(cama.vida===antes) anota("", `⚠️ ${nom}: ${cama.p.nombre} ya estaba en 1 ❤️ — colocar nunca mata.`);
  else anota("m", `⚠️ ${nom}: ${cama.p.nombre} pierde 1 ❤️ (queda ${cama.vida}).`);
  if(carta.turno24 && duenio.mano.length){
    const b = duenio.mano.pop(); G.descG.push(b);
    anota("m", `El Turno Veinticuatro: ${duenio.nombre} descarta ${b.nombre}.`);
  }
}

/* — retirar y poner recursos ya colocados — */
function quitarRecurso(cama, idx){
  const x = cama.puestos.splice(idx,1)[0];
  const t = x.puestoTipo || x.tipo, ap = x.puestoAp || 1;
  if(TIPOS.includes(t)) cama.tiene[t] = Math.max(0, cama.tiene[t]-ap);
  if(x.previene){ const k = cama.protege.indexOf(x.previene); if(k>=0) cama.protege.splice(k,1); }
  revisar(cama, G.ronda);
  return x;
}
function ponerRecurso(cama, x){
  let t = x.puestoTipo || x.tipo;
  if(x.comodin) t = TIPOS.filter(k=>falta(cama,k)>0)
                        .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || t || "FARMACOS";
  const ap = aporte(x, cama, t);
  x.puestoTipo = t; x.puestoAp = ap;
  if(TIPOS.includes(t)) cama.tiene[t] += ap;
  cama.puestos.push(x);
  if(x.previene) cama.protege.push(x.previene);
  revisar(cama, G.ronda);
}

/* — listas de objetivos — */
function objCamasPropias(f){
  // primero la que está más cerca de cerrar (y aún no cerró)
  return yo().camas.filter(c=>c && (!f||f(c)))
    .map(c=>({txt:esc(c.p.nombre),
              sub:`${c.vida} ❤️ · faltan ${faltanTotal(c)}${c.estable?" · ✅ estable":""}`,
              val:c, orden:(c.estable?99:0) + faltanTotal(c)}))
    .sort((a,b)=>a.orden-b.orden);
}
/* las listas de rivales van ordenadas por "a quién estorba más": primero
   el que está por cerrar. Así la IA acierta eligiendo la primera. */
function objCamasRivales(f){
  const out = [];
  otros().forEach(r=>r.camas.forEach(c=>{
    if(!c || c.escudo || (f && !f(c))) return;
    out.push({txt:esc(c.p.nombre),
              sub:`${esc(r.nombre)} · ${c.vida} ❤️ · faltan ${faltanTotal(c)}${c.estable?" · ✅":""}`,
              val:{cama:c, duenio:r}, orden:faltanTotal(c)});
  }));
  return out.sort((a,b)=>a.orden-b.orden);
}
function objRecursosRivales(f){
  const out = [];
  otros().forEach(r=>r.camas.forEach(c=>{
    if(!c || c.escudo) return;
    c.puestos.forEach((x,i)=>{ if(!f || f(x))
      out.push({txt:`${ico(x.tipo)} ${esc(x.nombre)}`,
                sub:`sobre ${esc(c.p.nombre)} · ${esc(r.nombre)}`,
                val:{cama:c, idx:i, carta:x, duenio:r}, orden:faltanTotal(c)}); });
  }));
  return out.sort((a,b)=>a.orden-b.orden);
}
function objRecursosPropios(){
  const out = [];
  yo().camas.forEach(c=>{ if(!c) return;
    c.puestos.forEach((x,i)=>out.push({
      txt:`${ico(x.tipo)} ${esc(x.nombre)}`, sub:`sobre ${esc(c.p.nombre)}`,
      val:{cama:c, idx:i, carta:x}})); });
  return out;
}
function objRivales(){
  return otros().map(r=>({txt:esc(r.nombre),
    sub:`${r.mano.length} cartas · ${r.altas.length} altas · ${r.muertos.length} ✝️`, val:r}));
}
const objCartas = lista => lista.map((x,i)=>({
  txt:`${ico(x.tipo)} ${esc(x.nombre)}`,
  sub:`${TNOM[x.tipo]||x.tipo}${x.sistema&&SIS[x.sistema]?" · "+SIS[x.sistema][0]:""}${x.warn?" · ⚠️ "+esc(x.compNombre):""}`,
  val:{carta:x, idx:i}}));

/* — hoja de selección: el paso genérico de "elige un objetivo".
   No usa hoja(): una Acción de varios pasos no puede cerrarse tocando
   fuera, o el efecto quedaría a medio aplicar. Sales por Cancelar. — */
function elegirUno(titulo, ayuda, ops, fn, no, prefiere){
  if(!ops.length){ (no||render)(); return; }
  // la IA no abre hojas: elige sola. Las listas ya vienen ordenadas por
  // conveniencia, así que "la primera" es su mejor opción salvo que la
  // carta pida otro criterio (prefiere).
  if(yo().ia){
    const v = prefiere ? prefiere(ops) : ops[0].val;
    if(v===undefined || v===null && !ops.some(o=>o.val===null)){ (no||render)(); return; }
    fn(v); return;
  }
  const velo = el("div","velo");
  const m = el("div","modal");
  m.appendChild(el("div","tirador"));
  m.appendChild(el("h2",null,esc(titulo)));
  if(ayuda) m.appendChild(el("p",null,ayuda));
  const cont = el("div","opciones");
  ops.forEach(o=>{
    const b = el("button","op");
    b.innerHTML = `<b>${o.txt}</b>`+(o.sub?`<small>${o.sub}</small>`:"");
    b.onclick = ()=>{ UI.modal=null; fn(o.val); };
    cont.appendChild(b);
  });
  m.appendChild(cont);
  const can = el("button","btn","Cancelar");
  can.onclick = ()=>{ UI.modal=null; (no||render)(); };
  m.appendChild(can);
  velo.appendChild(m);
  UI.modal = velo; render();
}

const ACC = {
A01:{ // Vacaciones
  puede:()=> objRecursosRivales(x=>x.tipo==="PERSONAL").length>0,
  jugar(j, ok, no){
    elegirUno("Vacaciones","Elige el 🧑‍⚕️ Personal que se toma quince días. Vuelve a la mano de su dueño.",
      objRecursosRivales(x=>x.tipo==="PERSONAL"), s=>{
        quitarRecurso(s.cama, s.idx); s.duenio.mano.push(s.carta);
        anota("a",`Vacaciones: ${s.carta.nombre} deja a ${s.cama.p.nombre} y vuelve a la mano de ${s.duenio.nombre}.`);
        aviso("warn",`🧑‍⚕️ ${esc(s.carta.nombre)} se va de vacaciones (vuelve a la mano rival)`);
        ok();
      }, no);
  }},
A02:{ // Cumpleaños del Residente
  puede:()=> otros().some(r=>r.camas.some(c=>c && !c.escudo && c.puestos.length)),
  jugar(j, ok, no){
    // cada rival entrega su recurso menos valioso; tú eliges dónde va
    const botin = [];
    otros().forEach(r=>{
      const cands = [];
      r.camas.forEach(c=>{ if(c && !c.escudo)
        c.puestos.forEach((x,i)=>cands.push({c,i,x})); });
      if(!cands.length) return;
      cands.sort((a,b)=> faltanTotal(a.c)-faltanTotal(b.c));  // suelta el de la cama más lejana
      const el0 = cands[0];
      quitarRecurso(el0.c, el0.i); botin.push(el0.x);
      anota("a",`Cumpleaños: ${r.nombre} entrega ${el0.x.nombre} (de ${el0.c.p.nombre}).`);
    });
    const colocarSiguiente = ()=>{
      if(!botin.length){ aviso("ok","🎂 Cumpleaños del Residente: recursos recibidos"); ok(); return; }
      const x = botin[0];
      const destinos = objCamasPropias();
      if(!destinos.length){ botin.forEach(c=>G.descG.push(c)); botin.length=0; colocarSiguiente(); return; }
      elegirUno(`Colocar ${x.nombre}`,"Te lo trajeron de regalo. ¿Sobre quién lo pones?",
        destinos, cama=>{ botin.shift(); ponerRecurso(cama, x); colocarSiguiente(); },
        ()=>{ botin.shift(); G.descG.push(x); colocarSiguiente(); });
    };
    colocarSiguiente();
  }},
A03:{ // Reunión Clínica — mueve hasta 3 recursos entre tus pacientes
  puede:()=> objRecursosPropios().length>0 && objCamasPropias().length>1,
  jugar(j, ok, no){
    let movidos = 0;
    const paso = ()=>{
      if(movidos>=3){ cierra(); return; }
      const fuentes = objRecursosPropios();
      if(!fuentes.length){ cierra(); return; }
      elegirUno(`Reunión Clínica · ${movidos}/3`,
        movidos ? "¿Mueves otro? Puedes parar cuando quieras." : "Elige el recurso que cambia de cama.",
        fuentes, s=>{
          const destinos = objCamasPropias(c=>c!==s.cama);
          if(!destinos.length){ cierra(); return; }
          elegirUno(`¿A quién va ${s.carta.nombre}?`, null, destinos, cama=>{
            quitarRecurso(s.cama, s.idx); ponerRecurso(cama, s.carta);
            anota("a",`Reunión Clínica: ${s.carta.nombre} pasa de ${s.cama.p.nombre} a ${cama.p.nombre}.`);
            movidos++; paso();
          }, paso);
        }, cierra);
    };
    function cierra(){
      if(movidos){ aviso("ok",`📋 Reunión Clínica: ${movidos} recurso${movidos>1?"s":""} redistribuido${movidos>1?"s":""}`); ok(); }
      else no();
    }
    paso();
  }},
A04:{ // Interconsulta — rescata un recurso del descarte
  puede:()=> G.descG.length>0 && objCamasPropias().length>0,
  jugar(j, ok, no){
    elegirUno("Interconsulta","Rescata 1 recurso de la pila de descartes: va a tu mano.",
      objCartas(G.descG.slice(-40).reverse()), s=>{
        const k = G.descG.indexOf(s.carta); if(k>=0) G.descG.splice(k,1);
        j.mano.push(s.carta);
        anota("a",`Interconsulta: ${s.carta.nombre} rescatada a la mano.`);
        aviso("ok",`📞 Interconsulta: ${esc(s.carta.nombre)} a tu mano`);
        ok();
      }, no);
  }},
A05:{ // Doblo Turno
  puede:()=>true,
  jugar(j, ok){
    for(let i=0;i<3;i++) robar(j);
    j.roboMod = (j.roboMod||0) - 2;
    anota("a",`${j.nombre} dobla turno: roba 3 (el próximo turno roba 2 menos).`);
    aviso("ok","☕ Doblo Turno: +3 cartas");

A07:{ // ¡Liceeeencia! — cambia de avatar con un rival

/* ══ la IA usa la Pizarra ═══════════════════════════════════════════
   Heurística portada del simulador y afinada con 4.000 partidas: la
   clave es que solo compra con cartas que DE VERDAD sobran (dos por
   encima de lo que necesita para tratar). Comprando de más se hace
   daño sola: −1,0 puntos propios y el mismo daño al rival.        */
const PRIO_ACC = {
  A21:10, A15:9, A01:8, A20:8, A04:8, A11:7, A16:7, A22:7, A19:6,
  A05:6, A18:6, A02:5, A08:5, A17:5, A03:4, A09:4, A13:4, A12:3,
  A10:3, A14:2, A07:2, A06:1,
};
/* La compra de la IA: exige 2 cartas de sobra por encima de lo que va a
   tratar (afinado en §4n). Devuelve la carta comprada o null. */
function iaComprar(j){
  if(j.compraHecha) return null;
  const porTratar = j.camas.filter(c=>c && !c.estable).length * 2;
  const sobra = j.mano.length - porTratar - 2;
  if(sobra <= 0) return null;
  const ops = G.pizarra
    .map((a,i)=>({a,i}))
    .filter(x=>+x.a.coste <= Math.min(sobra, j.mano.length) &&
               ACC[x.a.id] && ACC[x.a.id].puede())
    .sort((x,y)=>((PRIO_ACC[y.a.id]||0)-+y.a.coste)-((PRIO_ACC[x.a.id]||0)-+x.a.coste));
  if(!ops.length) return null;
  const {a, i} = ops[0];
  j.mano.sort((c1,c2)=>(c1.comodin?1:0)-(c2.comodin?1:0) ||
                       (c1.sistema?1:0)-(c2.sistema?1:0));
  for(let k=0;k<+a.coste;k++){ const c=j.mano.shift(); if(c) G.descG.push(c); }
  G.pizarra.splice(i,1);
  const nueva = G.mazoA.pop(); if(nueva) G.pizarra.push(nueva);
  j.protocolos.push(a); j.compraHecha = true;
  anota("a", `${j.nombre} toma ${a.nombre} (${a.coste}).`);
  return a;
}

/* — la ventana de RESPUESTA 🛡️ (A11 y A16) — */
function compAnulable(){
  const u = G.ultimaComp;
  if(!u || u.ronda !== G.ronda) return null;
  const cama = yo().camas.find(c=>c && c.uid===u.cama);
  return cama ? {cama, u} : null;    // solo sobre un paciente TUYO
}
function anularComplicacion(nombre, ok, no){
  const t = compAnulable();
  if(!t){ no(); return; }
  hoja(nombre, (m, cerrar)=>{
    m.appendChild(el("p",
      `Anula <b>${esc(t.u.nombre)}</b> sobre <b>${esc(t.u.paciente)}</b>: recupera el ❤️ `+
      `y el recurso se queda puesto.`));
    const fila = el("div","acciones"); fila.style.padding="0";
    const can = el("button","btn","Ahora no");
    can.onclick = ()=>{ UI.modal=null; no(); };
    const si = el("button","btn pri","Anular");
    si.onclick = ()=>{
      t.cama.vida = Math.min(t.cama.vidaMax, t.cama.vida + 1);
      G.ultimaComp = null;
      anota("a",`${nombre}: se anula ${t.u.nombre} en ${t.u.paciente}.`);
      aviso("ok",`🛡️ ${esc(t.u.nombre)} anulada — ${esc(t.u.paciente)} recupera 1 ❤️`);
      UI.modal=null; ok();
    };
    fila.appendChild(can); fila.appendChild(si);
    m.appendChild(fila);
  });
}

/* — puerta única: valida, resuelve y consume — */
function accionesBloqueadas(){ return G.bloqueoAcciones === G.ronda; }
function puedeJugarAccion(a){
  const j = yo();
  if(j.ia || G.fase!==1 || j.accionHecha || accionesBloqueadas()) return false;
  const m = ACC[a.id];
  return m ? m.puede() : false;
}
function jugarAccion(a, alGastar){
  const j = yo();
  const m = ACC[a.id];
  if(!m) return;
  m.jugar(j, ()=>{                       // ok: la carta se gasta
    j.accionHecha = true;
    G.ultimaAccion = a.id;
    G.descA.push(a);
    alGastar();
    guardar(); render();
  }, ()=>{ render(); });                 // cancelada: sigue guardada
}

/* ══ fases ══════════════════════════════════════════════════════════ */
function mostrarFranja(txt, ms){
  UI.franja = txt;
  UI.franjaMs = ms || 1700;
  clearTimeout(UI.franjaT);
  UI.franjaT = setTimeout(()=>{ UI.franja = null; render(); }, UI.franjaMs);
}

function entrarFase(f){
  G.fase = f;
  const j = yo();
  if(f===0 && !j.ia && G.iniciado){
    mostrarFranja(`TURNO ${G.ronda} (DÍA ${G.ronda})`);
  }
  if(f===0){ faseEntrega(); }
  if(f===1){ j.coloc = INDICACIONES - (j.colocMod||0); j.colocMod = 0;
             j._pi = false; j._compraVista = false; }
  if(f===2){ faseFin(); }
  guardar(); render();
  if(j.ia && !G.fin && !G.pendiente){
    clearTimeout(UI.iaT);              // un solo hilo de IA, nunca dos
    UI.iaT = setTimeout(iaJuega, 550);
  }
}

function faseEntrega(){
  const j = yo();
  // los escudos 🛡️ de El Que Guarda vencen ahora: protegieron toda la vuelta
  j.camas.forEach(c=>{ if(c && c.escudo){ c.escudo=false;
    anota("", `Vence la protección de ${c.p.nombre}.`); } });
  // ¡Liceeeencia!: el avatar prestado vuelve a su dueño
  if(G.canjeAvatar && G.ronda >= G.canjeAvatar.ronda &&
     G.jug.indexOf(j) === G.canjeAvatar.a){
    const A = G.jug[G.canjeAvatar.a], B = G.jug[G.canjeAvatar.b];
    if(A && B){ const t = A.avatar; A.avatar = B.avatar; B.avatar = t;
      anota("", `Se acaba la licencia: ${A.nombre} vuelve a ser ${A.avatar.nombre}.`); }
    G.canjeAvatar = null;
  }
  // a) altas — con ✅ de antes de este turno y sin basura encima
  j.camas.forEach((c,i)=>{
    if(c && c.estable && c.estableDesde!==null && c.estableDesde < G.ronda){
      if(c.basura.length){
        anota("", `${c.p.nombre} está listo pero tiene basura clínica: el alta espera.`);
        return;
      }
      j.altas.push(c.p);
      c.puestos.forEach(x=>G.descG.push(x));
      anota("a", `ALTA · ${c.p.nombre} (+${c.p.alta}) — ${j.nombre}`);
      (UI.fxAltas = UI.fxAltas || []).push({
        nombre:c.p.nombre, pts:c.p.alta, jug:j.nombre, arte:c.p.arte,
        propio: !(G.modo==="ia" && j.ia) });
      j.camas[i] = null;
    }
  });
  // b) admisión obligatoria → se resuelve en la UI (o por la IA)
  // c) robo → tras la admisión
  pedirAdmision();
}

const FRASES_ADMISION = [
  "Llaman de Urgencias",
  "Solicitan cama desde Medicina",
  "Llaman desde Cirugía",
  "Traslado desde la Posta",
  "Rescate desde Pabellón",
  "La UTI pide una cama",
  "Ambulancia en la puerta",
  "Interconsulta: piden UCI",
];

function pedirAdmision(){
  const j = yo();
  // v0.32: la ronda 1 se juega con los 2 pacientes de la preparación
  if(G.ronda === 1){ hacerRobo(); return; }
  const i = j.camas.findIndex(c=>c===null);
  if(i<0 || !G.mazoP.length){ hacerRobo(); return; }
  const ops = [G.mazoP.pop()]; if(G.mazoP.length) ops.push(G.mazoP.pop());
  if(j.ia){
    const mejor = ops.slice().sort((a,b)=>
      (b.alta-b.fallece)/Math.max(1,b.total) - (a.alta-a.fallece)/Math.max(1,a.total))[0];
    resolverAdmision(i, ops, mejor);
  } else {
    G.pendiente = {tipo:"admision", cama:i, ops, sel:null,
      titulo: FRASES_ADMISION[Math.floor(Math.random()*FRASES_ADMISION.length)]};
    render();
  }
}
function resolverAdmision(i, ops, elegido){
  const j = yo();
  j.camas[i] = nuevaCama(elegido);
  ops.filter(o=>o!==elegido).forEach(o=>G.mazoP.unshift(o));
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  anota("", `${j.nombre} admite a ${elegido.nombre} (${elegido.gravedad}).`);
  G.pendiente = null;
  pedirAdmision();
}
function hacerRobo(){
  const j = yo();
  const n = Math.max(0, ROBO + (j.roboMod||0)); j.roboMod = 0;
  for(let i=0;i<n;i++) robar(j);
  anota("", `${j.nombre} roba ${n}.`);
  G.pendiente = null;
  entrarFase(1);          // directo al Pase de Visita
}

function faseFin(){
  const j = yo();
  j.camas.forEach((c,i)=>{
    if(!c) return;
    if(!c.estable){
      c.vida -= 1 + (c.extraDeterioro||0);
      c.extraDeterioro = 0;
    }
    if(c.vida<=0){
      j.muertos.push(c.p);
      anota("m", `✝️ ALTA CELESTIAL · ${c.p.nombre} (${c.p.fallece}) — ${j.nombre}`);
      (UI.fxAltas = UI.fxAltas || []).push({
        tipo:"celestial", nombre:c.p.nombre, pts:c.p.fallece, jug:j.nombre,
        arte:c.p.arte, propio: !(G.modo==="ia" && j.ia) });
      c.puestos.concat(c.basura).forEach(x=>G.descG.push(x));
      j.camas[i]=null;
      if(G.sumariosLibres>0){ j.sumarios++; G.sumariosLibres--; }
    }
  });
  // el escudo NO se limpia aquí: dura "hasta tu próximo turno", así que
  // tiene que sobrevivir los turnos rivales. Se retira en tu Entrega.
  j.camas.forEach(c=>{ if(c) c.atacada=false; });
  if(j.mano.length > limiteMano(j)){
    if(j.ia){
      while(j.mano.length>limiteMano(j)) G.descG.push(j.mano.pop());
      terminarTurno();
    } else { G.pendiente = {tipo:"descartar"}; UI.marcarDescartes=[]; render(); }
  } else terminarTurno();
}

function terminarTurno(){
  const j = yo();
  j.compraHecha=false; j.accionHecha=false; j.sinFarmacos=false; j.habT=false;
  G.pendiente = null;
  G.turno++;
  if(G.turno >= G.jug.length){
    G.turno = 0; G.ronda++;
    if(G.ronda > RONDAS){ G.fin = true; guardar(); render(); return; }
    anota("r", `RONDA ${G.ronda}`);
  }
  if(G.modo==="hotseat" && !yo().ia){ G.pendiente = {tipo:"pasa"}; guardar(); render(); }
  else entrarFase(0);
}

/* ══ puntuación ═════════════════════════════════════════════════════ */
function puntos(j){
  let p = j.altas.reduce((s,c)=>s+c.alta,0) + j.muertos.reduce((s,c)=>s+c.fallece,0);
  p -= j.pena || 0;                                     // altas apuradas (A22)
  p -= j.camas.filter(c=>c===null).length;              // camas vacías al final
  if(!j.muertos.length) p += 3;
  else if(j.muertos.every(c=>c.gravedad==="III"||c.gravedad==="ROJO")) p += 1;
  return p;
}

/* ══ IA (misma heurística que tools/simular_v030.py) ════════════════ */
function iaElegirCamas(j){
  return j.camas.filter(c=>c && !c.estable && faltanTotal(c)>0)
    .map(c=>({c, alc: faltanTotal(c) <= c.vida*2.1,
              val:(c.p.alta-c.p.fallece)/faltanTotal(c)}))
    .sort((a,b)=> (a.alc===b.alc ? b.val-a.val : (a.alc?-1:1)))
    .map(x=>x.c);
}
function iaElegirCarta(j, cama){
  const cands = j.mano.filter(c=>puedeColocarPropia(c,cama));
  if(!cands.length) return null;
  // prioriza sinergia/doble, luego normal, comodín al final; limpia antes que ⚠️
  const puntua = c => (c.comodin?3:0) + (aporte(c,cama)===2?-2:0) + (c.warn?1:0);
  return cands.sort((a,b)=>puntua(a)-puntua(b))[0];
}
function iaSabotaje(j){
  const warns = j.mano.filter(c=>c.warn);
  if(!warns.length) return null;
  let best=null;
  otros().forEach(r=>r.camas.forEach(cama=>{
    if(!cama || cama.atacada || cama.escudo) return;
    warns.forEach(c=>{
      if(leSirve(c,cama)) return;               // sería un regalo
      const urg = -faltanTotal(cama) + (cama.estable?3:0);
      if(urg < -2) return;                       // solo si de verdad estorba
      if(!best || urg>best.urg) best = {urg, carta:c, cama, duenio:r};
    });
  }));
  return best;
}
/* ══ EL TURNO DE LA IA SE VE (v0.43) ═════════════════════════════════
   Antes el turno rival ocurría entero en un parpadeo y había que ir a la
   bitácora a entender qué pasó. Ahora es una secuencia: cada jugada de la
   IA revela la carta al centro —legible— y recién después cae la
   siguiente. Tocar la revelación la adelanta. */
let IA_PAUSA = 2000;          // ritmo entre jugadas; los tests lo bajan
let FX_ALTA  = 2000;          // duración de la ceremonia del alta

function celebrarAlta(fx, luego){
  const celestial = fx.tipo === "celestial";
  const cont = el("div","altafx");
  const carta = el("div","fa-carta"+(celestial?" celestial":""));
  carta.style.setProperty("--dur", (FX_ALTA/1000)+"s");
  carta.innerHTML =
    (fx.arte ? `<div class="fa-arte" style="background-image:url('${fx.arte}')"></div>` : "") +
    `<div class="fa-nom">${esc(fx.nombre)}</div>` +
    `<div class="fa-sub">${esc(fx.jug)} · ${fx.nota||(celestial?"alta celestial · deja Sumario":"alta médica")}</div>` +
    (celestial ? `<div class="sello-alta rojo">SUMARIO ⚠</div>`
               : `<div class="sello-alta">ALTA ✚</div>`);
  cont.appendChild(carta);
  document.body.appendChild(cont);
  let fin = false;
  const irse = ()=>{ if(fin) return; fin = true; cont.remove(); luego(); };
  // la moneda: dorada vuela al marcador; la gris cae y se apaga
  setTimeout(()=>{
    if(fin) return;
    const m = el("div","moneda"+(celestial?" gris":""),
                 (fx.pts>0?"+":"")+fx.pts);
    document.body.appendChild(m);
    const destino = celestial ? null : document.querySelector(
      (fx.propio ? ".zona.cerca" : ".zona.lejos") + " .marca.al");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(celestial){
        m.style.transform = "translateY(46vh) rotate(24deg) scale(.55)";
      } else if(destino){
        const r = destino.getBoundingClientRect();
        m.style.transform = `translate(${r.x + r.width/2 - innerWidth/2}px,` +
                            `${r.y + r.height/2 - innerHeight*0.26}px) scale(.35)`;
      } else {
        m.style.transform = "translateY(-40vh) scale(.35)";
      }
      m.style.opacity = "0.1";
    }));
    setTimeout(()=>{
      m.remove();
      if(destino){ destino.classList.add("pop-marca");
                   setTimeout(()=>destino.classList.remove("pop-marca"), 520); }
    }, Math.round(FX_ALTA*0.34));
  }, Math.round(FX_ALTA*0.42));
  const tm = setTimeout(irse, FX_ALTA);
  cont.addEventListener("pointerdown", ev=>{ ev.stopPropagation();
    clearTimeout(tm); irse(); });
}
function colaAltas(){
  if(UI.fxViva || !UI.fxAltas || !UI.fxAltas.length) return;
  UI.fxViva = true;
  celebrarAlta(UI.fxAltas.shift(), ()=>{ UI.fxViva = false; colaAltas(); });
}

function revelarIA(cartaHtml, txt, luego){
  const r = el("div","revelada");
  r.innerHTML = (cartaHtml ? cartaHtml : "") +
                `<div class="rev-txt">${txt}</div>`;
  document.body.appendChild(r);
  let hecho = false;
  const fin = ()=>{ if(hecho) return; hecho = true;
    r.classList.add("fuera"); setTimeout(()=>r.remove(), 160); luego(); };
  const tm = setTimeout(fin, cartaHtml ? IA_PAUSA : Math.round(IA_PAUSA*0.65));
  r.addEventListener("pointerdown", ev=>{ ev.stopPropagation();
    clearTimeout(tm); fin(); });
}
function revCarta(c){
  return `<div class="carta rev" style="border-left-color:${TCOL[c.tipo]||TCOL.COMODIN}">${cuerpoCarta(c)}</div>`;
}
function revProt(a){
  return `<div class="prot rev"><div class="prot-cab">`+
    `<span class="coste">${a.coste}</span><span class="prot-tipo">${esc(a.tipo)}</span></div>`+
    `<div class="prot-nom">${esc(a.nombre)}</div>`+
    `<div class="prot-txt">${esc(a.texto)}</div></div>`;
}

function iaJuega(){
  const j = yo();
  if(G.fin || !j.ia || G.fase!==1) return;
  if(UI.fxViva){                       // primero termina la ceremonia del alta
    clearTimeout(UI.iaT);
    UI.iaT = setTimeout(iaJuega, 300);
    return;
  }

  // 1. jugar un Protocolo guardado (un solo intento por turno)
  if(!j._pi && !j.accionHecha && !accionesBloqueadas()){
    j._pi = true;
    const jugables = j.protocolos
      .filter(a=>ACC[a.id] && ACC[a.id].puede())
      .sort((a,b)=>(PRIO_ACC[b.id]||0)-(PRIO_ACC[a.id]||0));
    if(jugables.length){
      const a = jugables[0];
      let jugo = false;
      jugarAccion(a, ()=>{ jugo = true;
        const k = j.protocolos.indexOf(a); if(k>=0) j.protocolos.splice(k,1);
        anota("a", `${j.nombre} juega ${a.nombre}.`); });
      if(jugo){ revelarIA(revProt(a), `${esc(j.nombre)} juega <b>${esc(a.nombre)}</b>`, iaJuega); return; }
    }
  }
  // 2. comprar de la Pizarra
  if(!j._compraVista){
    j._compraVista = true;
    const a = iaComprar(j);
    if(a){ guardar(); render();
      revelarIA(revProt(a), `${esc(j.nombre)} toma <b>${esc(a.nombre)}</b> de la Pizarra`, iaJuega);
      return; }
  }
  // 3. una indicación por paso
  if(j.coloc > 0){
    const bloq = j.camas.find(c=>c && c.basura.length && (c.estable || faltanTotal(c)<=1));
    if(bloq){
      G.descG.push(bloq.basura.pop()); j.coloc--;
      anota("", `${j.nombre} des-escala en ${bloq.p.nombre}.`);
      revisar(bloq, G.ronda); guardar(); render();
      revelarIA(null, `${esc(j.nombre)} des-escala en <b>${esc(bloq.p.nombre)}</b>`, iaJuega);
      return;
    }
    const sab = iaSabotaje(j);
    if(sab && faltanTotal(sab.cama)<=1 && !sab.cama.estable){
      colocar(sab.carta, sab.cama, sab.duenio, true); guardar(); render();
      revelarIA(revCarta(sab.carta), `⚠️ ${esc(j.nombre)} sabotea a <b>${esc(sab.cama.p.nombre)}</b>`, iaJuega);
      return;
    }
    for(const cama of iaElegirCamas(j)){
      const carta = iaElegirCarta(j, cama);
      if(carta){
        colocar(carta, cama, j, false); guardar(); render();
        revelarIA(revCarta(carta), `${esc(j.nombre)} trata a <b>${esc(cama.p.nombre)}</b>`, iaJuega);
        return;
      }
    }
    if(sab){
      colocar(sab.carta, sab.cama, sab.duenio, true); guardar(); render();
      revelarIA(revCarta(sab.carta), `⚠️ ${esc(j.nombre)} sabotea a <b>${esc(sab.cama.p.nombre)}</b>`, iaJuega);
      return;
    }
    j.coloc = 0;               // no le queda nada que colocar
  }
  // 4. cerrar Sumarios, de a uno
  if(j.sumarios > 0 && j.mano.length >= 2){
    G.descG.push(j.mano.pop()); G.descG.push(j.mano.pop());
    j.sumarios--; G.sumariosLibres++;
    anota("a", `${j.nombre} cierra un Sumario.`); guardar(); render();
    revelarIA(null, `📋 ${esc(j.nombre)} cierra un Sumario (paga 2 cartas)`, iaJuega);
    return;
  }
  // 5. fin de su guardia
  entrarFase(2);
}

  // v0.38: la Pizarra sale del centro a un cajón — el tablero respira y
  // los pacientes quedan cara a cara, como pidió el autor (estilo Pocket)
  const alguna = G.fase===1 && !j.ia && !j.compraHecha &&
                 G.pizarra.some(a=>j.mano.length >= +a.coste);
  const bp = el("button","btn-pizarra"+(alguna?" puede":""));
  bp.id = "btn-pizarra";
  const gemas = G.pizarra.map(a=>`<span class="coste">${a.coste}</span>`).join("");

    `<span class="gemas">${gemas || '<span class="prot-tipo">vacía</span>'}</span>` +
    `<span class="flecha">›</span>`;
  bp.onclick = hojaPizarra;
  c.appendChild(bp);
  return c;
}
