@media (prefers-reduced-motion: no-preference){
  body[data-maq="b"] .mazo-btn.late .n{animation:pulsoMazo 2s ease-in-out infinite}}
@keyframes pulsoMazo{
  0%,100%{box-shadow:0 2px 7px rgba(22,36,46,.22),0 0 0 0 rgba(17,132,145,.45)}
  70%{box-shadow:0 2px 7px rgba(22,36,46,.22),0 0 0 10px rgba(17,132,145,0)}}

body[data-maq="b"] .abanico-b{position:fixed;left:0;right:0;bottom:0;
  height:34%;min-height:212px;z-index:47;pointer-events:none}
body[data-maq="b"] .velo-mano{position:fixed;inset:0;z-index:43;pointer-events:auto;
  background:linear-gradient(to top,rgba(9,18,22,.6) 0,rgba(9,18,22,.26) 22%,
             transparent 34%)}
/* las camas quedan por encima del velo: con la mano abierta se sigue
   pudiendo tocar una para jugar la carta elegida, y todo lo demás cierra */
body[data-maq="b"] .cama{position:relative;z-index:44}
body[data-maq="b"] .abanico-b .arco{position:absolute;inset:0;touch-action:none}
body[data-maq="b"] .ran-b{position:absolute;left:50%;
  bottom:calc(40px + env(safe-area-inset-bottom,0px));pointer-events:auto;
  transform:translateX(-50%);transform-origin:50% 50%;
  will-change:transform}
/* La animación de entrada cuelga de .abre y sólo se pone al abrir la mano.
   Estaba en .ran-b a secas y se relanzaba dos veces cada vez que soltabas
   el hojeo —una al quitar .vivo, que devolvía el animation-name, y otra al
   redibujar—: ocho cartas parpadeando dos veces al detenerte. */
body[data-maq="b"] .ran-b.abre{animation:abreMano .22s cubic-bezier(.22,1.1,.36,1) backwards}
@keyframes abreMano{from{transform:translateX(-50%) translateY(46px) scale(.7);opacity:0}}
@media (prefers-reduced-motion: reduce){
  body[data-maq="b"] .ran-b.abre{animation:none}}
body[data-maq="b"] .ran-b .carta{width:106px;height:150px;overflow:hidden;
  touch-action:none;box-shadow:0 6px 14px rgba(22,36,46,.32)}
body[data-maq="b"] .ran-b.foco{z-index:40 !important}
body[data-maq="b"] .ran-b.foco .carta.no{opacity:.72}
body[data-maq="b"] .ran-b.foco .carta{border-color:var(--acc);
  box-shadow:0 0 0 2px var(--acc),0 16px 30px rgba(22,36,46,.45)}
/* Las de los extremos se alejan, no se desvanecen: con opacidad .55 el
   papel dejaba pasar el texto de las de atrás y la mano entera se veía
   como una nube de letras. Ahora la carta es opaca —así se lee su sello
   de esquina— y la lejanía la da el color, que se apaga. */
body[data-maq="b"] .ran-b.lejos .carta{filter:saturate(.62) brightness(.99)}
body[data-maq="b"] .ran-b.lejos .carta-pie{opacity:.5}
/* mientras el dedo hojea, las ranuras siguen al dedo sin transición */
body[data-maq="b"] .arco.vivo .ran-b{animation:none}
body[data-maq="b"] .puntos-b{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;gap:5px;
  pointer-events:none}
body[data-maq="b"] .puntos-b i{width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.42);transition:background .15s ease}
body[data-maq="b"] .puntos-b i.on{background:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.28)}
body[data-maq="b"] .ran-b .carta .carta-pie{font-size:7.5px;
  max-height:20px;overflow:hidden}
body[data-maq="b"] .cerrar-mano{position:absolute;left:50%;top:auto;
  bottom:calc(214px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);pointer-events:none;
  font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  background:rgba(255,255,255,.9);white-space:nowrap;padding:3px 10px;
  border-radius:99px;box-shadow:0 2px 7px rgba(22,36,46,.2)}

/* al arrastrar, el abanico se aparta para que las camas reciban el dedo */
/* el velo declara pointer-events:auto para poder cerrarse al tocarlo, así
   que hay que apagarlo explícitamente: si no, se come el elementFromPoint
   del arrastre y la cama de abajo nunca recibe la carta */
body[data-maq="b"].arrastrando .abanico-b,
body[data-maq="b"].arrastrando .velo-mano{opacity:.16;pointer-events:none;
  transition:opacity .15s ease}
body[data-maq="b"].arrastrando .mazo-mano{opacity:0}
/* en B el Fin de Guardia sube por encima del mazo */
body[data-maq="b"] .btn-fin{bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:60px;height:60px;font-size:10.5px}

/* ── la banda de control: menú · Pizarra · reloj ───────────────────
   Se lleva los 86 px que gastaban la barra de estado y la franja de guía,
   y queda en 62: la banda entera pesa menos que la Pizarra sola antes. */
body[data-maq="b"] .centro{padding:5px 8px 6px}
body[data-maq="b"] .centro-info{display:none}
body[data-maq="b"] .banda-b{display:flex;align-items:center;gap:6px}
body[data-maq="b"] .banda-b .icono-btn{width:32px;height:40px;flex:none;font-size:14px}
body[data-maq="b"] .banda-b .btn-pizarra{flex:1;min-width:0;margin:0;height:46px;
  white-space:nowrap;overflow:hidden}
body[data-maq="b"] .banda-b .btn-pizarra .rot{display:none}
/* el reloj control de asistencia */
body[data-maq="b"] .reloj-g{width:80px;height:46px;flex:none;position:relative;
  overflow:hidden;
  border-radius:9px;padding:3px 4px 4px;border:0;font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;pointer-events:auto;
  background:linear-gradient(163deg,#eef2f4 0%,#c3ced4 22%,#f6f9fa 46%,
             #aab8bf 68%,#dde5e9 100%);
  box-shadow:0 0 0 1px #8b9aa2, inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -1px 0 rgba(0,0,0,.16), 0 3px 8px rgba(22,36,46,.28)}
body[data-maq="b"] .reloj-g .marca{flex:none;font-family:"IBM Plex Mono",monospace;
  font-size:5.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:#5c6b73;line-height:1;margin-bottom:2px}
body[data-maq="b"] .reloj-g .fila{width:100%;flex:1 1 0;min-height:0;
  display:flex;align-items:stretch;gap:4px}
body[data-maq="b"] .reloj-g .pantalla{flex:1 1 0;min-width:0;border-radius:3px;
  background:#12201d;box-shadow:inset 0 1px 3px rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;padding:0 3px}
/* el lector: un rebaje en la chapa, no una parte de la pantalla */
body[data-maq="b"] .reloj-g .lector{width:20px;flex:none;border-radius:4px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#9caab2,#cdd7dc 45%,#93a2aa);
  box-shadow:inset 0 1.5px 2px rgba(0,0,0,.42),
             inset 0 -1px 0 rgba(255,255,255,.6),
             0 .5px 0 rgba(255,255,255,.7)}
body[data-maq="b"] .reloj-g .cifra{font-family:"IBM Plex Mono",monospace;
  font-size:15px;font-weight:700;color:#7ee0b8;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 6px rgba(126,224,184,.55)}
body[data-maq="b"] .reloj-g .cifra small{font-size:8px;opacity:.65}
body[data-maq="b"] .reloj-g .huella{width:12px;height:15px;border-radius:6px/7.5px;
  flex:none;background:radial-gradient(ellipse at 50% 55%,
    transparent 0 1.3px,#5c6f78 1.3px 2.1px,transparent 2.1px 3.5px,
    #5c6f78 3.5px 4.3px,transparent 4.3px 5.7px,#5c6f78 5.7px 6.5px,transparent 6.5px);
  opacity:.8}
body[data-maq="b"] .reloj-g.viva .huella{background:radial-gradient(ellipse at 50% 55%,
    transparent 0 1.3px,#0d6e78 1.3px 2.1px,transparent 2.1px 3.5px,
    #0d6e78 3.5px 4.3px,transparent 4.3px 5.7px,#0d6e78 5.7px 6.5px,transparent 6.5px)}
body[data-maq="b"] .reloj-g .fase{flex:none;font-family:"IBM Plex Mono",monospace;
  font-size:6.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:#5c6b73;line-height:1;margin-top:2px;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
body[data-maq="b"] .reloj-g.viva{box-shadow:0 0 0 1px #8b9aa2,
  inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.16),
  0 3px 8px rgba(22,36,46,.28), 0 0 0 3px rgba(17,132,145,.3)}
body[data-maq="b"] .reloj-g.gris{opacity:.72}
body[data-maq="b"] .reloj-g.gris .pantalla{opacity:.55}
@media (prefers-reduced-motion: no-preference){
  body[data-maq="b"] .reloj-g.viva .huella{animation:huellaLate 1.8s ease-in-out infinite}}
@keyframes huellaLate{0%,100%{opacity:.45} 55%{opacity:1}}

/* el aviso contextual: sale sólo con la carta en el aire */
body[data-maq="b"] .pista{position:fixed;left:50%;transform:translateX(-50%);
  top:calc(50% - 16px);z-index:44;pointer-events:none;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:#fff;
  background:rgba(20,36,44,.86);white-space:nowrap;padding:5px 12px;
  border-radius:99px;box-shadow:0 3px 12px rgba(22,36,46,.35)}
body[data-maq="b"].arrastrando .pista{opacity:0;transition:opacity .15s ease}

/* ── el marco blanco de la carta ────────────────────────────────────
   Un filete blanco fino alrededor del arte, como el de una carta de
   verdad: separa la ilustración del tablero, le da filo en cualquier
   fondo y —lo importante para el arte que viene— fija dónde termina la
   imagen. La medida es proporcional al ancho de cada vista (≈2,8 %), no
   un valor fijo, para que la carta se vea igual en la mano, en la cama y
   en el zoom. El arte NO sangra al filo: sangra al filete. */
body[data-maq="b"] .carta{--marco:3px}
body[data-maq="b"] .cama.pficha{--marco:3px;padding:var(--marco)}
body[data-maq="b"] .cama.pficha .cama-arte{margin:0 0 3px}
body[data-maq="b"] .cama.suya .cama-arte{margin:3px 0 0}
body[data-maq="b"] .cama.pficha .cuerpo-f{padding:0 3px}
body[data-maq="b"] .cama.pficha .sellos{padding:0 3px}
/* ── el botón de la cama, encima y no debajo ─────────────────────────
   La ficha tiene alto fijo —las dos mitades del campo miden igual— y el
   botón se añadía DESPUÉS del contenido: caía 17 px por fuera y la cama
   recorta. O sea que «Tratar», «Sabotear», «🛡️ protegido» y sobre todo
   «Des-escalar» existían en el DOM y no se veían ni se podían tocar; el
   autor no encontraba cómo sacarse una basura clínica de encima porque
   literalmente no estaba en pantalla. Ahora es una banda flotante sobre
   el filo del arte: no ocupa alto, así que no descuadra el espejo. */
body[data-maq="b"] .cama.pficha .cama-btn{position:absolute;z-index:6;
  left:3px;right:3px;bottom:3px;width:auto;margin:0;
  padding:4px 3px;font-size:9.5px;line-height:1.15;
  box-shadow:0 -3px 10px rgba(9,25,32,.35)}
body[data-maq="b"] .grande.conarte{--marco:7px;padding:var(--marco)}
body[data-maq="b"] .grande.conarte .g-arte{border-radius:9px;overflow:hidden}
body[data-maq="b"] .grande.conarte .g-cuerpo{padding:4px 8px 8px}

/* ── la cama respira: ranura más alta y requerimientos más grandes ──
   Los puntos de color son lo que más se mira de la cama —dicen qué le
   falta— y a 7,5 px se contaban mal de un vistazo. La ranura crece lo
   justo para que quepan sin apretar, y crece en las DOS mitades a la vez:
   el aire se reparte solo y el espejo sigue cuadrando. */
body[data-maq="b"] .tres{height:132px}
body[data-maq="b"] .cama.pficha .pips{gap:2px 5px;margin:0 0 2px}
body[data-maq="b"] .cama.pficha .uni{width:12.5px;height:12.5px}
body[data-maq="b"] .cama.pficha .corazones{margin:0 0 3px}
body[data-maq="b"] .cama.pficha .cz-uno{width:18px;height:17px}
body[data-maq="b"] .cama.pficha .vnum{font-size:12.5px}
body[data-maq="b"] .cama.pficha .f-faltan{font-size:15px}

/* ── el avatar, más grande y despegado del filo ─────────────────────
   Pegado al borde se leía como que se caía de la pantalla. Sube 10 px y
   el retrato del rival baja otros tantos desde su borde, para que las dos
   repisas sigan siendo la misma pieza vista al revés. */
body[data-maq="b"] .aro-av{width:94px;height:94px;bottom:10px}
body[data-maq="b"] .aro-av .ind{top:-15px;font-size:9px;padding:2px 8px}
body[data-maq="b"] .poder-av{left:calc(50% + 40px);bottom:64px;
  width:38px;height:38px;font-size:16px}
body[data-maq="b"] .repisa{padding-top:15px}
body[data-maq="b"] .aroS{width:54px;height:54px}

/* ── aire entre las camas y los Protocolos guardados ────────────────
   Los Protocolos entran justo debajo de la fila de camas y quedaban
   pegados al filo de la última: una carta apoyada en otra. Un respiro
   fino los separa sin comerse el aire de la mitad, que es flexible. */
body[data-maq="b"] .zona.cerca .jugador-linea{margin:10px 0 4px}
body[data-maq="b"] .zona.cerca .prot-mios{margin-top:6px;max-height:94px;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
body[data-maq="b"] .zona.cerca .prot-mios::-webkit-scrollbar{display:none}
/* el Protocolo guardado se aprieta: en B la mitad está repartida al
   milímetro y la tarjeta entera se metía debajo del avatar */
body[data-maq="b"] .zona.cerca .prot{padding:6px}
body[data-maq="b"] .zona.cerca .prot-nom{font-size:10.5px}
body[data-maq="b"] .zona.cerca .prot-txt{font-size:9.5px;line-height:1.3;
  max-height:25px;overflow:hidden}
body[data-maq="b"] .zona.cerca .prot-btn{padding:4px;font-size:9px}

/* la sala fotográfica del fondo de la fila de camas se retira en B: ahora
   el ambiente es vectorial y mezclar los dos lenguajes se notaba. En su
   sitio van las tres plazas dibujadas en planta, que es lo que se ve
   cuando una cama está vacía. */
body[data-maq="b"] .zona.cerca .tres{
  background:var(--camas-mio) center/100% 100% no-repeat}
body[data-maq="b"] .zona.suya .tres{
  background:var(--camas-suyo) center/100% 100% no-repeat}
body[data-maq="b"] .zocalo{background:var(--meson-mio) center/100% 100% no-repeat}
body[data-maq="b"] .repisa{background:var(--meson-suyo) center/100% 100% no-repeat}
body[data-maq="b"] .zona.cerca .aire{background:var(--suelo-mio) center top/100% auto no-repeat;
  position:relative}
/* ── el cartel de SALIDA, colgado del techo del pasillo ─────────────
   Es la puerta de la guardia: no había ninguna. Va donde iría en la UCI
   de verdad —al fondo del pasillo, sobre la salida— y con el mismo verde
   ISO. Pequeño y quieto: es un mueble, no un botón de la interfaz. */
.salida{position:absolute;right:9px;top:0;z-index:4;width:62px;
  padding-top:11px;display:block;line-height:0;
  filter:drop-shadow(0 3px 6px rgba(9,25,32,.28))}
.salida .sal-cadena{position:absolute;top:0;height:11px;width:1px;
  background:rgba(60,78,88,.55)}
.salida .sal-cadena{left:13px}
.salida .sal-cadena.der{left:auto;right:13px}
.salida .sal-placa{display:block;position:relative;border-radius:3px;
  overflow:hidden;background:#1a7a44}
.salida .sal-placa svg{width:100%;height:auto;display:block}
.salida .sal-txt{display:block;font-family:"IBM Plex Mono",monospace;
  font-size:7.5px;font-weight:700;letter-spacing:.18em;color:#fff;
  text-align:center;line-height:1;padding:0 0 3px;background:#1a7a44}
@media (hover:hover){ .salida:hover{filter:drop-shadow(0 4px 10px rgba(26,122,68,.55))} }
.salida:active{transform:translateY(1px)}
/* el mismo cartel, descolgado, dentro del Panel */
.salida.suelto{position:static;width:84px;padding-top:0;margin:2px 0 8px}
.salida.suelto .sal-cadena{display:none}
body[data-maq="b"] .zona.suya .aire{background:var(--suelo-suyo) center bottom/100% auto no-repeat}

/* ── el menú de inicio: tres cuadrados con su moneda ────────────────
   Eran cuatro botones anchos con una frase cada uno y se comían media
   pantalla; luego tres fichas en fila vertical, que seguían tapando al
   auxiliar. Ahora son tres cuadrados en una sola fila —el ícono en una
   moneda de metal y una palabra— y ocupan 14 % del alto en vez de 40 %.
   Todo lo que se ahorra aquí lo gana el clip que corre detrás. */
.pastillas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-bottom:9px}
.pastilla{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;width:100%;aspect-ratio:1/1;text-align:center;
  padding:8px 4px;border-radius:15px;border:1px solid var(--line);
  background:var(--cerca);font:inherit;color:var(--ink);cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
/* la medalla: el mismo cromado que la Pizarra y el reloj de asistencia.
   No se llama .moneda porque esa clase ya es la del alta, y es fija. */
.pastilla .medalla{width:46px;height:46px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:var(--acc);
  background:radial-gradient(120% 120% at 32% 22%, #ffffff 0%, #eef4f6 42%, #cfdde1 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
             inset 0 -1.5px 3px rgba(60,78,88,.24),
             0 0 0 1.5px rgba(60,78,88,.20), 0 2px 6px rgba(22,36,46,.16)}
.pastilla .ic{width:25px;height:25px;flex:none;display:block;color:var(--acc)}
.pastilla b{font-family:Petrona,Georgia,serif;font-size:14.5px;line-height:1}
.pastilla small{font-family:"IBM Plex Mono",monospace;font-size:7.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;line-height:1;margin-top:-3px}
.pastilla:active{transform:scale(.97)}
@media (hover:hover){.pastilla:hover{border-color:var(--acc);
  box-shadow:0 4px 14px rgba(13,110,120,.18)}
  .pastilla:hover .medalla{color:var(--acc)}}
.tuto{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--cerca);font:inherit;color:var(--ink);cursor:pointer}
.tuto .marca{width:19px;height:19px;border-radius:6px;flex:none;display:grid;
  place-items:center;font-size:11px;line-height:1;color:#fff;
  border:2px solid var(--ink-3);background:transparent}
.tuto.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.tuto.on .marca{border-color:var(--acc);background:var(--acc)}
.tuto .tx{font-size:11.5px;line-height:1.25}
.tuto .tx b{font-family:Petrona,Georgia,serif;font-size:12.5px;display:block}
@media (prefers-reduced-motion: no-preference){
  .pastillas .pastilla{animation:subir .34s cubic-bezier(.2,.9,.3,1) backwards}
  .pastillas .pastilla:nth-child(2){animation-delay:70ms}
  .pastillas .pastilla:nth-child(3){animation-delay:140ms}}
/* con portada, las fichas y la casilla se vuelven vidrio esmerilado */
body.con-portada .pastilla,body.con-portada .tuto{background:rgba(255,255,255,.82);
  backdrop-filter:blur(9px) saturate(1.15);
  -webkit-backdrop-filter:blur(9px) saturate(1.15);
  border-color:rgba(60,78,88,.16);box-shadow:0 3px 12px rgba(22,36,46,.13)}

/* ── el coach del tutorial ─────────────────────────────────────────── */
#tuto{position:fixed;inset:0;z-index:400;pointer-events:none}
.tuto-anillo{position:fixed;border:2.5px solid var(--acc);border-radius:14px;
  box-shadow:0 0 0 4px rgba(17,132,145,.18), 0 0 22px rgba(17,132,145,.35);
  animation:tutoPulso 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tutoPulso{
  0%,100%{box-shadow:0 0 0 4px rgba(17,132,145,.18), 0 0 22px rgba(17,132,145,.35)}
  50%{box-shadow:0 0 0 8px rgba(17,132,145,.08), 0 0 30px rgba(17,132,145,.5)}}
.tuto-burbuja{position:fixed;left:12px;right:12px;max-width:420px;margin:0 auto;
  background:var(--papel,#fffdf8);border:1.5px solid var(--acc);border-radius:14px;
  padding:13px 14px 11px;box-shadow:0 10px 34px rgba(22,36,46,.28);
  pointer-events:auto;animation:subir .3s cubic-bezier(.2,.9,.3,1)}
.tuto-burbuja .paso{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.tuto-burbuja h3{font-family:Petrona,Georgia,serif;font-size:16.5px;margin:0 0 5px}
.tuto-burbuja p{font-size:12.5px;line-height:1.45;color:var(--ink-2);margin:0}
.tuto-burbuja .tuto-pie{display:flex;align-items:center;gap:10px;margin-top:10px}
.tuto-burbuja .btn.pri{flex:none;padding:8px 16px;font-size:12.5px}
.tuto-burbuja .tuto-haz{font-size:11.5px;color:var(--acc);font-weight:600;
  animation:tutoGuino 1.4s ease-in-out infinite}
@keyframes tutoGuino{0%,100%{opacity:1}50%{opacity:.45}}
.tuto-burbuja .tuto-salta{margin-left:auto;background:none;border:none;
  font-size:10.5px;color:var(--ink-3);text-decoration:underline;padding:4px}

/* ── LA RESIDENCIA: los casos clínicos ─────────────────────────────────
   El coach de arriba acompaña una partida de verdad; esto es lo otro: una
   unidad montada a mano para que una sola mecánica ocurra y se vea. La
   burbuja es la misma —no hacen falta dos lenguajes de ayuda—, con una
   línea más para la meta del caso. */
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;

<div id="portada" aria-hidden="true" hidden></div>
<div class="app" id="app"></div>
<div id="capa"></div>

<script>
"use strict";
/* El artefacto arma su propio <head>, así que el viewport se inyecta desde
   aquí: sin él, el teléfono maquetaría a 980 px y todo saldría diminuto. */
if(!document.querySelector('meta[name="viewport"]')){
  const mv = document.createElement("meta");
  mv.name = "viewport";
  mv.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}
/* En el artefacto esto queda en false; generar_app.py --pwa lo pone en
   true al compilar la app instalable (que sí trae sw.js y manifest). */
const PWA = /*__PWA__*/false;

/* ══ maqueta del campo ══════════════════════════════════════════════
   A y B convivieron mientras B estaba en pruebas. Desde la v0.57 el
   autor se queda con B —el campo partido en dos mitades iguales por la
   Pizarra, las camas del rival del mismo tamaño que las tuyas y la mano
   como mazo desplegable— y A queda retirada.

   maqueta() devuelve "b" siempre y a propósito: el interruptor del Panel
   se fue, pero las ramas `if(esB())` siguen en pie por ahora. Podarlas es
   un cambio grande y mecánico, y mezclarlo con los arreglos de esta
   tanda sería pedir un error tonto. Va en PENDIENTES. Mientras tanto,
   partidas guardadas y enlaces viejos entran en B aunque su
   localStorage diga otra cosa. */
const CLAVE_MAQ = "vt-maqueta";
function maqueta(){ return "b"; }
const esB = ()=> maqueta()==="b";
function aplicarMaqueta(){ document.body.dataset.maq = maqueta(); }
// el interruptor se retiró con la maqueta A; queda la limpieza por si
// alguna guardia guardada trae la marca vieja
try{ localStorage.removeItem(CLAVE_MAQ); }catch(e){}
if(PWA && "serviceWorker" in navigator){
  addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
/* Android dispara este evento cuando la app es instalable; hay que
   atraparlo ANTES de que se pinte la portada y guardarlo para el botón. */
let instalador = null;
addEventListener("beforeinstallprompt", ev=>{
  ev.preventDefault(); instalador = ev;
  if(!G) render();                      // la portada estrena su botón
});
addEventListener("appinstalled", ()=>{ instalador = null; if(!G) render(); });
function instalada(){
  return matchMedia("(display-mode: standalone)").matches ||
         navigator.standalone === true;
}
function esIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

const D = /*__DATOS__*/{};

/* ══ constantes de reglas (v0.30 · REGLAMENTO-v030.md) ══════════════ */
const TIPOS = ["IMAGEN","FARMACOS","PERSONAL","PROCEDIMIENTOS"];
const IC = {IMAGEN:"🩻",FARMACOS:"💊",PERSONAL:"🧑‍⚕️",PROCEDIMIENTOS:"💉",COMODIN:"🃏"};
const TNOM = {IMAGEN:"Imagen",FARMACOS:"Fármacos",PERSONAL:"Personal",
              PROCEDIMIENTOS:"Procedim.",COMODIN:"Comodín"};
const SIS = {RESP:["🫁 Resp","var(--resp)"],CARD:["🫀 Card","var(--card)"],
             NEURO:["🧠 Neuro","var(--neuro)"],METAB:["🧪 Metab","var(--metab)"],
             QUIR:["🔪 Quir","var(--quir)"]};
const TCOL = {IMAGEN:"#3d7ea6",FARMACOS:"#b03d29",PERSONAL:"#2f8f6b",
              PROCEDIMIENTOS:"#7a5ba6",COMODIN:"#8a6a2f"};
// v0.31: se eliminó El Pasillo. La Pizarra vive en el centro de la mesa y
// se compra durante el Pase de Visita, que es cuando de verdad la miras.
const FASES = [["entrega","Entrega de Turno"],["visita","Pase de Visita"],
               ["fin","Fin de Guardia"]];
const RONDAS = 8, CAMAS = 3, ROBO = 4, MANO_MAX = 6, INDICACIONES = 3;
// nota: el campo interno sigue llamándose j.coloc porque viaja dentro de
// la partida guardada; renombrarlo rompería las guardias en curso.
const CLAVE = "vaya-turno-v030-partida";

/* ══ estado ═════════════════════════════════════════════════════════ */
let G = null;          // partida
let UI = {sel:null, selProt:null, modal:null, marcarDescartes:[],
          // pulso de juego: diffs entre renders para animar solo lo que cambió
          nuevas:new Set(), vidaPrev:{}, okPrev:{}, reqPrev:{}, colocPrev:null,
          foco:0, manoAbierta:false};

/* aviso flotante — vive fuera de #app, sobrevive a los re-render */
function aviso(cls, html){
  let c = document.getElementById("avisos");
  if(!c){ c = document.createElement("div"); c.id = "avisos"; document.body.appendChild(c); }
  const t = document.createElement("div");
  t.className = "aviso "+cls; t.innerHTML = html;
  c.appendChild(t);
  while(c.children.length > 3) c.firstChild.remove();
  setTimeout(()=>t.remove(), 2650);
}

const uid = (()=>{ let n=0; return ()=> ++n; })();
/* El azar del juego pasa por AZAR para que La Guardia del Día pueda
   sembrarlo: con la misma semilla, la misma baraja para todo el mundo.
   Fuera del reparto inicial, AZAR vuelve a ser Math.random. */
let AZAR = Math.random;
function azarSemilla(n){
  let s = n >>> 0;
  return ()=>{ s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function semillaDe(txt){
  let h = 9; for(const ch of txt) h = (Math.imul(h, 31) + ch.codePointAt(0)) | 0;
  return h >>> 0;
}
function fechaDia(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
         "-" + String(d.getDate()).padStart(2,"0");
}
function baraja(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(AZAR()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function copiasDe(lista){ const out=[]; lista.forEach(c=>{ for(let i=0;i<(+c.copias||1);i++) out.push({...c,uid:uid()}); }); return out; }

/* ══ construir partida ══════════════════════════════════════════════ */
function nuevaPartida(modo, nombres, tuto, dia){
  // `dia` (una fecha "2026-09-04") siembra TODO el reparto inicial: mazos,
  // pacientes de partida, pizarra, manos y la terna de avatares. Dos
  // personas que jueguen la misma fecha reciben exactamente la misma
  // guardia; lo único distinto es cómo la juegan.
  if(dia) AZAR = azarSemilla(semillaDe(dia));
  const mazoP = baraja(copiasDe(D.pacientes));
  const mazoG = baraja(copiasDe(D.recursos));
  const mazoA = baraja(copiasDe(D.acciones));
  const avat  = baraja(D.personajes.slice());
  AZAR = Math.random;
  const jug = nombres.map((nom,i)=>({
    nombre:nom, ia: modo==="ia" && i===1,
    avatar: null, mano:[], camas:[null,null,null],
    altas:[], muertos:[], sumarios:0,
    protocolos:[], coloc:INDICACIONES, compraHecha:false, accionHecha:false,
    roboMod:0, sinFarmacos:false, colocMod:0, habP:false, habT:false, pena:0,
    habUsos:0, guardadaC11:null, warnsVistas:0, sinCierre:false
  }));
  jug.forEach(j=>{ if(j.ia) j.avatar = avat.pop(); });
  G = { modo, dia: dia || null, ronda:1, turno:0, fase:0,
        mazoP, mazoG, descG:[], mazoA, descA:[],
        pizarra:[], sumariosLibres:6, log:[], fin:false, pendiente:null,
        bloqueoAcciones:0, ultimaAccion:null, ultimaComp:null,
        canjeAvatar:null, iniciado:false };
  // 2 pacientes por jugador, la tercera cama parte vacía
  jug.forEach(j=>{ for(let i=0;i<2;i++) j.camas[i] = nuevaCama(G.mazoP.pop()); });
  G.jug = jug;
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  for(let i=0;i<3;i++){ const a=G.mazoA.pop(); if(a) G.pizarra.push(a); }
  jug.forEach(j=>{ for(let i=0;i<ROBO;i++) robar(j); });
  jug.forEach(j=>{ if(j.avatar) regaloInicialAvatar(j); });   // C17 de la IA
  anota("r", `RONDA 1 · empieza ${jug[0].nombre}`);
  G.avatarPool = avat;
  G.iniciado = true;
  if(tuto) G.tuto = {i:0};
  UI.vidaPrev = {}; UI.okPrev = {}; UI.reqPrev = {}; UI.colocPrev = null;
  siguienteAvatar();
}

/* Al inicio se revelan 3 avatares por jugador humano; elige 1 y los otros
   vuelven al fondo de la pila. */
function siguienteAvatar(){
  const i = G.jug.findIndex(j=>!j.avatar);
  if(i < 0){ siguienteEntrega(); return; }   // y ahora te pasan la unidad
  G.pendiente = {tipo:"avatar", jugador:i,
                 ops: G.avatarPool.splice(-3, 3)};
  UI.avPos = 0;
  // la franja "SELECCIONA TU PERSONAJE" sobraba desde que la elección
  // ocupa la pantalla entera y ya lleva su título: cruzaba por encima
  guardar(); render();
}
function resolverAvatar(elegido){
  const p = G.pendiente;
  G.jug[p.jugador].avatar = elegido;
  G.avatarPool.unshift(...p.ops.filter(o=>o!==elegido));
  anota("", `${G.jug[p.jugador].nombre} será ${elegido.nombre}.`);
  regaloInicialAvatar(G.jug[p.jugador]);       // C17: su comodín de partida
  siguienteAvatar();
}

function nuevaCama(p){
  if(!p) return null;
  return { p, uid:uid(), vida:p.vida, vidaMax:p.vida,
           pide:{...p.pide}, tiene:{IMAGEN:0,FARMACOS:0,PERSONAL:0,PROCEDIMIENTOS:0},
           puestos:[], basura:[], protege:[], estable:false, estableDesde:null,
           atacada:false, escudo:false, extraDeterioro:0,
           soporteVivo:false };
}

function robar(j){
  if(!G.mazoG.length){
    if(!G.descG.length) return null;
    G.mazoG = baraja(G.descG); G.descG = [];
    anota("", "Se acabó el Mazo de Guardia: se baraja el descarte.");
  }
  const c = G.mazoG.pop();
  if(c){ j.mano.push(c); if(!j.ia) UI.nuevas.add(c.uid); }
  return c;
}
function anota(cls, txt){ G.log.push({cls, txt, r:G.ronda}); }

/* ══ consultas ══════════════════════════════════════════════════════ */
const yo   = ()=> G.jug[G.turno];
const otros= ()=> G.jug.filter((_,i)=>i!==G.turno);
/* el dueño de la cámara: contra la IA siempre el humano. Antes el tablero
   se daba vuelta en el turno de la IA — y con el turno pausado (v0.43) su
   mano quedaba a la vista en el abanico. En hotseat sigue rotando. */
const vista = ()=> (G.modo==="ia" && yo().ia) ? G.jug.find(j=>!j.ia) : yo();
function falta(c,t){ return Math.max(0, c.pide[t]-c.tiene[t]); }
function faltanTotal(c){ return TIPOS.reduce((s,t)=>s+falta(c,t),0); }
function limiteMano(j){ return Math.max(1, MANO_MAX - j.sumarios); }

/* Dos preguntas que el jugador se hace mirando la cama, y que hasta ahora
   tenía que calcular de cabeza. Las contesta el marco: verde si se va,
   rojo si se muere. */
function saldraDeAlta(c){
  // el alta se cobra en tu Entrega, y la basura clínica la retiene
  return !!(c && c.estable && !c.basura.length);
}
/* ¿hay soporte vital puesto? Mientras lo haya, el reloj de este paciente
   está parado — y por eso hay que preguntarlo también aquí: sin esto el
   aura roja de «se muere esta noche» seguiría encendida sobre alguien
   conectado al ventilador, que es justo el que no se muere. */
/* ¿le queda al paciente su turno de soporte? La Ventilación Mecánica no
   congela para siempre: aguanta UN Fin de Guardia y se gasta. Un
   ventilado igual se muere — solo que no esta noche. Por eso la carga
   vive en la cama (`soporteVivo`) y no en la carta: la carta se queda
   puesta como 💉 aunque el aguante ya se haya consumido, y volver a
   colocar una Ventilación Mecánica la recarga. */
function conSoporte(c){ return !!(c && c.soporteVivo); }
function alFilo(c){
  if(!c) return false;
  if(c.estable && !c.basura.length) return false;   // congelado: no baja
  if(conSoporte(c)) return false;                   // conectado: tampoco
  return c.vida - (1 + (c.extraDeterioro||0)) <= 0;
}

function revisar(c, ronda){
  const completo = faltanTotal(c)===0;
  if(completo && !c.estable){ c.estable=true; c.estableDesde=ronda; }
  else if(!completo && c.estable){ c.estable=false; c.estableDesde=null; }
}

/* Cuánto aporta una carta sobre una cama. Dos caminos al ×2 y nunca se
   suman —el tope es 2— porque la gracia del juego es que el recurso
   correcto valga el doble, no que existan cartas de cuatro:

   · SINERGIA: la carta es del sistema clínico del paciente.
   · CASA PROPIA: la carta vale doble en un tipo concreto. Es lo que hace
     que un comodín sea una decisión y no un relleno: el Stock de Sala
     puesto como 💊 vale 2, y puesto como cualquier otra cosa, 1. */
function aporte(carta, cama, tipoElegido){
  if(carta.sistema && carta.sistema===cama.p.sistema) return 2;
  if(carta.dobleEn && (tipoElegido||carta.tipo)===carta.dobleEn) return 2;
  return 1;
}
/* ¿esta carta sirve al paciente? (define tratamiento vs basura) */
function leSirve(carta, cama){
  // LA CONTRAINDICACIÓN (v0.60). Antes un paciente pedía «2 💊» y cualquier
  // 💊 valía: la categoría decidía y el fármaco daba igual. Ahora uno de los
  // 💊 que aceptaría es justo el que lo mataría, y la carta lo dice. Va
  // antes que todo lo demás —incluida la sinergia de sistema— porque una
  // contraindicación no la salva que el sistema coincida.
  if(cama.p.contra && carta.nombre === cama.p.contra) return false;
  if(carta.comodin) return TIPOS.some(t=>falta(cama,t)>0);
  if(carta.sistema && carta.sistema===cama.p.sistema && falta(cama,carta.tipo)>0) return true;
  return TIPOS.includes(carta.tipo) && falta(cama,carta.tipo)>0;
}
function puedeColocarPropia(carta, cama){
  if(!cama) return false;
  if(carta.restriccion==="PERSONAL" && cama.tiene.PERSONAL===0) return false;
  if(yo().sinFarmacos && carta.tipo==="FARMACOS") return false;
  return leSirve(carta, cama);
}
function puedeSabotear(carta, cama){
  return carta.warn && cama && !cama.atacada && !cama.escudo;
}

/* ¿Qué huecos podría tapar este comodín en esta cama? Con dos o más, la
   elección es del jugador y no de la app: hasta ahora el Médico General se
   iba solo al hueco más grande, que muchas veces es el peor sitio —el que
   ibas a llenar con la carta de sistema que vale doble—. */
function tiposComodin(carta, cama){
  if(!carta || !carta.comodin || !cama) return [];
  return TIPOS.filter(t=>falta(cama,t)>0);
}

/* ══ LAS HABILIDADES DEL PERSONAL 🧑‍⚕️ ════════════════════════════════
   Los recursos son puro ícono a propósito: son la carta más frecuente del
   juego —63 de 159— y cada una con texto es una carta que hay que leer
   CADA vez que alguien la juega. Las personas son la excepción, y no es
   una excepción arbitraria sino la regla con la que el mazo ya estaba
   construido: de las 67 cartas de recurso, las únicas con texto son las
   🧑‍⚕️. Dicho en una línea que se puede recordar en la mesa: **los
   recursos no hacen nada; las personas sí.**

   Todas se disparan al COLOCARLAS sobre un paciente TUYO y como
   tratamiento —nunca como sabotaje ni como basura— y no cuestan una
   indicación aparte: la indicación es la de colocar la carta. */
const HAB = {

/* 🔎 BUSCA · el Gestor de Camas. Descarta 2 y saca del mazo la que
   necesitas. Cambia CANTIDAD por CERTEZA: pagas dos cartas por una, así
   que es negativo en mano y por eso no descuadra la economía (medido: 3,07
   → 3,06 altas). Lo que compra es dejar de depender del robo. */
BUSCA:{
  puede:()=> G.mazoG.length > 0 && yo().mano.length >= 2,
  jugar(j, cama){
    // Primero se elige, DESPUÉS se paga: antes era al revés, y cancelar la
    // elección te dejaba con 2 cartas menos y las manos vacías.
    const orden = G.mazoG.slice().sort((a,b)=>
      (a.tipo+a.nombre).localeCompare(b.tipo+b.nombre));
    elegirUno("¿Qué le pides?", "Del Mazo de Guardia, a tu mano. Cuesta 2 cartas.",
      objCartas(orden), s=>{
        pagarCartas(2, "Gestor de Camas",
          `Marca las 2 cartas que descartas por ${esc(s.carta.nombre)}.`, ()=>{
          const k = G.mazoG.indexOf(s.carta); if(k>=0) G.mazoG.splice(k,1);
          j.mano.push(s.carta); UI.nuevas.add(s.carta.uid);
          G.mazoG = baraja(G.mazoG);
          anota("a",`${j.nombre} consigue ${s.carta.nombre} por el Gestor de Camas.`);
          aviso("ok",`🔎 A la mano: ${esc(s.carta.nombre)}`);
          guardar(); render();
        });
      }, ()=>{ guardar(); render(); },
      ops=>{                                   // la IA: la que más le sirve
        let mejor = null, val = 0;
        ops.forEach(o=>{
          const c = o.val.carta;
          j.camas.forEach(x=>{ if(x && puedeColocarPropia(c,x)){
            const v = aporte(c, x); if(v > val){ val = v; mejor = o.val; } }});
        });
        return mejor || ops[0].val;
      });
  }},

/* ↔ MUEVE · el Pabellón. Un solo recurso, de una cama tuya a otra, gratis.
   Es la mitad de una Reunión Clínica (A03, que mueve tres y cuesta 2
   cartas de la Pizarra) — aquí viene de regalo con la carta. */
MUEVE:{
  puede:()=> objRecursosPropios().length > 0 && objCamasPropias().length > 1,
  jugar(j, cama){
    elegirUno("Pabellón disponible", "Mueve 1 recurso de una cama tuya a otra.",
      objRecursosPropios(), s=>{
        const destinos = objCamasPropias(c=>c!==s.cama);
        if(!destinos.length){ render(); return; }
        elegirUno(`¿A quién va ${s.carta.nombre}?`, null, destinos, dest=>{
          quitarRecurso(s.cama, s.idx); ponerRecurso(dest, s.carta);
          anota("a",`Pabellón: ${s.carta.nombre} pasa de ${s.cama.p.nombre} a ${dest.p.nombre}.`);
          aviso("ok",`↔ ${esc(s.carta.nombre)} → ${esc(dest.p.nombre)}`);
          guardar(); render();
        }, ()=>{ guardar(); render(); });
      }, ()=>{ guardar(); render(); });
  }},

/* 🔁 RECUPERA · el Becado. Rescata un Protocolo del descarte. No cuenta
   como la compra del turno: el Becado no compra, recicla. */
RECUPERA:{
  puede:()=> G.descA.length > 0,
  jugar(j, cama){
    const orden = G.descA.slice().reverse();
    elegirUno("Papeleo al día", "Rescata 1 Protocolo del descarte y guárdalo.",
      orden.map(a=>({txt:esc(a.nombre), sub:`${esc(a.tipo)} · ${esc(a.texto).slice(0,70)}`,
                     val:a})),
      a=>{
        const k = G.descA.indexOf(a); if(k>=0) G.descA.splice(k,1);
        j.protocolos.push(a);
        anota("a",`${j.nombre} rescata ${a.nombre} del descarte (Becado).`);
        aviso("ok",`🔁 Recuperado: ${esc(a.nombre)}`);
        guardar(); render();
      }, ()=>{ guardar(); render(); });
  }},
};

/* La hoja de "marca N cartas y págalas". Existía dentro de abrirCompra y la
   necesitaba también el Gestor, así que sale a vivir sola. La IA no abre
   hojas: bota las que menos le sirven, que es el mismo criterio con el que
   compra en la Pizarra. */
function pagarCartas(n, titulo, ayuda, ok){
  const j = yo();
  if(j.mano.length < n) return;
  if(j.ia){
    j.mano.sort((a,b)=>(a.comodin?1:0)-(b.comodin?1:0) ||
                       (a.sistema?1:0)-(b.sistema?1:0));
    for(let k=0;k<n;k++) G.descG.push(j.mano.shift());
    ok(); return;
  }
  const marcados = [];
  hoja(titulo, (m, cerrar)=>{
    m.appendChild(el("p",null,ayuda+` Marca <b>${n}</b>.`));
    const cont = el("div","opciones");
    let confirmar;
    j.mano.forEach(c=>{
      const b = el("button","op");
      b.innerHTML = `<b>${ico(c.tipo)} ${esc(c.nombre)}</b>`+
                    `<small>${TNOM[c.tipo]||""}${c.warn?" · ⚠️ "+esc(c.compNombre):""}</small>`;
      b.onclick = ()=>{
        const i = marcados.indexOf(c.uid);
        if(i>=0){ marcados.splice(i,1); b.className="op"; }
        else if(marcados.length<n){ marcados.push(c.uid); b.className="op sel"; }
        confirmar.disabled = marcados.length!==n;
      };
      cont.appendChild(b);
    });
    m.appendChild(cont);
    const fila = el("div","acciones"); fila.style.padding="0";
    const can = el("button","btn","Ahora no");
    can.onclick = ()=>{ UI.modal=null; guardar(); render(); };
    confirmar = el("button","btn pri","Pagar"); confirmar.disabled = true;
    confirmar.onclick = ()=>{
      marcados.forEach(u=>{ const i=j.mano.findIndex(c=>c.uid===u);
                            if(i>=0) G.descG.push(j.mano.splice(i,1)[0]); });
      UI.modal = null; ok();
    };
    fila.appendChild(can); fila.appendChild(confirmar);
    m.appendChild(fila);
  });
}

/* Se dispara diferida a propósito: `colocar` todavía tiene que terminar y
   su llamador va a renderizar justo después. Si la hoja se abriera aquí,
   ese render se la llevaría por delante. */
function dispararHabilidad(carta, cama){
  const h = carta && carta.hab ? HAB[carta.hab] : null;
  if(!h || !h.puede()) return;
  setTimeout(()=>{ if(G && !G.fin) h.jugar(yo(), cama); }, 0);
}

/* ══ colocar ════════════════════════════════════════════════════════ */
function colocar(carta, cama, duenio, esSabotaje, tipoElegido){
  const j = yo();
  j.mano.splice(j.mano.indexOf(carta),1);
  let tipo = carta.tipo;
  if(carta.comodin){
    // Con `tipoElegido` manda el jugador (lo pregunta soltarComodin). Sin
    // él —la IA, o un solo hueco posible— se rellena el que más falta, que
    // es lo que hacía siempre.
    tipo = tipoElegido || TIPOS.filter(t=>falta(cama,t)>0)
                .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || "FARMACOS";
  }
  const sirve = leSirve(carta, cama);

  if(esSabotaje && !sirve){
    cama.basura.push(carta);
    anota("m", `${j.nombre} tira ${carta.nombre} sobre ${cama.p.nombre} (${duenio.nombre}): basura clínica.`);
  } else {
    let ap = aporte(carta, cama, tipo);
    // C16 Ojo Entrenado: sus 🩻 con sistema valen doble en cualquier
    // paciente SUYO, no solo en los de su sistema
    if(ap===1 && !esSabotaje && duenio===j && tieneAv(j,"C16") &&
       carta.tipo==="IMAGEN" && carta.sistema){
      ap = 2; anota("", `Ojo Entrenado: ${carta.nombre} cuenta doble.`);
    }
    // C13 Paciente Emblema: el 3º tipo distinto del turno sobre el mismo
    // paciente cuenta doble (si no doblaba ya)
    if(!esSabotaje && duenio===j && tieneAv(j,"C13")){
      j._c13 = j._c13 || {};
      const pt = j._c13[cama.uid] = j._c13[cama.uid] || [];
      pt.push(tipo);
      if(ap===1 && pt.length===3 && new Set(pt).size===3){
        ap = 2; anota("a", `Paciente Emblema: ${carta.nombre} es el tercer tipo distinto — cuenta doble.`);
        if(!j.ia) aviso("ok",`🏅 Paciente Emblema: ${esc(carta.nombre)} ×2`);
      }
    }
    cama.tiene[tipo] += ap;
    // se guarda QUÉ aportó: sin esto no se puede retirar ni mover un recurso
    // ya colocado (Vacaciones, Reunión Clínica, Hay Que Repetirlo…)
    carta.puestoTipo = tipo; carta.puestoAp = ap;
    cama.puestos.push(carta);
    if(carta.previene) cama.protege.push(carta.previene);
    if(carta.soporte) cama.soporteVivo = true;      // queda conectado
    if(!esSabotaje) dispararHabilidad(carta, cama);
    const doble = ap===2 ? " ×2" : "";
    anota("", esSabotaje
      ? `${j.nombre} le pone ${carta.nombre} a ${cama.p.nombre} (${duenio.nombre}) — le sirve${doble}.`
      : `${j.nombre} trata a ${cama.p.nombre} con ${carta.nombre}${doble}.`);
  }
  if(esSabotaje) cama.atacada = true;

  if(carta.warn){
    const antes = cama.vida;
    complicar(carta, cama, duenio);
    // C12 Vigilancia Epidemiológica: cada 3 ⚠️ en tu unidad, un Protocolo
    // gratis. Cuentan las que caen en TU unidad — las pongas tú o el rival.
    if(tieneAv(duenio,"C12")){
      duenio.warnsVistas = (duenio.warnsVistas||0) + 1;
      if(duenio.warnsVistas % 3 === 0 && G.mazoA.length){
        const pa = G.mazoA.pop(); duenio.protocolos.push(pa);
        anota("a",`Vigilancia Epidemiológica: van ${duenio.warnsVistas} ⚠️ — ${duenio.nombre} suma ${pa.nombre} gratis.`);
        if(!duenio.ia) aviso("ok",`🦠 3 ⚠️ vigiladas: ${esc(pa.nombre)} gratis`);
      }
    }
    // C01 El Diostor: tu ⚠️ sobre tu paciente puede pagarla el rival
    if(!esSabotaje && duenio===j && cama.vida<antes && tieneAv(j,"C01") &&
       !j.habT && j.mano.length>=2 &&
       otros().some(r=>r.camas.some(c=>c && !c.escudo))){
      ofrecerDiostor(j, carta, cama);
    }
  }
  revisar(cama, G.ronda);
  // La carta ya vive en la cama (puestos o basura): NO va además al
  // descarte. Duplicarla ahí hacía que, al rebarajar el mazo agotado,
  // volviera a circular una copia de algo que sigue puesto.

  j.coloc--;
  if(carta.restriccion==="TURNO"){ j.coloc = 0; anota("", "La Resonancia con Cupo cierra el Pase de Visita."); }
}

/* COLOCAR NUNCA MATA: piso universal de 1 ❤️ */
function complicar(carta, cama, duenio){
  const nom = carta.compNombre;
  if(nom && cama.protege.includes(nom)){
    anota("a", `🛡️ ${nom} prevenida en ${cama.p.nombre}.`);
    aviso("ok", `🛡️ ${esc(nom)} prevenida en ${esc(cama.p.nombre)}`);
    return;
  }
  const antes = cama.vida;
  cama.vida = Math.max(1, cama.vida - 1);
  // ventana de RESPUESTA: la última complicación resuelta se puede anular
  if(cama.vida < antes)
    G.ultimaComp = {cama:cama.uid, nombre:nom, paciente:cama.p.nombre, ronda:G.ronda};
  if(cama.vida===antes) anota("", `⚠️ ${nom}: ${cama.p.nombre} ya estaba en 1 ❤️ — colocar nunca mata.`);
  else anota("m", `⚠️ ${nom}: ${cama.p.nombre} pierde 1 ❤️ (queda ${cama.vida}).`);
  if(carta.turno24 && duenio.mano.length){
    const b = duenio.mano.pop(); G.descG.push(b);
    anota("m", `El Turno Veinticuatro: ${duenio.nombre} descarta ${b.nombre}.`);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   ACCIONES CON EFECTO REAL (v0.35)
   Antes las 22 Acciones eran texto: la app las anotaba y tú movías las
   fichas. Ahora el árbitro las ejecuta y te pide los objetivos que la
   carta necesita. Cada entrada declara:
     puede()  → ¿hay objetivos válidos ahora? (si no, no se deja jugar)
     jugar(j, ok, no) → resuelve; llama ok() si se aplicó, no() si se
                        canceló (la carta NO se gasta al cancelar).
   ══════════════════════════════════════════════════════════════════ */

/* — retirar y poner recursos ya colocados — */
function quitarRecurso(cama, idx){
  const x = cama.puestos.splice(idx,1)[0];
  const t = x.puestoTipo || x.tipo, ap = x.puestoAp || 1;
  if(TIPOS.includes(t)) cama.tiene[t] = Math.max(0, cama.tiene[t]-ap);
  if(x.previene){ const k = cama.protege.indexOf(x.previene); if(k>=0) cama.protege.splice(k,1); }
  // desconectarlo apaga el aguante aunque no se hubiera gastado
  if(x.soporte && !cama.puestos.some(y=>y.soporte)) cama.soporteVivo = false;
  revisar(cama, G.ronda);
  return x;
}
function ponerRecurso(cama, x){
  let t = x.puestoTipo || x.tipo;
  if(x.comodin) t = TIPOS.filter(k=>falta(cama,k)>0)
                        .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || t || "FARMACOS";
  const ap = aporte(x, cama, t);
  x.puestoTipo = t; x.puestoAp = ap;
  if(TIPOS.includes(t)) cama.tiene[t] += ap;
  cama.puestos.push(x);
  if(x.previene) cama.protege.push(x.previene);
  if(x.soporte) cama.soporteVivo = true;
  revisar(cama, G.ronda);
}

/* — listas de objetivos — */
function objCamasPropias(f){
  // primero la que está más cerca de cerrar (y aún no cerró)
  return yo().camas.filter(c=>c && (!f||f(c)))
    .map(c=>({txt:esc(c.p.nombre),
              sub:`${c.vida} ❤️ · faltan ${faltanTotal(c)}${c.estable?" · ✅ estable":""}`,
              val:c, orden:(c.estable?99:0) + faltanTotal(c)}))
    .sort((a,b)=>a.orden-b.orden);
}
/* las listas de rivales van ordenadas por "a quién estorba más": primero
   el que está por cerrar. Así la IA acierta eligiendo la primera. */
function objCamasRivales(f){
  const out = [];
  otros().forEach(r=>r.camas.forEach(c=>{
    if(!c || c.escudo || (f && !f(c))) return;
    out.push({txt:esc(c.p.nombre),
              sub:`${esc(r.nombre)} · ${c.vida} ❤️ · faltan ${faltanTotal(c)}${c.estable?" · ✅":""}`,
              val:{cama:c, duenio:r}, orden:faltanTotal(c)});
  }));
  return out.sort((a,b)=>a.orden-b.orden);
}
function objRecursosRivales(f){
  const out = [];
  otros().forEach(r=>r.camas.forEach(c=>{
    if(!c || c.escudo) return;
    c.puestos.forEach((x,i)=>{
      // C22 La Jefa de Unidad: su 🧑‍⚕️ no se toca; C17: sus 🃏 tampoco
      if((x.puestoTipo||x.tipo)==="PERSONAL" && tieneAv(r,"C22")) return;
      if(x.comodin && tieneAv(r,"C17")) return;
      if(!f || f(x))
      out.push({txt:`${ico(x.tipo)} ${esc(x.nombre)}`,
                sub:`sobre ${esc(c.p.nombre)} · ${esc(r.nombre)}`,
                val:{cama:c, idx:i, carta:x, duenio:r}, orden:faltanTotal(c)}); });
  }));
  return out.sort((a,b)=>a.orden-b.orden);
}
function objRecursosPropios(){
  const out = [];
  yo().camas.forEach(c=>{ if(!c) return;
    c.puestos.forEach((x,i)=>out.push({
      txt:`${ico(x.tipo)} ${esc(x.nombre)}`, sub:`sobre ${esc(c.p.nombre)}`,
      val:{cama:c, idx:i, carta:x}})); });
  return out;
}
function objRivales(){
  return otros().map(r=>({txt:esc(r.nombre),
    sub:`${r.mano.length} cartas · ${r.altas.length} altas · ${r.muertos.length} ✝️`, val:r}));
}
const objCartas = lista => lista.map((x,i)=>({
  txt:`${ico(x.tipo)} ${esc(x.nombre)}`,
  sub:`${TNOM[x.tipo]||x.tipo}${x.sistema&&SIS[x.sistema]?" · "+SIS[x.sistema][0]:""}${x.warn?" · ⚠️ "+esc(x.compNombre):""}`,
  val:{carta:x, idx:i}}));

/* — hoja de selección: el paso genérico de "elige un objetivo".
   No usa hoja(): una Acción de varios pasos no puede cerrarse tocando
   fuera, o el efecto quedaría a medio aplicar. Sales por Cancelar. — */
function elegirUno(titulo, ayuda, ops, fn, no, prefiere){
  if(!ops.length){ (no||render)(); return; }
  // la IA no abre hojas: elige sola. Las listas ya vienen ordenadas por
  // conveniencia, así que "la primera" es su mejor opción salvo que la
  // carta pida otro criterio (prefiere).
  if(yo().ia){
    const v = prefiere ? prefiere(ops) : ops[0].val;
    if(v===undefined || v===null && !ops.some(o=>o.val===null)){ (no||render)(); return; }
    fn(v); return;
  }
  const velo = el("div","velo");
  const m = el("div","modal");
  m.appendChild(el("div","tirador"));
  m.appendChild(el("h2",null,esc(titulo)));
  if(ayuda) m.appendChild(el("p",null,ayuda));
  const cont = el("div","opciones");
  ops.forEach(o=>{
    const b = el("button","op");
    b.innerHTML = `<b>${o.txt}</b>`+(o.sub?`<small>${o.sub}</small>`:"");
    b.onclick = ()=>{ UI.modal=null; fn(o.val); };
    cont.appendChild(b);
  });
  m.appendChild(cont);
  const can = el("button","btn","Cancelar");
  can.onclick = ()=>{ UI.modal=null; (no||render)(); };
  m.appendChild(can);
  velo.appendChild(m);
  UI.modal = velo; render();
}

const ACC = {
A01:{ // Vacaciones
  puede:()=> objRecursosRivales(x=>x.tipo==="PERSONAL").length>0,
  jugar(j, ok, no){
    elegirUno("Vacaciones","Elige el 🧑‍⚕️ Personal que se toma quince días. Vuelve a la mano de su dueño.",
      objRecursosRivales(x=>x.tipo==="PERSONAL"), s=>{
        quitarRecurso(s.cama, s.idx); s.duenio.mano.push(s.carta);
        anota("a",`Vacaciones: ${s.carta.nombre} deja a ${s.cama.p.nombre} y vuelve a la mano de ${s.duenio.nombre}.`);
        aviso("warn",`🧑‍⚕️ ${esc(s.carta.nombre)} se va de vacaciones (vuelve a la mano rival)`);
        ok();
      }, no);
  }},
A02:{ // Cumpleaños del Residente
  puede:()=> otros().some(r=>r.camas.some(c=>c && !c.escudo && c.puestos.length)),
  jugar(j, ok, no){
    // cada rival entrega su recurso menos valioso; tú eliges dónde va
    const botin = [];
    otros().forEach(r=>{
      const cands = [];
      r.camas.forEach(c=>{ if(c && !c.escudo)

      quitarRecurso(el0.c, el0.i); botin.push(el0.x);
      anota("a",`Cumpleaños: ${r.nombre} entrega ${el0.x.nombre} (de ${el0.c.p.nombre}).`);
    });

      if(!botin.length){ aviso("ok","🎂 Cumpleaños del Residente: recursos recibidos"); ok(); return; }

  }},

/* ══ LAS HABILIDADES DE AVATAR (v0.66) ══════════════════════════════
   Hasta hoy las 22 eran texto: el ⚡ marcaba el poder como gastado y el
   efecto lo aplicaba el jugador a mano — o sea, contra la IA no lo
   aplicaba nadie. Ahora el árbitro las ejecuta, con la misma semántica
   que ya validó tools/simular_avatares.py (rebalance §4q).

   Tres familias:
   · ACTIVAS (tabla AV) — el ⚡ pide objetivos con elegirUno/pagarCartas.
     Regla de oro: SE PAGA AL FINAL. Cancelar a medio camino no gasta
     nada — ni cartas ni el poder.
   · AUTOMÁTICAS (C08, C14) — se disparan solas cuando toca; el ⚡ solo
     informa.
   · PASIVAS — enganchadas donde viven sus reglas (robo, admisión,
     aporte, muertes, complicaciones, Pizarra, Sumarios).            */

const tieneAv = (j, id) => !!(j && j.avatar && j.avatar.id === id);
const duenioDe = cama => G.jug.find(x=>x.camas.includes(cama));

function marcarPoder(j){
  const f = (j.avatar && j.avatar.frecuencia) || "";
  if(/2×/.test(f)) j.habUsos = (j.habUsos||0) + 1;
  else if(/PARTIDA/.test(f)) j.habP = true;
  else j.habT = true;
}
function poderGastado(j){
  const f = (j.avatar && j.avatar.frecuencia) || "";
  if(/2×/.test(f)) return (j.habUsos||0) >= 2;
  return /PARTIDA/.test(f) ? !!j.habP : !!j.habT;
}
/* C04 Burocracia Amiga: al Director cerrar Sumarios le cuesta 1 */
function costoSumario(j){ return tieneAv(j,"C04") ? 1 : 2; }

/* C20 El Carroñero de Pasillo: cada ✝️ ajeno le paga una carta al azar */
function alPonerCruz(victima){
  G.jug.forEach(r=>{
    if(r===victima || !tieneAv(r,"C20") || !victima.mano.length) return;
    const cand = victima.mano.filter(c=>!(tieneAv(victima,"C17") && c.comodin));
    if(!cand.length) return;
    const c = cand[Math.floor(Math.random()*cand.length)];
    victima.mano.splice(victima.mano.indexOf(c),1);
    r.mano.push(c); if(!r.ia) UI.nuevas.add(c.uid);
    anota("a",`Justo Pasaba por Ahí: ${r.nombre} le carroñea una carta a ${victima.nombre}.`);
  });
}
/* C08 Foto para la Memoria: la primera alta ✅ trae 1 carta */
function alDarAlta(j){
  if(tieneAv(j,"C08") && !j.habP){
    j.habP = true; robar(j);
    anota("a",`Foto para la Memoria: primera alta de ${j.nombre} — roba 1.`);
    if(!j.ia) aviso("ok","📸 Foto para la Memoria: robas 1 carta");
  }
}
/* C17 El Multiuso: parte con un comodín extra en la mano */
function regaloInicialAvatar(j){
  if(!tieneAv(j,"C17")) return;
  const k = G.mazoG.findIndex(c=>c.comodin);
  if(k<0) return;
  const c = G.mazoG.splice(k,1)[0];
  j.mano.push(c); if(!j.ia) UI.nuevas.add(c.uid);
  anota("", `El Multiuso: ${j.nombre} parte con un comodín extra.`);
}
/* C19 El Intensivista: los graves entran con +1 ❤️ */
function entraConAvatar(j, cama){
  if(cama && tieneAv(j,"C19") &&
     (cama.p.gravedad==="III" || cama.p.gravedad==="ROJO")){
    cama.vida++; cama.vidaMax++;
    anota("", `A Mí No Me Asusta: ${cama.p.nombre} entra con +1 ❤️.`);
  }
}
/* colocación sin costo (C06 y C11): el espejo de colocar() sin mano,
   sin indicación y sin habilidades de turno */
function colocarGratis(carta, cama, j, apForzado){
  let tipo = carta.tipo;
  if(carta.comodin) tipo = TIPOS.filter(t=>falta(cama,t)>0)
      .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || "FARMACOS";
  const ap = apForzado || aporte(carta, cama, tipo);
  cama.tiene[tipo] += ap;
  carta.puestoTipo = tipo; carta.puestoAp = ap;
  cama.puestos.push(carta);
  if(carta.previene) cama.protege.push(carta.previene);
  if(carta.soporte) cama.soporteVivo = true;
  if(carta.warn) complicar(carta, cama, j);
  revisar(cama, G.ronda);
  return ap;
}

/* C01 El Diostor — reactiva: acaba de caer TU ⚠️ y puedes pagar 2 para
   que la sufra un rival. La IA decide sola; al humano se le ofrece en
   una hoja diferida (colocar aún no terminó y su llamador va a pintar). */
function ofrecerDiostor(j, carta, cama){
  const aplicar = victima=>{
    cama.vida = Math.min(cama.vidaMax, cama.vida + 1);
    const nom = carta.compNombre;
    if(nom && victima.protege.includes(nom)){
      anota("a",`El Diostor desvía ${nom}… pero ${victima.p.nombre} estaba protegido.`);
    } else {
      victima.vida = Math.max(1, victima.vida - 1);
      const rd = duenioDe(victima);
      anota("m",`El Diostor desvía ${nom||"la complicación"}: la sufre ${victima.p.nombre}${rd?` (${rd.nombre})`:""}.`);
    }
    revisar(cama, G.ronda); revisar(victima, G.ronda);
    j.habT = true;
  };
  if(j.ia){
    if(j.mano.length < 2) return;
    j.mano.sort((a,b)=>(a.comodin?1:0)-(b.comodin?1:0) ||
                       (a.sistema?1:0)-(b.sistema?1:0));
    G.descG.push(j.mano.shift()); G.descG.push(j.mano.shift());
    const vict = otros().flatMap(r=>r.camas).filter(c=>c && !c.escudo)
                        .sort((a,b)=>b.vida-a.vida)[0];
    if(vict) aplicar(vict);
    return;
  }
  setTimeout(()=>{
