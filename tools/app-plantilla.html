function pie(){
  const j = vista();
  const mio = j === yo();              // ¿es mi turno? si no, la mano es inerte
  const f = el("div","pie");
  const descartando = G.pendiente && G.pendiente.tipo==="descartar";
  // v0.55: el plegado murió con el abanico — la tira ya es bajita siempre.
  // UI.manoOculta queda como bandera inerte para no romper guardias viejas.
  const sobra = j.mano.length - limiteMano(j);
  const rot = el("div","mano-rot");
  rot.innerHTML = `🂠 ${j.mano.length}`+
    (sobra>0 ? ` · <b style="color:var(--warn)">botas ${sobra}</b>` : "")+
    ` <span></span>`;

  // v0.55: la mano es un SELECTOR — miniaturas al filo, scroll nativo,
  // y la lectura ocurre en la carta grande. La cuadrícula de abajo queda
  // solo para marcar descartes, donde comparar todas a la vez sí importa.
  // maqueta B: la mano es un mazo compacto al filo que se despliega en
  // abanico sobre TU zócalo. El tablero entero sigue arriba, así que
  // eliges la carta mirando a quién se la vas a poner, y la arrastras.
  if(esB() && !descartando){
    f.appendChild(barraAcciones());
    const bf = botonFin(); if(bf) f.appendChild(bf);
    f.appendChild(mazoMano(j, mio));
    if(UI.manoAbierta && j.mano.length) f.appendChild(abanicoB(j, mio));
    return f;
  }
  if(!descartando){
    const tira = el("div","selector");
    j.mano.forEach((c,idx)=>{
      let cl = "mini-c";
      if(UI.sel===c) cl += " sel";
      if(mio && G.fase===1){
        const util = j.camas.some(x=>puedeColocarPropia(c,x)) ||
                     (c.warn && otros().some(r=>r.camas.some(x=>puedeSabotear(c,x))));
        if(!util) cl += " no";
      }
      if(UI.nuevas.has(c.uid)) cl += " nueva";
      const b = el("button", cl);
      b.style.setProperty("--i", idx);
      b.style.setProperty("--tc", TCOL[c.tipo] || TCOL.COMODIN);
      if(c.tinte) b.style.setProperty("--tinte", c.tinte);
      b.dataset.uid = c.uid;
      b.innerHTML = `<i class="tp"></i>` + (c.arte
        ? `<img src="${c.arte}" alt="">`
        : `<span class="mini-ico">${ico(c.tipo)}</span>`) +
        `<span class="mini-nom">${esc(c.nombre)}</span>`;
      b.setAttribute("aria-label", c.nombre);
      b.onclick = ()=> verCartaGrande(idx, j);
      tira.appendChild(b);
    });
    if(!j.mano.length) tira.appendChild(el("div","nota","Mano vacía."));
    f.appendChild(barraAcciones());
    f.appendChild(rot);
    f.appendChild(tira);                       // la tira toca el filo
    const bf = botonFin(); if(bf) f.appendChild(bf);
    return f;
  }
  // aquí solo se llega descartando: la cuadrícula para marcar varias
  const abanico = false;
  const mano = el("div","mano");
  if(!j.mano.length) mano.appendChild(el("div","nota","Mano vacía."));

  if(abanico) UI.foco = Math.max(0, Math.min(UI.foco||0, j.mano.length-1));
  let nCarta = 0;
  j.mano.forEach((c,idx)=>{
    let cl = "carta";
    if(UI.sel===c || (descartando && UI.marcarDescartes.includes(c.uid))) cl += " sel";
    if(mio && G.fase===1 && !descartando){
      const util = j.camas.some(x=>puedeColocarPropia(c,x)) ||
                   (c.warn && otros().some(r=>r.camas.some(x=>puedeSabotear(c,x))));
      if(!util) cl += " no";
    }
    if(UI.nuevas.has(c.uid)) cl += " nueva";
    const b = el("button", cl);
    b.style.setProperty("--i", nCarta++);
    b.style.borderLeftColor = TCOL[c.tipo] || TCOL.COMODIN;
    b.dataset.uid = c.uid;
    b.innerHTML = cuerpoCarta(c);
    const esFoco = abanico && idx === UI.foco;
    b.onclick = ()=>{
      if(arrastre.huboArrastre){ arrastre.huboArrastre=false; return; }
      if(descartando){
        const i = UI.marcarDescartes.indexOf(c.uid);
        if(i>=0) UI.marcarDescartes.splice(i,1); else UI.marcarDescartes.push(c.uid);
      } else if(abanico && !esFoco){
        UI.foco = idx;                       // tocar un lado: traerla al centro
      } else if(abanico && esFoco){
        verCartaGrande(idx); return;         // tocar la del centro: verla grande
      } else if(mio && G.fase===1 && j.coloc>0 && !j.ia){
        UI.sel = (UI.sel===c) ? null : c;
      }
      render();
    };
    if(mio && G.fase===1 && j.coloc>0 && !j.ia && !descartando && (!abanico || esFoco))
      b.addEventListener("pointerdown", ev=>tomarCarta(ev,c,b));

    if(!abanico){ mano.appendChild(b); return; }
    const r = el("div","ranura"+(esFoco?" foco":""));
    r.dataset.idx = idx;
    ponRanura(r, idx - UI.foco);
    r.appendChild(b);
    mano.appendChild(r);
  });

  if(abanico){
    mano.appendChild(el("i","abanico-borde izq"));
    mano.appendChild(el("i","abanico-borde der"));
    const pts = el("div","puntos-mano");
    j.mano.forEach((_,i)=>pts.appendChild(el("i", i===UI.foco?"on":"")));
    mano.appendChild(pts);
    hojearAbanico(mano);
  }
  f.appendChild(mano);
  f.appendChild(rot);          // el rótulo va DEBAJO del abanico
  f.appendChild(barraAcciones());
  const bf = botonFin(); if(bf) f.appendChild(bf);
  return f;
}

/* ══ maqueta B · la mano que se abre sobre ti ═══════════════════════
   El problema de la v0.55 no era el tamaño de las miniaturas: era que
   leer una carta te sacaba del tablero (mini → modal → Jugar → cama).
   Aquí la mano es un mazo compacto en la esquina; al tocarlo se abre en
   abanico SOBRE tu zócalo — nunca sobre las camas — con las cartas al
   tamaño en que se leen. Desde ahí se arrastra directo al destino, que
   puede ser tu cama o la del rival. Tocarla la elige y cierra el
   abanico (camino de respaldo, dos toques); mantenerla presionada abre
   la carta grande de siempre, que pasa a ser el "quiero leerla toda". */
function mazoMano(j, mio){
  const w = el("div","mazo-mano"+(UI.manoAbierta?" abierta":""));
  const b = el("button","mazo-btn");
  b.setAttribute("aria-label", UI.manoAbierta ? "Cerrar la mano" : `Abrir tu mano · ${j.mano.length} cartas`);
  b.innerHTML = `<i></i><i></i><i></i><span class="n">${j.mano.length}</span>` +
                `<span class="lab">tu mano</span>`;
  // late solo si hay algo que jugar: el aviso vive donde vas a tocar
  const hay = mio && G.fase===1 && !j.ia && j.coloc>0 && !G.pendiente &&
    j.mano.some(c=> j.camas.some(x=>puedeColocarPropia(c,x)) ||
      (c.warn && otros().some(r=>r.camas.some(x=>puedeSabotear(c,x)))));
  if(hay && !UI.manoAbierta) b.classList.add("late");
  b.onclick = ()=>{
    UI.manoAbierta = !UI.manoAbierta;
    UI.abreMano = UI.manoAbierta;   // la animación de entrada va una sola vez
    UI.sel = null; render();
  };
  w.appendChild(b);
  return w;
}

/* La geometría del abanico B con d CONTINUO —igual que la del de v0.55—
   para que la mano pueda seguir al dedo píxel a píxel mientras hojeas. La
   del foco sube, crece y se pone delante; las vecinas se apartan para
   dejarle sitio. El paso va acotado por arriba y por el ancho total, así
   ni con ocho cartas se sale ninguna de la pantalla. */
function pasoB(n){ return n > 1 ? Math.min(46, 176/(n-1)) : 0; }
/* El arco va SIEMPRE centrado en la pantalla y lo que se mueve es el foco,
   que se levanta y crece en su sitio. Antes el arco se centraba en la carta
   del foco, y con el foco en un extremo la mano entera se corría hacia un
   lado y las últimas cartas se salían de la pantalla. Como la mano nunca
   pasa de ocho, entera cabe: no hace falta desplazarla, solo señalar. */
function ponRanB(r, i, foco, n){
  // La FORMA del arco (posición, caída y giro) sale del sitio de la carta
  // en la mano y no cambia nunca; el foco solo levanta, agranda y abre
  // hueco. Cuando la caída dependía del foco, con el foco en un extremo la
  // última carta bajaba 42 px y se salía por abajo.
  const p = i - (n-1)/2;
  const d = i - foco;
  const ad = Math.abs(d);
  const cerca = Math.max(0, 1 - ad);
  const hueco = 16 * Math.max(-1, Math.min(1, d));   // las vecinas se apartan
  const x = p*pasoB(n) + hueco, y = Math.abs(p)*5 - 20*cerca;
  // transform DIRECTO, no variables CSS: cambiar una custom property
  // invalida el estilo de todo el subárbol de la carta, y ocho subárboles
  // por fotograma era justo lo que daba los tirones al hojear. Un transform
  // inline no toca el estilo de los hijos y lo resuelve el compositor.
  r.style.transform = `translate3d(calc(-50% + ${x.toFixed(1)}px), ` +
    `${y.toFixed(1)}px, 0) rotate(${(p*3.5).toFixed(2)}deg) ` +
    `scale(${(0.90 + 0.22*cerca).toFixed(3)})`;
  const z = String(30 - Math.round(ad));
  if(r.style.zIndex !== z) r.style.zIndex = z;
  const lejos = ad > 2.6;                     // tocar la clase solo si cambia
  if(lejos !== r.__lejos){ r.classList.toggle("lejos", lejos); r.__lejos = lejos; }
}

function abanicoB(j, mio){
  UI.foco = Math.max(0, Math.min(UI.foco||0, j.mano.length-1));
  const w = el("div","abanico-b");
  const arco = el("div","arco");
  const jugable = mio && G.fase===1 && !j.ia && j.coloc>0 && !G.pendiente;
  j.mano.forEach((c,idx)=>{
    const esFoco = idx === UI.foco;
    const r = el("div","ran-b"+(esFoco?" foco":"")+(UI.abreMano?" abre":""));
    r.dataset.idx = idx;
    ponRanB(r, idx, UI.foco, j.mano.length);
    let cl = "carta";
    if(UI.sel===c) cl += " sel";
    if(jugable){
      const util = j.camas.some(x=>puedeColocarPropia(c,x)) ||
                   (c.warn && otros().some(x=>puedeSabotear(c,x)));
      if(!util) cl += " no";
    }
    const b = el("button", cl);
    b.dataset.uid = c.uid;
    b.style.borderLeftColor = TCOL[c.tipo] || TCOL.COMODIN;
    b.innerHTML = cuerpoCarta(c);
    b.onclick = ()=>{
      if(arrastre.huboArrastre){ arrastre.huboArrastre=false; return; }
      if(UI.lupa){ UI.lupa=false; return; }        // fue mantener presionado
      if(!esFoco){ UI.foco = idx; abanicoVivoSnap(); return; }  // recolocar, no redibujar
      if(!jugable){ verCartaGrande(idx, j); return; }
      UI.sel = (UI.sel===c) ? null : c;   // respaldo: la elige y espera la cama
      render();
    };
    // mantener presionado = leerla entera; navegar o arrastrar la cancelan
    b.addEventListener("pointerdown", ev=>{
      clearTimeout(UI.lupaT); UI.lupa = false;
      UI.lupaT = setTimeout(()=>{
        if(arrastre.activo || hojeo.movio) return;
        UI.lupa = true; sanearGestos(); verCartaGrande(idx, j);
      }, 480);
      // de lado navegas, hacia arriba juegas: la dirección la parte moverCarta
      tomarCarta(ev, c, b);
    });
    const cancela = ()=> clearTimeout(UI.lupaT);
    b.addEventListener("pointerup", cancela);
    b.addEventListener("pointercancel", cancela);
    b.addEventListener("pointermove", ()=>{ if(arrastre.activo||hojeo.movio) cancela(); });
    if(UI.abreMano) r.addEventListener("animationend",
      ()=>r.classList.remove("abre"), {once:true});
    r.appendChild(b);
    arco.appendChild(r);
  });
  w.appendChild(arco);
  const pts = el("div","puntos-b");
  j.mano.forEach((_,i)=>pts.appendChild(el("i", i===UI.foco ? "on" : "")));
  w.appendChild(pts);
  w.appendChild(el("div","cerrar-mano","desliza para elegir"));
  UI.abreMano = false;   // los renders siguientes ya no reabren el abanico
  return w;
}

/* La geometría del abanico con d CONTINUO: el hueco junto al foco, el
   levante y la escala son rampas, no saltos — así la mano puede seguir
   al dedo píxel a píxel sin que nada pegue brincos. */
function ponRanura(r, d){
  const ad = Math.abs(d);
  const cerca = Math.max(0, 1 - ad);          // 1 en el foco, 0 desde d=±1
  const hueco = 40 * Math.max(-1, Math.min(1, d));
  r.style.setProperty("--x", (d*46 + hueco)+"px");
  r.style.setProperty("--y", (ad*9 - 20*cerca)+"px");
  r.style.setProperty("--a", (d*6.5)+"deg");
  r.style.setProperty("--s", String(0.85 + 0.37*cerca));
  r.style.setProperty("--z", String(30 - Math.round(ad)));
  r.classList.toggle("lejos", ad > 3.4);
}
/* El abanico vivo sirve a las dos maquetas: A mueve .ranura con ponRanura,
   B mueve .ran-b con ponRanB. Todo lo demás del hojeo es común. */
function contAbanico(){
  return document.querySelector(".abanico-b .arco") ||
         document.querySelector(".mano.abanico");
}
function ranurasAbanico(){
  const c = contAbanico();
  return c ? c.querySelectorAll(".ran-b, .ranura") : [];
}
function pasoAbanico(){
  const n = ranurasAbanico().length || 1;
  return document.querySelector(".abanico-b") ? Math.max(18, pasoB(n)) : PASO_ABANICO;
}
function abanicoVivo(pos){
  const cont = contAbanico();
  if(!cont) return;
  cont.classList.add("vivo");
  const rs = ranurasAbanico(), n = rs.length || 1;
  const bb = !!document.querySelector(".abanico-b");
  const foc = Math.round(pos);
  rs.forEach(r=>{
    const idx = +r.dataset.idx;
    if(bb) ponRanB(r, idx, pos, n); else ponRanura(r, idx - pos);
    const f = idx === foc;
    if(f !== r.__foco){ r.classList.toggle("foco", f); r.__foco = f; }
  });
  if(abanicoVivo.__foc !== foc){
    abanicoVivo.__foc = foc;
    document.querySelectorAll(".puntos-b i, .puntos-mano i")
      .forEach((p,i)=>p.classList.toggle("on", i === foc));
  }
}

/* ¿abanico o cuadrícula? Se recuerda entre partidas. */
function manoAbanico(){
  try{ return localStorage.getItem("vaya-turno-mano") !== "rejilla"; }
  catch(e){ return true; }
}
function cambiarModoMano(){
  try{ localStorage.setItem("vaya-turno-mano", manoAbanico()?"rejilla":"abanico"); }
  catch(e){}
  render();
}

/* Hojear el abanico al estilo TCG Pocket: mientras el dedo está abajo las
   cartas lo siguen 1:1 (sin redibujar nada — solo transforms), y al soltar
   el abanico encaja en la carta más cercana. En los extremos hay goma:
   puedes tirar un poco más allá y vuelve.
   El estado vive fuera del closure y los oyentes van en window, porque el
   render destruye los nodos y con oyentes locales se perdía el gesto. */
const hojeo = {x0:null, y0:null, base:0, movio:false, pos:0};
const PASO_ABANICO = 52;
function hojearAbanico(cont){
  cont.addEventListener("pointerdown", ev=>{
    if(ev.target.closest(".ranura.foco")) return;   // esa la lleva el arrastre
    sanearGestos();
    hojeo.x0 = ev.clientX; hojeo.y0 = ev.clientY;
    hojeo.base = UI.foco; hojeo.movio = false; hojeo.pos = UI.foco;
    window.addEventListener("pointermove", hojearMover);
    window.addEventListener("pointerup", hojearFin);
    window.addEventListener("pointercancel", hojearFin);
  });
}
function hojearMover(ev){
  if(hojeo.x0===null) return;
  const dx = ev.clientX-hojeo.x0, dy = ev.clientY-hojeo.y0;
  if(!hojeo.movio){
    if(Math.abs(dx) < 9) return;
    if(Math.abs(dy) > Math.abs(dx)){ hojearFin(); return; }  // era vertical
    hojeo.movio = true; arrastre.huboArrastre = true;
    clearTimeout(UI.lupaT);          // esto es un hojeo, no una pulsación larga
    try{ document.body.setPointerCapture(ev.pointerId); }catch(e){}
  }
  const n = ranurasAbanico().length || 1;
  let pos = hojeo.base - dx/pasoAbanico();
  if(pos < 0) pos *= 0.3;                              // goma en los bordes
  else if(pos > n-1) pos = (n-1) + (pos-(n-1))*0.3;
  hojeo.pos = pos;
  abanicoVivo(pos);
}
function hojearFin(){
  window.removeEventListener("pointermove", hojearMover);
  window.removeEventListener("pointerup", hojearFin);
  window.removeEventListener("pointercancel", hojearFin);
  const m = hojeo.movio;
  if(m){
    const n = ranurasAbanico().length || 1;
    UI.foco = Math.max(0, Math.min(n-1, Math.round(hojeo.pos)));
    const cont = contAbanico();
    if(cont) cont.classList.remove("vivo");            // vuelve la animación
    abanicoVivoSnap();
  }
  hojeo.x0 = null; hojeo.movio = false;
  if(m) setTimeout(()=>{ arrastre.huboArrastre = false; }, 60);
}
/* el encaje: animar hacia el foco elegido y recién entonces redibujar */
function abanicoVivoSnap(){
  const cont = contAbanico();
  if(!cont){ render(); return; }
  const rs = ranurasAbanico(), n = rs.length || 1;
  const bb = !!document.querySelector(".abanico-b");
  rs.forEach(r=>{
    const idx = +r.dataset.idx;
    if(bb) ponRanB(r, idx, UI.foco, n); else ponRanura(r, idx - UI.foco);
    r.classList.toggle("foco", idx === UI.foco);
  });
  clearTimeout(UI.snapT);
  UI.snapT = setTimeout(render, 240);   // el render fija botones y puntitos
}

/* La carta grande se toma con el dedo: se inclina hacia donde tocas y
   la luz te sigue; al soltar vuelve sola con su resorte (la transición
   CSS). En escritorio basta pasar el mouse. Los overlays van DENTRO de
   la carta, así que rotan con ella. */
function armarHolo(esc, carta){
  let rid = 0;
  const pinta = (px, py)=>{
    carta.style.transform =
      "rotateX(" + ((py - .5) * -13).toFixed(2) + "deg) " +
      "rotateY(" + ((px - .5) * 15).toFixed(2) + "deg) scale(1.02)";
    carta.style.setProperty("--hx", (px * 100).toFixed(1) + "%");
    carta.style.setProperty("--hy", (py * 100).toFixed(1) + "%");
    carta.style.setProperty("--hp", (130 - (px + py) * 65).toFixed(1) + "%");
  };
  const mueve = ev=>{
    const r = carta.getBoundingClientRect();
    if(!r.width) return;
    const px = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    const py = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
    cancelAnimationFrame(rid);
    rid = requestAnimationFrame(()=>pinta(px, py));
  };
  const suelta = ()=>{
    cancelAnimationFrame(rid);
    carta.classList.remove("vivo");
    carta.style.transform = "";
  };
  esc.addEventListener("pointerdown", ev=>{
    carta.classList.remove("giro");
    carta.classList.add("vivo");
    mueve(ev);
  });
  esc.addEventListener("pointermove", ev=>{
    // con mouse, el puro hover ya la inclina; con dedo, solo tomada
    if(ev.pointerType === "mouse" && !carta.classList.contains("vivo"))
      carta.classList.add("vivo");
    if(carta.classList.contains("vivo")) mueve(ev);
  });
  esc.addEventListener("pointerup", suelta);
  esc.addEventListener("pointercancel", suelta);
  esc.addEventListener("pointerleave", suelta);
}

/* El giroscopio le da vida a la carta aunque no la toques. En Android los
   eventos llegan solos; el iPhone exige pedir permiso con un gesto, así
   que ahí la carta responde solo al dedo. Un único listener global: busca
   la carta abierta en vez de suscribirse por modal (nada que des-suscribir). */
addEventListener("deviceorientation", ev=>{
  const carta = document.querySelector(".grande.holo:not(.vivo)");
  if(!carta || ev.gamma == null || ev.beta == null) return;
  const px = Math.min(1, Math.max(0, .5 + ev.gamma / 70));
  const py = Math.min(1, Math.max(0, .5 + (ev.beta - 40) / 90));
  carta.classList.add("giro");
  carta.style.transform =
    "rotateX(" + ((py - .5) * -8).toFixed(2) + "deg) " +
    "rotateY(" + ((px - .5) * 9).toFixed(2) + "deg)";
  carta.style.setProperty("--hx", (px * 100).toFixed(1) + "%");
  carta.style.setProperty("--hy", (py * 100).toFixed(1) + "%");
  carta.style.setProperty("--hp", (130 - (px + py) * 65).toFixed(1) + "%");
});

function cuerpoCarta(c){
  // El sello de esquina: en el abanico las cartas se tapan unas a otras y
  // de la mayoría solo asoma una franja de papel blanco —la mano se veía
  // "invisible"—. El símbolo del recurso va en las DOS esquinas de arriba,
  // como el índice de un naipe, así que sea cual sea el trozo que asoma,
  // dice de qué es la carta.
  const tc = TCOL[c.tipo] || TCOL.COMODIN;
  let h = `<i class="esq ai" style="--tc:${tc}">${SVG[c.tipo]||SVG.COMODIN}</i>`+
          `<i class="esq bd" style="--tc:${tc}">${SVG[c.tipo]||SVG.COMODIN}</i>`;
  h += c.arte
    ? `<i class="arte"${c.tinte ? ` style="--tinte:${c.tinte}"` : ""}>` +
      `<img src="${c.arte}" alt=""></i>`
    : "";
  // el ícono ya lo dan los sellos de esquina: aquí queda solo la palabra,
  // apartada a los lados para no meterse debajo de ellos
  h += `<div class="carta-cab${c.arte ? "" : " libre"}">`+
       `<span class="carta-tipo">${TNOM[c.tipo]||c.tipo}</span></div>`+
       `<div class="carta-nom">${esc(c.nombre)}</div>`;
  if(c.sistema && SIS[c.sistema])
    h += `<span class="etiq x2" style="color:${SIS[c.sistema][1]}">${SIS[c.sistema][0]} ×2</span>`;
  if(c.soporte) h += `<span class="etiq sop">⏸ aguanta 1 turno</span>`;
  if(c.dobleEn) h += `<span class="etiq x2">×2 ${esc(TNOM[c.dobleEn]||c.dobleEn).toLowerCase()}</span>`;
  if(c.previene) h += `<span class="etiq s">🛡️ previene</span>`;
  if(c.restriccion==="PERSONAL") h += `<span class="etiq r">⚑ pide personal</span>`;
  if(c.restriccion==="TURNO") h += `<span class="etiq r">⚑ cierra turno</span>`;
  if(c.warn) h += `<span class="etiq w">⚠️ −1 ❤️</span>`;
  h += `<div class="carta-pie">${esc(c.warn ? c.compNombre : (c.frase||""))}</div>`;
  return h;
}

function sanearGestos(){
  clearTimeout(UI.snapT);
  document.body.classList.remove("arrastrando");
  document.querySelectorAll(".fantasma").forEach(f=>f.remove());
  arrastre.carta = null; arrastre.boton = null; arrastre.fantasma = null;
  arrastre.sobre = null; arrastre.activo = false;
  arrastre.huboArrastre = false;
  hojeo.x0 = null; hojeo.movio = false;
  window.removeEventListener("pointermove", moverCarta);
  window.removeEventListener("pointerup", soltarCarta);
  window.removeEventListener("pointercancel", soltarCarta);
  window.removeEventListener("pointermove", hojearMover);
  window.removeEventListener("pointerup", hojearFin);
  window.removeEventListener("pointercancel", hojearFin);
}

/* Une causa y efecto: la indicación gastada viaja desde la cama donde
   actuaste hasta el contador. Sin esto, el contador bajaba en silencio
   al otro extremo de la pantalla y nadie notaba que había pagado. */
function volarIndic(desde){
  if(!desde || !desde.getBoundingClientRect) return;
  const r = desde.getBoundingClientRect();
  const f = el("div","ficha-indic");
  f.style.left = (r.x + r.width/2) + "px";
  f.style.top  = (r.y + r.height - 14) + "px";
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const caja = document.getElementById("indic-caja");
    if(caja){
      const q = caja.getBoundingClientRect();
      f.style.transform = `translate(${q.x + 18 - (r.x + r.width/2)}px,` +
                          `${q.y + q.height/2 - (r.y + r.height - 14)}px) scale(.6)`;
    } else {
      f.style.transform = "translateY(40vh) scale(.6)";
    }
    f.style.opacity = "0.15";
  }));
  setTimeout(()=>f.remove(), 560);
}

/* ══ arrastrar y soltar (funciona con dedo y con mouse) ═════════════ */
const arrastre = {carta:null, boton:null, x0:0, y0:0, activo:false,
                  fantasma:null, sobre:null, huboArrastre:false};

function tomarCarta(ev, carta, boton){
  if(ev.button !== undefined && ev.button !== 0) return;
  sanearGestos();
  arrastre.carta = carta; arrastre.boton = boton;
  arrastre.x0 = ev.clientX; arrastre.y0 = ev.clientY;
  arrastre.activo = false;
  arrastre.abanico = !!(boton.closest &&
    (boton.closest(".mano.abanico") || boton.closest(".abanico-b")));
  window.addEventListener("pointermove", moverCarta);
  window.addEventListener("pointerup", soltarCarta);
  window.addEventListener("pointercancel", soltarCarta);
}

function moverCarta(ev){
  if(!arrastre.carta) return;
  const dx = ev.clientX-arrastre.x0, dy = ev.clientY-arrastre.y0;
  if(!arrastre.activo){
    if(Math.abs(dx) < 11 && Math.abs(dy) < 11) return;
    // en el abanico manda la dirección: de lado navegas, hacia arriba juegas.
    // El empate favorece navegar — equivocarse hojeando es gratis,
    // equivocarse jugando saca el naipe fantasma y enciende camas.
    clearTimeout(UI.lupaT);          // hubo movimiento: ya no es pulsación larga
    if(arrastre.abanico && Math.abs(dx) >= Math.abs(dy)*0.9){
      hojeo.x0 = arrastre.x0; hojeo.y0 = arrastre.y0;
      hojeo.base = UI.foco; hojeo.movio = true; hojeo.pos = UI.foco;
      arrastre.huboArrastre = true;
      try{ document.body.setPointerCapture(ev.pointerId); }catch(e){}
      window.removeEventListener("pointermove", moverCarta);
      window.removeEventListener("pointerup", soltarCarta);
      window.removeEventListener("pointercancel", soltarCarta);
      arrastre.carta = null; arrastre.boton = null; arrastre.abanico = false;
      window.addEventListener("pointermove", hojearMover);
      window.addEventListener("pointerup", hojearFin);
      window.addEventListener("pointercancel", hojearFin);
      hojearMover(ev);
      return;
    }
    arrastre.activo = true;
    arrastre.huboArrastre = true;
    // anclar el gesto al body: el render que viene destruye el botón de
    // origen y en Android eso mataba el stream táctil a mitad de arrastre
    try{ document.body.setPointerCapture(ev.pointerId); }catch(e){}
    UI.sel = arrastre.carta;
    document.body.classList.add("arrastrando"); // la mano se aparta del medio
    render();                                   // enciende las camas válidas
    const g = el("div","carta fantasma");
    const w0 = arrastre.boton ? arrastre.boton.offsetWidth : 0;
    g.style.width = (w0 >= 60 ? w0 : 112) + "px";
    g.innerHTML = cuerpoCarta(arrastre.carta);
    document.body.appendChild(g);
    arrastre.fantasma = g;
  }
  arrastre.fantasma.style.transform =
    `translate(${ev.clientX-52}px, ${ev.clientY-56}px)`;
  const bajo = document.elementFromPoint(ev.clientX, ev.clientY);
  const cama = bajo && bajo.closest && bajo.closest(".cama.blanco");
  if(arrastre.sobre && arrastre.sobre!==cama) arrastre.sobre.classList.remove("sobre");
  if(cama) cama.classList.add("sobre");
  arrastre.sobre = cama;
}

function soltarCarta(ev){
  window.removeEventListener("pointermove", moverCarta);
  window.removeEventListener("pointerup", soltarCarta);
  window.removeEventListener("pointercancel", soltarCarta);
  const a = arrastre.activo, sobre = arrastre.sobre, carta = arrastre.carta;
  document.body.classList.remove("arrastrando");
  if(arrastre.fantasma) arrastre.fantasma.remove();
  arrastre.carta = null; arrastre.boton = null;
  arrastre.fantasma = null; arrastre.sobre = null; arrastre.activo = false;
  if(!a) return;                       // fue un toque: lo resuelve el onclick
  if(sobre && sobre.__soltar){ sobre.__soltar(); }
  else {
    // ¿soltó sobre otra carta de la mano? → reordenar
    const bajo = document.elementFromPoint(ev.clientX, ev.clientY);
    const tgt = bajo && bajo.closest && bajo.closest(".mano .carta[data-uid]");
    if(tgt && carta){
      const j = yo();
      const from = j.mano.indexOf(carta);
      const to = j.mano.findIndex(c=>c.uid === +tgt.dataset.uid);
      if(from >= 0 && to >= 0 && from !== to){
        j.mano.splice(to, 0, j.mano.splice(from, 1)[0]);
        guardar();
      }
    }
    UI.sel = null; render();
  }
  setTimeout(()=>{ arrastre.huboArrastre = false; }, 60);
}

/* ══ barra de acciones ══════════════════════════════════════════════ */
function barraAcciones(){
  const j = yo();
  const b = el("div","acciones");
  const add = (txt, cls, fn, dis)=>{
    const x = el("button","btn "+(cls||""),esc(txt));
    if(dis) x.disabled = true; else x.onclick = fn;
    b.appendChild(x); return x;
  };
  if(G.pendiente && G.pendiente.tipo==="descartar"){
    const faltan = j.mano.length - limiteMano(j) - UI.marcarDescartes.length;
    add(faltan>0?`Marca ${faltan} más`:"Descartar y pasar","pri",()=>{
      UI.marcarDescartes.forEach(u=>{
        const i = j.mano.findIndex(c=>c.uid===u);
        if(i>=0) G.descG.push(j.mano.splice(i,1)[0]);
      });
      UI.marcarDescartes=[]; terminarTurno();
    }, faltan!==0);
    return b;
  }
  if(j.ia){ add("La IA está jugando…","",null,true); return b; }
  if(G.fase===1){
    if(j.sumarios>0)
      add("Cerrar Sumario","",()=>{
        const paga = costoSumario(j);           // C04: al Director, 1
        for(let k=0;k<paga;k++) G.descG.push(j.mano.pop());
        j.sumarios--; G.sumariosLibres++;
        anota("a",`${j.nombre} cierra un Sumario.`); guardar(); render();
      }, j.mano.length<costoSumario(j));
    if(UI.sel) add("Cancelar","",()=>{ UI.sel=null; render(); });
    // Fin de Guardia ya no vive aquí: es el botón redondo de la esquina
  }
  return b;
}

/* ══ LA RESIDENCIA · los casos clínicos ═══════════════════════════════
   El coach de arriba se monta encima de una partida de verdad, y una
   partida de verdad no enseña lo que quieres cuando quieres: puede que en
   ocho rondas no te toque nunca una ⚠ que sirva para sabotear, o que el
   único paciente a punto de cerrar sea del rival. Un caso es lo contrario:
   la unidad viene armada a mano para que UNA cosa ocurra, ahora, y se vea
   ocurrir. Dos o tres jugadas y se acabó.

   Un caso es datos y nada más:
     montar(mío, rival)   arma camas, mano y Pizarra sobre el G recién hecho
     pasos[]              lo que se dice y lo que hay que hacer
        meta()            cuando esto es cierto, el paso está cumplido y
                          la burbuja avanza sola; sin meta, hay «Entendido»
        sel               a qué elemento se le pone el anillo
        haz               la línea de la meta, en imperativo
     cierre[]             lo que se explica al resolverlo
     rival(j)             qué hace el rival en su turno (por defecto, cerrar)

   Las metas se leen del estado del juego, no del DOM: `UI.sel` y `G` son
   la verdad, y una consulta a `querySelector` se rompe en cuanto alguien
   cambia una clase.

   Nada de esto se guarda. `guardar()` se salta los casos enteros, así que
   la guardia real que tengas a medias sigue exactamente donde estaba. */
const CLAVE_CASOS = "vt-casos-hechos";
function casosHechos(){
  try{ return new Set(JSON.parse(localStorage.getItem(CLAVE_CASOS) || "[]")); }
  catch(e){ return new Set(); }
}
function marcarCaso(id){
  const s = casosHechos(); s.add(id);
  try{ localStorage.setItem(CLAVE_CASOS, JSON.stringify([...s])); }catch(e){}
}

function _rec(id){ const r = D.recursos.find(x=>x.id===id); return r ? {...r, uid:uid()} : null; }
function _acc(id){ const a = D.acciones.find(x=>x.id===id); return a ? {...a, uid:uid()} : null; }
function _pac(id){ return D.pacientes.find(x=>x.id===id); }
function _av(id){ return D.personajes.find(x=>x.id===id) || D.personajes[0]; }
function _mano(j, ids){ ids.forEach(id=>{ const c = _rec(id) || _acc(id); if(c) j.mano.push(c); }); }

/* Una cama ya servida. `tiene` va en unidades de requisito y no en cartas:
   montarla con recursos de verdad obligaría a inventar diez cartas por
   caso y ninguna se ve — lo que se ve en la ficha es el contador. El
   precio es que esos recursos no se pueden robar ni mover, y en un caso
   de tres jugadas eso no llega a notarse. */
function _cama(pid, tiene, o){
  o = o || {};
  const c = nuevaCama(_pac(pid));
  if(!c) return null;
  Object.assign(c.tiene, tiene || {});
  (o.basura || []).forEach(id=>{ const b = _rec(id); if(b) c.basura.push(b); });
  revisar(c, o.desde != null ? o.desde : 1);
  if(o.vida != null) c.vida = o.vida;      // después de revisar: manda el guion
  return c;
}

function casoActual(){ return (G && G.caso) ? CASOS.find(c=>c.id===G.caso.id) : null; }

function montarCaso(caso){
  const mk = (nombre, ia)=>({
    nombre, ia, avatar:null, mano:[], camas:[null,null,null],
    altas:[], muertos:[], sumarios:0, protocolos:[], coloc:INDICACIONES,
    compraHecha:false, accionHecha:false, roboMod:0, sinFarmacos:false,
    colocMod:0, habP:false, habT:false, pena:0, entregado:true});
  G = { modo:"ia", ronda:caso.ronda || 3, turno:0, fase:1,
        mazoP:[], mazoG:[], descG:[], mazoA:[], descA:[], pizarra:[],
        sumariosLibres:6, log:[], fin:false, pendiente:null,
        bloqueoAcciones:0, ultimaAccion:null, ultimaComp:null,
        canjeAvatar:null, iniciado:true, caso:{id:caso.id, i:0} };
  G.jug = [mk("Tú", false), mk("Dr. Silicio", true)];
  G.jug[0].avatar = _av(caso.avatar || "C13");
  G.jug[1].avatar = _av("C19");
  // un fondo de mazo, para que el robo de la próxima Entrega reparta algo
  ["R01","R16","R24","R35","R18","R30"].forEach(id=>{
    const c = _rec(id); if(c) G.mazoG.push(c); });
  caso.montar(G.jug[0], G.jug[1]);
  UI.sel = null; UI.selProt = null; UI.modal = null; UI.verRival = null;
  UI.manoAbierta = false; UI.marcarDescartes = []; UI.nuevas = new Set();
  UI.vidaPrev = {}; UI.okPrev = {}; UI.reqPrev = {}; UI.colocPrev = null;
  UI.foco = 0; UI.pantalla = null; UI.fxAltas = null; UI.fxViva = null;
  UI.franja = null;
  anota("r", `CASO · ${caso.tit}`);
  render();
}
function salirCaso(){
  G = null;
  UI.pantalla = "casos"; UI.sel = null; UI.modal = null;
  UI.manoAbierta = false; UI.fxAltas = null; UI.fxViva = null; UI.franja = null;
  render();
}
function reiniciarCaso(){ const c = casoActual(); if(c) montarCaso(c); }

/* El rival de un caso no improvisa. La IA de verdad haría jugadas que no
   vienen al cuento —comprar en la Pizarra, sabotearte de vuelta— y
   arruinaría el guion en dos turnos. Aquí cierra su guardia y te devuelve
   el turno, que es justo lo que hace falta para ver un cierre de ronda. */
function casoRival(){
  const caso = casoActual();
  if(caso && caso.rival){ caso.rival(yo()); return; }
  entrarFase(2);
}

function pintarCaso(cont){
  const caso = casoActual();
  if(!caso) return;
  const pasos = caso.pasos;
  while(G.caso.i < pasos.length && pasos[G.caso.i].meta && pasos[G.caso.i].meta())
    G.caso.i++;
  if(G.caso.i >= pasos.length){ cont.appendChild(finCaso(caso)); return; }
  // Las hojas y las ceremonias mandan… salvo el descarte del cierre, que es
  // justo el momento que el caso del Sumario tiene que explicar. Ahí la
  // burbuja se queda: no tapa la rejilla, que vive abajo.
  if(UI.fxViva) return;
  if(G.pendiente && G.pendiente.tipo!=="descartar") return;
  const p = pasos[G.caso.i];
  if(UI.modal && !p.conHoja) return;
  // Los pasos que explican lo que acaba de pasar necesitan ver el tablero, y
  // la mano abierta lo tapa —y su velo se come los toques—. `cierra` la
  // recoge. No se hace siempre: el paso que pide soltar una carta la
  // necesita abierta.
  if(p.cierra && UI.manoAbierta){
    UI.manoAbierta = false; UI.sel = null;
    setTimeout(render, 0);
    return;
  }
  const obj = p.sel ? document.querySelector(p.sel) : null;
  let arriba = true;
  if(obj){
    const r = obj.getBoundingClientRect();
    if(r.width && r.height){
      const an = el("div","tuto-anillo");
      an.style.left = Math.max(2, r.left-5)+"px";
      an.style.top = Math.max(2, r.top-5)+"px";
      an.style.width = Math.min(innerWidth-8, r.width+10)+"px";
      an.style.height = (r.height+10)+"px";
      cont.appendChild(an);
      arriba = r.top + r.height/2 > innerHeight/2;
    }
  }
  const b = el("div","tuto-burbuja");
  b.appendChild(el("div","paso",
    `${esc(caso.tit)} · paso ${G.caso.i+1} de ${pasos.length}`));
  b.appendChild(el("h3",null,esc(p.tit)));
  b.appendChild(el("p",null,p.txt));
  if(p.meta){
    const m = el("div","meta");
    m.innerHTML = `<i>▸</i><span>${esc(p.haz || "hazlo para seguir")}</span>`;
    b.appendChild(m);
  }
  const pie2 = el("div","tuto-pie");
  if(!p.meta){
    const ok = el("button","btn pri","Entendido");
    ok.onclick = ()=>{ G.caso.i++; render(); };
    pie2.appendChild(ok);
  }
  const li = el("div","caso-links");
  const re = el("button","caso-rec","reiniciar");
  re.onclick = reiniciarCaso;
  const sa = el("button","caso-rec","salir");
  sa.onclick = salirCaso;
  li.appendChild(re); li.appendChild(sa);
  pie2.appendChild(li);
  b.appendChild(pie2);
  if(arriba) b.style.top = "70px"; else b.style.bottom = "16px";
  cont.appendChild(b);
}

function finCaso(caso){
  if(!G.caso.hecho){ G.caso.hecho = true; marcarCaso(caso.id); }
  const w = el("div","caso-fin");
  const t = el("div","tarj");
  t.appendChild(el("div","marca-fin","🩺"));
  t.appendChild(el("h3",null,"Caso resuelto"));
  (caso.cierre || []).forEach(x=>t.appendChild(el("p",null,x)));
  const f = el("div","acciones");
  const v = el("button","btn","A la lista"); v.onclick = salirCaso;
  f.appendChild(v);
  const sig = CASOS[CASOS.indexOf(caso)+1];
  if(sig){
    const s = el("button","btn pri","Siguiente caso");
    s.onclick = ()=>montarCaso(sig);
    f.appendChild(s);
  }
  t.appendChild(f);
  w.appendChild(t);
  return w;
}

function pantallaCasos(){
  const hechos = casosHechos();
  const w = el("div","casos");
  const cab = el("div","cab");
  cab.appendChild(el("h2",null,"La Residencia"));
  cab.appendChild(el("div","prog",
    `${CASOS.filter(c=>hechos.has(c.id)).length} / ${CASOS.length}`));
  w.appendChild(cab);
  w.appendChild(el("p","lead",
    "Seis casos armados a mano. En cada uno la unidad ya está montada para "+
    "que ocurra una cosa y la veas ocurrir: dos o tres jugadas y se acabó. "+
    "No tocan la guardia que tengas guardada."));
  CASOS.forEach((c,i)=>{
    const hecho = hechos.has(c.id);
    const b = el("button","caso-f"+(hecho?" ok":""));
    b.appendChild(el("div","ord", hecho ? "✓" : String(i+1)));
    const cu = el("div","cu");
    cu.innerHTML = `<b>${esc(c.tit)}</b><small>${esc(c.sub)}</small>`+
                   `<span class="ens">${esc(c.ens)}</span>`;
    b.appendChild(cu);
    b.onclick = ()=>montarCaso(c);
    w.appendChild(b);
  });
  // y al final, la guardia entera con el coach encima: lo que hasta ahora
  // era la casilla «Primera guardia» de la portada. Aquí se entiende mejor
  // qué es —el último escalón, no una modalidad— y la portada queda limpia.
  const g = el("button","caso-f");
  g.appendChild(el("div","ord","▶"));
  const gc = el("div","cu");
  gc.innerHTML = "<b>Tu primera guardia</b><small>Una partida entera contra "+
    "la IA, con el coach señalando cada paso sobre el tablero de verdad."+
    "</small><span class=\"ens\">las 8 rondas · sin guion</span>";
  g.appendChild(gc);
  g.onclick = ()=>{ UI.pantalla = null;
                    nuevaPartida("ia",["Tú","Dr. Silicio"], true); };
  w.appendChild(g);
  const v = el("button","btn","Volver a la portada");
  v.style.marginTop = "6px";
  v.onclick = ()=>{ UI.pantalla = null; render(); };
  w.appendChild(v);
  return w;
}

function pintarTuto(){
  const cont = document.getElementById("tuto");
  if(!cont) return;
  cont.innerHTML = "";
  if(!G || G.fin) return;
  if(G.caso){ pintarCaso(cont); return; }
  if(!G.tuto) return;
  let p = TUTO[G.tuto.i];
  while(p && p.listo && p.listo()){ G.tuto.i++; p = TUTO[G.tuto.i]; }
  if(!p){ G.tuto = null; guardar(); return; }
  if(UI.modal || UI.fxViva) return;               // hojas y ceremonias mandan
  if(G.pendiente && G.pendiente.tipo!=="avatar") return;
  if(p.cuando && !p.cuando()) return;             // aún no es su momento
  const obj = p.sel ? document.querySelector(p.sel) : null;
  let arriba = true;                              // burbuja arriba o abajo
  if(obj){
    const r = obj.getBoundingClientRect();
    if(r.width && r.height){
      const an = el("div","tuto-anillo");
      an.style.left = Math.max(2, r.left-5)+"px";
      an.style.top = Math.max(2, r.top-5)+"px";
      an.style.width = Math.min(innerWidth-8, r.width+10)+"px";
      an.style.height = (r.height+10)+"px";
      cont.appendChild(an);
      arriba = r.top + r.height/2 > innerHeight/2;
    }
  }
  const b = el("div","tuto-burbuja");
  b.appendChild(el("div","paso",`Tutorial · paso ${G.tuto.i+1} de ${TUTO.length}`));
  b.appendChild(el("h3",null,esc(p.tit)));
  b.appendChild(el("p",null,p.txt));
  const pie2 = el("div","tuto-pie");
  if(p.listo){
    pie2.appendChild(el("span","tuto-haz","▸ "+esc(p.haz||"hazlo para seguir")));
  } else {
    const ok = el("button","btn pri", p.fin ? "¡A jugar!" : "Entendido");
    ok.onclick = ()=>{ if(p.fin){ G.tuto=null; } else { G.tuto.i++; } guardar(); render(); };
    pie2.appendChild(ok);
  }
  const sk = el("button","tuto-salta","saltar tutorial");
  sk.onclick = ()=>{ G.tuto = null; guardar(); render(); };
  pie2.appendChild(sk);
  b.appendChild(pie2);
  if(arriba) b.style.top = "70px"; else b.style.bottom = "16px";
  cont.appendChild(b);
}

/* ── la capa de pantallas pendientes ────────────────────────────────
   Se vaciaba y se rehacía en CADA render, y con ella volvían a arrancar
   las animaciones de entrada: el velo aparece, la hoja sube y las
   opciones entran en cascada. En la admisión eso se veía como un
   parpadeo cada vez que tocabas un paciente —tocar guarda la elección y
   llama a render, o sea que la pantalla entera volvía a nacer para
   cambiar una clase—. Medido antes: 74 entradas de `.op` y 72 de `.velo`
   en tres rondas.

   La rueda de avatares ya tenía su parche a mano; ahora la regla es de
   todas: la pantalla se monta UNA vez por estado y, mientras el estado
   sea el mismo, solo se retoca lo que cambió. La clave incluye el golpe
   de la Entrega, que sí quiere volver a entrar en cada paso. */
/* ── el reloj de la capa ─────────────────────────────────────────────
   La admisión y la Entrega no pueden quedarse esperando para siempre: a
   los 10 s siguen solas. La admisión entra con el paciente que tengas
   marcado —o con el primero, si no marcaste ninguno— y arranca el turno;
   la Entrega pasa al golpe siguiente, así que si dejas el teléfono la
   ceremonia se cuenta sola y el juego empieza igual.

   Va con barra a la vista: una cuenta atrás invisible que actúa por su
   cuenta es una trampa. Y elegir en la admisión reinicia el reloj, para
   que marcar en el segundo nueve no te deje uno para confirmar. */
const ESPERA = 10000;
function pararRelojCapa(){
  if(UI.relojCapa){ clearTimeout(UI.relojCapa); UI.relojCapa = null; }
}
function vencerCapa(){
  const p = G && G.pendiente;
  if(!p) return;
  if(p.tipo === "admision"){
    const i = (p.sel === null || p.sel === undefined) ? 0 : p.sel;
    anota("", "Nadie decidió a tiempo: entra "+p.ops[i].nombre+".");
    resolverAdmision(p.cama, p.ops, p.ops[i]);
  } else if(p.tipo === "entrega"){
    const g = golpesEntrega(G.jug[p.jugador]);
    if((p.paso||0) >= g.length-1 || !conCeremonia()) cerrarEntrega();
    else { p.paso = (p.paso||0) + 1; render(); }
  }
}
function armarRelojCapa(p, capa){
  pararRelojCapa();
  if(!p || (p.tipo !== "admision" && p.tipo !== "entrega")) return;
  const barra = el("div","reloj-capa");
  barra.appendChild(el("i"));
  capa.appendChild(barra);
  UI.relojCapa = setTimeout(vencerCapa, ESPERA);
}
/* marcar un paciente devuelve los 10 s enteros */
function reiniciarRelojCapa(){
  if(!UI.relojCapa) return;
  pararRelojCapa();
  const b = document.querySelector("#capa .reloj-capa i");
  if(b){ b.style.animation = "none"; void b.offsetWidth; b.style.animation = ""; }
  UI.relojCapa = setTimeout(vencerCapa, ESPERA);
}

function clavePendiente(p){
  if(!p) return "";
  if(p.tipo === "avatar")   return "avatar:" + p.jugador;
  if(p.tipo === "entrega")  return "entrega:" + p.jugador + ":" + (p.paso||0) +
                                   ":" + (conCeremonia() ? "c" : "h");
  if(p.tipo === "admision") return "admision:" + p.cama + ":" +
                                   p.ops.map(o=>o.id).join(",");
  if(p.tipo === "pasa")     return "pasa:" + G.turno;
  return p.tipo;
}

/* Lo que sí cambia sin rehacer la pantalla. Hoy solo la admisión tiene
   estado interno; si mañana otra lo tiene, se retoca aquí. */
function refrescarPendiente(p, capa){
  if(p.tipo !== "admision") return;
  const sel = p.sel;
  capa.querySelectorAll(".opciones .op").forEach((b,ix)=>
    b.classList.toggle("sel", ix === sel));
  const adm = capa.querySelector(".modal > .btn.pri");
  if(adm) adm.disabled = (sel === null || sel === undefined);
}

function pintarCapa(){
  const capa = document.getElementById("capa");
  // Las hojas son de la partida: si la partida terminó o ya no existe, la
  // hoja muere con ella. Sin esto, abrir la ficha de un paciente mientras
  // la IA juega la última ronda dejaba la hoja viva ENCIMA del marcador
  // final —o de la portada— comiéndose los toques.
  if(UI.modal && (!G || G.fin)) UI.modal = null;
  if(UI.modal){
    if(capa.firstChild !== UI.modal){
      capa.innerHTML = ""; capa.appendChild(UI.modal);
    }
    delete capa.dataset.pend; pararRelojCapa();
    return;
  }
  const p = G && G.pendiente;
  if(!p){ capa.innerHTML = ""; delete capa.dataset.pend; pararRelojCapa(); return; }
  const k = clavePendiente(p);
  if(capa.dataset.pend === k && capa.firstChild){
    refrescarPendiente(p, capa);        // el mismo estado: solo retocar
    return;
  }
  capa.innerHTML = "";
  capa.dataset.pend = k;
  if(p.tipo === "avatar")        capa.appendChild(modalAvatar());
  else if(p.tipo === "entrega")  capa.appendChild(pantallaEntrega());
  else if(p.tipo === "pasa")     capa.appendChild(cortina());
  else if(p.tipo === "admision") capa.appendChild(modalAdmision());
  // "descartar" no vive aquí: la cuadrícula está en el pie de la mano
  armarRelojCapa(p, capa);
}

/* La rueda de personajes: los 3 giran sobre un eje vertical, SIN tope —
   si sigues hacia la derecha, da la vuelta completa. Tocar al del centro
   (o el botón) lo elige; tocar uno de lado lo trae al centro. */
const rueda = {x0:null, base:0, movio:false};
function focoRueda(n){ return ((Math.round(UI.avPos||0) % n) + n) % n; }

function pintarRueda(pos, donde){
  const cont = donde || document.querySelector(".rueda");
  if(!cont) return;
  const cartas = cont.querySelectorAll(".av-carta");
  const n = cartas.length;
  cartas.forEach(c=>{
    let d = ((+c.dataset.i - pos) % n + n) % n;   // distancia circular
    if(d > n/2) d -= n;
    const th = d * 2*Math.PI/n;
    // el radio se ajusta al ancho: en la pantalla completa las cartas son
    // más grandes y con 132 px fijos las vecinas quedaban debajo del centro
    const x = Math.sin(th) * Math.min(168, (cont.clientWidth||390)*0.40);
    const cerca = (Math.cos(th)+1)/2;             // 1 al frente, 0 atrás
    // translateY(-50%): la carta se centra vertical y crece con su
    // contenido, en vez de estirarse hasta el borde de la rueda
    c.style.transform = `translate(${x}px,-50%) rotateY(${(-th*32).toFixed(1)}deg)`+
                        ` scale(${(0.68+0.34*cerca).toFixed(3)})`;
    c.style.opacity = (0.2+0.8*cerca).toFixed(2);
    c.style.zIndex = String(Math.round(10+20*cerca));
  });
  const raiz = cont.parentNode || document;
  const pista = raiz.querySelectorAll(".rueda-pista i");
  const f = ((Math.round(pos)%n)+n)%n;
  pista.forEach((i2,k)=>i2.classList.toggle("on", k===f));
  // solo el del frente respira. Si se movieran las tres, la pantalla
  // tembloraría entera y ninguna diría «esta es».
  cartas.forEach(c=>c.classList.toggle("foco", +c.dataset.i === f));
}

function armarRueda(cont){
  cont.addEventListener("pointerdown", ev=>{
    rueda.x0 = ev.clientX; rueda.base = UI.avPos||0; rueda.movio = false;
    window.addEventListener("pointermove", ruedaMover);
    window.addEventListener("pointerup", ruedaFin);
    window.addEventListener("pointercancel", ruedaFin);
  });
}
function ruedaMover(ev){
  if(rueda.x0===null) return;
  const dx = ev.clientX - rueda.x0;
  if(!rueda.movio){
    if(Math.abs(dx) < 9) return;
    rueda.movio = true;
    try{ document.body.setPointerCapture(ev.pointerId); }catch(e){}
    const c = document.querySelector(".rueda");
    if(c) c.classList.add("viva");
  }
  UI.avPos = rueda.base - dx/150;      // sin tope: gira y gira
  pintarRueda(UI.avPos);
}
function ruedaFin(){
  window.removeEventListener("pointermove", ruedaMover);
  window.removeEventListener("pointerup", ruedaFin);
  window.removeEventListener("pointercancel", ruedaFin);
  if(rueda.movio){
    UI.avPos = Math.round(UI.avPos||0);
    const c = document.querySelector(".rueda");
    if(c) c.classList.remove("viva");
    pintarRueda(UI.avPos);
  }
  const m = rueda.movio;
  rueda.x0 = null; rueda.movio = false;
  if(m) setTimeout(()=>{ rueda.movio = false; }, 60);
  rueda.hubo = m;
  if(m) setTimeout(()=>{ rueda.hubo = false; }, 80);
}

/* Elegir personaje era una hoja de abajo con tres tarjetitas de 232 px y
   el tablero asomando por detrás: la decisión que abre la partida se
   tomaba de reojo. Ahora ocupa la pantalla entera. La ilustración manda
   —arriba, a sangre— y debajo van el rol, el nombre y la habilidad al
   tamaño en que se lee. La rueda es la misma: se desliza, no tiene tope
   y las dos vecinas asoman por los costados para que se sepa que hay
   más. Sin ilustración, el hueco lo llena la inicial sobre el tinte de
   la casa: un retrato ausente, no un rectángulo gris. */
function modalAvatar(){
  const p = G.pendiente;
  const n = p.ops.length;
  const cap = el("div","elige-av");
  const cab = el("div","ea-cab");
  cab.appendChild(el("div","ea-rot","Tu personaje"));
  cab.appendChild(el("h2",null,`${esc(G.jug[p.jugador].nombre)}, elige con quién entras al turno`));
  cap.appendChild(cab);

  const cont = el("div","rueda");
  p.ops.forEach((o,i)=>{
    const c = el("button","op av-carta");
    c.dataset.i = i;
    const par = (o.habilidad||"").split(" — ");
    const tit = par.length > 1 ? par.shift() : "";
    const hab = par.join(" — ");
    c.innerHTML =
      `<div class="av-retrato"${o.tinte?` style="--tinte:${o.tinte}"`:""}>`+
        (o.arte ? `<img src="${o.arte}" alt="">`
                : `<span class="av-inicial">${esc((o.nombre||"?").replace(/^(El|La|Los|Las) /,"")[0])}</span>`)+
        `<div class="av-rol">${esc(o.frecuencia)}</div>`+
      `</div>`+
      `<div class="av-ficha">`+
        `<div class="av-nom">${esc(o.nombre)}</div>`+
        (tit ? `<div class="av-habtit">${esc(tit)}</div>` : "")+
        `<div class="av-hab">${esc(hab)}</div>`+
        `<div class="av-frase">“${esc(o.frase)}”</div>`+
      `</div>`;
    c.onclick = ()=>{
      if(rueda.hubo){ rueda.hubo = false; return; }
      const f = focoRueda(n);
      if(i === f){ resolverAvatar(o); return; }
      let d = ((i - (UI.avPos||0)) % n + n) % n;   // girar hasta traerlo
      if(d > n/2) d -= n;
      UI.avPos = Math.round((UI.avPos||0) + d);
      pintarRueda(UI.avPos);
    };
    cont.appendChild(c);
  });
  cap.appendChild(cont);

  const pie2 = el("div","ea-pie");
  const pista = el("div","rueda-pista");
  p.ops.forEach(()=>pista.appendChild(el("i")));
  pie2.appendChild(pista);
  pie2.appendChild(el("div","ea-pista","desliza para ver los otros"));
  const be = el("button","btn pri","Quedarme con este");
  be.onclick = ()=> resolverAvatar(p.ops[focoRueda(n)]);
  pie2.appendChild(be);
  cap.appendChild(pie2);

  armarRueda(cont);
  pintarRueda(UI.avPos||0, cont);   // ya colocadas al nacer, sin parpadeo
  return cap;
}


/* ══ LA ENTREGA DE TURNO (v0.58) ═════════════════════════════════════
   La primera fase del juego ya se llamaba así y era la única que nunca
   ocurría en pantalla: elegías personaje y de golpe había dos pacientes
   en sus camas, sin que nadie te dijera quiénes eran. Ahora la colega
   que sale te pasa la unidad, cama por cama.

   Dos formas, y la diferencia es cuántas veces la has visto:

   · LA CEREMONIA — la primera guardia de todas y siempre en «Primera
     guardia». Un golpe por cama, la carta grande con su arte, y cierra
     con la cama vacía, que es el único silencio de la pantalla y prepara
     la admisión que llega enseguida. «Saltar» está desde el primer toque.
   · LA HOJA — de ahí en adelante. Una pantalla, dos toques, y quien
     quiera detalle toca una cama y se abre la ficha de siempre.

   No toca ninguna regla: no eliges paciente, no cambia el reparto, no hay
   nada que volver a simular. Es escenario.                              */
const CLAVE_ENT = "vt-entrega-vista";
function conCeremonia(){
  if(G && G.tuto) return true;                 // el coach la muestra siempre
  try{ return localStorage.getItem(CLAVE_ENT) !== "1"; }catch(e){ return true; }
}
function entregaVista(){ try{ localStorage.setItem(CLAVE_ENT,"1"); }catch(e){} }

/* Encadena una entrega por jugador humano y, cuando no queda ninguna,
   entra a la fase 0 de siempre. Se llama al terminar los avatares. */
function siguienteEntrega(){
  const i = G.jug.findIndex(j=>!j.ia && !j.entregado);
  if(i < 0){ G.pendiente = null; entrarFase(0); return; }
  G.pendiente = {tipo:"entrega", jugador:i, paso:0};
  guardar(); render();
}
function cerrarEntrega(){
  const p = G.pendiente;
  if(p && p.tipo==="entrega") G.jug[p.jugador].entregado = true;
  entregaVista();
  siguienteEntrega();
}

/* Los golpes de la ceremonia salen de la unidad: uno por cama ocupada,
   uno por la vacía si la hay, más la apertura y el cierre. */
function golpesEntrega(j){
  const g = [{t:"abre"}];
  j.camas.forEach((c,i)=>{ if(c) g.push({t:"cama", c, n:i+1}); });
  if(j.camas.some(c=>!c)) g.push({t:"vacia", n:j.camas.findIndex(c=>!c)+1});
  g.push({t:"cierra"});
  return g;
}

/* La línea con que te pasan al paciente. Si el autor escribió la suya en
   `entrega`, esa manda; si no, sirve la frase de la carta, que es lo que
   ya había. Sin ninguna de las dos, la ficha se queda con los datos. */
function vozEntrega(p){
  if(p.entrega) return esc(p.entrega);
  return p.frase ? "“"+esc(p.frase)+"”" : "";
}

function fichaEntrega(c, n, total, idx){
  const p = c.p;
  const w = el("div","ent-cama");
  const cab = el("div","ent-cab");
  cab.appendChild(el("span","ent-n","Cama "+n));
  if(total > 1) cab.appendChild(el("span","ent-de",`${idx} de ${total}`));
  w.appendChild(cab);

  const f = el("div","ent-ficha");
  f.style.setProperty("--sis", SIS[p.sistema] ? SIS[p.sistema][1] : "var(--ink-3)");
  f.style.setProperty("--gravc", GRAVC[p.gravedad] || "var(--line)");
  const v = el("div","ent-ventana");
  v.style.setProperty("--tinte", p.tinte || TINSIS[p.sistema] || "#b9c7cc");
  if(p.arte){
    const im = document.createElement("img");
    im.src = p.arte; im.alt = ""; v.appendChild(im);
  } else v.appendChild(el("span","sinarte",
    (SIS[p.sistema] ? SIS[p.sistema][0] : "🛏️").split(" ")[0]));
  v.appendChild(el("span","ent-grav",
    p.gravedad==="ROJO" ? "★ROJO" : "G·"+esc(p.gravedad)));
  f.appendChild(v);

  const cu = el("div","ent-cuerpo");
  cu.appendChild(el("h3",null,esc(p.nombre)));
  const dat = el("div","ent-datos");
  if(p.edad) dat.appendChild(el("span","ent-edad",esc(p.edad)+" años"));
  if(SIS[p.sistema]){
    const ss = el("span","ent-sis",SIS[p.sistema][0]);
    ss.style.color = SIS[p.sistema][1];
    dat.appendChild(ss);
  }
  dat.appendChild(el("span",null,`alta +${p.alta} · fallece ${p.fallece}`));
  cu.appendChild(dat);

  const vit = el("div","ent-vitales");
  const rr = c.vidaMax ? Math.max(0, Math.min(1, c.vida/c.vidaMax)) : 0;
  const uno = el("i","cz-uno");
  uno.style.setProperty("--llen", rr.toFixed(3));
  vit.appendChild(uno);
  vit.appendChild(el("span","vnum",`${c.vida}<small>/${c.vidaMax}</small>`));
  vit.appendChild(el("i","ent-sep"));
  const fila = el("div","pips");
  TIPOS.forEach(t=>{
    if(!c.pide[t]) return;
    const gr = el("span","gr");
    gr.style.setProperty("--pc", TCOL[t] || "var(--ink-3)");
    for(let k=0;k<c.pide[t];k++){
      const u = el("i","uni"); u.innerHTML = SVG[t] || SVG.COMODIN;
      u.title = TNOM[t] || t; gr.appendChild(u);
    }
    fila.appendChild(gr);
  });
  vit.appendChild(fila);
  cu.appendChild(vit);

  const voz = vozEntrega(p);
  if(voz){
    const q = el("div","ent-voz");
    q.appendChild(el("p",null,voz));
    q.appendChild(el("span","ent-firma","te lo entrega la turno de noche"));
    cu.appendChild(q);
  }
  f.appendChild(cu);
  w.appendChild(f);
  return w;
}

function pantallaEntrega(){
  const p = G.pendiente;
  const j = G.jug[p.jugador];
  return conCeremonia() ? ceremoniaEntrega(j, p) : hojaEntrega(j);
}

function ceremoniaEntrega(j, p){
  const g = golpesEntrega(j);
  p.paso = Math.max(0, Math.min(p.paso||0, g.length-1));
  const b = g[p.paso];
  const cap = el("div","entrega");
  const avanza = ()=>{
    if(p.paso >= g.length-1){ cerrarEntrega(); return; }
    p.paso++; render();
  };
  cap.onclick = ev=>{
    if(ev.target.closest("[data-saltar]")){ p.paso = g.length-1; render(); return; }
    avanza();
  };

  if(b.t === "abre"){
    const z = el("div","ent-abre");
    z.appendChild(el("div","ent-reloj", SVG_RELOJ));
    z.appendChild(el("div","ent-hora","07:45"));
    z.appendChild(el("h2",null,"Entrega de Turno"));
    const ocup = j.camas.filter(c=>c).length;
    const libres = CAMAS - ocup;
    z.appendChild(el("p","ent-dice",
      `“Te dejo la unidad. ${ocup===1?"Una cama ocupada":ocup+" camas ocupadas"}`+
      `${libres ? " y "+(libres===1?"la otra libre":libres+" libres") : ""}, `+
      `pero no te confíes: Urgencias ya llamó dos veces.”`));
    z.appendChild(el("div","ent-quien",
      G.jug.length>2 || G.modo==="hotseat"
        ? esc(j.nombre)+" · recibe la unidad" : "turno de noche · se va a su casa"));
    cap.appendChild(z);
  } else if(b.t === "cama"){
    const camas = g.filter(x=>x.t==="cama");
    cap.appendChild(fichaEntrega(b.c, b.n, camas.length, camas.indexOf(b)+1));
  } else if(b.t === "vacia"){
    const z = el("div","ent-vacia");
    const c = el("div","ent-centro");
    c.appendChild(el("div","ent-dib", SVG_CAMA_VACIA));
    c.appendChild(el("h2",null,`Cama ${b.n} · vacía`));
    c.appendChild(el("p","ent-por","Por ahora."));
    z.appendChild(c);
    cap.appendChild(z);
  } else {
    const z = el("div","ent-cierra");
    z.appendChild(el("h2",null,"La unidad es tuya"));
    z.appendChild(el("p",null,`${RONDAS} rondas. Que no se te muera nadie.`));
    const btn = el("button","btn pri","Recibo el turno");
    btn.onclick = ev=>{ ev.stopPropagation(); cerrarEntrega(); };
    z.appendChild(btn);
    cap.appendChild(z);
  }

  if(b.t !== "cierra"){
    const pie = el("div","ent-pie");
    const pts = el("div","ent-puntos");
    g.slice(0,-1).forEach((_,k)=>pts.appendChild(el("i", k===p.paso ? "on" : "")));
    pie.appendChild(pts);
    pie.appendChild(el("span","ent-sigue","tocar para seguir"));
    const sk = el("button","ent-saltar","saltar");
    sk.setAttribute("data-saltar","");
    pie.appendChild(sk);
    cap.appendChild(pie);
  }
  return cap;
}

function hojaEntrega(j){
  const cap = el("div","entrega hoja-ent");
  cap.appendChild(el("h2",null,"Entrega de Turno"));
  cap.appendChild(el("div","ent-sub","07:45 · recibes la unidad"));
  const q = el("div","ent-voz");
  const ocup = j.camas.filter(c=>c).length;
  q.appendChild(el("p",null,
    `“Te dejo la unidad. ${ocup===1?"Una cama ocupada":ocup+" camas ocupadas"}. `+
    `Urgencias ya llamó dos veces.”`));

function abrirCompra(idx){

  // C09 Bodega Llena: 1 carta de descuento
  const coste = Math.max(0, +a.coste - (tieneAv(j,"C09") ? 1 : 0));
  const marcados = [];
  hoja(`Tomar · ${a.nombre}`, (m, cerrar)=>{
    m.appendChild(el("p",null,
      coste===0
        ? `Con la Bodega Llena te sale <b>gratis</b>. No gasta indicación.`
        : `Cuesta <b>${coste}</b> carta${coste>1?"s":""} de tu mano`+
          `${tieneAv(j,"C09")?" (1 menos por la Bodega Llena)":""}. `+
          `Marca cuáles descartas. No gasta indicación.`));
    const cont = el("div","opciones");
    let confirmar;
    j.mano.forEach(c=>{
      const b = el("button","op");
      b.innerHTML = `<b>${ico(c.tipo)} ${esc(c.nombre)}</b><small>${TNOM[c.tipo]||""}${c.warn?" · ⚠️ "+esc(c.compNombre):""}</small>`;
      b.onclick = ()=>{
        const i = marcados.indexOf(c.uid);
        if(i>=0){ marcados.splice(i,1); b.className="op"; }
        else if(marcados.length<coste){ marcados.push(c.uid); b.className="op sel"; }
        confirmar.disabled = marcados.length!==coste;
      };
      cont.appendChild(b);
    });
    m.appendChild(cont);
    const fila = el("div","acciones"); fila.style.padding="0";
    const can = el("button","btn","Cancelar"); can.onclick = cerrar;
    confirmar = el("button","btn pri","Tomar"); confirmar.disabled = coste>0;
    confirmar.onclick = ()=>{
      marcados.forEach(u=>{ const i=j.mano.findIndex(c=>c.uid===u);
                            if(i>=0) G.descG.push(j.mano.splice(i,1)[0]); });
      G.pizarra.splice(idx,1);
      const nueva = G.mazoA.pop(); if(nueva) G.pizarra.push(nueva);
      j.compraHecha = true;
      anota("a",`${j.nombre} toma ${a.nombre} (${coste}).`);
      UI.modal = null; alertaAccion(a);
    };
    fila.appendChild(can); fila.appendChild(confirmar);
    m.appendChild(fila);
  });

/* ══ el fondo vivo de la portada ════════════════════════════════════
   Los dos archivos los inyecta tools/generar_app.py: en el artefacto van
   como data-URI y en la PWA como ruta, que es la única forma de que el
   service worker pueda cachearlos por separado. Vacíos = sin portada, y
   la pantalla de inicio queda como estaba. */
const PORTADA = {video:/*__PORTADA_VIDEO__*/"", cuadro:/*__PORTADA_CUADRO__*/"",
                 dibujo:/*__PORTADA_DIBUJO__*/"", logo:/*__PORTADA_LOGO__*/"",
                 salida:/*__PORTADA_SALIDA__*/""};
const CLAVE_SON = "vt-portada-sonido";

function pintarPortada(){
  const cont = document.getElementById("portada");
  if(!cont) return;
  const toca = !G && !UI.pantalla &&
               (PORTADA.dibujo || PORTADA.video || PORTADA.cuadro);
  document.body.classList.toggle("con-portada", !!toca);
  const viejo = document.querySelector(".son-portada");
  if(!toca){ cont.hidden = true; cont.innerHTML = "";
             cont.style.backgroundImage = "";
             if(viejo) viejo.remove(); return; }
  cont.hidden = false;
  if(cont.firstChild) return;          // ya está puesta: no la reinicies

  // v0.57: manda el CLIP. El vector de dibujo.svg fue el boceto que se
  // mandó a dibujar y a animar; ahora que el video existe, el vector pasa
  // a ser el respaldo de última hora —debajo del cuadro fijo— y solo se
  // ve si el clip no está o el teléfono pide menos animación.
  const fondo = PORTADA.cuadro || PORTADA.dibujo;
  if(fondo) cont.style.backgroundImage = `url("${fondo}")`;
  // si el teléfono pide menos animación, se queda el cuadro fijo y ya
  const quieto = window.matchMedia &&
                 matchMedia("(prefers-reduced-motion: reduce)").matches;
  let vid = null;
  if(PORTADA.video && !quieto){
    vid = document.createElement("video");
    vid.poster = PORTADA.cuadro || "";
    vid.loop = true; vid.playsInline = true; vid.preload = "auto";
    vid.setAttribute("playsinline","");        // Safari viejo mira el atributo
    vid.muted = true;                          // sin esto NO parte solo
    cont.appendChild(vid);
    // Un <video> NO puede colgar de un data: URI: el navegador no lo puede
    // pedir por tramos y se queda en 0x0 (probado en Chromium; en iOS ni
    // arranca). En el artefacto el archivo viene incrustado, así que hay
    // que convertirlo a blob: antes de dárselo. En la PWA es una ruta y
    // esto se salta solo.
    const listo = PORTADA.video.startsWith("data:")
      ? fetch(PORTADA.video).then(r=>r.blob()).then(b=>URL.createObjectURL(b))
      : Promise.resolve(PORTADA.video);
    listo.then(u=>{ vid.src = u; return vid.play(); })
         .catch(()=>{});                       // si no parte, queda el cuadro
  }
  cont.appendChild(el("div","velo"));

  if(vid){
    // El navegador no deja arrancar con sonido sin que alguien toque algo,
    // así que el audio es un botón: parte apagado y se recuerda la elección.
    const b = el("button","son-portada");
    const pinta = ()=>{ b.textContent = vid.muted ? "🔇" : "🔊";
      b.setAttribute("aria-label", vid.muted ? "Encender el sonido"
                                             : "Apagar el sonido"); };
    if(localStorage.getItem(CLAVE_SON) === "1"){ vid.muted = false;
                                                 vid.play().catch(()=>{}); }
    pinta();
    b.onclick = ()=>{ vid.muted = !vid.muted;
      try{ localStorage.setItem(CLAVE_SON, vid.muted ? "0" : "1"); }catch(e){}
      if(!vid.muted) vid.play().catch(()=>{});
      pinta(); };
    document.body.appendChild(b);
  }
}

/* ══ ENTRAR A TURNO ═══════════════════════════════════════════════════
   La cortina entre tocar la moneda y estar dentro de la unidad. Cinco
   segundos, tres golpes y un remate — y todos los golpes son MANOS, que
   es lo único que ves de ti mismo cuando llegas a un turno.

     2,5 s  marcas tarjeta en el reloj control
     2,3 s  entras a la unidad
     3,2 s  lavado clínico — el punto de atención es adentro, no antes

   Ocho segundos y entrega directo a la elección de personaje. No hay un
   cuarto golpe presentando al rival: la pantalla que viene ya está llena
   de caras, y poner una antes era decir dos veces lo mismo.

   No esconde ninguna carga: la partida se arma en un milisegundo. Es una
   cortina de ficción, y por eso **se salta tocando la pantalla** y por eso
   no lleva barra de progreso —una barra falsa sería mentir—: lleva tres
   puntos, que dicen cuánto falta sin fingir que miden algo.

   El dibujo va en la misma línea que los íconos del juego (trazo de 2, sin
   relleno, viewBox 100×100) a propósito: el día que haya ilustración se
   cambia el SVG por una imagen y no se mueve nada más. */

function entrarATurno(luego){
  // sin la marca del turno anterior encima
  document.querySelectorAll(".entrada").forEach(n=>n.remove());
  const quieto = window.matchMedia &&
                 matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(quieto){ luego(); return; }          // quien pidió menos animación, entra ya

  const w = el("div","entrada");
  w.setAttribute("role","status");
  w.setAttribute("aria-label","Entrando a turno");
  const marco = el("div","marco");
  ENTRADA_GOLPES.forEach(g=>{
    if(ENTRADA_ARTE[g.clase]){
      const im = document.createElement("img");
      im.src = ENTRADA_ARTE[g.clase]; im.alt = "";
      marco.appendChild(im);
    } else {
      const d = el("div", null);
      d.innerHTML = g.svg;
      marco.appendChild(d.firstElementChild);
    }
  });
  w.appendChild(marco);
  const rot = el("div","rot"), sub = el("div","sub");
  w.appendChild(rot); w.appendChild(sub);
  const pasos = el("div","pasos");
  ENTRADA_GOLPES.forEach(()=>pasos.appendChild(el("i")));
  w.appendChild(pasos);
  w.appendChild(el("div","saltar","toca para saltar"));
  document.body.appendChild(w);

  let t = null, cerrado = false;
  const cerrar = ()=>{
    if(cerrado) return; cerrado = true;
    clearTimeout(t); w.remove(); luego();
  };
  w.onclick = cerrar;

  const piezas = [...marco.children];
  const golpe = i=>{
    if(cerrado) return;
    if(i >= ENTRADA_GOLPES.length){ cerrar(); return; }
    const g = ENTRADA_GOLPES[i];
    piezas.forEach((s,k)=>s.classList.toggle("on", k===i));
    marco.className = "marco " + g.clase;
    rot.textContent = g.rot; sub.textContent = g.sub;
    [...pasos.children].forEach((p,k)=>p.classList.toggle("on", k<=i));
    t = setTimeout(()=>golpe(i+1), g.ms);
  };
  golpe(0);
}

function pantallaInicio(){
  const w = el("div","inicio");
  const h = el("div","portada");
  const t = el("h1");
  if(PORTADA.logo){
    // el logotipo dibujado reemplaza al título tipográfico, pero el <h1>
    // se queda: el nombre del juego sigue siendo el encabezado de la
    // página para quien no ve la imagen
    const img = document.createElement("img");
    img.src = PORTADA.logo; img.alt = "¡Vaya Turno!"; img.className = "logo";
    img.width = 1000; img.height = 635;      // reserva el sitio, sin saltos
    t.appendChild(img);
  } else t.textContent = "¡Vaya Turno!";
  h.appendChild(t);
  w.appendChild(h);
  // el hueco donde se luce el dibujo: crece con la pantalla y empuja el
  // menú al filo de abajo, así ninguno de los dos le come sitio al otro
  w.appendChild(el("div","aire-inicio"));
  const s = el("div","portada"); s.style.paddingTop="14px";
  // Tres modalidades, tres fichas. La cuarta entrada de antes —Primera
  // guardia— NO es una modalidad: es la partida contra la IA con el coach
  // encendido, la misma llamada con una bandera de más. Así que baja a una
  // casilla: la marcas y «Contra la IA» arranca con la guía. Quien ya jugó
  // no vuelve a leerla y el menú son tres fichas y nada más.
  const ops = el("div","pastillas");
  const mk = (icono, tit, sub, largo, fn)=>{
    const b = el("button","pastilla");
    b.innerHTML = `<span class="medalla">${icono}</span>`+
                  `<b>${tit}</b><small>${sub}</small>`;
    b.setAttribute("aria-label", largo);
    b.onclick = fn; ops.appendChild(b);
  };
  mk(SVG_MODO.ia, "IA", "1 jugador", "Jugar contra la IA, 1 jugador",
     ()=>entrarATurno(()=>nuevaPartida("ia",["Tú","Dr. Silicio"])));
  mk(SVG_MODO.dos, "Dúo", "1 teléfono", "Dos jugadores en un teléfono",
     ()=>entrarATurno(()=>nuevaPartida("hotseat",["Jugador 1","Jugador 2"])));
  mk(SVG_MODO.solo, "Solo", "2 manos", "Solitario, las dos manos a la vista",
     ()=>entrarATurno(()=>nuevaPartida("abierto",["Mano A","Mano B"])));
  s.appendChild(ops);

  // Antes aquí había una casilla «Primera guardia» que encendía el coach
  // sobre la partida contra la IA. Se fue adentro de La Residencia, que es
  // donde se entiende qué es: el último escalón de aprender, y no una
  // cuarta modalidad compitiendo con las tres monedas.
  const hechos = casosHechos();
  const nh = CASOS.filter(c=>hechos.has(c.id)).length;
  const re = el("button","res");
  re.innerHTML = `<span class="medalla">🩺</span>`+
    `<span class="tx"><b>La Residencia</b>`+
    `${nh ? "Sigue donde ibas:" : "Aprende jugando:"} `+
    `${CASOS.length} casos cortos, uno por mecánica.</span>`+
    `<span class="cuenta">${nh}/${CASOS.length}</span>`;
  re.setAttribute("aria-label", `La Residencia · ${nh} de ${CASOS.length} casos resueltos`);
  re.onclick = ()=>{ UI.pantalla = "casos"; render(); };
  s.appendChild(re);

  // La Guardia del Día: contra la IA, pero con la baraja sembrada por la
  // fecha — todo el mundo recibe hoy los mismos pacientes, la misma mano
  // y la misma terna de avatares. Vale el primer parte del día; se puede
  // repetir, pero el parte ya está firmado.
  const parte = parteDelDia();
  const gd = el("button","res");
  gd.innerHTML = `<span class="medalla">🗓️</span>`+
    `<span class="tx"><b>La Guardia del Día</b>`+
    (parte
      ? `Tu parte de hoy ya está firmado: ${parte.pts} pts · ${parte.altas} altas.`
      : `La misma baraja para todo el mundo. Firma el parte de hoy.`)+
    `</span>`+
    `<span class="cuenta">${parte
      ? (parte.racha > 1 ? `🔥${parte.racha}` : "✓")
      : "HOY"}</span>`;
  gd.setAttribute("aria-label", "La Guardia del Día · reto diario contra la IA con baraja compartida");
  gd.onclick = ()=>entrarATurno(()=>nuevaPartida("ia",["Tú","Dr. Silicio"],false,fechaDia()));
  s.appendChild(gd);

  if(localStorage.getItem(CLAVE)){
    const b = el("button","btn pri","Retomar la guardia guardada");
    b.style.marginTop = "9px";
    b.onclick = ()=>{ if(cargar()) render(); };
    s.appendChild(b);
  }
  const inst = bloqueInstalar();
  if(inst) s.appendChild(inst);
  w.appendChild(s);
  return w;
}

/* La invitación a instalar: solo en la app compilada, solo si aún no lo
   está. Android tiene botón de un toque; iPhone no expone la API, así que
   ahí se explica el camino de Compartir → Agregar a inicio. */
function bloqueInstalar(){
  if(!PWA || instalada()) return null;
  const w = el("div","instalar");
  if(instalador){
    w.appendChild(el("div","ins-txt",
      "<b>Instálala en tu teléfono</b><br>Queda con su ícono, a pantalla completa y funciona sin internet."));
    const b = el("button","btn pri","📲 Instalar ¡Vaya Turno!");
    b.onclick = async ()=>{
      const ev = instalador; instalador = null;
      try{ await ev.prompt(); }catch(e){}
      render();
    };
    w.appendChild(b);
  } else if(esIOS()){
    w.appendChild(el("div","ins-txt",
      "<b>Instálala en tu iPhone</b><br>Toca <b>Compartir</b> "+
      "<span class=\"ios-ic\">↑</span> abajo en Safari y elige "+
      "<b>Agregar a pantalla de inicio</b>. Queda como una app más."));
  } else {
    return null;
  }
  return w;
}

/* El marcador final se contaba sobre el fondo liso de la mesa, que es
   donde menos sentido tenía: la guardia termina cuando cruzas la puerta.
   Ahora se cuenta en el pasillo de salida, al atardecer, con el cartel
   verde encendido al fondo. El dibujo va detrás y fijo —no se desplaza
   con la bitácora— y lleva su velo para que los números se lean. */
/* El parte firmado de La Guardia del Día: vale el PRIMERO de cada fecha.
   Repetir se puede — la baraja es la misma— pero el parte no se pisa. */
function parteDelDia(){
  try{
    const p = JSON.parse(localStorage.getItem("vt-dia") || "null");
    return p && p.fecha === fechaDia() ? p : null;
  }catch(e){ return null; }
}
/* La racha: cuántas fechas SEGUIDAS llevan parte firmado. Se actualiza al
   firmar; un día sin jugar la corta de vuelta a 1. */
function diasEntre(a, b){
  return Math.round((Date.parse(b+"T00:00Z") - Date.parse(a+"T00:00Z")) / 864e5);
}
function firmarParte(){
  const mio = G.jug.find(j=>!j.ia) || G.jug[0];
  const ia  = G.jug.find(j=>j.ia);
  try{
    const previo = JSON.parse(localStorage.getItem("vt-dia") || "null");
    if(previo && previo.fecha === G.dia) return previo;
    const seguida = previo && diasEntre(previo.fecha, G.dia) === 1;
    const p = { fecha:G.dia, pts:puntos(mio), altas:mio.altas.length,
                muertos:mio.muertos.length,
                rival: ia ? ia.nombre : null, ptsRival: ia ? puntos(ia) : null,
                racha: seguida ? (previo.racha || 1) + 1 : 1 };
    localStorage.setItem("vt-dia", JSON.stringify(p));
    return p;
  }catch(e){ return null; }
}
function textoParte(p){
  const [a,m,d] = p.fecha.split("-");
  const vs = p.ptsRival===null ? ""
    : p.pts > p.ptsRival ? `\n🏆 Le gané a ${p.rival} (${p.ptsRival})`
    : p.pts < p.ptsRival ? `\n😮‍💨 Me ganó ${p.rival} (${p.ptsRival})`
    : `\n🤝 Empate con ${p.rival} (${p.ptsRival})`;
  return `¡VAYA TURNO! · Guardia del ${d}-${m}-${a}\n`+
         `🛏️ ${p.altas} alta${p.altas===1?"":"s"} · ✝️ ${p.muertos} · ${p.pts} pts${vs}`+
         (p.racha > 1 ? `\n🔥 ${p.racha} guardias seguidas` : "")+
         `\nhttps://diegonicolasmelo-cell.github.io/VAYA-TURNO/juego/`;
}

function pantallaFinal(){
  const w = el("div","final"+(PORTADA.salida?" con-salida":""));
  if(PORTADA.salida){
    const f = el("div","final-fondo");
    f.style.backgroundImage = `url("${PORTADA.salida}")`;
    w.appendChild(f);
    w.appendChild(el("div","final-velo"));
  }
  const s = el("div","portada");
  const orden = G.jug.map(j=>({j, p:puntos(j)})).sort((a,b)=>b.p-a.p);
  s.appendChild(el("h1",null,"Fin de la guardia"));
  s.appendChild(el("p",null,
    (G.finAnticipado
      ? `Cerrada en la ronda ${G.ronda} de ${RONDAS}. `
      : "Ocho rondas. ") +
    `Gana <b>${esc(orden[0].j.nombre)}</b> con ${orden[0].p} puntos.`));
  // deja respirar la puerta antes de las cifras
  if(PORTADA.salida) s.appendChild(el("div","final-aire"));
  const g = el("div","marcador"); g.style.marginTop="14px";
  orden.forEach(({j,p},oi)=>{
    const t = el("div","mtile"+(oi===0?" gana":""));
    t.appendChild(el("div","n",(oi===0?"🏆 ":"")+String(p)));
    const bonus = !j.muertos.length ? "¡Durante mi guardia no! +3"
      : (j.muertos.every(c=>c.gravedad==="III"||c.gravedad==="ROJO") ? "Se hizo todo +1" : "sin logro");
    t.appendChild(el("div","l",`${esc(j.nombre)} · ${j.altas.length} altas · ${j.muertos.length} ✝️`));
    t.appendChild(el("div","l",esc(bonus)));
    g.appendChild(t);
  });
  s.appendChild(g);
  // La bitácora se va del marcador: cien líneas de registro tapaban el
  // pasillo y el que gana no quiere leer el turno otra vez. El botón se
  // queda —sirve para mandar la partida— y el registro completo sigue
  // entero en el Panel mientras la guardia esté abierta.
  const bc = el("button","btn chico","Copiar bitácora"); bc.style.marginTop="8px";
  bc.onclick = ()=>{ const txt=G.log.map(x=>`R${x.r} · ${x.txt}`).join("\n");
    if(navigator.clipboard) navigator.clipboard.writeText(txt); bc.textContent="Copiada ✓"; };
  s.appendChild(bc);
  if(G.dia){
    const p = firmarParte();
    if(p){
      const bp = el("button","btn pri","📋 Compartir el parte del día");
      bp.style.marginTop = "12px";
      bp.onclick = async ()=>{
        const txt = textoParte(p);
        try{
          if(navigator.share) await navigator.share({text:txt});
          else if(navigator.clipboard){ await navigator.clipboard.writeText(txt);
            bp.textContent = "Parte copiado ✓"; }
        }catch(e){}
      };
      s.appendChild(bp);
    }
  }
  const b = el("button","btn pri","Nueva guardia"); b.style.marginTop="12px";
  b.onclick = ()=>{ borrar(); G=null;
    UI={sel:null,selProt:null,modal:null,marcarDescartes:[],
        nuevas:new Set(),vidaPrev:{},okPrev:{},reqPrev:{},colocPrev:null,foco:0,
        manoAbierta:false,pantalla:null};
    render(); };
  s.appendChild(b);
  w.appendChild(s);
  return w;
}
