/* C18 La de la Buena Muñeca y C11: lo que pasa entre el robo y el Pase */
function entregaAvatar(j){
  // C11: lo guardado entra gratis y cuenta doble
  if(tieneAv(j,"C11") && j.guardadaC11){
    const c = j.guardadaC11; j.guardadaC11 = null;
    const camas = objCamasPropias(x=>puedeColocarPropia(c,x));
    const poner = cama=>{
      colocarGratis(c, cama, j, 2);
      anota("a",`Sugiero Evaluar: ${c.nombre} entra gratis sobre ${cama.p.nombre} y cuenta ×2.`);
      if(!j.ia) aviso("ok",`📝 ${esc(c.nombre)} → ${esc(cama.p.nombre)} ×2`);
      guardar(); render();
    };
    if(!camas.length){
      j.mano.push(c); if(!j.ia) UI.nuevas.add(c.uid);
      anota("a",`Sugiero Evaluar: ya nadie necesita ${c.nombre} — vuelve a la mano.`);
    } else if(j.ia || camas.length===1){
      poner(camas[0].val);
    } else {
      setTimeout(()=>{ if(!G || G.fin || j!==yo()) return;
        elegirUno(`${c.nombre} sale de evaluación`, "Entra gratis y cuenta doble. ¿Sobre quién?",
          objCamasPropias(x=>puedeColocarPropia(c,x)), poner,
          ()=>poner(camas[0].val));
      }, 0);
    }
    return;
  }
  // C18: devuelve 1 carta al fondo, mira 3 y se queda con 1
  if(!tieneAv(j,"C18") || !j.mano.length || !G.mazoG.length) return;
  const mirar = devuelta=>{
    j.mano.splice(j.mano.indexOf(devuelta),1);
    G.mazoG.unshift(devuelta);
    const vistas = [];
    for(let k=0;k<3 && G.mazoG.length;k++) vistas.push(G.mazoG.pop());
    const quedarse = elegida=>{
      vistas.filter(x=>x!==elegida).forEach(x=>G.mazoG.unshift(x));
      j.mano.push(elegida); if(!j.ia) UI.nuevas.add(elegida.uid);
      anota("a",`Al Primer Intento: ${j.nombre} cambia una carta por ${elegida.nombre}.`);
      if(!j.ia) aviso("ok",`🧤 A la mano: ${esc(elegida.nombre)}`);
      guardar(); render();
    };
    if(j.ia){
      const mejor = vistas.slice().sort((a,b)=>
        (b.comodin?1:0)-(a.comodin?1:0) || (b.sistema?1:0)-(a.sistema?1:0) ||
        (a.warn?1:0)-(b.warn?1:0))[0];
      quedarse(mejor); return;
    }
    elegirUno("Las 3 primeras del mazo", "Quédate con 1; el resto vuelve al fondo.",
      objCartas(vistas), s=>quedarse(s.carta), ()=>quedarse(vistas[0]));
  };
  if(j.ia){
    const inutil = j.mano.find(c=>!c.warn && !c.comodin && !c.previene && !c.dobleEn &&
      !j.camas.some(x=>x && falta(x, c.tipo)>0));
    if(inutil) mirar(inutil);
    return;
  }
  setTimeout(()=>{
    if(!G || G.fin || j!==yo() || G.fase!==1) return;
    hoja("La de la Buena Muñeca", (m, cerrar)=>{
      m.appendChild(el("p",null,
        "Puedes devolver <b>1 carta</b> de tu mano al fondo del mazo: miras las "+
        "3 primeras y te quedas con 1."));
      const fila = el("div","acciones"); fila.style.padding="0";
      const noB = el("button","btn","Ahora no"); noB.onclick = cerrar;
      const siB = el("button","btn pri","🧤 Cambiar una");
      siB.onclick = ()=>{ UI.modal = null;
        elegirUno("¿Cuál devuelves al fondo?", null, objCartas(j.mano),
          s=>mirar(s.carta), ()=>{ guardar(); render(); }); };
      fila.appendChild(noB); fila.appendChild(siB); m.appendChild(fila);
    });
  }, 0);
}

/* la IA usa su poder activo: una vez por turno lo evalúa con el mismo
   criterio del simulador; elegirUno y pagarCartas deciden solos por ella */
function iaUsaAvatar(j){
  if(!j.avatar || poderGastado(j)) return false;
  const id = j.avatar.id, e = AV[id];
  if(!e || !e.puede()) return false;
  const quiere =
    (id==="C03" && j.camas.some(c=>c && falta(c,"PERSONAL")>0)) ||
    (id==="C04" && j.sumarios>0) ||
    (id==="C05" && j.camas.some(c=>c && !c.estable && faltanTotal(c) > c.vida*2.1)) ||
    (id==="C06" && j.mano.length>=3 && j.camas.some(c=>c && faltanTotal(c)>0)) ||
    (id==="C11" && j.mano.length>5 && j.coloc>0) ||
    (id==="C15" && j.mano.length>=4) ||
    (id==="C21");
  if(!quiere) return false;
  let jugo = false;
  e.jugar(j, ()=>{ jugo = true; marcarPoder(j); }, ()=>{});
  return jugo;
}

/* ══ la IA usa la Pizarra ═══════════════════════════════════════════
   Heurística portada del simulador y afinada con 4.000 partidas: la
   clave es que solo compra con cartas que DE VERDAD sobran (dos por
   encima de lo que necesita para tratar). Comprando de más se hace
   daño sola: −1,0 puntos propios y el mismo daño al rival.        */
const PRIO_ACC = {
  A21:10, A15:9, A01:8, A20:8, A04:8, A11:7, A16:7, A22:7, A19:6,
  A05:6, A18:6, A02:5, A08:5, A17:5, A03:4, A09:4, A13:4, A12:3,
  A10:3, A14:2, A07:2, A06:1,
};
/* La compra de la IA: exige 2 cartas de sobra por encima de lo que va a
   tratar (afinado en §4n). Devuelve la carta comprada o null. */
function iaComprar(j){
  if(j.compraHecha) return null;
  const porTratar = j.camas.filter(c=>c && !c.estable).length * 2;
  const sobra = j.mano.length - porTratar - 2;
  if(sobra <= 0) return null;
  const ops = G.pizarra
    .map((a,i)=>({a,i}))
    .filter(x=>+x.a.coste <= Math.min(sobra, j.mano.length) &&
               ACC[x.a.id] && ACC[x.a.id].puede())
    .sort((x,y)=>((PRIO_ACC[y.a.id]||0)-+y.a.coste)-((PRIO_ACC[x.a.id]||0)-+x.a.coste));
  if(!ops.length) return null;
  const {a, i} = ops[0];
  j.mano.sort((c1,c2)=>(c1.comodin?1:0)-(c2.comodin?1:0) ||
                       (c1.sistema?1:0)-(c2.sistema?1:0));
  // C09 Bodega Llena: a La de Abastecimiento le fían 1 carta del precio
  const pago = Math.max(0, +a.coste - (tieneAv(j,"C09") ? 1 : 0));
  for(let k=0;k<pago;k++){ const c=j.mano.shift(); if(c) G.descG.push(c); }
  G.pizarra.splice(i,1);
  const nueva = G.mazoA.pop(); if(nueva) G.pizarra.push(nueva);
  j.protocolos.push(a); j.compraHecha = true;
  anota("a", `${j.nombre} toma ${a.nombre} (${a.coste}).`);
  return a;
}

/* — la ventana de RESPUESTA 🛡️ (A11 y A16) — */
function compAnulable(){
  const u = G.ultimaComp;
  if(!u || u.ronda !== G.ronda) return null;
  const cama = yo().camas.find(c=>c && c.uid===u.cama);
  return cama ? {cama, u} : null;    // solo sobre un paciente TUYO
}
function anularComplicacion(nombre, ok, no){
  const t = compAnulable();
  if(!t){ no(); return; }
  // La IA no abre hojas (mismo trato que elegirUno): si llegó hasta aquí
  // es porque quiere anular, así que anula y listo. Sin esto la hoja
  // quedaba huérfana en la pantalla del humano, esperando un dedo ajeno.
  if(yo().ia){
    t.cama.vida = Math.min(t.cama.vidaMax, t.cama.vida + 1);
    G.ultimaComp = null;
    anota("a",`${nombre}: se anula ${t.u.nombre} en ${t.u.paciente}.`);
    ok(); return;
  }
  hoja(nombre, (m, cerrar)=>{
    m.appendChild(el("p",
      `Anula <b>${esc(t.u.nombre)}</b> sobre <b>${esc(t.u.paciente)}</b>: recupera el ❤️ `+
      `y el recurso se queda puesto.`));
    const fila = el("div","acciones"); fila.style.padding="0";
    const can = el("button","btn","Ahora no");
    can.onclick = ()=>{ UI.modal=null; no(); };
    const si = el("button","btn pri","Anular");
    si.onclick = ()=>{
      t.cama.vida = Math.min(t.cama.vidaMax, t.cama.vida + 1);
      G.ultimaComp = null;
      anota("a",`${nombre}: se anula ${t.u.nombre} en ${t.u.paciente}.`);
      aviso("ok",`🛡️ ${esc(t.u.nombre)} anulada — ${esc(t.u.paciente)} recupera 1 ❤️`);
      UI.modal=null; ok();
    };
    fila.appendChild(can); fila.appendChild(si);
    m.appendChild(fila);
  });
}

/* — puerta única: valida, resuelve y consume — */
function accionesBloqueadas(){ return G.bloqueoAcciones === G.ronda; }
function puedeJugarAccion(a){
  const j = yo();
  if(j.ia || G.fase!==1 || j.accionHecha || accionesBloqueadas()) return false;
  const m = ACC[a.id];
  return m ? m.puede() : false;
}
/* las Acciones de ATAQUE que despiertan la Asamblea del Dirigente (C10) */
const ACC_ATAQUES = {A01:1,A02:1,A07:1,A08:1,A09:1,A13:1,A17:1,A18:1,A20:1,A21:1};

function jugarAccion(a, alGastar){
  const j = yo();
  const m = ACC[a.id];
  if(!m) return;
  m.jugar(j, ()=>{                       // ok: la carta se gasta
    j.accionHecha = true;
    G.ultimaAccion = a.id;
    G.descA.push(a);
    // C10 Asamblea Extraordinaria: el atacado roba 1 por el atrevimiento
    if(ACC_ATAQUES[a.id]){
      G.jug.forEach(r=>{
        if(r!==j && tieneAv(r,"C10")){
          robar(r);
          anota("a",`Asamblea Extraordinaria: ${r.nombre} roba 1 por el ataque.`);
          if(!r.ia) aviso("ok","✊ Asamblea Extraordinaria: robas 1 carta");
        }
      });
    }
    alGastar();
    guardar(); render();
  }, ()=>{ render(); });                 // cancelada: sigue guardada
}

/* ══ fases ══════════════════════════════════════════════════════════ */
function mostrarFranja(txt, ms){
  UI.franja = txt;
  UI.franjaMs = ms || 1700;
  clearTimeout(UI.franjaT);
  UI.franjaT = setTimeout(()=>{ UI.franja = null; render(); }, UI.franjaMs);
}

function entrarFase(f){
  G.fase = f;
  const j = yo();
  if(f===0 && !j.ia && G.iniciado){
    mostrarFranja(`TURNO ${G.ronda} (DÍA ${G.ronda})`);
  }
  if(f===0){ faseEntrega(); }
  if(f===1){ j.coloc = INDICACIONES - (j.colocMod||0); j.colocMod = 0;
             j._pi = false; j._compraVista = false; j._avVisto = false;
             j._c13 = {};
             entregaAvatar(j); }   // C11 coloca lo guardado; C18 ofrece cambiar
  if(f===2){ faseFin(); }
  guardar(); render();
  if(j.ia && !G.fin && !G.pendiente){
    clearTimeout(UI.iaT);              // un solo hilo de IA, nunca dos
    UI.iaT = setTimeout(iaJuega, 550);
  }
}

function faseEntrega(){
  const j = yo();
  // los escudos 🛡️ de El Que Guarda vencen ahora: protegieron toda la vuelta
  j.camas.forEach(c=>{ if(c && c.escudo){ c.escudo=false;
    anota("", `Vence la protección de ${c.p.nombre}.`); } });
  // ¡Liceeeencia!: el avatar prestado vuelve a su dueño
  if(G.canjeAvatar && G.ronda >= G.canjeAvatar.ronda &&
     G.jug.indexOf(j) === G.canjeAvatar.a){
    const A = G.jug[G.canjeAvatar.a], B = G.jug[G.canjeAvatar.b];
    if(A && B){ const t = A.avatar; A.avatar = B.avatar; B.avatar = t;
      anota("", `Se acaba la licencia: ${A.nombre} vuelve a ser ${A.avatar.nombre}.`); }
    G.canjeAvatar = null;
  }
  // a) altas — con ✅ de antes de este turno y sin basura encima
  j.camas.forEach((c,i)=>{
    if(c && c.estable && c.estableDesde!==null && c.estableDesde < G.ronda){
      if(c.basura.length){
        anota("", `${c.p.nombre} está listo pero tiene basura clínica: el alta espera.`);
        return;
      }
      j.altas.push(c.p);
      alDarAlta(j);                     // C08: la primera alta trae 1 carta
      c.puestos.forEach(x=>G.descG.push(x));
      anota("a", `ALTA · ${c.p.nombre} (+${c.p.alta}) — ${j.nombre}`);
      (UI.fxAltas = UI.fxAltas || []).push({
        nombre:c.p.nombre, pts:c.p.alta, jug:j.nombre, arte:c.p.arte,
        propio: !(G.modo==="ia" && j.ia) });
      j.camas[i] = null;
    }
  });
  // b) admisión obligatoria → se resuelve en la UI (o por la IA)
  // c) robo → tras la admisión
  pedirAdmision();
}

const FRASES_ADMISION = [
  "Llaman de Urgencias",
  "Solicitan cama desde Medicina",
  "Llaman desde Cirugía",
  "Traslado desde la Posta",
  "Rescate desde Pabellón",
  "La UTI pide una cama",
  "Ambulancia en la puerta",
  "Interconsulta: piden UCI",
];

function pedirAdmision(){
  const j = yo();
  // v0.32: la ronda 1 se juega con los 2 pacientes de la preparación
  if(G.ronda === 1){ hacerRobo(); return; }
  const i = j.camas.findIndex(c=>c===null);
  if(i<0 || !G.mazoP.length){ hacerRobo(); return; }
  const ops = [G.mazoP.pop()]; if(G.mazoP.length) ops.push(G.mazoP.pop());
  if(j.ia){
    const mejor = ops.slice().sort((a,b)=>
      (b.alta-b.fallece)/Math.max(1,b.total) - (a.alta-a.fallece)/Math.max(1,a.total))[0];
    resolverAdmision(i, ops, mejor);
  } else {
    G.pendiente = {tipo:"admision", cama:i, ops, sel:null,
      titulo: FRASES_ADMISION[Math.floor(Math.random()*FRASES_ADMISION.length)]};
    render();
  }
}
function resolverAdmision(i, ops, elegido){
  const j = yo();
  j.camas[i] = nuevaCama(elegido);
  entraConAvatar(j, j.camas[i]);               // C19: los graves, con +1 ❤️
  ops.filter(o=>o!==elegido).forEach(o=>G.mazoP.unshift(o));
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  anota("", `${j.nombre} admite a ${elegido.nombre} (${elegido.gravedad}).`);
  G.pendiente = null;
  pedirAdmision();
}
function hacerRobo(){
  const j = yo();
  let n = Math.max(0, ROBO + (j.roboMod||0)); j.roboMod = 0;
  // C02 El Médico Fantasma: en la ronda 1 aún no llega; desde la 4 rinde
  if(tieneAv(j,"C02")){
    if(G.ronda===1){ n = Math.max(0, n-1);
      anota("", "El Médico Fantasma aún no llega: roba 1 menos."); }
    else if(G.ronda>=4){ n++;
      anota("", "El Médico Fantasma por fin aparece: roba 1 extra."); }
  }
  for(let i=0;i<n;i++) robar(j);
  anota("", `${j.nombre} roba ${n}.`);
  G.pendiente = null;
  entrarFase(1);          // directo al Pase de Visita
}

function faseFin(){
  const j = yo();
  // C07 · la IA gasta su Turno Tranquilo justo cuando salva de verdad
  if(j.ia && tieneAv(j,"C07") && !j.habP && j.mano.length>=3 &&
     j.camas.some(c=>c && !c.estable && !conSoporte(c) && c.vida<=1)){
    j.mano.sort((a,b)=>(a.comodin?1:0)-(b.comodin?1:0) ||
                       (a.sistema?1:0)-(b.sistema?1:0));
    for(let k=0;k<3;k++) G.descG.push(j.mano.shift());
    const velado = j.camas.filter(c=>c && !c.estable && !conSoporte(c))
                          .sort((a,b)=>a.vida-b.vida)[0];
    velado.tregua = true; j.habP = true;
    anota("a",`Turno Tranquilo: la Enfermera de Noche vela a ${velado.p.nombre}.`);
  }
  j.camas.forEach((c,i)=>{
    if(!c) return;
    // C07 Turno Tranquilo: esta noche este paciente no pierde ❤️ — y por
    // lo mismo el ventilador no gasta su aguante
    if(c.tregua){
      c.tregua = false; c.extraDeterioro = 0;
      if(!c.estable || c.basura.length)
        anota("a",`🌙 ${c.p.nombre} pasa la noche velado — no pierde ❤️.`);
      return;
    }
    // El ✅ congela el reloj, PERO la basura clínica lo vuelve a soltar.
    // Sin esto un paciente estabilizado con basura encima quedaba inmune
    // para siempre: no se moría porque estaba ✅ y no se iba de alta
    // porque la basura la retiene. O sea que dejar la basura salía gratis.
    // Ahora muerde: o gastas la indicación en des-escalar, o se desangra.
    // Y el soporte vital para el reloj por su cuenta: la Ventilación
    // Mecánica no cura nada —los requisitos siguen igual de abiertos—
    // pero mientras esté puesta el paciente no se deteriora. Es lo único
    // que salva a alguien que no vas a alcanzar a completar, y también
    // lo único que corta la sangría de la basura clínica. Se desconecta
    // como cualquier 💉: con Hay Que Repetirlo.
    // El aguante solo se gasta cuando de verdad salva: si el paciente no
    // iba a perder nada igual, la Ventilación Mecánica sigue cargada.
    const soporte = conSoporte(c);
    if(soporte && (!c.estable || c.basura.length)){
      c.soporteVivo = false;
      anota("m", `${c.p.nombre} aguanta la noche en ventilación mecánica `+
                 `— pero el ventilador ya dio lo que tenía.`);
    }
    if(!soporte && (!c.estable || c.basura.length)){
      c.vida -= 1 + (c.extraDeterioro||0);
      if(c.estable && c.basura.length && c.vida > 0)
        anota("m", `${c.p.nombre} está ✅ pero la basura clínica no lo deja `+
                   `descansar: −1 ❤️ (le quedan ${c.vida}).`);
    }
    // se consume siempre: un turno de Llaman de Urgencias no se guarda
    // para el siguiente por haber estado conectado
    c.extraDeterioro = 0;
    if(c.vida<=0){
      // C14 Masaje y Adrenalina: no muere — 1 ❤️ y pierde lo colocado
      if(tieneAv(j,"C14") && !j.habP){
        j.habP = true;
        c.vida = 1;
        while(c.puestos.length) G.descG.push(quitarRecurso(c, 0));
        anota("a",`⚡ Masaje y Adrenalina: El Reanimador trae de vuelta a ${c.p.nombre} — 1 ❤️ y sin recursos.`);
        if(!j.ia) aviso("ok",`💓 ${esc(c.p.nombre)} vuelve con 1 ❤️`);
        return;
      }
      j.muertos.push(c.p);
      alPonerCruz(j);                   // C20: el Carroñero cobra su carta
      anota("m", `✝️ ALTA CELESTIAL · ${c.p.nombre} (${c.p.fallece}) — ${j.nombre}`);
      (UI.fxAltas = UI.fxAltas || []).push({
        tipo:"celestial", nombre:c.p.nombre, pts:c.p.fallece, jug:j.nombre,
        arte:c.p.arte, propio: !(G.modo==="ia" && j.ia) });
      c.puestos.concat(c.basura).forEach(x=>G.descG.push(x));
      j.camas[i]=null;
      if(G.sumariosLibres>0){ j.sumarios++; G.sumariosLibres--; }
    }
  });
  // el escudo NO se limpia aquí: dura "hasta tu próximo turno", así que
  // tiene que sobrevivir los turnos rivales. Se retira en tu Entrega.
  j.camas.forEach(c=>{ if(c) c.atacada=false; });
  if(j.mano.length > limiteMano(j)){
    if(j.ia){
      while(j.mano.length>limiteMano(j)) G.descG.push(j.mano.pop());
      terminarTurno();
    } else { G.pendiente = {tipo:"descartar"}; UI.marcarDescartes=[]; render(); }
  } else terminarTurno();
}

function terminarTurno(){
  const j = yo();
  j.compraHecha=false; j.accionHecha=false; j.sinFarmacos=false; j.habT=false;
  G.pendiente = null;
  G.turno++;
  if(G.turno >= G.jug.length){
    G.turno = 0; G.ronda++;
    if(G.ronda > RONDAS){ G.fin = true; guardar(); render(); return; }
    anota("r", `RONDA ${G.ronda}`);
  }
  if(G.modo==="hotseat" && !yo().ia){ G.pendiente = {tipo:"pasa"}; guardar(); render(); }
  else entrarFase(0);
}

/* ══ puntuación ═════════════════════════════════════════════════════ */
function puntos(j){
  let p = j.altas.reduce((s,c)=>s+c.alta,0) + j.muertos.reduce((s,c)=>s+c.fallece,0);
  p -= j.pena || 0;                                     // altas apuradas (A22)
  p -= j.camas.filter(c=>c===null).length;              // camas vacías al final
  if(j.sinCierre) return p;         // C05: la Gestora renunció a los logros
  if(!j.muertos.length) p += 3;
  else if(j.muertos.every(c=>c.gravedad==="III"||c.gravedad==="ROJO")) p += 1;
  return p;
}

/* ══ IA (misma heurística que tools/simular_v030.py) ════════════════ */
function iaElegirCamas(j){
  return j.camas.filter(c=>c && !c.estable && faltanTotal(c)>0)
    .map(c=>({c, alc: faltanTotal(c) <= c.vida*2.1,
              val:(c.p.alta-c.p.fallece)/faltanTotal(c)}))
    .sort((a,b)=> (a.alc===b.alc ? b.val-a.val : (a.alc?-1:1)))
    .map(x=>x.c);
}
function iaElegirCarta(j, cama){
  const cands = j.mano.filter(c=>puedeColocarPropia(c,cama));
  if(!cands.length) return null;
  // prioriza sinergia/doble, luego normal, comodín al final; limpia antes que ⚠️
  const puntua = c => (c.comodin?3:0) + (aporte(c,cama)===2?-2:0) + (c.warn?1:0);
  return cands.sort((a,b)=>puntua(a)-puntua(b))[0];
}
function iaSabotaje(j){
  const warns = j.mano.filter(c=>c.warn);
  if(!warns.length) return null;
  let best=null;
  otros().forEach(r=>r.camas.forEach(cama=>{
    if(!cama || cama.atacada || cama.escudo) return;
    warns.forEach(c=>{
      if(leSirve(c,cama)) return;               // sería un regalo
      const urg = -faltanTotal(cama) + (cama.estable?3:0);
      if(urg < -2) return;                       // solo si de verdad estorba
      if(!best || urg>best.urg) best = {urg, carta:c, cama, duenio:r};
    });
  }));
  return best;
}
/* ══ EL TURNO DE LA IA SE VE (v0.43) ═════════════════════════════════
   Antes el turno rival ocurría entero en un parpadeo y había que ir a la
   bitácora a entender qué pasó. Ahora es una secuencia: cada jugada de la
   IA revela la carta al centro —legible— y recién después cae la
   siguiente. Tocar la revelación la adelanta. */
let IA_PAUSA = 2000;          // ritmo entre jugadas; los tests lo bajan
let FX_ALTA  = 2000;          // duración de la ceremonia del alta

function celebrarAlta(fx, luego){
  const celestial = fx.tipo === "celestial";
  const cont = el("div","altafx");
  const carta = el("div","fa-carta"+(celestial?" celestial":""));
  carta.style.setProperty("--dur", (FX_ALTA/1000)+"s");
  carta.innerHTML =
    (fx.arte ? `<div class="fa-arte" style="background-image:url('${fx.arte}')"></div>` : "") +
    `<div class="fa-nom">${esc(fx.nombre)}</div>` +
    `<div class="fa-sub">${esc(fx.jug)} · ${fx.nota||(celestial?"alta celestial · deja Sumario":"alta médica")}</div>` +
    (celestial ? `<div class="sello-alta rojo">SUMARIO ⚠</div>`
               : `<div class="sello-alta">ALTA ✚</div>`);
  cont.appendChild(carta);
  document.body.appendChild(cont);
  let fin = false;
  const irse = ()=>{ if(fin) return; fin = true; cont.remove(); luego(); };
  // la moneda: dorada vuela al marcador; la gris cae y se apaga
  setTimeout(()=>{
    if(fin) return;
    const m = el("div","moneda"+(celestial?" gris":""),
                 (fx.pts>0?"+":"")+fx.pts);
    document.body.appendChild(m);
    // el ancla cambia con la maqueta: en A es la línea de datos (o el chip
    // del rival); en B, el número de altas del rótulo de cada unidad
    const destino = celestial ? null : document.querySelector(fx.propio
      ? ".zona.cerca .marca.al"
      : ".zona.lejos .marca.al, .zona.suya .marca.al, .rival-chip");
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(celestial){
        m.style.transform = "translateY(46vh) rotate(24deg) scale(.55)";
      } else if(destino){
        const r = destino.getBoundingClientRect();
        m.style.transform = `translate(${r.x + r.width/2 - innerWidth/2}px,` +
                            `${r.y + r.height/2 - innerHeight*0.26}px) scale(.35)`;
      } else {
        m.style.transform = "translateY(-40vh) scale(.35)";
      }
      m.style.opacity = "0.1";
    }));
    setTimeout(()=>{
      m.remove();
      if(destino){ destino.classList.add("pop-alta");
                   setTimeout(()=>destino.classList.remove("pop-alta"), 760); }
      // la ceremonia celestial no termina en la moneda gris: el Sumario que
      // deja viaja hasta tu contador 📋, para que se VEA de dónde salió el
      // castigo — antes el contador subía en silencio en la otra punta
      if(celestial){
        const chip = document.querySelector(fx.propio
          ? ".zona.cerca .suml"
          : ".zona.suya .su-sum, .rival-chip");
        const v = el("div","vuelo-sum","📋");
        document.body.appendChild(v);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          if(chip){
            const r = chip.getBoundingClientRect();
            v.style.transform = `translate(${r.x + r.width/2 - innerWidth/2}px,` +
                                `${r.y + r.height/2 - innerHeight*0.72}px) scale(.5)`;
          } else v.style.transform = "translateY(12vh) scale(.4)";
          v.style.opacity = "0.15";
        }));
        setTimeout(()=>{ v.remove();
          if(chip){ chip.classList.add("pop-alta");
                    setTimeout(()=>chip.classList.remove("pop-alta"), 760); }
        }, 640);
      }
    }, Math.round(FX_ALTA*0.34));
  }, Math.round(FX_ALTA*0.42));
  const tm = setTimeout(irse, FX_ALTA);
  cont.addEventListener("pointerdown", ev=>{ ev.stopPropagation();
    clearTimeout(tm); irse(); });
}
function colaAltas(){
  if(UI.fxViva || !UI.fxAltas || !UI.fxAltas.length) return;
  UI.fxViva = true;
  celebrarAlta(UI.fxAltas.shift(), ()=>{ UI.fxViva = false; colaAltas(); });
}

function revelarIA(cartaHtml, txt, luego){
  const r = el("div","revelada");
  r.innerHTML = (cartaHtml ? cartaHtml : "") +
                `<div class="rev-txt">${txt}</div>`;
  document.body.appendChild(r);
  let hecho = false;
  const fin = ()=>{ if(hecho) return; hecho = true;
    r.classList.add("fuera"); setTimeout(()=>r.remove(), 160); luego(); };
  const tm = setTimeout(fin, cartaHtml ? IA_PAUSA : Math.round(IA_PAUSA*0.65));
  r.addEventListener("pointerdown", ev=>{ ev.stopPropagation();
    clearTimeout(tm); fin(); });
}
function revCarta(c){
  return `<div class="carta rev" style="border-left-color:${TCOL[c.tipo]||TCOL.COMODIN}">${cuerpoCarta(c)}</div>`;
}
function revProt(a){
  return `<div class="prot rev">`+
    (a.arte ? `<i class="p-arte"${a.tinte?` style="--tinte:${a.tinte}"`:""}>`+
              `<img src="${a.arte}" alt=""></i>` : "")+
    `<div class="prot-cab">`+
    `<span class="coste">${a.coste}</span><span class="prot-tipo">${esc(a.tipo)}</span></div>`+
    `<div class="prot-nom">${esc(a.nombre)}</div>`+
    `<div class="prot-txt">${esc(a.texto)}</div></div>`;
}

function iaJuega(){
  // Llega por setTimeout: la partida pudo morir (Nueva guardia, borrar)
  // entre que se armó el reloj y que sonó.
  if(!G || G.fin) return;
  const j = yo();
  if(!j.ia || G.fase!==1) return;
  if(G.caso){ casoRival(); return; }
  if(UI.fxViva){                       // primero termina la ceremonia del alta
    clearTimeout(UI.iaT);
    UI.iaT = setTimeout(iaJuega, 300);
    return;
  }

  // 1. jugar un Protocolo guardado (un solo intento por turno)
  if(!j._pi && !j.accionHecha && !accionesBloqueadas()){
    j._pi = true;
    const jugables = j.protocolos
      .filter(a=>ACC[a.id] && ACC[a.id].puede())
      .sort((a,b)=>(PRIO_ACC[b.id]||0)-(PRIO_ACC[a.id]||0));
    if(jugables.length){
      const a = jugables[0];
      let jugo = false;
      jugarAccion(a, ()=>{ jugo = true;
        const k = j.protocolos.indexOf(a); if(k>=0) j.protocolos.splice(k,1);
        anota("a", `${j.nombre} juega ${a.nombre}.`); });
      if(jugo){ revelarIA(revProt(a), `${esc(j.nombre)} juega <b>${esc(a.nombre)}</b>`, iaJuega); return; }
    }
  }
  // 1.5 usar el poder de su avatar (elegirUno/pagarCartas deciden por ella)
  if(!j._avVisto){
    j._avVisto = true;
    if(iaUsaAvatar(j)){
      guardar();
      revelarIA(null, `⚡ ${esc(j.nombre)} usa <b>${esc(j.avatar.nombre)}</b>`, iaJuega);
      return;
    }
  }
  // 2. comprar de la Pizarra
  if(!j._compraVista){
    j._compraVista = true;
    const a = iaComprar(j);
    if(a){ guardar(); render();
      revelarIA(revProt(a), `${esc(j.nombre)} toma <b>${esc(a.nombre)}</b> de la Pizarra`, iaJuega);
      return; }
  }
  // 3. una indicación por paso
  if(j.coloc > 0){
    const bloq = j.camas.find(c=>c && c.basura.length && (c.estable || faltanTotal(c)<=1));
    if(bloq){
      G.descG.push(bloq.basura.pop()); j.coloc--;
      anota("", `${j.nombre} des-escala en ${bloq.p.nombre}.`);
      revisar(bloq, G.ronda); guardar(); render();
      revelarIA(null, `${esc(j.nombre)} des-escala en <b>${esc(bloq.p.nombre)}</b>`, iaJuega);
      return;
    }
    const sab = iaSabotaje(j);
    if(sab && faltanTotal(sab.cama)<=1 && !sab.cama.estable){
      colocar(sab.carta, sab.cama, sab.duenio, true); guardar(); render();
      revelarIA(revCarta(sab.carta), `⚠️ ${esc(j.nombre)} sabotea a <b>${esc(sab.cama.p.nombre)}</b>`, iaJuega);
      return;
    }
    for(const cama of iaElegirCamas(j)){
      const carta = iaElegirCarta(j, cama);
      if(carta){
        colocar(carta, cama, j, false); guardar(); render();
        revelarIA(revCarta(carta), `${esc(j.nombre)} trata a <b>${esc(cama.p.nombre)}</b>`, iaJuega);
        return;
      }
    }
    if(sab){
      colocar(sab.carta, sab.cama, sab.duenio, true); guardar(); render();
      revelarIA(revCarta(sab.carta), `⚠️ ${esc(j.nombre)} sabotea a <b>${esc(sab.cama.p.nombre)}</b>`, iaJuega);
      return;
    }
    j.coloc = 0;               // no le queda nada que colocar
  }
  // 4. cerrar Sumarios, de a uno (C04: al Director le cuestan 1)
  const pagaS = costoSumario(j);
  if(j.sumarios > 0 && j.mano.length >= pagaS){
    for(let k=0;k<pagaS;k++) G.descG.push(j.mano.pop());
    j.sumarios--; G.sumariosLibres++;
    anota("a", `${j.nombre} cierra un Sumario.`); guardar(); render();
    revelarIA(null, `📋 ${esc(j.nombre)} cierra un Sumario (paga ${pagaS} carta${pagaS>1?"s":""})`, iaJuega);
    return;
  }
  // 5. fin de su guardia
  entrarFase(2);
}

/* ══ persistencia ═══════════════════════════════════════════════════ */
function guardar(){
  // un caso clínico es un banco de pruebas, no una partida: si se guardara,
  // pisaría la guardia de verdad que el jugador tenga a medias
  if(G && G.caso) return;
  try{ localStorage.setItem(CLAVE, JSON.stringify(G)); }catch(e){}
}
function cargar(){
  try{ const s=localStorage.getItem(CLAVE); if(!s) return false;

const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c;
                      if(h!==undefined) e.innerHTML=h; return e; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ── el parpadeo que quedaba ─────────────────────────────────────────
   #app se reconstruye entero en cada render, así que toda animación
   infinita que viva dentro vuelve al fotograma 0: el retrato pega un
   respingo, el rayo del poder rebota y un brillo cruza la Pizarra. En
   una partida medida eso pasaba 235 veces. Con un animation-delay
   negativo igual al tiempo ya transcurrido, la animación entra por donde
   iba y el re-render deja de verse. El elemento es nuevo cada vez, así
   que el retardo hay que reponerlo cada vez: es una línea por elemento
   y solo sobre los cinco que laten.

   El tercer campo, cuando está, es una propiedad personalizada: el aura
   de la cama late en un ::after, y a un pseudo-elemento no se le puede
   escribir el estilo desde JS — hay que pasarle el retardo por variable. */
const LATIDOS = [[".aro-av img, .aro-av .ini", 5200],
                 [".poder-av.vivo", 2400],
                 [".btn-pizarra", 6500],
                 [".cz-uno.bajo", 1400],
                 [".cama.al-filo", 1050, "--fase"]];
function continuarAnimaciones(){
  const t = performance.now();
  LATIDOS.forEach(([sel, dur, prop])=>{
    const d = (-(t % dur)).toFixed(0) + "ms";
    document.querySelectorAll(sel).forEach(e=>{
      if(prop) e.style.setProperty(prop, d); else e.style.animationDelay = d;
    });
  });
}

function render(){
  document.querySelectorAll(".fantasma").forEach(f=>{
    if(f !== arrastre.fantasma) f.remove();   // huérfanos de gestos muertos
  });
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.classList.remove("partida");
  if(!G){ app.appendChild(UI.pantalla==="casos" ? pantallaCasos()
                                                 : pantallaInicio());
         pintarCapa(); pintarTuto(); pintarPortada(); return; }
  if(G.fin){ app.appendChild(pantallaFinal()); pintarCapa(); pintarTuto();
             pintarPortada(); return; }
  app.classList.add("partida");
  app.appendChild(rieles());
  // en B la barra de estado y la franja de guía se van: la ronda y la fase
  // viven en el reloj control, el menú se muda al lado de la Pizarra, y el
  // aviso pasa a ser una pastilla que sale sólo cuando hace falta
  if(!esB()) app.appendChild(barraEstado());
  const g = textoGuia();
  if(g && !esB()) app.appendChild(el("div","guia",g));
  const v = vista();
  G.jug.filter(x=>x!==v).forEach(r=>app.appendChild(zonaJugador(r,false)));
  app.appendChild(bandaCentral());     // la Pizarra vive aquí, siempre visible
  app.appendChild(zonaJugador(v,true));
  app.appendChild(pie());
  if(esB() && UI.manoAbierta && !G.pendiente){
    // tocar cualquier hueco fuera de las cartas y las camas cierra la mano
    const velo = el("div","velo-mano");
    velo.onclick = ()=>{ UI.manoAbierta = false; UI.sel = null; render(); };
    app.appendChild(velo);
  }
  if(esB() && UI.sel && !G.pendiente)
    app.appendChild(el("div","pista","suéltala en una cama"));
  if(UI.franja){
    const fr = el("div","franja",esc(UI.franja));
    fr.style.animationDuration = ((UI.franjaMs||1700) - 100)/1000 + "s";
    if(UI.franja.length > 16) fr.style.fontSize = "21px";
    app.appendChild(fr);
  }
  if(UI.verRival && !UI.modal){
    const r = G.jug.find(x=>x.nombre===UI.verRival && x!==vista());
    if(r) UI.modal = modalRival(r); else UI.verRival = null;
  } else if(UI.verRival && UI.modal && UI.modal.querySelector(".zona-rival")){
    const r = G.jug.find(x=>x.nombre===UI.verRival && x!==vista());
    UI.modal = r ? modalRival(r) : null;
    if(!r) UI.verRival = null;
  }
  pintarCapa(); pintarTuto(); pintarPortada();
  continuarAnimaciones();              // que el re-render no las devuelva al 0
  colaAltas();                         // la ceremonia del alta, si hay cola
  // el reparto se anima una sola vez — pero entrarFase puede renderizar dos
  // veces en la misma pasada síncrona (0→1 anidado), así que la limpieza va
  // diferida: todos los renders del mismo latido conservan la clase
  if(UI.nuevas.size){
    clearTimeout(UI.nuevasT);
    UI.nuevasT = setTimeout(()=>UI.nuevas.clear(), 80);
  }
}

function barraEstado(){

  b.appendChild(el("div","fase-chip",esc(FASES[G.fase][1])));
  if(yo().ia) b.appendChild(el("div","fase-chip ia-chip","IA jugando…"));
  b.appendChild(el("div","espacio"));
  const p = el("button","icono-btn","☰");
  p.setAttribute("aria-label","Panel de guardia");
  p.onclick = abrirPanel;
  b.appendChild(p);
  return b;
}

function textoGuia(){
  const j = yo();
  if(G.pendiente && G.pendiente.tipo==="descartar")
    return `<b>Fin de Guardia.</b> Toca cartas de tu mano hasta dejar ${limiteMano(j)}.`;
  if(G.fase===1){
    if(UI.sel) return "<b>Suéltala en una cama.</b> Las tuyas para tratar; las de arriba, para sabotear con una ⚠️.";
    if(esB()) return "<b>Pase de Visita.</b> Abre tu mano y arrastra: abajo tratas, arriba saboteas.";
    return "<b>Pase de Visita.</b> Toca una carta de tu mano, elige «Jugar esta» y toca la cama.";
  }
  return "";
}

function zonaJugador(j, propio){
  // v0.55: el rival ya no ocupa media pantalla — es una ficha consultable
  // (estilo riel de Battlegrounds, adaptado a UN rival). Sus camas se abren
  // tocándola, y el badge avisa lo único urgente: que está por dar de alta.
  if(!propio) return esB() ? zonaRivalB(j) : chipRival(j);
  const z = el("div","zona cerca");
  if(esB()){
    const rot = el("div","rot-lado");
    rot.innerHTML = `tu unidad · <b class="marca al">${j.altas.length}</b> altas` +
                    (j.muertos.length ? ` · ${j.muertos.length} ✝️` : "") +
                    (j.sumarios ? ` · ${j.sumarios} 📋` : "");
    z.appendChild(rot);
    const tres = el("div","tres");
    j.camas.forEach((c,i)=>tres.appendChild(vistaCama(c,i,j,propio)));
    z.appendChild(tres);
    if(j.protocolos.length) z.appendChild(protMios(j));
    const aire = el("div","aire");
    aire.appendChild(carteSalida());   // el cartel verde del pasillo
    z.appendChild(aire);
    z.appendChild(tiraZona(j));
    return z;
  }
  const linea = el("div","jugador-linea");
  linea.appendChild(el("b",null,esc(j.nombre)));
  linea.appendChild(el("span","marca al",`${j.altas.length} altas`));
  linea.appendChild(el("span","marca",`${j.muertos.length} ✝️`));
  if(j.sumarios) linea.appendChild(el("span","marca su",`${j.sumarios} 📋`));
  linea.appendChild(el("div","espacio"));
  linea.appendChild(el("span","marca",`${j.mano.length} cartas`));
  z.appendChild(linea);
  const tres = el("div","tres");
  j.camas.forEach((c,i)=>tres.appendChild(vistaCama(c,i,j,propio)));
  z.appendChild(tres);
  if(j.protocolos.length) z.appendChild(protMios(j));
  z.appendChild(tiraZona(j));
  return z;
}

/* ══ maqueta B · la mitad del rival ═════════════════════════════════
   Su unidad deja de ser una ficha que abre un cajón: ocupa la mitad de
   arriba, con la Pizarra de eje. Arriba del todo su repisa (el espejo
   de tu zócalo: retrato con anillo, pasiva, su mano en dorsos) y contra
   la Pizarra sus tres camas — la misma pieza que las tuyas, espejada,
   así los corazones y los requerimientos de los dos lados se miran a
   la misma altura. Con eso el sabotaje es el mismo arrastre, hacia
   arriba, y ya no hace falta entrar a ningún modal. */
function zonaRivalB(j){
  const z = el("div","zona suya");

  const rep = el("div","repisa");
  const aro = el("div","aro-suyo");
  const suTurno = G.fase===1 && yo()===j;
  for(let k=1;k<=3;k++)
    aro.style.setProperty("--seg"+k,
      (suTurno && j.coloc>=k) ? "var(--warn, #e0af3c)" : "var(--line)");
  if(j.avatar && j.avatar.arte){
    const im = document.createElement("img");
    im.src = j.avatar.arte; im.alt = ""; aro.appendChild(im);
  } else aro.appendChild(el("span","ini",esc((j.nombre||"?")[0])));
  rep.appendChild(aro);

  const qn = el("span","qn");
  qn.appendChild(el("b",null,esc(j.nombre)+(j.ia?" · IA":"")));
  qn.appendChild(el("span",null,
    (suTurno ? `${j.coloc} de ${INDICACIONES} · ` : "") +
    (j.avatar ? esc(j.avatar.nombre) : "sin avatar")));
  rep.appendChild(qn);

  if(j.avatar){
    const pod = el("span","poder-suyo","⚡");
    pod.title = j.avatar.nombre + " · " + (j.avatar.frecuencia||"");
    rep.appendChild(pod);
  }
  // el mismo aviso del chip: lo único que no puede perderse de vista
  const listas = j.camas.filter(c=>c && c.estable).length;
  const cerca  = j.camas.some(c=>c && !c.estable && faltanTotal(c)===1);
  if(listas) rep.appendChild(el("span","peligro",`✅ alta ×${listas}`));
  else if(cerca) rep.appendChild(el("span","peligro","⚠ cerca"));
  if(j.sumarios) rep.appendChild(el("span","dato su-sum",`📋 ${j.sumarios}`));

  const dor = el("div","mano-suya");
  for(let k=0;k<Math.min(5, j.mano.length);k++) dor.appendChild(el("i"));
  dor.appendChild(el("span","n",String(j.mano.length)));
  rep.appendChild(dor);

  const grupo = el("div","grupo-suyo");
  const tres = el("div","tres");
  j.camas.forEach((c,i)=>{
    const n = vistaCama(c,i,j,false);
    n.classList.add("suya");
    tres.appendChild(n);
  });
  const rot = el("div","rot-lado");
  rot.innerHTML = `su unidad · <b class="marca al">${j.altas.length}</b> altas` +
                  (j.muertos.length ? ` · ${j.muertos.length} ✝️` : "");
  // column-reverse: se emite en el MISMO orden que tu mitad y se pinta al revés
  grupo.appendChild(rot);
  grupo.appendChild(tres);
  grupo.appendChild(el("div","aire"));
  z.appendChild(grupo);
  z.appendChild(rep);   // último en el DOM, arriba del todo por column-reverse
  if(UI.emoteRival && j.ia) rep.appendChild(el("div","burb-viva rival",esc(UI.emoteRival)));
  return z;
}

function chipRival(j){
  const sel = UI.sel;
  const activo = G.fase===1 && !yo().ia && yo().coloc>0 && !G.pendiente;
  const saboteable = sel && activo && j.camas.some(c=>c && puedeSabotear(sel,c));
  const b = el("button","rival-chip"+(saboteable?" blanco":""));
  b.setAttribute("aria-label","Ver la unidad de "+j.nombre);
  if(j.avatar && j.avatar.arte){
    const f = document.createElement("img");
    f.className = "foto"; f.src = j.avatar.arte; f.alt = "";
    b.appendChild(f);
  } else b.appendChild(el("span","foto-ini",esc((j.nombre||"?")[0])));
  const qn = el("span","qn");
  qn.appendChild(el("b",null,esc(j.nombre)+(j.ia?" · IA":"")));
  if(j.avatar) qn.appendChild(el("span",null,esc(j.avatar.nombre)));
  b.appendChild(qn);
  b.appendChild(el("span","dato",`🂠 ${j.mano.length}`));
  b.appendChild(el("span","dato",`${j.altas.length} altas`));
  if(j.muertos.length) b.appendChild(el("span","dato",`${j.muertos.length} ✝️`));
  // el aviso que no puede perderse al sacar sus camas de la pantalla:
  // ✅ = tiene un paciente estable (alta segura si sobrevive);
  // ⚠ = alguno está a 1 recurso de completarse
  const listas = j.camas.filter(c=>c && c.estable).length;
  const cerca = j.camas.some(c=>c && !c.estable && faltanTotal(c)===1);
  if(listas) b.appendChild(el("span","peligro",`✅ alta ×${listas}`));
  else if(cerca) b.appendChild(el("span","peligro","⚠ cerca"));
  b.appendChild(el("span","abre","›"));
  b.onclick = ()=>{ UI.verRival = j.nombre; render(); };
  if(UI.emoteRival && j.ia){
    const bv = el("div","burb-viva rival",esc(UI.emoteRival));
    b.appendChild(bv);
  }
  return b;
}

/* el cajón del rival: sus camas con todo el detalle, y ahí también se
   sabotea — se reconstruye en cada render para que refleje la jugada */
function modalRival(j){
  const velo = el("div","velo");
  const m = el("div","modal");
  m.appendChild(el("div","tirador"));
  m.appendChild(el("h2",null,"Unidad de "+esc(j.nombre)));
  const sel = UI.sel;
  if(sel && sel.warn)
    m.appendChild(el("p",null,`Tienes <b>${esc(sel.nombre)}</b> ⚠️ en la mano: toca una cama para jugarla aquí.`));
  const z = el("div","zona-rival");
  const linea = el("div","jugador-linea");
  if(j.avatar) linea.appendChild(el("span","av-chip",esc(j.avatar.nombre)));
  linea.appendChild(el("span","marca al",`${j.altas.length} altas`));
  linea.appendChild(el("span","marca",`${j.muertos.length} ✝️`));
  if(j.sumarios) linea.appendChild(el("span","marca su",`${j.sumarios} 📋`));
  linea.appendChild(el("div","espacio"));
  linea.appendChild(el("span","marca",`${j.mano.length} cartas`));
  z.appendChild(linea);
  const tres = el("div","tres");
  j.camas.forEach((c,i)=>tres.appendChild(vistaCama(c,i,j,false)));
  z.appendChild(tres);
  m.appendChild(z);
  const fila = el("div","acciones"); fila.style.padding = "12px 0 0";
  const cb = el("button","btn pri","Cerrar");
  cb.onclick = ()=>{ UI.verRival = null; UI.modal = null; render(); };
  fila.appendChild(cb);
  m.appendChild(fila);
  velo.appendChild(m);
  velo.onclick = e=>{ if(e.target===velo){ UI.verRival = null; UI.modal = null; render(); } };
  return velo;
}

/* El zócalo (v0.55): el retrato al centro con el anillo de indicaciones,
   el poder ⚡ al hombro y los Sumarios al otro lado. El anillo ES el
   contador: cada colocación apaga un segmento. */
function tiraZona(j){
  const w = el("div","zocalo");
  const a = j.avatar;
  if(j.sumarios) w.appendChild(el("span","suml",`📋 ${j.sumarios}`));

  const aro = el("button","aro-av");
  aro.id = "indic-caja";              // volarIndic aterriza aquí
  const activo = G.fase===1 && !j.ia && j === yo();
  for(let k=1;k<=3;k++)
    aro.style.setProperty("--seg"+k,
      (activo && j.coloc>=k) ? "var(--warn, #e0af3c)" : "var(--line)");
  if(a && a.arte){
    const im = document.createElement("img");
    im.src = a.arte; im.alt = "Tu avatar: " + esc(a.nombre);
    aro.appendChild(im);
  } else aro.appendChild(el("span","ini",
    a ? esc(a.nombre.replace(/^(el|la|los|las)\s+(de\s+la\s+|de\s+|del\s+)?/i,"")[0].toUpperCase()) : "?"));
  if(activo) aro.appendChild(el("span","ind",`${j.coloc} de ${INDICACIONES}`));
  aro.setAttribute("aria-label", a ? "Tu avatar: " + a.nombre : "Tu avatar");
  // tocar tu retrato abre los emotes (la carta vive en el ⚡ → Ver la carta)
  aro.onclick = ()=>{
    if(j !== yo() || j.ia) return;
    if(UI.emoteCd && Date.now() - UI.emoteCd < 3500) return;   // anti-spam
    UI.emotes = !UI.emotes; render();
  };
  w.appendChild(aro);

  if(UI.emotes && j === yo() && !j.ia){
    const opciones = ["¡Buena jugada!", "Gracias a Dios 🙏", "¿En serio?"];
    const pos = [[ "left:calc(50% - 172px)", "bottom:6px" ],
                 [ "left:calc(50% - 148px)", "bottom:58px" ],
                 [ "right:calc(50% - 148px)", "bottom:58px" ]];
    opciones.forEach((t,k)=>{
      const bu = el("button","burb-em",esc(t));
      bu.style.cssText = pos[k][0] + ";" + pos[k][1];
      bu.onclick = ev=>{ ev.stopPropagation(); decirEmote(t); };
      w.appendChild(bu);
    });
    if(a && a.frase){
      const bu = el("button","burb-em fr","“"+esc(a.frase)+"”");
      bu.style.cssText = "right:calc(50% - 190px);bottom:-8px";
      bu.onclick = ev=>{ ev.stopPropagation(); decirEmote("“"+a.frase+"”"); };
      w.appendChild(bu);
    }
  }
  if(UI.emoteVivo && j === yo()){
    const bv = el("div","burb-viva",esc(UI.emoteVivo));
    bv.style.cssText = "left:calc(50% - 30px);bottom:96px";
    w.appendChild(bv);
  }

  if(a){
    const act1 = !!AV[a.id] || AV_AUTO[a.id];
    const gast = act1 && poderGastado(j);
    const usable = !!AV[a.id] && !gast && j===yo() && !j.ia &&
                   G.fase===1 && !G.pendiente;
    const pod = el("button","poder-av" +
      (usable ? " vivo" : "") + (gast ? " gastado" : ""));
    pod.innerHTML = gast ? "✓" : "⚡";
    pod.setAttribute("aria-label","Poder de " + a.nombre);
    pod.onclick = ()=> hojaPoder(j);
    w.appendChild(pod);
  }
  return w;
}

/* Decir un emote: burbuja viva 2,6 s, y contra la IA el rival contesta
   con la frase de su propio avatar — las frases ya estaban en el CSV. */
function decirEmote(txt){
  UI.emotes = false;
  UI.emoteCd = Date.now();
  UI.emoteVivo = txt;
  clearTimeout(UI.emoteT);
  UI.emoteT = setTimeout(()=>{ UI.emoteVivo = null; render(); }, 2600);
  const rival = otros().find(r=>r.ia && r.avatar && r.avatar.frase);
  if(rival && Math.random() < 0.65){
    clearTimeout(UI.emoteRT);
    UI.emoteRT = setTimeout(()=>{
      UI.emoteRival = "“" + rival.avatar.frase + "”";
      render();
      UI.emoteRT = setTimeout(()=>{ UI.emoteRival = null; render(); }, 2600);
    }, 1100);
  }
  render();
}

/* el poder en su hoja: qué hace, y el Usar si corresponde */
function hojaPoder(j){
  const a = j.avatar;
  hoja(a.nombre, (m, cerrar)=>{
    const freq = a.frecuencia || "";
    const entry = AV[a.id];
    const auto = AV_AUTO[a.id];
    const act1 = !!entry || !!auto;
    const gast = act1 && poderGastado(j);
    m.appendChild(el("p",null,
      `<b>${esc(freq)}</b>${act1 ? "" : " · pasiva: aplica sola, no se gasta"}` +
      `${gast ? " · <b>ya usada</b>" : ""}<br>${esc(a.habilidad)}`));
    if(auto && !gast)
      m.appendChild(el("p",null,`<i>${esc(auto)}</i>`));
    const fila = el("div","acciones"); fila.style.padding = "12px 0 0";
    if(entry && !gast && j===yo() && !j.ia && G.fase===1 && !G.pendiente){
      const puede = entry.puede();
      const ub = el("button","btn pri","⚡ Usar ahora");
      ub.disabled = !puede;
      ub.onclick = ()=>{
        UI.modal = null;
        // el poder se gasta SOLO si el efecto se aplicó: cancelar a medio
        // camino no cuesta nada — ni cartas ni el ⚡
        entry.jugar(j,
          ()=>{ marcarPoder(j); guardar(); render(); },
          ()=>{ guardar(); render(); });
      };
      fila.appendChild(ub);
      if(!puede && entry.ayuda)
        m.appendChild(el("p",null,`<i>${esc(entry.ayuda)}</i>`));
    }
    const vb = el("button","btn","Ver la carta");
    vb.onclick = ()=>{ UI.modal = null; verAvatarGrande(j); };
    fila.appendChild(vb);
    const cb = el("button","btn","Cerrar"); cb.onclick = cerrar;
    fila.appendChild(cb);
    m.appendChild(fila);
  });
}

/* el botón redondo de Fin de Guardia, en la esquina opuesta al avatar */
function botonFin(){
  const j = yo();
  if(esB()) return null;          // en B lo hace el reloj control de la banda
  if(G.fase!==1 || j.ia || vista()!==j || G.pendiente) return null;
  const b = el("button","btn-fin");
  b.id = "btn-fin";
  b.innerHTML = "Fin de<br>Guardia";
  b.setAttribute("aria-label","Fin de Guardia");   // el <br> parte el nombre
  b.onclick = ()=>{ UI.sel = null; entrarFase(2); };
  return b;
}

/* Tus Protocolos comprados: zona propia con su botón de jugar. */
/* El Protocolo también tiene ilustración —A01 y A19 ya la traen— y no se
   pintaba en ninguna parte: la carta se compraba y su imagen desaparecía.
   Mismo trato que la carta de recurso: a sangre arriba y disolviéndose. */
function arteProt(a){
  const z = el("i","p-arte");
  if(a.tinte) z.style.setProperty("--tinte", a.tinte);
  const im = document.createElement("img");
  im.src = a.arte; im.alt = "";
  z.appendChild(im);
  return z;
}

function protMios(j){
  const w = el("div");
  const rot = el("div","jugador-linea");
  rot.style.marginTop = esB() ? "12px" : "9px";   // en B las camas quedaban pegadas
  rot.innerHTML = `<b>Tus Protocolos</b><span class="marca">${j.accionHecha?"ya jugaste 1 este turno":"máx. 1 por turno"}</span>`;
  w.appendChild(rot);
  const g = el("div","prot-mios");
  g.style.marginTop = "0";
  j.protocolos.forEach((a,idx)=>{
    const c = el("div","prot");
    if(a.arte) c.appendChild(arteProt(a));
    const cab = el("div","prot-cab");
    cab.appendChild(el("span","prot-tipo",esc(a.tipo)));
    c.appendChild(cab);
    c.appendChild(el("div","prot-nom",esc(a.nombre)));
    c.appendChild(el("div","prot-txt",esc(a.texto)));
    const puede = j === yo() && puedeJugarAccion(a);
    let rot2 = "Guardada";
    if(puede) rot2 = "Jugar ahora";
    else if(G.fase!==1 || j.ia) rot2 = "En el Pase de Visita";
    else if(accionesBloqueadas()) rot2 = "Sistema caído";
    else if(j.accionHecha) rot2 = "Ya jugaste 1";
    else rot2 = "Sin objetivo válido";
    const b = el("button","prot-btn"+(puede?"":" no"), rot2);
    if(puede) b.onclick = ()=> jugarAccion(a, ()=>{
      const k = j.protocolos.indexOf(a); if(k>=0) j.protocolos.splice(k,1);
    });
    c.appendChild(b);
    g.appendChild(c);
  });
  w.appendChild(g);
  return w;
}

/* El reloj control de asistencia: fichar la salida ES el Fin de Guardia.
   Se lleva la ronda y la fase, que es lo que marcaba la barra de arriba, y
   saca el botón de la esquina donde convivía con el mazo — que era justo
   donde más fácil se tocaba sin querer. Mismo cromado que la Pizarra: la
   banda se lee como un aparato y no como tres botones sueltos. */
function relojGuardia(){
  const j = yo();
  const puede = G.fase===1 && !j.ia && vista()===j && !G.pendiente;
  const b = el("button","reloj-g"+(puede?" viva":" gris"));
  b.id = "btn-fin";
  // la pantalla es SOLO la ronda; el lector de huella va aparte, en su
  // propio hueco rebajado en el metal, como en el reloj de verdad
  b.innerHTML = `<span class="marca">Guardia</span>` +
    `<span class="fila">` +
      `<span class="pantalla"><span class="cifra">${G.ronda}` +
        `<small>/${RONDAS}</small></span></span>` +
      `<span class="lector"><i class="huella"></i></span>` +
    `</span>` +
    `<span class="fase">${esc(puede ? "fichar salida" : FASES[G.fase][1])}</span>`;
  b.setAttribute("aria-label", puede
    ? `Fin de Guardia · ronda ${G.ronda} de ${RONDAS}`
    : `Ronda ${G.ronda} de ${RONDAS} · ${FASES[G.fase][1]}`);
  if(puede) b.onclick = ()=>{ UI.sel = null; UI.manoAbierta = false; entrarFase(2); };
  return b;
}

      'stroke-width="1.6" stroke-linejoin="round"/>'+
    /* el hombrecito corriendo */
    '<g fill="#fff">'+
      '<circle cx="20.4" cy="6.6" r="2.3"/>'+
      '<path d="M18.6 10.1c1.6-.9 3.4-.6 4.4.6l3.1 3.7 3.3 1.1-.8 2.3-4.2-1.4-1.6-1.9-.9 3.6 3.1 3.3-1.7 1.6-3.9-4.1c-.4-.5-.6-1.1-.4-1.7l.6-2.5-2 1.9-2.9 3.1-1.8-1.7 3.3-3.5z"/>'+
    '</g>'+
    /* la flecha hacia la puerta */

  b.setAttribute("aria-label","Salida · terminar la guardia");
  b.innerHTML = `<i class="sal-cadena"></i><i class="sal-cadena der"></i>`+
                `<span class="sal-placa">${SVG_SALIDA}`+
                `<span class="sal-txt">SALIDA</span></span>`;
  b.onclick = ev=>{ ev.stopPropagation(); hojaSalida(); };
  return b;
}

function hojaSalida(){
  hoja("Salida", (m, cerrar)=>{
    m.appendChild(el("p",null,
      `Vas por la <b>ronda ${G.ronda} de ${RONDAS}</b>. Puedes cerrar la guardia `+
      `aquí mismo y contar los puntos como están, o irte sin contarlos.`));
    const fila = el("div","acciones");
    const cerrarYa = el("button","btn pri","Cerrar la guardia y contar");
    cerrarYa.onclick = ()=>{
      anota("", `Se cierra la guardia en la ronda ${G.ronda}.`);
      G.fin = true; G.finAnticipado = true;
      UI.modal = null; guardar(); render();
    };
    fila.appendChild(cerrarYa);
    const irse = el("button","btn","Irme sin contar");
    irse.onclick = ()=>{
      borrar(); G = null; UI.modal = null;
      UI = {sel:null, selProt:null, modal:null, marcarDescartes:[],
            nuevas:new Set(), vidaPrev:{}, okPrev:{}, reqPrev:{}, colocPrev:null,
            foco:0, manoAbierta:false};
      render();
    };
    fila.appendChild(irse);
    const q = el("button","btn","Seguir en la guardia"); q.onclick = cerrar;
    fila.appendChild(q);
    m.appendChild(fila);
  });
}

function bandaCentral(){
  const j = yo();
  const c = el("div","centro");
  const info = el("div","centro-info");
  if(accionesBloqueadas()){
    const cai = el("div","guia");
    cai.style.cssText = "margin:-6px -10px 6px;border-bottom:0;background:#f6e7c8";
    cai.innerHTML = "<b>💻 Se cayó el sistema.</b> Esta ronda nadie puede jugar Acciones.";
    c.appendChild(cai);
  }
  // v0.55: Urgencias y Guardia viven en los rieles; aquí queda solo el dato
  // que es información de juego y no un contador: quién viene llegando
  info.appendChild(el("span","sep"));
  info.appendChild(el("span",null, G.informe
    ? `Próximo: ${esc(G.informe.nombre)}` : "Urgencias vacía"));
  info.appendChild(el("span","sep"));
  c.appendChild(info);

  // v0.38: la Pizarra sale del centro a un cajón — el tablero respira y
  // los pacientes quedan cara a cara, como pidió el autor (estilo Pocket)
  const dcto = tieneAv(j,"C09") ? 1 : 0;    // C09 Bodega Llena
  const alguna = G.fase===1 && !j.ia && !j.compraHecha &&
                 G.pizarra.some(a=>j.mano.length >= Math.max(0,+a.coste-dcto));
  const bp = el("button","btn-pizarra"+(alguna?" puede":""));
  bp.id = "btn-pizarra";
  const gemas = G.pizarra.map(a=>`<span class="coste">${a.coste}</span>`).join("");
  bp.innerHTML = (esB() ? `🗒️ Pizarra` : `🗒️ Pizarra de Turno`) +
    `<span class="gemas">${gemas || '<span class="prot-tipo">vacía</span>'}</span>` +
    `<span class="flecha">›</span>`;
  bp.onclick = hojaPizarra;
  if(esB()){
    // la banda pasa a ser el panel de control: menú · Pizarra · reloj
    const fila = el("div","banda-b");
    const men = el("button","icono-btn");
    men.innerHTML = "☰";
    men.setAttribute("aria-label","Panel de guardia");
    men.onclick = abrirPanel;
    fila.appendChild(men);
    fila.appendChild(bp);
    fila.appendChild(relojGuardia());
    c.appendChild(fila);
    return c;
  }
  c.appendChild(bp);
  return c;
}

/* el cajón de la Pizarra: los 3 Protocolos, la compra y la limpieza */
function hojaPizarra(){
  const j = yo();
  hoja("Pizarra de Turno", (m, cerrar)=>{
    m.appendChild(el("p", j.compraHecha
      ? "Ya compraste este turno. Máximo 1 Protocolo por turno."
      : "Toma 1 pagando su coste en cartas de tu mano. No gasta indicación."));
    const p = el("div","pizarra");
    G.pizarra.forEach((a,idx)=>{
      const puede = G.fase===1 && !j.ia && !j.compraHecha &&
                    j.mano.length >= Math.max(0, +a.coste - (tieneAv(j,"C09")?1:0));
      const b = el("button","prot "+(puede?"puede":"no"));
      if(a.arte) b.appendChild(arteProt(a));
      const cab = el("div","prot-cab");
      cab.appendChild(el("span","coste",`${a.coste}`));
      cab.appendChild(el("span","prot-tipo",esc(a.tipo)));
      b.appendChild(cab);
      b.appendChild(el("div","prot-nom",esc(a.nombre)));
      b.appendChild(el("div","prot-txt",esc(a.texto)));
      if(puede) b.onclick = ()=>{ UI.modal=null; abrirCompra(idx); };
      p.appendChild(b);
    });
    m.appendChild(p);
    const fila = el("div","acciones"); fila.style.padding="12px 0 0";
    if(G.fase===1 && !j.ia && !j.compraHecha && G.pizarra.length){
      const lb = el("button","btn","Limpiar Pizarra");
      lb.onclick = ()=>{
        G.pizarra.forEach(a=>G.descA.push(a)); G.pizarra=[];
        for(let i=0;i<3;i++){ const a=G.mazoA.pop(); if(a) G.pizarra.push(a); }
        j.compraHecha = true;
        anota("",`${j.nombre} limpia la Pizarra.`); guardar();
        UI.modal=null; render();
      };
      fila.appendChild(lb);
    }
    const cb = el("button","btn pri","Cerrar"); cb.onclick = cerrar;
    fila.appendChild(cb);
    m.appendChild(fila);
  });
}

/* La banda del botón va sobre la ILUSTRACIÓN, no sobre el pie de la
   ficha: abajo están los símbolos de recurso, que son justo lo que hay
   que leer para decidir dónde sueltas la carta. Tapar el dibujo no cuesta
   nada; tapar el dato, sí. */
function ponBanda(d, b){ (d.__ventana || d).appendChild(b); return b; }

function vistaCama(c, i, duenio, propio){
  if(!c) return el("div","cama vacia","cama vacía");
  const sel = UI.sel;
  const activo = G.fase===1 && !yo().ia && yo().coloc>0 && !G.pendiente;
  const objetivo = sel && activo &&
    (propio ? puedeColocarPropia(sel,c) : puedeSabotear(sel,c));

  let clase = "cama";
  if(c.estable) clase += " est";
  if(objetivo) clase += " blanco";

  // pulso: comparar con el render anterior y animar solo lo que cambió
  const pv = UI.vidaPrev[c.uid], po = UI.okPrev[c.uid], pr = UI.reqPrev[c.uid];
  const ft = faltanTotal(c);
  let popNum = null;
  if(pv!==undefined && c.vida < pv){ clase += " golpe"; popNum = ["mal", `−${pv-c.vida} ❤️`]; }
  else if(pv!==undefined && c.vida > pv){ popNum = ["bien", `+${c.vida-pv} ❤️`]; }
  if(po===false && c.estable) clase += " recien-ok";
  else if(pr!==undefined && ft < pr && popNum===null) clase += " progreso";
  UI.vidaPrev[c.uid]=c.vida; UI.okPrev[c.uid]=c.estable; UI.reqPrev[c.uid]=ft;

  const d = el(objetivo ? "button" : "div", clase);
  if(popNum) d.appendChild(el("span","pop-num "+popNum[0], popNum[1]));

  // v0.55: con arte, la cama es una FICHA — arte y números; el nombre y el
  // detalle viven en el zoom (tócala). Sin arte sigue la carta clásica.
  // En B es SIEMPRE ficha: la fila de camas es una ranura de alto fijo y las
  // dos mitades tienen que medir igual, así que la cama no puede crecer con
  // su contenido. Sin ilustración va el ícono del sistema sobre el tinte.
  const ficha = !!c.p.arte || esB();
  const total = faltanTotal(c);
  if(ficha){
    d.classList.add("pficha");   // "ficha" a secas ya existe: las fichitas
                                 // de la tira del avatar (display:flex), y
                                 // chocaba — la cama colapsaba a una fila
    d.style.setProperty("--gravc", GRAVC[c.p.gravedad] || "var(--line)");
    const za = el("div","cama-arte");
    za.style.setProperty("--tinte", c.p.tinte || TINSIS[c.p.sistema] || "#b9c7cc");
    if(c.p.arte){
      const im = document.createElement("img");
      im.src = c.p.arte; im.alt = esc(c.p.nombre);
      za.appendChild(im);
    } else {
      const ic = el("span","sinarte", (SIS[c.p.sistema] ? SIS[c.p.sistema][0] : "🛏️").split(" ")[0]);
      ic.title = esc(c.p.nombre);
      za.appendChild(ic);
    }
    za.appendChild(el("span","f-grav",
      c.p.gravedad==="ROJO" ? "★ROJO" : "G·"+esc(c.p.gravedad)));
    za.appendChild(el("span","f-faltan"+(total===0?" cero":""),
      total===0 ? "✓" : String(total)));
    // el aura: verde si se va de alta en tu Entrega, roja y latiendo si
    // no llega al cierre del turno. La roja manda sobre la verde.
    if(alFilo(c)) d.classList.add("al-filo");
    else if(saldraDeAlta(c)) d.classList.add("por-alta");
    // la basura clínica se veía solo en un sello que la ficha recortaba
    if(c.basura.length){
      const bs = el("span","f-basura", `↯${c.basura.length>1?c.basura.length:""}`);
      bs.title = `${c.basura.length} basura clínica — retiene el alta y `+
                 `le cuesta 1 ❤️ por turno`;
      za.appendChild(bs);
    }
    // el escudo se pone solo; que al menos se vea a quién cubre
    if(c.escudo){
      d.classList.add("escudado");
      const sc = el("span","f-escudo","🛡️");
      sc.title = "Protegido: nadie puede tocar sus recursos hasta tu próximo turno";
      za.appendChild(sc);
    }
    d.appendChild(za);
    d.__ventana = za;   // la banda del botón cuelga del arte, no del pie
  } else {
    const raya = el("i","raya");
    raya.style.background = SIS[c.p.sistema] ? SIS[c.p.sistema][1] : "var(--ink-3)";
    d.appendChild(raya);
    const cab = el("div","cama-cab");
    cab.appendChild(el("span","pnom",esc(c.p.nombre)));
    cab.appendChild(el("span","faltan"+(total===0?" cero":""), total===0?"✓":String(total)));
    d.appendChild(cab);
    const linea = el("div","grav");
    linea.style.display = "flex"; linea.style.alignItems = "center"; linea.style.gap = "5px";
    linea.appendChild(el("i","gchip g-"+c.p.gravedad,
      c.p.gravedad==="ROJO" ? "★ ROJO" : "G·"+esc(c.p.gravedad)));
    if(SIS[c.p.sistema]) linea.appendChild(el("span",null,SIS[c.p.sistema][0]));
    d.appendChild(linea);
  }

  const cuerpoF = ficha ? el("div","cuerpo-f") : d;
  if(ficha) d.appendChild(cuerpoF);

  // un corazón que se vacía + la cifra: se ve de un vistazo y deja sitio
  // a los símbolos de recurso, que es lo que de verdad hay que contar
  const hp = el("div","corazones");
  const rr = c.vidaMax ? Math.max(0, Math.min(1, c.vida / c.vidaMax)) : 0;
  const uno = el("i","cz-uno"+(c.vida<=2 ? " bajo" : ""));
  uno.style.setProperty("--llen", rr.toFixed(3));
  uno.title = `${c.vida} de ${c.vidaMax} ❤️`;
  hp.appendChild(uno);
  hp.appendChild(el("span","vnum",`${c.vida}<small>/${c.vidaMax}</small>`));
  // El reloj parado se anuncia aquí, pegado al corazón, y con UNA sola
  // insignia: si hay ventilador manda él, porque además dice que hay una
  // carta encima que el rival puede arrancar. La ficha tiene alto fijo —
  // una fila de sellos más abajo se recorta sin avisar.
  const PAUSA = '<svg viewBox="0 0 16 16" fill="currentColor">'+
    '<rect x="3.5" y="2.5" width="3.4" height="11" rx="1"/>'+
    '<rect x="9.1" y="2.5" width="3.4" height="11" rx="1"/></svg> ';
  if(conSoporte(c)) hp.appendChild(el("span","cong vm", PAUSA + "en VM"));
  else if(c.estable) hp.appendChild(el("span","cong",
    '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3.4" height="11" rx="1"/><rect x="9.1" y="2.5" width="3.4" height="11" rx="1"/></svg> congelada'));
  cuerpoF.appendChild(hp);

  if(ficha){
    // los requerimientos: el símbolo del recurso, repetido una vez por
    // unidad. Apagado = ya está puesto; a color = todavía falta.
    const fila = el("div","pips");
    TIPOS.forEach(t=>{
      const nn = Math.max(c.pide[t], c.tiene[t]);
      if(!nn) return;
      const g = el("span","gr");
      g.style.setProperty("--pc", TCOL[t] || "var(--ink-3)");
      for(let k=0;k<nn;k++){
        const u = el("i","uni"+(k<c.tiene[t] ? (k<c.pide[t] ? " ya":" extra") : ""));
        u.innerHTML = SVG[t] || SVG.COMODIN;
        u.title = TNOM[t] || t;
        g.appendChild(u);
      }
      fila.appendChild(g);
    });
    cuerpoF.appendChild(fila);
  }

  if(!ficha && c.puestos.length){
    const en = el("div","energias");
    const brota = UI.enerPrev && UI.enerPrev[c.uid]!==undefined &&
                  c.puestos.length > UI.enerPrev[c.uid];
    c.puestos.slice(0,9).forEach((x,k)=>{
      const i2 = el("i","energia"+(brota && k===c.puestos.length-1 ? " brote" : ""));
      i2.style.background = TCOL[x.puestoTipo||x.tipo] || TCOL.COMODIN;
      i2.title = x.nombre;
      en.appendChild(i2);
    });
    if(c.puestos.length>9) en.appendChild(el("span","mas",`+${c.puestos.length-9}`));
    d.appendChild(en);
  }
  UI.enerPrev = UI.enerPrev || {};
  UI.enerPrev[c.uid] = c.puestos.length;

  const rq = el("div","reqs");
  if(ficha) rq.style.display = "none";   // el desglose vive en el zoom
  TIPOS.forEach(t=>{
    if(!c.pide[t] && !c.tiene[t]) return;
    const f = falta(c,t);
    const r = el("div","req");
    r.style.setProperty("--tc", TCOL[t] || "var(--ink-3)");   // el color manda
    r.innerHTML = ico(t);
    const cas = el("span","casillas");
    const n = Math.max(c.pide[t], c.tiene[t]);
    for(let k=0;k<n;k++)
      cas.appendChild(el("i", k<c.tiene[t] ? (k<c.pide[t]?"cas full":"cas extra") : "cas"));
    r.appendChild(cas);
    r.appendChild(el("span","resta"+(f===0?" ok":""), f===0?"✓":String(f)));
    rq.appendChild(r);
  });
  d.appendChild(rq);

  const sellos = el("div","sellos");
  if(c.estable) sellos.appendChild(el("span","sello ok","✅ estable · no se deteriora"));
  if(c.basura.length) sellos.appendChild(el("span","sello bas",`↯${c.basura.length} retiene alta`));
  if(c.escudo && !ficha) sellos.appendChild(el("span","sello esc","🛡️"));
  c.protege.forEach(p=>sellos.appendChild(el("span","sello pro",`🛡️ ${esc(p.split(" ")[0])}`)));
  if(c.p.contra) sellos.appendChild(el("span","sello contra",
    `⛔ ${esc(c.p.contra)}`));
  if(sellos.childNodes.length) d.appendChild(sellos);

  if(objetivo){
    const soltar = ()=>{
      const ops = propio ? tiposComodin(sel, c) : [];
      // la casa propia primero: es donde la carta vale 2, y es la que la IA
      // toma cuando elige sola (elegirUno se queda con la primera)
      if(sel && sel.dobleEn) ops.sort((x,y)=>(y===sel.dobleEn)-(x===sel.dobleEn));
      if(ops.length > 1){
        const carta = sel, cama = c, dn = duenio;
        UI.sel = null;
        elegirUno(`${carta.nombre}`,
          `Vale por <b>un</b> recurso del tipo que elijas. `+
          `A ${esc(cama.p.nombre)} le falta:`,
          ops.map(t=>({val:t,
            txt:`${IC[t]||""} ${TNOM[t]||t}`+
                (carta.dobleEn===t ? " · vale 2" : ""),
            sub:`le faltan ${falta(cama,t)} · esta carta cubre `+
                (carta.dobleEn===t ? "2" : "1")})),
          t=>{ volarIndic(d); colocar(carta, cama, dn, false, t);
               guardar(); render(); });
        return;
      }
      volarIndic(d);
      colocar(sel, c, duenio, !propio);
      UI.sel=null; guardar(); render(); };   // la mano se queda abierta
    ponBanda(d, el("span","cama-btn",
      (propio ? "Tratar" : (leSirve(sel,c) ? "Le sirve ⚠️" : "Sabotear")) +
      '<i class="precio"></i>'));
    d.onclick = soltar;
    d.__soltar = soltar;          // lo usa el arrastre
  } else if(sel && activo && propio && c.p.contra && sel.nombre === c.p.contra){
    // sin esto la regla sería invisible: la carta simplemente no se podría
    // soltar y el jugador no sabría por qué
    const b = el("span","cama-btn no-va","⛔ Contraindicado");
    ponBanda(d, b);
  } else if(sel && activo && !propio && c.escudo && sel.warn){
    // el escudo del rival bloquea en silencio; que se sepa por qué no se puede
    const b = el("span","cama-btn sec","🛡️ protegido");
    b.style.opacity = ".85";
    ponBanda(d, b);
  } else if(activo && propio && !sel && c.basura.length){
    // retirar basura ocupa una indicación: en vez de poner, retiras
    const b = el("button","cama-btn sec",'Des-escalar<i class="precio"></i>');
    b.onclick = ev=>{ ev.stopPropagation(); volarIndic(d);
      G.descG.push(c.basura.pop()); yo().coloc--;
      anota("",`Des-escalada en ${c.p.nombre} (gasta 1 indicación).`);
      revisar(c,G.ronda); guardar(); render(); };
    ponBanda(d, b);
  }
  if(!objetivo){
    // tocar la cama abre al paciente en grande: ahí están el nombre, el
    // desglose de requerimientos y todo lo que la ficha ya no muestra
    d.style.cursor = "pointer";
    d.onclick = ()=> verPacienteGrande(c);
  }
  return d;
}
