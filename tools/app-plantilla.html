        padding:7px 10px;display:flex;align-items:center;gap:8px}
.ronda{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
       color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ronda b{color:var(--ink);font-size:14px}
.fase-chip{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
           background:var(--acc);color:var(--acc-ink);padding:3px 7px;border-radius:99px;
           white-space:nowrap}
.espacio{flex:1}
.icono-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
           background:var(--cerca);font-size:15px;line-height:1;flex:none}
.guia{flex:none;background:var(--acc-soft);border-bottom:1px solid var(--line);
      padding:7px 10px;font-size:12.5px;line-height:1.3}

/* ── zonas ──────────────────────────────────────────────────────────── */
.zona{padding:7px 10px}
.zona.lejos{background:linear-gradient(180deg,rgba(205,217,222,.86),rgba(213,224,228,.82) 60%);
            border-bottom:1px solid var(--line);
            box-shadow:inset 0 -10px 16px -14px rgba(22,36,46,.35)}
.zona.cerca{background:linear-gradient(180deg,rgba(233,241,242,.84),rgba(242,247,248,.80) 45%);
            flex:1;display:flex;flex-direction:column}
/* La fila de camas se apoya en la sala: las tres camas dibujadas quedan
   detrás de las tres cartas. La imagen ya viene lavada hacia el blanco
   desde el generador, así que no compite con lo que va encima. */
/* 112% de ancho, no cover: las camas dibujadas están en 20%, 51% y 81%
   de la ilustración y las columnas de cartas en 17%, 50% y 83%. Estirar
   un 12% desde el centro las hace coincidir — cada carta cae sobre su
   cama. La altura sobra y se recorta, que es lo que queremos. */
.tres{background-size:112% auto;background-position:center 46%;
      background-repeat:no-repeat;border-radius:9px}
.zona.cerca .tres{background-image:var(--sala-mia)}
.zona.lejos .tres{background-image:var(--sala-suya)}
.jugador-linea{display:flex;align-items:center;gap:7px;margin-bottom:6px;
               font-size:11px;color:var(--ink-2)}
.jugador-linea b{color:var(--ink);font-size:13px;font-weight:700}
.marca{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
       font-variant-numeric:tabular-nums;white-space:nowrap}
.marca.al{color:var(--ok)} .marca.su{color:var(--warn)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}

/* ── banda central: la mesa compartida ──────────────────────────────── */
.centro{flex:none;background:var(--mesa);border-top:1px solid var(--line);
        border-bottom:1px solid var(--line);padding:6px 10px 8px}
.centro-info{display:flex;align-items:center;gap:8px;margin-bottom:6px;
             font-family:"IBM Plex Mono",monospace;font-size:9.5px;
             letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.centro-info .sep{flex:1;height:1px;background:var(--line)}
/* La pizarra abierta lleva el mismo marco que su tira en el tablero: al
   desplegarla no cambias de objeto, la miras de cerca. Mismo cromado y
   los mismos protectores de esquina, un punto más grandes: el panel es
   más alto que la tira, así que la tapa aguanta un pelo más. */
.pizarra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
         position:relative;padding:9px;border:6px solid transparent;
         border-radius:9px;
         background:linear-gradient(177deg,#ffffff 0%,#f7fbfc 55%,#e9f1f3 100%) padding-box,
                    linear-gradient(147deg,
                      #ffffff 0%, #b9c6cd 11%, #74838c 21%, #fdfefe 31%,
                      #93a2aa 44%, #5f6d76 55%, #eef3f5 66%,
                      #8e9da5 78%, #d9e2e6 89%, #ffffff 100%) border-box;
         box-shadow:0 0 0 1px rgba(60,78,88,.45) inset,
                    0 3px 12px rgba(22,36,46,.16)}
.pizarra::after{content:"";position:absolute;inset:-6px;pointer-events:none;
  border-radius:9px;
  background:
    linear-gradient(to bottom right,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) left top/17px 17px no-repeat,
    linear-gradient(to bottom left,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) right top/17px 17px no-repeat,
    linear-gradient(to top right,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) left bottom/17px 17px no-repeat,
    linear-gradient(to top left,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) right bottom/17px 17px no-repeat}
.prot{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px;text-align:left;box-shadow:var(--sombra);display:flex;
      flex-direction:column;gap:3px;min-height:92px;position:relative}
.prot.no{opacity:.5}
.prot .p-arte{position:relative;display:block;margin:0 0 4px;
  aspect-ratio:4/3;flex:none;background:var(--tinte,var(--lejos));
  overflow:hidden;border:1px solid rgba(22,36,46,.20);border-radius:5px}
.prot .p-arte img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;display:block}
.prot.puede{border-color:var(--acc);animation:compable 2.4s ease-in-out infinite}
@keyframes compable{
  0%,100%{box-shadow:0 0 0 0 rgba(13,110,120,0),var(--sombra)}
  50%{box-shadow:0 0 0 3px rgba(13,110,120,.18),var(--sombra)}}
.prot-cab{display:flex;align-items:center;gap:4px}
/* la gema de coste: el "maná" de la Pizarra */
.coste{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;
       width:19px;height:19px;border-radius:99px;flex:none;
       display:inline-flex;align-items:center;justify-content:center;
       background:linear-gradient(180deg,#118491,#0a5860);color:#fff;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(9,25,32,.25)}
.prot.no .coste{background:var(--ink-3);box-shadow:none}
.prot-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
           letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prot-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.prot-txt{font-size:8.5px;line-height:1.25;color:var(--ink-2)}

/* ── cama ───────────────────────────────────────────────────────────── */
.cama{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px 6px 6px 8px;position:relative;overflow:hidden;
      box-shadow:var(--sombra);text-align:left;width:100%;display:block}
.cama.vacia{background:transparent;border-style:dashed;box-shadow:none;
            color:var(--ink-3);text-align:center;padding:16px 4px;font-size:10px;
            letter-spacing:.1em;text-transform:uppercase;min-height:70px}
.cama.est{border-color:var(--ok);background:#f4fbf8}
.cama.blanco{border-color:var(--acc);cursor:pointer;
             animation:respira 1.1s ease-in-out infinite}
@keyframes respira{
  0%,100%{box-shadow:0 0 0 2px var(--acc-soft),var(--sombra)}
  50%{box-shadow:0 0 0 4px rgba(13,110,120,.34),0 4px 14px rgba(13,110,120,.22)}}
.cama.sobre{box-shadow:0 0 0 3px var(--acc),0 6px 18px rgba(13,110,120,.3);
            transform:translateY(-2px) scale(1.02);animation:none}
.raya{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2}
/* ── el arte de la cama: la misma ventana enmarcada ─────────────────
   Entraba a sangre y se disolvía en la ficha; ahora es la misma ventana
   4:3 con filete que en la carta de mano, para que una sola ilustración
   sirva en las dos sin recortar nada. El fondo lleva el tinte de la
   propia imagen por si el redondeo deja ver un pelo de costado. */
.cama{--fondo-carta:var(--paper)}
.cama.est{--fondo-carta:#f4fbf8}
.cama-arte{position:relative;margin:0 0 4px;aspect-ratio:4/3;
           background:var(--tinte,var(--lejos));overflow:hidden;
           border:1px solid rgba(22,36,46,.20);border-radius:4px}
.cama-arte img{position:absolute;inset:0;width:100%;height:100%;
               object-fit:cover;object-position:center;display:block}
.cama-cab{display:flex;align-items:flex-start;gap:4px}
.pnom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11.5px;
      line-height:1.12;flex:1;min-height:26px}
.faltan{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:700;
        color:var(--acc);line-height:1;flex:none;font-variant-numeric:tabular-nums}
.faltan.cero{color:var(--ok)}
.grav{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
      color:var(--ink-3);display:block;margin-top:2px}
/* ── la cama-ficha (v0.55): arte y números; el texto vive en el zoom.
   Solo cuando el paciente TIENE arte — sin arte se queda la carta clásica,
   que es transitorio mientras llegan las 115 ilustraciones. */
.cama.pficha{padding:0 0 5px;border-width:2px;border-color:var(--gravc,var(--line))}
.cama.pficha .cama-arte{margin:0 0 4px;aspect-ratio:4/3}
.cama.pficha .f-grav{position:absolute;top:4px;left:4px;z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:8px;font-weight:700;
  letter-spacing:.04em;color:#fff;background:var(--gravc);padding:2px 5px;
  border-radius:5px}
.cama.pficha .f-faltan{position:absolute;top:2px;right:5px;z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:700;
  color:var(--acc);text-shadow:0 1px 0 var(--paper),0 0 6px var(--paper)}
.cama.pficha .f-faltan.cero{color:var(--ok)}
/* ── el aura de la cama ──────────────────────────────────────────────
   Dos cosas que el jugador tenía que calcular de cabeza mirando corazones
   y símbolos: si este paciente se va de alta en su próxima Entrega, y si
   no llega vivo al cierre del turno. Ahora lo dice el marco. Va en un
   ::after con sombra INTERIOR porque la ficha recorta —una sombra por
   fuera no se vería— y así tampoco pelea con el borde de gravedad ni con
   el aro del escudo, que son box-shadow del propio elemento. */
.cama.pficha{position:relative}
.cama.por-alta::after,.cama.al-filo::after{content:"";position:absolute;
  inset:0;border-radius:inherit;pointer-events:none;z-index:7}
.cama.por-alta::after{box-shadow:inset 0 0 0 2.5px var(--ok),
  inset 0 0 16px rgba(35,122,91,.45)}
.cama.al-filo::after{box-shadow:inset 0 0 0 2.5px var(--vida),
  inset 0 0 18px rgba(192,73,47,.5)}
@media (prefers-reduced-motion: no-preference){
  .cama.al-filo::after{animation:auraFilo 1.05s ease-in-out infinite;
    animation-delay:var(--fase,0s)}}
@keyframes auraFilo{
  0%,100%{box-shadow:inset 0 0 0 2.5px var(--vida), inset 0 0 10px rgba(192,73,47,.32)}
  50%{box-shadow:inset 0 0 0 3.5px var(--vida), inset 0 0 26px rgba(192,73,47,.72)}}
/* la basura clínica: ↯ morado sobre el arte, del lado del corazón */
.cama.pficha .f-basura{position:absolute;z-index:4;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;
  line-height:1;color:#fff;background:var(--basura);padding:3px 5px;
  border-radius:5px;box-shadow:0 1px 4px rgba(9,25,32,.4);
  top:22px;right:5px}
/* la banda del botón vive en el filo de abajo del arte, así que el ↯ va
   arriba, bajo el número de lo que falta; espejado en la mitad del rival */
body[data-maq="b"] .cama.suya .f-basura{top:auto;bottom:22px}


/* la barra del reloj de la capa: cruza el filo de abajo y se drena en los
   10 s. Va por encima de todo lo de la capa, y con el velo también, para
   que se vea igual sobre la admisión que sobre la Entrega. */
.reloj-capa{position:fixed;left:0;right:0;z-index:95;height:3px;
  bottom:env(safe-area-inset-bottom,0px);
  background:rgba(22,36,46,.12);pointer-events:none}
.reloj-capa i{display:block;height:100%;width:100%;transform-origin:left center;
  background:var(--acc);animation:drenaReloj 10s linear forwards}
@keyframes drenaReloj{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){
  .reloj-capa i{animation-duration:10s}}

/* ══ la Entrega de Turno ═════════════════════════════════════════════
   Ocupa la pantalla entera, como elegir personaje: es el prólogo, no un
   aviso. Vive en #capa, así que no la toca el re-render del tablero. */
.entrega{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  padding:calc(30px + env(safe-area-inset-top,0px)) 14px
          calc(14px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(130% 100% at 50% 0%, #e6edf0 0%, var(--mesa) 52%, #ccd9d3 100%);
  color:var(--ink);animation:aparecer .26s ease;cursor:pointer;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.entrega h2{font-family:Petrona,Georgia,serif;font-weight:700;margin:0}

/* el golpe de apertura: el reloj de la unidad */
.ent-abre{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center}
.ent-reloj{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  margin-bottom:20px;
  background:radial-gradient(120% 120% at 32% 22%,#fff 0%,#eef4f6 42%,#cfdde1 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
             inset 0 -2px 4px rgba(60,78,88,.24),
             0 0 0 2px rgba(60,78,88,.22), 0 6px 18px rgba(22,36,46,.22)}
.ent-reloj svg{width:78px;height:78px;display:block}
.ent-hora{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;
  letter-spacing:.2em;color:var(--acc)}
.ent-abre h2{font-size:27px;margin-top:6px;line-height:1.1}
.ent-dice{font-family:Petrona,Georgia,serif;font-style:italic;font-size:15px;
  color:var(--ink-2);margin:14px 18px 0;line-height:1.45;text-wrap:balance}
.ent-quien{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:12px}

/* el golpe de cama: la carta grande con su ventana enmarcada */
.ent-cama{flex:1;display:flex;flex-direction:column;justify-content:center;
  min-height:0}
.ent-cab{display:flex;align-items:baseline;gap:8px;margin:0 3px 9px}
.ent-n{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--acc);
  padding:3px 8px;border-radius:6px}
.ent-de{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.ent-ficha{background:var(--paper);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 10px 26px rgba(22,36,46,.16);overflow:hidden;
  border-left:5px solid var(--sis,var(--ink-3))}
.ent-ventana{position:relative;aspect-ratio:4/3;margin:7px 7px 0;
  border:1px solid rgba(22,36,46,.2);border-radius:6px;overflow:hidden;
  background:var(--tinte,#c6d3d8);display:grid;place-items:center}
.ent-ventana img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block}
.ent-ventana .sinarte{font-size:44px;opacity:.55;
  filter:drop-shadow(0 2px 4px rgba(22,36,46,.2))}
.ent-grav{position:absolute;top:5px;left:5px;z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.04em;color:#fff;background:var(--gravc,var(--line));
  padding:2.5px 6px;border-radius:5px}
.ent-cuerpo{padding:9px 11px 12px}
.ent-cuerpo h3{font-family:Petrona,Georgia,serif;font-weight:700;font-size:19px;
  line-height:1.08;margin:0}
.ent-datos{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin:7px 0 0;
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.ent-edad{color:var(--ink);background:var(--cerca);border:1px solid var(--line);
  border-radius:99px;padding:2px 8px}
.ent-vitales{display:flex;align-items:center;gap:6px;margin:11px 0 0;flex-wrap:wrap}
.ent-vitales .cz-uno{width:19px;height:18px}
.ent-vitales .vnum{font-family:"IBM Plex Mono",monospace;font-size:14px;
  font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ent-vitales .vnum small{font-size:9.5px;font-weight:600;color:var(--ink-3)}
.ent-sep{width:1px;height:15px;background:var(--line);margin:0 3px;flex:none}
.entrega .pips{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;margin:0}
.entrega .gr{display:flex;gap:2px;flex:none}
.entrega .uni{width:14px;height:14px;flex:none;color:var(--pc);display:block}
.entrega .uni svg{width:100%;height:100%;display:block}
.ent-voz{margin:12px 0 0;padding:10px 12px;border-radius:10px;
  background:var(--cerca);border:1px solid var(--line-2);
  border-left:3px solid var(--acc)}
.ent-voz p{margin:0;font-family:Petrona,Georgia,serif;font-style:italic;
  font-size:13.5px;line-height:1.45;color:var(--ink)}
.ent-firma{display:block;margin-top:7px;font-family:"IBM Plex Mono",monospace;
  font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3)}

/* el golpe de la cama vacía: el único silencio de la pantalla */
.ent-vacia{flex:1;display:flex;flex-direction:column;text-align:center}
.ent-centro{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center}
.ent-dib{width:150px;opacity:.5;margin-bottom:6px}
.ent-dib svg{width:100%;height:auto;display:block}
.ent-vacia h2{font-size:23px}
.ent-por{font-family:Petrona,Georgia,serif;font-style:italic;font-size:15px;
  color:var(--ink-2);margin:8px 0 0}

/* el cierre */
.ent-cierra{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center}
.ent-cierra h2{font-size:26px;margin-bottom:4px}
.ent-cierra p{color:var(--ink-2);font-size:14px;margin:0 20px}
.ent-cierra .btn.pri{margin-top:22px;padding:13px 26px;width:auto;flex:none}

/* el pie: en qué golpe vas, y saltar desde el primero */
.ent-pie{flex:none;display:flex;align-items:center;gap:10px;padding-top:12px}
.ent-puntos{display:flex;gap:5px}
.ent-puntos i{width:6px;height:6px;border-radius:99px;background:var(--line);
  transition:width .2s ease, background .2s ease}
.ent-puntos i.on{background:var(--acc);width:17px}
.ent-sigue{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.ent-saltar{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  padding:6px 2px}

/* ── la hoja: de la segunda guardia en adelante ─────────────────────── */
.hoja-ent{cursor:default;padding-top:calc(34px + env(safe-area-inset-top,0px))}
.hoja-ent h2{font-size:22px}
.ent-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:5px 0 13px}
.hoja-ent .ent-voz{margin:0 0 13px}
.ent-fila{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:10px;border-radius:11px;background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--sis,var(--ink-3));
  box-shadow:var(--sombra);margin-bottom:8px;cursor:pointer}
.ent-mini{width:52px;height:39px;flex:none;border-radius:5px;overflow:hidden;
  border:1px solid rgba(22,36,46,.2);background:var(--tinte,#c6d3d8);
  display:grid;place-items:center;font-size:19px}
.ent-mini img{width:100%;height:100%;object-fit:cover;display:block}
.ent-tx{min-width:0;flex:1}
.ent-tx b{font-family:Petrona,Georgia,serif;font-size:14.5px;font-weight:700;
  display:block;line-height:1.1}
.ent-e2{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  color:var(--ink-3);vertical-align:2px}
.ent-l2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;margin-top:5px}
.ent-cn{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.1em;color:#fff;background:var(--acc);padding:2px 5px;border-radius:4px}
.ent-l2 .cz-uno.chico{width:15px;height:14px}
.ent-l2 .pips{gap:2px 6px}
.ent-l2 .uni{width:13px;height:13px}
.ent-linea{display:block;margin-top:6px;font-family:Petrona,Georgia,serif;
  font-style:italic;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.ent-fila.libre{background:transparent;border-style:dashed;box-shadow:none;
  border-left-color:var(--line);color:var(--ink-3);justify-content:center;
  padding:15px 10px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:default}
.ent-abrir{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center;
  margin:2px 0 0}
.hoja-ent .btn.pri{margin-top:auto;width:100%;flex:none}

/* el escudo no se activa: lo pone la carta. Solo hay que verlo */
.cama.pficha .f-escudo{position:absolute;left:50%;top:50%;z-index:3;
  transform:translate(-50%,-50%);font-size:24px;
  filter:drop-shadow(0 2px 5px rgba(9,25,32,.45))}
.cama.escudado{box-shadow:0 0 0 2px rgba(13,110,120,.55),var(--sombra)}
.cama.escudado .cama-arte{filter:saturate(.7) brightness(1.06)}
.cama.pficha .cuerpo-f{padding:0 6px}
.cama.pficha .corazones{margin:0 0 3px}

/* ── los requerimientos, en su propio símbolo repetido ───────────────
   Cinco círculos de colores obligaban a traducir color→recurso cada vez
   que mirabas una cama. Ahora se dibuja el símbolo tantas veces como
   unidades pide: 💊💊 son dos fármacos y se acabó. Lo ya cubierto se
   apaga y lo que falta queda a todo color, así que la cama se lee por
   lo que le falta, que es la única pregunta que uno le hace. */
.cama.pficha .pips{display:flex;flex-wrap:wrap;gap:2px 5px;margin:0 0 2px;
  align-items:center}
.cama.pficha .gr{display:flex;gap:1.5px;flex:none}
.cama.pficha .uni{width:11px;height:11px;flex:none;color:var(--pc);
  display:block}
.cama.pficha .uni svg{width:100%;height:100%;display:block}
.cama.pficha .uni.ya{opacity:.24}
.cama.pficha .uni.extra{color:var(--ink-3);opacity:.5}
.cama.pficha .sellos{margin-top:3px;padding:0 6px}
.cama.pficha .cama-btn{width:calc(100% - 12px);margin:5px 6px 0}

/* ── el rival es una ficha consultable, no media pantalla ──────────── */
.rival-chip{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:6px 9px;box-shadow:var(--sombra);font:inherit}
.rival-chip .foto{width:34px;height:34px;border-radius:50%;flex:none;
  object-fit:cover;object-position:center 12%;border:2px solid var(--line);
  background:var(--lejos)}
.rival-chip .foto-ini{width:34px;height:34px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--acc);color:#fff;
  font-weight:700;font-size:15px;border:2px solid var(--line)}
.rival-chip .qn{flex:1;min-width:0;line-height:1.12}
.rival-chip .qn b{font-family:Petrona,Georgia,serif;font-size:13.5px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival-chip .qn span{font-family:"IBM Plex Mono",monospace;font-size:8px;
  color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival-chip .dato{font-family:"IBM Plex Mono",monospace;font-size:9px;
  color:var(--ink-2);background:var(--cerca);border:1px solid var(--line);
  border-radius:6px;padding:2.5px 6px;flex:none;white-space:nowrap}
.rival-chip .peligro{font-family:"IBM Plex Mono",monospace;font-size:8.5px;
  font-weight:700;letter-spacing:.04em;color:#fff;background:var(--vida);
  border-radius:6px;padding:3px 6px;flex:none;white-space:nowrap;
  animation:parpadea 1.6s ease-in-out infinite}
@keyframes parpadea{0%,100%{opacity:1}50%{opacity:.55}}
.rival-chip .abre{color:var(--ink-3);font-size:13px;flex:none}
.rival-chip.blanco{border-color:var(--acc);cursor:pointer;
  animation:respira 1.1s ease-in-out infinite}
/* dentro del cajón del rival, sus camas con todo el detalle */
.modal .zona-rival .tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;background-image:var(--sala-suya);background-size:112% auto;
  background-position:center 46%;background-repeat:no-repeat;border-radius:9px;
  padding:6px 4px}

/* semáforo de gravedad: chip de color junto al nombre */
.gchip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;
       font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
       color:#fff;flex:none;line-height:1;margin-top:1px}
.g-I{background:#237a5b} .g-II{background:#b57e14}
.g-III{background:#c0492f} .g-ROJO{background:#7c1310}
.corazones{display:flex;gap:1px;align-items:center;margin:4px 0 5px;flex-wrap:wrap}
.cz{display:inline-flex;width:11px;height:11px;color:var(--vida);flex:none}
.cz svg{width:100%;height:100%;display:block}

/* ── un corazón, no siete ────────────────────────────────────────────
   Siete corazones en fila ocupaban el ancho entero de la cama y,
   contados de reojo, se confundían con los requerimientos. Queda uno
   solo que se vacía por abajo —la vida se ve, no se cuenta— con la
   cifra al lado para el dato exacto. El hueco que deja es justo el que
   necesitan los símbolos de recurso. */
.cz-uno{position:relative;width:17px;height:16px;flex:none;
  -webkit-mask:var(--m-cz) no-repeat center/contain;
          mask:var(--m-cz) no-repeat center/contain;
  background:linear-gradient(to top,
    var(--vida) 0 calc(var(--llen) * 100%),
    rgba(120,132,140,.34) calc(var(--llen) * 100%) 100%)}
.cz-uno.bajo{background:linear-gradient(to top,
    #c0392b 0 calc(var(--llen) * 100%),
    rgba(192,57,43,.22) calc(var(--llen) * 100%) 100%)}
@media (prefers-reduced-motion: no-preference){
  .cz-uno.bajo{animation:czLate 1.4s ease-in-out infinite}}
@keyframes czLate{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.corazones .vnum{font-family:"IBM Plex Mono",monospace;font-size:12px;
  font-weight:700;color:var(--ink);margin-left:3px;font-variant-numeric:tabular-nums;
  line-height:1}
.corazones .vnum small{font-size:8.5px;font-weight:600;color:var(--ink-3)}
.cong{display:inline-flex;align-items:center;gap:2px;font-size:7.5px;font-weight:700;
      letter-spacing:.04em;text-transform:uppercase;color:var(--ok);margin-left:4px}
.cong svg{width:7px;height:7px;flex:none}
.cong.vm{color:var(--acc)}
.num{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
     color:var(--ink-2);margin-left:4px;font-variant-numeric:tabular-nums}
.reqs{display:flex;flex-direction:column;gap:2.5px}
.req{display:flex;align-items:center;gap:3px;font-size:9px;line-height:1}
.req .ico{font-size:12.5px}
/* Los requerimientos son fichas redondas del color de su tipo, no
   casilleros. Es la gramática del coste de energía de Pokémon —fichas,
   nombre, número— y se lee sin leer: cuentas los puntos de color de un
   vistazo. --tc lo pone el JS con el color del tipo de la fila. */
.casillas{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.cas{width:7px;height:7px;border-radius:50%;flex:none;
     border:1.2px solid var(--tc,var(--ink-3));background:transparent}
.cas.full{background:var(--tc,var(--acc));border-color:var(--tc,var(--acc));
          box-shadow:inset 0 -1px 1px rgba(0,0,0,.28)}
.cas.extra{background:var(--ink-3);border-color:var(--ink-3);opacity:.55}
.resta{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
       color:var(--ink);min-width:9px;text-align:right;font-variant-numeric:tabular-nums}
.resta.ok{color:var(--ok)}
.sellos{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.sello{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       padding:1.5px 4px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.sello.ok{color:var(--ok)} .sello.bas{color:var(--basura)}
.sello.esc{color:var(--acc)} .sello.pro{color:var(--ok);border-style:dashed}
/* el nombre del fármaco prohibido es largo y la ficha de la cama mide 93 px:
   que se recorte con puntos suspensivos antes que desbordar. El nombre
   entero está a un toque, en la ficha grande del paciente. */
.sello.contra{color:var(--vida);border-style:dashed;max-width:100%;
  min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:7.5px}
.cama-btn{display:block;width:100%;margin-top:5px;padding:5px 4px;border-radius:6px;
          background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:700;
          text-align:center}
/* la banda que dice que no: mismo sitio, color de sangre y sin invitación */
.cama-btn.no-va{background:var(--vida);cursor:not-allowed}
.cama-btn.sec{background:var(--cerca);color:var(--ink-2);border:1px solid var(--line)}

/* ── tu papeleo ─────────────────────────────────────────────────────── */
.tira{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;
      padding-top:8px;border-top:1px dashed var(--line)}
.ficha{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
       padding:4px 8px;border-radius:99px;background:var(--paper);
       border:1px solid var(--line);color:var(--ink-2)}
.ficha.sum{color:var(--warn);border-color:var(--warn)}
.ficha.pro{color:var(--acc);border-color:var(--acc)}
.ficha b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.tira .vacio{font-size:10px;color:var(--ink-3);font-style:italic}

/* ── pie: mano + acciones ───────────────────────────────────────────── */
/* v0.39: la mano flota SOBRE el tablero (estilo Pocket): sin panel sólido,
   el juego se ve debajo y solo las cartas y los controles reciben el dedo */
.pie{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;
     background:transparent;z-index:45;pointer-events:none}
.pie::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;
     background:linear-gradient(180deg,transparent,rgba(22,36,46,.12));
     pointer-events:none;z-index:-1}
.pie .acciones,.pie .mano-rot{pointer-events:auto}
/* el tablero reserva solo una franja abajo: el resto queda a la vista */
.app{padding-bottom:calc(156px + env(safe-area-inset-bottom,0px))}

/* mientras arrastras una carta, la mano se aparta para despejar tus camas */
body.arrastrando .pie .mano,body.arrastrando .pie .mano-rot,
body.arrastrando .pie .acciones{opacity:0;pointer-events:none;
     transition:opacity .15s ease}

/* la mano plegada: una pastilla para volver a abrirla */
.mano-cerrada{display:flex;justify-content:flex-end;padding:0 10px 10px;
     pointer-events:none}
.mano-cerrada button{pointer-events:auto;display:flex;align-items:center;gap:7px;
     padding:9px 14px;border-radius:99px;background:var(--paper);
     border:1px solid var(--line);box-shadow:0 4px 16px rgba(22,36,46,.18);
     font-weight:700;font-size:12.5px}
.mano-rot{margin:2px 8px 4px;padding:4px 8px 4px 12px;font-size:10px;
          font-weight:700;letter-spacing:.09em;text-transform:uppercase;
          color:var(--ink-2);display:flex;gap:6px;align-items:center;
          white-space:nowrap;background:rgba(255,255,255,.88);
          -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
          border:1px solid var(--line);border-radius:99px;
          box-shadow:0 2px 10px rgba(22,36,46,.1)}
.mano-rot span{flex:1;height:1px;background:var(--line-2)}
/* Las indicaciones son LA moneda del turno: se ven grandes, y cada gasto
   se anima desde la cama donde ocurrió hasta el contador. */
.indic-caja{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;
            border-radius:99px;background:var(--acc-soft);color:var(--ink);
            letter-spacing:.02em;text-transform:none;font-size:11.5px;
            font-weight:700;border:1px solid rgba(13,110,120,.28)}
.indic-caja i{width:14px;height:14px;border-radius:99px;flex:none;
            background:radial-gradient(circle at 34% 30%,#3ea7b0,var(--acc) 62%,#0a5860);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 1px 2px rgba(9,25,32,.3)}
.indic-caja i.off{background:transparent;box-shadow:none;
            border:2px dashed rgba(13,110,120,.35)}
.indic-caja i.apaga{animation:apagaIndic .5s cubic-bezier(.3,1,.4,1) forwards}
@keyframes apagaIndic{
  0%{transform:scale(1.5);box-shadow:0 0 0 6px rgba(13,110,120,.3)}
  60%{transform:scale(.85)}
  100%{transform:scale(1);background:transparent;box-shadow:none;
       border:2px dashed rgba(13,110,120,.35)}}
.indic-caja.vacio{background:#fbeee0;border-color:#d9a441;color:#7a5209}
.indic-caja.vacio i.off{border-color:rgba(122,82,9,.35)}

/* la ficha que viaja de la cama al contador */
.ficha-indic{position:fixed;z-index:84;width:20px;height:20px;border-radius:99px;
            margin:-10px 0 0 -10px;pointer-events:none;
            background:radial-gradient(circle at 34% 30%,#5fc2ca,var(--acc) 60%,#0a5860);
            box-shadow:0 0 0 4px rgba(13,110,120,.22), 0 4px 12px rgba(9,25,32,.35);
            transition:transform .5s cubic-bezier(.5,0,.6,.5), opacity .5s ease}

/* cada acción dice lo que cuesta, como las gemas de la Pizarra */
.cama-btn .precio{display:inline-block;width:9px;height:9px;border-radius:99px;
            background:currentColor;margin-left:6px;vertical-align:middle;
            opacity:.85}
.mano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
      padding:8px;margin:0 8px;pointer-events:auto;
      background:rgba(255,255,255,.93);border:1px solid var(--line);
      border-radius:12px;box-shadow:0 6px 22px rgba(22,36,46,.16);
      -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (max-width:349px){.mano{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ── la mano en abanico (v0.37) ──────────────────────────────────────
   Las cartas se solapan en arco; deslizas para navegar y la del centro
   crece hasta ser legible de verdad. La cuadrícula sigue existiendo:
   sirve para comparar las 6 de un vistazo y para marcar descartes.   */
.mano.abanico{display:block;position:relative;height:192px;padding:0;margin:0;
              overflow:visible;background:none;border:0;box-shadow:none;
              -webkit-backdrop-filter:none;backdrop-filter:none;
              pointer-events:none;
              /* touch-action none: en el teléfono el navegador se quedaba con
                 el gesto (pan) y el hojeo nunca recibía los pointermove */
              touch-action:none}
.mano.abanico .ranura{pointer-events:auto;touch-action:none}
.ranura{position:absolute;left:50%;bottom:16px;width:118px;
        transform:translateX(calc(-50% + var(--x))) translateY(var(--y))
                  rotate(var(--a)) scale(var(--s));
        transform-origin:50% 135%;will-change:transform;
        transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .2s ease;
        z-index:var(--z)}
/* mientras el dedo está abajo, las cartas lo siguen 1:1 — sin animación
   intermedia, que era lo que se sentía trabado */
.mano.abanico.vivo .ranura{transition:opacity .2s ease}
.ranura.lejos{opacity:0;pointer-events:none}
.abanico .carta{width:100%;min-height:132px;padding:8px}
.abanico .carta .carta-nom{font-size:13px}
.abanico .carta .carta-tipo{font-size:8.5px}
.abanico .carta .etiq{font-size:8.5px;padding:2px 5px}
.abanico .carta .carta-pie{font-size:9.5px}
.ranura.foco .carta{box-shadow:0 10px 26px rgba(22,36,46,.26),
                               0 3px 8px rgba(22,36,46,.14)}
.ranura.foco .carta.no{opacity:.55}
/* la pista de que hay más cartas a los lados */
.abanico-borde{display:none}
.puntos-mano{position:absolute;left:0;right:0;bottom:0;z-index:41;display:flex;
             gap:4px;justify-content:center;pointer-events:none}
.puntos-mano i{width:5px;height:5px;border-radius:99px;background:var(--line)}
.puntos-mano i.on{background:var(--acc);width:14px}
.mano-modo{margin-left:auto;font-size:13px;line-height:1;color:var(--ink-2);
           border:1px solid var(--line);border-radius:8px;width:30px;height:24px;
           background:var(--cerca);flex:none}

/* ── la carta en grande ──────────────────────────────────────────── */
/* el avatar como carta activa (estilo TCG Pocket, invertido) */
.activo{display:flex;align-items:center;gap:9px;margin-top:8px;position:relative;
        background:var(--paper);border:1px solid var(--line);border-radius:10px;
        padding:8px 10px 8px 13px;box-shadow:var(--sombra);overflow:hidden}
.activo .raya{background:var(--acc)}
.activo-rol{font-family:"IBM Plex Mono",monospace;font-size:8px;font-weight:600;
            letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.activo-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:14.5px;
            line-height:1.1}
.activo-info{flex:1;min-width:0}
.av-chip{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;
         color:var(--ink);background:var(--paper);border:1px solid var(--line);
         border-radius:7px;padding:2.5px 8px;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;max-width:40vw;box-shadow:var(--sombra)}

/* recursos jugados como energías: una ficha de color por carta puesta */
.energias{display:flex;gap:2.5px;flex-wrap:wrap;margin:0 0 4px;align-items:center}
.energia{width:8.5px;height:8.5px;border-radius:99px;flex:none;
         box-shadow:inset 0 -1.5px 1.5px rgba(0,0,0,.28),
                    inset 0 1px 1px rgba(255,255,255,.5),
                    0 0 0 1px rgba(22,36,46,.12)}
.energia.brote{animation:brote .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes brote{0%{transform:scale(0)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
.energias .mas{font-family:"IBM Plex Mono",monospace;font-size:8px;
               color:var(--ink-3);font-weight:700}

/* la Pizarra vive en un cajón: el centro queda para los mazos */
/* ── LA PIZARRA: una pizarra magnética de verdad ───────────────────────
   Marco cromado con las tapitas negras de plástico en las esquinas, la
   superficie blanca satinada y un brillo que la recorre. Es el único
   objeto del tablero con esquinas RECTAS — las pizarras de la unidad no
   tienen esquinas redondeadas, y eso mismo la hace destacar entre tanta
   carta redondeada.

   El marco es un border-image de degradado: bandas claras y oscuras
   alternadas es lo que el ojo lee como metal pulido. Con `1` de slice el
   navegador no redondea nada, que es justo lo que queremos. */
.btn-pizarra{display:flex;align-items:center;gap:7px;width:100%;
             padding:9px 12px;position:relative;isolation:isolate;
             border:6px solid transparent;border-radius:9px;
             /* dos capas: la superficie recortada al padding-box y el
                cromado al border-box. Con border-image el degradado se
                aplanaba — `slice:1` toma UN píxel por lado y cada borde
                salía de un color liso. Así el metal recorre el marco
                entero y las bandas claras/oscuras se ven. */
             /* tres capas: el lustre arriba, la superficie al medio, el
                cromado al fondo. El brillo va COMO CAPA DE FONDO y no como
                ::before: un pseudo-elemento o queda detrás del fondo opaco
                (z-index:-1) o tapa el texto (z-index:0). Así se pinta sobre
                la pizarra y bajo las letras, que es donde tiene que ir. */
             /* El reflejo NO puede ser blanco: sobre una pizarra blanca el
                blanco no se ve. Lo que se lee son los filos — una sombra
                fría delante y un filo espectral detrás, con el núcleo
                claro al medio. Igual que un reflejo cruzando un vidrio. */
             background:linear-gradient(112deg,
                          rgba(255,255,255,0) 28%, rgba(108,152,176,.22) 37%,
                          rgba(255,255,255,.98) 46%, rgba(150,116,196,.20) 55%,
                          rgba(96,168,182,.13) 60%,
                          rgba(255,255,255,0) 68%) padding-box,
                        linear-gradient(177deg,#ffffff 0%,#f7fbfc 55%,#e9f1f3 100%) padding-box,
                        linear-gradient(147deg,
                          #ffffff 0%, #b9c6cd 11%, #74838c 21%, #fdfefe 31%,
                          #93a2aa 44%, #5f6d76 55%, #eef3f5 66%,
                          #8e9da5 78%, #d9e2e6 89%, #ffffff 100%) border-box;
             background-size:250% 100%, auto, auto;
             background-position:132% 0, 0 0, 0 0;
             background-repeat:no-repeat;
             box-shadow:0 0 0 1px rgba(60,78,88,.5) inset,
                        0 1px 0 rgba(255,255,255,.95) inset,
                        0 3px 12px rgba(22,36,46,.2);
             font-weight:700;font-size:12.5px}
/* Sin overflow:hidden. Recortaba los protectores de esquina: `overflow`
   recorta al PADDING-BOX, y el ::after vive en el área del borde
   (inset:-6px), o sea completamente fuera. El lustre ya se recorta solo
   —es una capa de fondo con padding-box—, así que no hacía falta. */
/* el lustre recorre la pizarra cada tantos segundos: blanco con un filo
   espectral apenas insinuado — es una pizarra, no una carta holográfica */
@media (prefers-reduced-motion: no-preference){
  .btn-pizarra{animation:lustre 6.5s ease-in-out infinite}}
@keyframes lustre{
  0%,42%{background-position:138% 0, 0 0, 0 0}
  100%{background-position:-48% 0, 0 0, 0 0}}
/* las cuatro tapitas de plástico negro de las esquinas */
/* Los cuatro protectores de esquina. Son PERIFÉRICOS: cada canto de la
   pizarra termina en ellos, así que su borde exterior es el borde de la
   pizarra —de ahí el border-radius, que recorta justo las cuatro esquinas
   de estos cuadrados y deja el resto a escuadra, que es la forma real de
   una tapa de plástico. El marco cromado muere debajo. */
.btn-pizarra::after{content:"";position:absolute;inset:-6px;pointer-events:none;
  border-radius:9px;
  background:
    linear-gradient(to bottom right,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) left top/16px 16px no-repeat,
    linear-gradient(to bottom left,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) right top/16px 16px no-repeat,
    linear-gradient(to top right,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) left bottom/16px 16px no-repeat,
    linear-gradient(to top left,#535d65 0%,#2a333a 30%,#0b0f12 49.3%,transparent 50%) right bottom/16px 16px no-repeat}
.btn-pizarra .gemas{display:flex;gap:3px;margin-left:auto}
/* cuando hay algo comprable, el marco se enciende con un halo — no con
   otra animación: `animation` es una sola propiedad y pisaría el lustre.
   Es un resplandor difuso, no un aro: un aro duro sobre el cromado se
   leía como un segundo marco turquesa encima del metal. */
.btn-pizarra.puede{box-shadow:0 0 0 1px rgba(60,78,88,.5) inset,
                              0 1px 0 rgba(255,255,255,.95) inset,
                              0 0 13px 2px rgba(13,110,120,.34),
                              0 3px 14px rgba(13,110,120,.26)}
.btn-pizarra .flecha{color:var(--ink-3);font-size:14px}

/* ── elegir personaje: la pantalla entera ────────────────────────────
   Era una hoja de abajo con tres tarjetitas y el tablero asomando por
   detrás. La primera decisión de la partida se merece la pantalla: la
   ilustración manda y debajo va la habilidad al tamaño en que se lee.
   Los 3 giran sobre un eje vertical; deslizas y da la vuelta completa. */
.elige-av{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  background:radial-gradient(120% 78% at 50% 0%, #22333c 0%, #101a20 62%, #070d11 100%);
  color:#eaf1f3;padding:calc(18px + env(safe-area-inset-top,0px)) 0
                        calc(14px + env(safe-area-inset-bottom,0px));
  animation:aparecer .24s ease}
.ea-cab{flex:none;padding:0 22px 10px;text-align:center}
.ea-rot{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:#7fb9c1}
.ea-cab h2{margin:6px 0 0;font-family:Petrona,Georgia,serif;font-size:19px;
  font-weight:700;line-height:1.2;text-wrap:balance;color:#fff}
.rueda{position:relative;flex:1 1 auto;min-height:0;margin:6px 0 8px;
       perspective:900px;touch-action:none;overflow:hidden}
.rueda .op.av-carta{position:absolute;left:50%;top:50%;width:266px;
       max-height:100%;
       margin-left:-133px;padding:0;text-align:left;overflow:hidden;
       display:flex;flex-direction:column;
       background:var(--paper);border:1px solid rgba(255,255,255,.14);
       border-radius:18px;box-shadow:0 22px 54px rgba(0,0,0,.5);
       transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
       will-change:transform}
.rueda.viva .op.av-carta{transition:none}
/* también 4:3: el retrato del personaje es la MISMA ilustración que la
   carta, y si aquí se estirara a lo alto habría que dibujar dos */
.av-retrato{position:relative;flex:none;aspect-ratio:4/3;margin:0;
  border-radius:17px 17px 0 0;
  background:linear-gradient(165deg,var(--tinte,#5d818b),#2c4149);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* El retrato de la carta del frente respira: un paneo lentísimo de once
   segundos, escala 1,015 → 1,075. Va sobre la IMAGEN y nunca sobre la
   carta, porque el transform de la carta lo escribe pintarRueda en cada
   arrastre y las dos se pelearían. Arranca en 1,015 y no en 1 para que al
   desplazarse no asome el borde del hueco.

   Y va solo en `.foco` a propósito: es la señal de «esta es la que estás
   mirando», que es justo lo que una rueda con tres cartas necesita. */
@media (prefers-reduced-motion: no-preference){
  .av-carta.foco .av-retrato img{
    animation:av-ken 11s ease-in-out infinite alternate}
}
@keyframes av-ken{
  from{transform:scale(1.015) translate(0,0)}
  to{transform:scale(1.075) translate(-1.6%,-2.2%)}}
.av-retrato img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 22%;display:block}
.av-inicial{font-family:Petrona,Georgia,serif;font-size:118px;font-weight:700;
  color:rgba(255,255,255,.42);line-height:.9;user-select:none;
  text-shadow:0 6px 22px rgba(0,0,0,.28)}

.av-rol{position:absolute;left:8px;top:8px;z-index:2;
        font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;
        letter-spacing:.11em;text-transform:uppercase;color:#fff;
        background:rgba(13,110,120,.9);padding:3px 8px;border-radius:99px}
/* el cuadro de texto: caja propia bajo el retrato, con su filete */
.av-ficha{flex:0 1 auto;min-height:0;overflow:auto;padding:12px 16px 15px;
  background:var(--paper);border-top:1px solid var(--line-2);
  -webkit-overflow-scrolling:touch}
.av-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:23px;
        line-height:1.08;margin:0 0 6px;color:var(--ink)}
.av-habtit{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;
        letter-spacing:.1em;text-transform:uppercase;color:var(--acc);
        margin:0 0 4px}
.av-hab{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.av-frase{font-family:Petrona,Georgia,serif;font-style:italic;font-size:12px;
          color:var(--ink-3);margin-top:9px;line-height:1.35}
.ea-pie{flex:none;padding:0 22px;display:flex;flex-direction:column;
  align-items:center;gap:8px}
.ea-pista{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:#6f8f99}
.ea-pie .btn.pri{width:100%;max-width:320px;margin:2px 0 0}
.rueda-pista{display:flex;gap:5px;justify-content:center;margin:0}
.rueda-pista i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}
.rueda-pista i.on{background:#5fc0cb;width:18px}

/* plegar la mano vive APARTE de la mano: botón redondo, arriba a la
   derecha del abanico, lejos de las cartas y de los otros controles */
.btn-plegar{position:absolute;right:8px;top:-14px;width:42px;height:42px;
       border-radius:99px;background:rgba(255,255,255,.94);z-index:44;
       border:1px solid var(--line);box-shadow:0 4px 14px rgba(22,36,46,.2);
       font-size:16px;line-height:1;color:var(--ink-2);pointer-events:auto}

.grande{background:var(--paper);border-radius:14px;border:1px solid var(--line);
        border-left:5px solid var(--line);padding:14px;
        box-shadow:0 10px 30px rgba(22,36,46,.2)}
.grande .g-cab{display:flex;align-items:center;gap:6px;
               font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
               letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grande .g-cab .ico{font-size:19px}
.grande h3{font-family:Petrona,Georgia,serif;font-size:23px;line-height:1.1;
           margin:6px 0 8px;font-weight:700}
.grande .g-etiqs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.grande .g-etiqs .etiq{font-size:10px;padding:3px 8px}
.grande .g-txt{font-size:13px;line-height:1.45;color:var(--ink-2)}
/* el expediente: las cartas que le pusiste, con su ilustración */
.grande .g-rot{margin:12px 0 5px;font-family:"IBM Plex Mono",monospace;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3)}
.grande .puestas{display:flex;flex-wrap:wrap;gap:5px}
.grande .puesta{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;
  border:1px solid var(--line);border-left:3px solid var(--tc,var(--ink-3));
  border-radius:999px;background:var(--cerca);max-width:100%}
.grande .puesta .pu-arte{width:22px;height:22px;border-radius:50%;overflow:hidden;
  flex:none;background:var(--line-2)}
.grande .puesta .pu-arte img{width:100%;height:100%;object-fit:cover;display:block}
.grande .puesta .pu-ico{width:22px;height:22px;border-radius:50%;flex:none;
  display:grid;place-items:center;color:#fff;background:var(--tc,var(--ink-3))}
.grande .puesta .pu-ico svg{width:13px;height:13px;display:block}
.grande .puesta .pu-nom{font-size:11px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grande .puesta.basura{--tc:var(--basura)}
.grande .puesta.basura .pu-ico{background:var(--basura);font-weight:700}
.grande .g-sop{margin-top:10px;padding:9px 11px;border-radius:9px;
  font-size:11.5px;line-height:1.4;color:var(--acc);
  background:var(--acc-soft);border:1px solid var(--acc)}
.grande .g-contra{margin-top:10px;padding:9px 11px;border-radius:9px;
  font-size:11.5px;line-height:1.4;color:var(--vida);
  background:rgba(192,73,47,.09);border:1px dashed var(--vida)}
.grande .g-warn{margin-top:10px;padding:9px 11px;border-radius:9px;
                background:#fdf4e3;border:1px solid #e6d3a8;font-size:12.5px;
                line-height:1.4;color:#6b4a09}
.grande .g-frase{margin-top:10px;font-family:Petrona,Georgia,serif;
                 font-style:italic;font-size:13px;color:var(--ink-3);line-height:1.4}
.grande-nav{display:flex;align-items:center;gap:8px;margin-top:10px}
.grande-nav .cual{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;
                  font-size:11px;color:var(--ink-3)}
.nav-btn{width:42px;height:42px;border-radius:99px;border:1px solid var(--line);
         background:var(--cerca);font-size:17px;line-height:1;flex:none}
.nav-btn:disabled{opacity:.35}
.carta{width:auto;background:var(--paper);border:1px solid var(--line);
       border-left-width:3px;position:relative;
       border-radius:8px;padding:6px;text-align:left;box-shadow:var(--sombra);
       display:flex;flex-direction:column;gap:2px;min-height:104px;
       transition:transform .14s ease, box-shadow .14s ease;touch-action:none}
/* el índice del naipe: el símbolo del recurso en diagonal —arriba a la
   izquierda y abajo a la derecha, girado, como en una carta de baraja—
   para que asome sea cual sea el lado que tape la carta vecina */
.esq{position:absolute;z-index:7;width:19px;height:19px;
     display:grid;place-items:center;color:#fff;background:var(--tc);
     pointer-events:none}
.esq svg{width:11.5px;height:11.5px;display:block}
.esq.ai{top:-1px;left:-3px;border-radius:8px 0 9px 0}
.esq.bd{bottom:-1px;right:-1px;border-radius:9px 0 8px 0}
.esq.bd svg{transform:rotate(180deg)}
@media (hover:hover){
  .carta:not(.no):not(.sel):hover{transform:translateY(-4px);
    box-shadow:0 6px 16px rgba(22,36,46,.16), 0 2px 5px rgba(22,36,46,.1)}}
.carta.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 8px 18px rgba(13,110,120,.22);
           transform:translateY(-6px)}
/* reparto: las recién robadas entran en cascada */
.carta.nueva{animation:repartir .42s cubic-bezier(.22,1.2,.36,1) backwards;
             animation-delay:calc(var(--i,0)*60ms)}
@keyframes repartir{
  0%{opacity:0;transform:translateY(26px) rotate(2.5deg) scale(.92)}
  100%{opacity:1;transform:none}}
.carta.no{opacity:.38}
.carta.fantasmal{opacity:.25}
/* arte de carta: aparece solo si cartas/arte/<id>.* existe.
   Maquetación B también aquí: a sangre por arriba, disolviéndose en la
   ficha, con el tinte de la ilustración detrás. La mano se ve de reojo,
   así que el hueco es más chato que en la carta grande. */
.carta{--fondo-carta:var(--paper)}
/* ── la ventana del arte: enmarcada, entera y sin difuminar ─────────
   Hasta la v0.57 el arte entraba a sangre y se disolvía en el cuerpo de
   la carta. Se veía bonito con las diez ilustraciones que hay, pero
   escondía el tercio de abajo de todas y obligaba a componer las nuevas
   contra un degradado. Ahora es una ventana con marco: 4:3, la misma
   proporción en TODAS las ranuras, la imagen completa y un filete que
   la separa del papel. Quien dibuje sabe exactamente qué se ve: todo. */
.carta .arte{position:relative;margin:0 0 4px;aspect-ratio:4/3;flex:none;
             background:var(--tinte,var(--lejos));overflow:hidden;
             border:1px solid rgba(22,36,46,.20);border-radius:5px}
.carta .arte img{position:absolute;inset:0;width:100%;height:100%;
                 object-fit:cover;object-position:center;display:block}
/* ── maquetación B en la carta grande ──────────────────────────────
   El arte entra a sangre por arriba y se DISUELVE en el cuerpo, no se
   corta: una línea dura cruzando la carta la parte en dos. El fondo lleva
   el tinte de la propia ilustración, medido de su borde en el generador,
   para que los costados no se vean si la imagen no llena el hueco. */
.grande.conarte{padding:0;overflow:hidden}
.grande .g-arte{position:relative;aspect-ratio:4/3;background:var(--tinte,#0d1417);
                overflow:hidden;margin:0;
                border:1px solid rgba(22,36,46,.20);border-radius:6px}
.grande .g-arte img{position:absolute;inset:0;width:100%;height:100%;
                    object-fit:cover;object-position:center;display:block}
.grande .g-cuerpo{padding:2px 14px 14px}

/* ── el avatar se agranda y se gira ────────────────────────────────
   La habilidad va al FRENTE, no al reverso: al empezar se elige entre tres
   avatares, y con la habilidad escondida habría que girar tres cartas para
   comparar. Lo que hay al reverso es la ilustración completa, sin una
   palabra — full art de verdad, como premio y no como problema. */
.av-esc{perspective:1300px;display:flex;justify-content:center;padding:4px 0 2px}
.av-carta3{--w:min(258px,70vw);width:var(--w);height:calc(var(--w)*1.3968);
           position:relative;font-size:calc(var(--w)*.0721)}
.av-giro{position:absolute;inset:0;transform-style:preserve-3d;
         transition:transform .62s cubic-bezier(.3,.9,.25,1)}
.av-carta3.vuelta .av-giro{transform:rotateY(180deg)}
.av-cara{position:absolute;inset:0;backface-visibility:hidden;
         -webkit-backface-visibility:hidden;border-radius:calc(var(--w)*.045);
         overflow:hidden;background:var(--paper);display:flex;flex-direction:column;
         border:calc(var(--w)*.015) solid var(--acc);
         box-shadow:0 16px 40px rgba(22,36,46,.34)}
.av-cara.dorso{transform:rotateY(180deg);background:var(--tinte,var(--lejos))}
.av-cara .zona{position:relative;aspect-ratio:4/3;flex:none;
               background:var(--tinte,var(--lejos));overflow:hidden}
.av-cara .zona img{position:absolute;inset:0;width:100%;height:100%;
                   object-fit:cover;object-position:center;display:block}
.av-cara .zona .chips{position:absolute;top:.42em;left:.46em;display:flex;gap:.26em}
.av-cara .chip{font-family:"IBM Plex Mono",monospace;font-size:.54em;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;font-style:normal;padding:.2em .48em;
  border-radius:.38em;background:var(--acc);color:#fff;line-height:1.6}
.av-cara .chip.hueco{background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.55)}
.av-cara .panel{flex:1 1 0;padding:.14em .6em .5em;display:flex;flex-direction:column;
                gap:.2em;min-height:0;overflow:hidden}
.av-cara .panel h3{font-family:Petrona,Georgia,serif;font-weight:700;font-size:1em;
                   margin:0;line-height:1.06}
.av-cara .habtit{margin:0;font-family:"IBM Plex Mono",monospace;font-size:.5em;
  font-weight:700;letter-spacing:.07em;color:var(--acc)}
.av-cara .regla{margin:0;font-size:.57em;line-height:1.34;color:var(--ink-2)}
.av-cara.dorso img{position:absolute;inset:0;width:100%;height:100%;
                   object-fit:cover;object-position:center 22%;display:block}
.av-cara.dorso .pieza{position:absolute;inset:auto 0 0;padding:1.2em .8em .8em;color:#fff;
  background:linear-gradient(to top,rgba(6,14,18,.88),rgba(6,14,18,.5) 55%,transparent)}
.av-cara.dorso .pieza h3{font-family:Petrona,Georgia,serif;font-weight:700;
  font-size:1.1em;margin:0;line-height:1.06;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.av-cara.dorso .pieza .frase{margin:.3em 0 0;font-family:Petrona,Georgia,serif;
  font-style:italic;font-size:.62em;line-height:1.28;text-shadow:0 1px 5px rgba(0,0,0,.85)}
/* el lustre solo vive en el reverso: es el lado bonito */
.av-cara.dorso .lustre{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(108deg, transparent 32%, rgba(255,255,255,.05) 42%,
    rgba(255,255,255,.30) 48%, rgba(150,200,255,.16) 54%, transparent 64%);
  background-size:260% 100%;background-position:130% 0}
@media (prefers-reduced-motion: no-preference){
  .av-carta3.vuelta .av-cara.dorso .lustre{animation:av-lustre 4.2s ease-in-out .35s infinite}}
@keyframes av-lustre{0%,40%{background-position:135% 0}100%{background-position:-55% 0}}
@media (prefers-reduced-motion: reduce){ .av-giro{transition:none} }

/* ── el holograma de la carta grande (referencia: Pokémon TCG Pocket) ──
   La carta vive dentro de un escenario con perspectiva y se inclina
   siguiendo el dedo; una luz la recorre. --hx/--hy es dónde está el dedo
   sobre la carta, --hp empuja la banda arcoíris de las iridiscentes. */
.holo-esc{perspective:900px;touch-action:none}
.grande.holo{position:relative;overflow:hidden;
  --hx:50%; --hy:50%; --hp:50%;
  transition:transform .55s cubic-bezier(.2,.9,.3,1), box-shadow .55s ease;
  will-change:transform}
.grande.holo.vivo{transition:box-shadow .3s ease;
  box-shadow:0 22px 48px rgba(22,36,46,.32)}
.grande.holo.giro{transition:transform .14s linear, box-shadow .55s ease}
/* la luz: un claro que sigue al dedo, con sombra ambiental alrededor —
   sobre papel blanco un brillo blanco no se ve, así que lo que se mueve
   es el sombreado */
.holo-brillo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at var(--hx) var(--hy),
    rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 34%,
    rgba(58,84,99,.14) 100%);
  opacity:0;transition:opacity .35s ease}
.grande.holo.vivo .holo-brillo, .grande.holo.giro .holo-brillo{opacity:1}
/* la banda iridiscente: solo las cartas con sistema (×2) y los comodines.
   multiply sobre papel claro = arcoíris pastel, muy de la caja retro */
.holo-arco{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,
    rgba(255,255,255,0) 12%,
    rgba(255,64,150,.5) 30%, rgba(255,205,64,.5) 40%,
    rgba(64,227,180,.5) 50%, rgba(64,150,255,.5) 60%,
    rgba(190,92,255,.5) 70%, rgba(255,255,255,0) 88%);
  background-size:240% 240%;
  background-position:var(--hp) var(--hp);
  mix-blend-mode:multiply;filter:saturate(1.25);
  opacity:0;transition:opacity .35s ease}
.grande.holo.vivo .holo-arco, .grande.holo.giro .holo-arco{opacity:.22}
.grande.holo.iris.vivo .holo-arco, .grande.holo.iris.giro .holo-arco{opacity:.38}
.av-carta .av-arte{height:92px;border-radius:9px;margin:-4px -4px 8px;
                   background-size:cover;background-position:center 20%}
.carta-cab{display:flex;align-items:center;gap:3px}
.carta-cab.libre{min-height:15px;padding:1px 2px 0 15px}
.carta-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
            letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.carta-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.etiq{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;padding:1.5px 4px;border-radius:99px;
      border:1px solid currentColor;align-self:flex-start;white-space:nowrap}
.etiq.w{color:var(--warn)} .etiq.s{color:var(--ok)}
.etiq.x2{color:var(--acc)} .etiq.r{color:var(--quir)}
.etiq.sop{color:var(--acc);font-weight:800}
.carta-pie{margin-top:auto;font-size:8.5px;color:var(--ink-3);line-height:1.2;
  padding-right:15px}   /* el sello de abajo a la derecha */

/* el naipe que sigue al dedo */
.fantasma{position:fixed;left:0;top:0;z-index:90;pointer-events:none;
          width:104px;opacity:.94;transform-origin:center;
          box-shadow:0 12px 28px rgba(22,36,46,.35);border-radius:8px;
          rotate:-4deg}

.acciones{display:flex;gap:6px;padding:0 10px 10px}
.pie .acciones .btn{box-shadow:0 4px 14px rgba(22,36,46,.18)}
.pie .acciones .btn:not(.pri){background:rgba(246,250,250,.95);
     -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* ── el fondo vivo de la pantalla de inicio ────────────────────────
   Vive FUERA de #app, que se vacía entero en cada render: si el <video>
   estuviera adentro volvería a empezar cada vez que se repinta el menú.
   Solo existe mientras no hay partida. */
/* Sin z-index a propósito: con uno, #portada crearía contexto de apilado
   y el botón de sonido quedaría atrapado bajo .app, invisible al dedo.
   Queda detrás por orden en el documento, que basta. */
/* v0.57 · el clip entra por ANCHO, no a sangre.
   El clip es 9:16 y la pantalla del teléfono es 9:19,5: llenándola con
   `cover` se perdía el 18 % de cada costado —el cartel de piso mojado y
   el carro del trapero quedaban cortados por la mitad— y la escena se
   veía con lupa. Anclado arriba y escalado al ancho se ve la escena
   entera; abajo sobran unos 150 px que rellena el papel de la mesa, y ahí
   caen justo los tres cuadrados del menú. */
#portada{position:fixed;inset:0;pointer-events:none;
         background:var(--mesa) center top/100% auto no-repeat}
/* Sin partida se vacía, PERO hay que esconderlo entero: es fijo y opaco,
   y `.app` no está posicionada, así que su piso y las camas se pintan por
   DEBAJO. Vaciar los hijos no basta — el contenedor seguía tapando. */
#portada[hidden]{display:none}
#portada video{position:absolute;left:0;top:0;right:0;bottom:auto;
               width:100%;height:auto;display:block}
/* El clip deja el 40% de abajo vacío a propósito, pero el piso mojado es
   lo más claro del cuadro y el menú igual necesita apagarlo hacia el
   papel para leerse. */
/* El velo hace dos cosas: aclara apenas el techo, donde va el logotipo, y
   cierra el canto de abajo del clip contra el papel de la mesa para que
   el corte no se vea como una línea. */
#portada .velo{position:absolute;inset:0;background:
   linear-gradient(to bottom, rgba(242,247,248,.40) 0%,
                              rgba(242,247,248,0) 17%),
   linear-gradient(to bottom, rgba(223,231,234,0) 0%,
                              rgba(223,231,234,0) 62%,
                              rgba(223,231,234,.30) 74%,
                              rgba(223,231,234,.72) 82%,
                              var(--mesa) 88%)}
/* Cuelga de <body>, no de #portada: `position:fixed` crea contexto de
   apilado, así que un hijo de #portada no puede subir sobre .app por más
   z-index que le pongas — quedaba dibujado pero intocable. */
.son-portada{position:fixed;z-index:6;
   top:calc(10px + env(safe-area-inset-top,0px));
   right:12px;width:38px;height:38px;border-radius:50%;
   border:1px solid rgba(60,78,88,.22);background:rgba(255,255,255,.82);
   backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
   font-size:16px;line-height:1;cursor:pointer;
   box-shadow:0 2px 8px rgba(22,36,46,.14)}
/* mientras hay portada, el piso de la unidad estorba: es otro escenario */
body.con-portada .app{background:none;position:relative;z-index:1}
/* Con portada, el menú baja: el auxiliar está en el tercio de arriba y si
   los botones empiezan donde empezaban le tapan la cara. Y se vuelven
   vidrio esmerilado, para que el pasillo se siga viendo por detrás. */
body.con-portada .portada{padding-top:18px}
/* con el dibujo detrás, el logotipo se achica: a 310 px tapaba las tres
   salas de vidrio, que son la mitad de la escena, y a 252 seguía cayendo
   sobre el letrero de UCI */
body.con-portada .portada h1 .logo{max-width:222px}
/* Bajo un logotipo tan grande el texto queda sobre el pasillo y no se lee.
   El subtítulo y el párrafo se juntan en una sola placa esmerilada —la
   misma de los botones— para que sigan siendo legibles sin taparlo todo. */
body.con-portada .portada .sub{background:rgba(255,255,255,.74);
   backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
   margin:6px -4px 0;padding:9px 12px 5px;border-radius:13px 13px 0 0;color:var(--ink-2)}
body.con-portada .portada p{background:rgba(255,255,255,.74);
   backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
   margin:0 -4px;padding:4px 12px 11px;border-radius:0 0 13px 13px;
   color:var(--ink);text-align:center}
/* Sin partida el inicio es una columna de alto completo: el logotipo
   arriba, el aire —donde se ve el dibujo— estirándose en medio, y el menú
   apoyado en el filo de abajo. Antes el menú arrancaba a 8vh fijos y en
   una pantalla corta le caía encima al auxiliar. */
body.con-portada .inicio{display:flex;flex-direction:column;
   min-height:100vh;min-height:100dvh}
body.con-portada .inicio .aire-inicio{flex:1 1 0;min-height:70px}
body.con-portada .inicio .portada:first-child{padding-bottom:0}
body.con-portada .opciones{margin-bottom:6px}
body.con-portada .pastillas{margin-bottom:9px}
body.con-portada .opciones .op{background:rgba(255,255,255,.80);
   backdrop-filter:blur(9px) saturate(1.15);
   -webkit-backdrop-filter:blur(9px) saturate(1.15);
   border-color:rgba(60,78,88,.16)}

/* ── la mano-selector (v0.55): miniaturas al filo, lectura en el zoom ─
   La mano deja de intentar ser legible en chico — eso la hacía enorme.
   Es un atril de miniaturas con scroll nativo; tocas una y se abre la
   carta grande de siempre (con ‹ › para hojear y su Jugar esta). */
.selector{pointer-events:auto;display:flex;gap:6px;align-items:flex-end;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.95);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  scrollbar-width:none}
.selector::-webkit-scrollbar{display:none}
.mini-c{position:relative;width:47px;height:61px;flex:none;border-radius:6px;
  overflow:hidden;border:1.5px solid var(--line);background:var(--tinte,var(--cerca));
  padding:0;scroll-snap-align:center;box-shadow:0 2px 6px rgba(22,36,46,.14);
  transition:transform .15s ease, box-shadow .15s ease}
.mini-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 18%;display:block}
.mini-c .tp{position:absolute;top:0;left:0;right:0;height:4px;background:var(--tc);z-index:2}
.mini-c .mini-ico{position:absolute;inset:0;display:grid;place-items:center;
  font-size:19px}
.mini-c .mini-nom{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;
  font-size:6.5px;font-weight:700;line-height:1.15;color:var(--ink);
  background:linear-gradient(to top,rgba(255,255,255,.94) 55%,transparent);
  text-align:center;max-height:26px;overflow:hidden}
.mini-c.sel{transform:translateY(-7px);border-color:var(--acc);
  box-shadow:0 0 0 2px var(--acc),0 8px 16px rgba(13,110,120,.3)}
.mini-c.no{opacity:.45}
.mini-c.nueva{animation:repartir .42s cubic-bezier(.22,1.2,.36,1) backwards;
  animation-delay:calc(var(--i,0)*50ms)}

/* ── el zócalo (v0.55): tu identidad al centro-abajo ─────────────────
   El retrato con el ANILLO de indicaciones alrededor: tres segmentos que
   se apagan al colocar — el contador vive sobre quien gasta, no escondido
   en la barra de la mano. El poder ⚡ cuelga del hombro y late mientras
   está disponible. Adaptado de Battlegrounds, con la ropa de la unidad. */
.zocalo{position:relative;height:92px;margin-top:6px}
.aro-av{position:absolute;left:50%;transform:translateX(-50%);bottom:0;
  width:82px;height:82px;z-index:42;border:0;padding:0;background:none;
  cursor:pointer;font:inherit}
.aro-av::before{content:"";position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from -84deg,
    var(--seg1,var(--line)) 0deg 108deg, transparent 108deg 120deg,
    var(--seg2,var(--line)) 120deg 228deg, transparent 228deg 240deg,
    var(--seg3,var(--line)) 240deg 348deg, transparent 348deg 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px))}
.aro-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;
  object-position:center 12%;border:3px solid var(--paper);display:block;
  box-shadow:0 6px 16px rgba(22,36,46,.28)}
.aro-av .ini{width:100%;height:100%;border-radius:50%;display:grid;
  place-items:center;background:var(--acc);color:#fff;font-family:Petrona,Georgia,serif;
  font-weight:700;font-size:30px;border:3px solid var(--paper);
  box-shadow:0 6px 16px rgba(22,36,46,.28)}
@media (prefers-reduced-motion: no-preference){
  .aro-av img,.aro-av .ini{animation:av-respira 5.2s ease-in-out infinite}}
@keyframes av-respira{0%,100%{transform:scale(1)}50%{transform:scale(1.02) translateY(-1px)}}
.aro-av .ind{position:absolute;left:50%;transform:translateX(-50%);top:-16px;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;
  color:var(--ink-2);background:var(--paper);padding:2px 8px;border-radius:999px;
  white-space:nowrap;box-shadow:0 2px 6px rgba(22,36,46,.18)}
.poder-av{position:absolute;left:calc(50% + 34px);bottom:52px;width:36px;height:36px;
  border-radius:50%;background:var(--acc);color:#fff;border:3px solid var(--paper);
  display:grid;place-items:center;font-size:15px;z-index:43;
  box-shadow:0 5px 14px rgba(13,110,120,.4)}
.poder-av.gastado{background:var(--line);color:var(--ink-3);box-shadow:none}
@media (prefers-reduced-motion: no-preference){
  .poder-av.vivo{animation:poder-late 2.4s ease-in-out infinite}}
@keyframes poder-late{
  0%,100%{box-shadow:0 5px 14px rgba(13,110,120,.4),0 0 0 0 rgba(13,110,120,.5)}
  70%{box-shadow:0 5px 14px rgba(13,110,120,.4),0 0 0 10px rgba(13,110,120,0)}}
.suml{position:absolute;left:calc(50% - 74px);bottom:52px;z-index:42;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;
  color:var(--ink-2);background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:4px 8px;box-shadow:var(--sombra)}

/* los emotes: tocas tu retrato y aparecen las burbujas; eliges una o
   tocas de nuevo y se van. La última es la frase de tu propio avatar. */
.burb-em{position:absolute;z-index:44;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:6px 10px;
  font-size:11.5px;font-weight:600;box-shadow:0 6px 16px rgba(22,36,46,.22);
  white-space:nowrap;cursor:pointer;font-family:inherit}
.burb-em.fr{font-family:Petrona,Georgia,serif;font-style:italic;font-weight:400;
  white-space:normal;max-width:150px;text-align:left;line-height:1.25}
.burb-em::after{content:"";position:absolute;bottom:-5px;left:18px;width:9px;
  height:9px;background:var(--paper);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);transform:rotate(45deg)}
/* la burbuja viva: lo que acabas de decir, o lo que contesta el rival */
.burb-viva{position:absolute;z-index:46;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:7px 11px;
  font-size:12px;font-weight:600;box-shadow:0 8px 20px rgba(22,36,46,.26);
  max-width:220px;line-height:1.3;animation:burb-entra .22s cubic-bezier(.2,1.1,.3,1)}
.burb-viva::after{content:"";position:absolute;bottom:-5px;left:22px;width:9px;
  height:9px;background:var(--paper);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);transform:rotate(45deg)}
.burb-viva.rival{animation:none}
.rival-chip{position:relative}
.rival-chip .burb-viva{left:8px;top:calc(100% + 8px);bottom:auto}
.rival-chip .burb-viva::after{bottom:auto;top:-5px;transform:rotate(225deg)}
@keyframes burb-entra{0%{opacity:0;transform:translateY(8px) scale(.9)}
  100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.burb-viva{animation:none}}

/* Fin de Guardia: el botón redondo de la esquina opuesta al avatar */
/* pointer-events:auto obligatorio: .pie es pointer-events:none y cada
   hijo tocable lo reactiva — sin esto el botón se dibuja pero no se toca */
.btn-fin{position:fixed;right:max(10px,calc(50% - 290px));bottom:74px;z-index:40;
  pointer-events:auto;
  width:66px;height:66px;border-radius:50%;background:var(--acc);color:var(--acc-ink);
  border:3px solid var(--paper);font:inherit;font-weight:700;font-size:11px;

  box-shadow:0 7px 18px rgba(13,110,120,.4)}

/* los rieles: Urgencias y la Guardia apoyadas en el borde de la mesa —
   antes eran texto flotando en la franja del centro */
.app.partida{padding-left:24px;padding-right:24px}
.riel-lat{position:fixed;top:62px;bottom:0;width:21px;z-index:4;

.riel-lat.izq{left:max(0px,calc(50% - 300px));border-radius:0 10px 10px 0}
.riel-lat.der{right:max(0px,calc(50% - 300px));border-radius:10px 0 0 10px}
.riel-lat .mazo{width:14px;height:21px;border-radius:3px;background:var(--paper);
  border:1px solid var(--line);box-shadow:1.5px 1.5px 0 rgba(22,36,46,.12);flex:none}
.riel-lat .cnt{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;

.riel-lat .eti{writing-mode:vertical-rl;font-family:"IBM Plex Mono",monospace;

  writing-mode:vertical-rl;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}

/* ══ maqueta B · campo partido y mano desplegable ═══════════════════
   Todo cuelga de body[data-maq="b"]: la maqueta A no se toca ni un px.
   La Pizarra es el eje — las dos mitades son flex:1 1 0, así que miden
   exactamente lo mismo pase lo que pase con el contenido. */
body[data-maq="b"] .app{padding-bottom:0}
body[data-maq="b"] .app.partida{height:100vh;height:100dvh;overflow:hidden}

/* EL ESPEJO EXACTO. Las dos mitades son flex:1 1 0 y por dentro llevan la
   MISMA estructura —rótulo · camas · aire · repisa— sólo que la de arriba
   va en column-reverse. Con la fila de camas de alto fijo y las dos repisas
   del mismo alto, el aire sale igual por construcción y no hay que cuadrar
   nada a mano. */
body[data-maq="b"] .zona.suya{flex:1 1 0;min-height:0;display:flex;
  flex-direction:column-reverse;padding:0 10px 5px;
  background:linear-gradient(180deg,rgba(205,217,222,.92),rgba(213,224,228,.45) 66%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 -10px 16px -14px rgba(22,36,46,.35)}
body[data-maq="b"] .zona.suya .grupo-suyo{display:contents}
body[data-maq="b"] .zona.suya .aire{flex:1 1 0;min-height:0}
body[data-maq="b"] .zona.cerca .aire{flex:1 1 0;min-height:0}
/* el ambiente dibujado pasa por detrás de los rótulos: un halo de papel
   para que el texto gane siempre, caiga donde caiga del mostrador */
body[data-maq="b"] .rot-lado{font-family:"IBM Plex Mono",monospace;font-size:7.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;
  text-shadow:0 0 5px var(--paper),0 0 5px var(--paper),0 1px 0 var(--paper)}
body[data-maq="b"] .repisa .qn b,
body[data-maq="b"] .repisa .qn span{
  text-shadow:0 0 6px var(--paper),0 0 6px var(--paper),0 1px 0 var(--paper)}
body[data-maq="b"] .aro-av .ind{box-shadow:0 2px 6px rgba(22,36,46,.2),
  0 0 0 3px rgba(255,255,255,.55)}
body[data-maq="b"] .rot-lado b{color:var(--ink-2)}

/* la repisa: el espejo de tu zócalo */
body[data-maq="b"] .repisa{position:relative;flex:none;height:84px;display:flex;
  align-items:center;gap:7px;padding:8px 0 2px}
body[data-maq="b"] .aro-suyo{position:relative;width:46px;height:46px;flex:none}
body[data-maq="b"] .aro-suyo::before{content:"";position:absolute;inset:-5px;
  border-radius:50%;
  background:conic-gradient(from -84deg,
    var(--seg1) 0deg 108deg, transparent 108deg 120deg,
    var(--seg2) 120deg 228deg, transparent 228deg 240deg,
    var(--seg3) 240deg 348deg, transparent 348deg 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
body[data-maq="b"] .aro-suyo img{width:100%;height:100%;border-radius:50%;
  object-fit:cover;object-position:center 12%;border:2.5px solid var(--paper);
  display:block;box-shadow:0 4px 12px rgba(22,36,46,.26)}
body[data-maq="b"] .aro-suyo .ini{width:100%;height:100%;border-radius:50%;
  display:grid;place-items:center;background:var(--cerca);
  border:2.5px solid var(--paper);font-family:Petrona,Georgia,serif;
  font-size:19px;font-weight:700;color:var(--ink-2)}
body[data-maq="b"] .repisa .qn{min-width:0;line-height:1.14}
body[data-maq="b"] .repisa .qn b{font-family:Petrona,Georgia,serif;font-size:13px;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-maq="b"] .repisa .qn span{font-family:"IBM Plex Mono",monospace;
  font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
body[data-maq="b"] .repisa .poder-suyo{width:26px;height:26px;border-radius:50%;

  box-shadow:0 3px 8px rgba(22,36,46,.2)}
body[data-maq="b"] .repisa .peligro{font-family:"IBM Plex Mono",monospace;
  font-size:8.5px;font-weight:700;color:#fff;background:var(--vida);
  border-radius:6px;padding:3px 6px;flex:none}
body[data-maq="b"] .repisa .dato{font-family:"IBM Plex Mono",monospace;
  font-size:9px;color:var(--ink-2);background:var(--paper);
  border:1px solid var(--line);border-radius:6px;padding:2px 5px;flex:none}
body[data-maq="b"] .repisa .burb-viva{left:8px;top:calc(100% + 4px);bottom:auto}
body[data-maq="b"] .repisa .burb-viva::after{bottom:auto;top:-5px;transform:rotate(225deg)}
/* su mano: dorsos, arriba a la derecha — el espejo de tu mazo */
body[data-maq="b"] .mano-suya{margin-left:auto;position:relative;

body[data-maq="b"] .mano-suya i:nth-child(1){left:0;transform:rotate(10deg)}

body[data-maq="b"] .mano-suya i:nth-child(3){left:18px;transform:rotate(0deg)}
body[data-maq="b"] .mano-suya i:nth-child(4){left:27px;transform:rotate(-5deg)}
body[data-maq="b"] .mano-suya i:nth-child(5){left:36px;transform:rotate(-10deg)}
body[data-maq="b"] .mano-suya .n{position:absolute;right:-5px;bottom:-6px;z-index:3;

/* tu mitad: camas contra la Pizarra, zócalo abajo del todo */
body[data-maq="b"] .zona.cerca{flex:1 1 0;min-height:0;padding:4px 10px 0}

  place-items:center;font-size:30px;opacity:.6;
  filter:drop-shadow(0 2px 4px rgba(22,36,46,.2))}
/* su cama, espejada: los datos quedan del lado de la Pizarra */
body[data-maq="b"] .cama.suya{display:flex;flex-direction:column-reverse}
body[data-maq="b"] .cama.suya .cama-arte{margin:4px 0 0}

/* ── el mazo compacto y su abanico ──────────────────────────────── */
body[data-maq="b"] .mazo-mano{position:fixed;z-index:46;pointer-events:none;
  right:max(8px,calc(50% - 292px));

body[data-maq="b"] .mazo-btn i:nth-child(1){right:18px;transform:rotate(-9deg)}
body[data-maq="b"] .mazo-btn i:nth-child(2){right:9px;transform:rotate(-4deg)}

body[data-maq="b"] .mazo-btn .n{position:absolute;right:-4px;top:-9px;z-index:3;
  min-width:24px;height:24px;border-radius:99px;background:var(--paper);
  border:2px solid var(--acc);color:var(--acc);
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 2px 7px rgba(22,36,46,.22)}
body[data-maq="b"] .mazo-btn .lab{display:none}
