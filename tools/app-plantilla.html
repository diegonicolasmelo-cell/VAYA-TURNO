<title>Guardia Virtual</title>

<style>
/* Tablero de una sola cara: modo claro fijo a propósito — se juega bajo la
   luz del control de enfermería, no en la oscuridad. Nada hereda el tema
   del navegador; todos los colores se pintan explícitos. */
:root{
  --mesa:#dfe7ea; --lejos:#d5e0e4; --cerca:#f2f7f8; --paper:#ffffff;
  --ink:#16242e; --ink-2:#4c6675; --ink-3:#87a0ad;
  --line:#c7d6db; --line-2:#e3ecef;
  --acc:#0d6e78; --acc-ink:#ffffff; --acc-soft:#d5e9eb;
  --vida:#c0492f; --ok:#237a5b; --warn:#96660d; --basura:#7f52bb;
  --resp:#3d7ea6; --card:#b03d29; --neuro:#7a5ba6; --metab:#2f8f6b; --quir:#8a6a2f;
  --sombra:0 1px 2px rgba(22,36,46,.08), 0 3px 10px rgba(22,36,46,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--mesa);color:var(--ink);
     font-family:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
     font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;
     overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;
     display:flex;flex-direction:column;background:var(--mesa)}

/* ── barra superior ─────────────────────────────────────────────────── */
.estado{flex:none;background:var(--paper);border-bottom:1px solid var(--line);
        padding:7px 10px;display:flex;align-items:center;gap:8px}
.ronda{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
       color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ronda b{color:var(--ink);font-size:14px}
.fase-chip{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
           background:var(--acc);color:var(--acc-ink);padding:3px 7px;border-radius:99px;
           white-space:nowrap}
.espacio{flex:1}
.icono-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
           background:var(--cerca);font-size:15px;line-height:1;flex:none}

/* ── aviso de fase ──────────────────────────────────────────────────── */
.guia{flex:none;background:var(--acc-soft);border-bottom:1px solid var(--line);
      padding:7px 10px;font-size:12.5px;line-height:1.3}

/* ── zonas del tablero ──────────────────────────────────────────────── */
.zona{padding:7px 10px}
.zona.lejos{background:var(--lejos);border-bottom:1px solid var(--line)}
.zona.cerca{background:var(--cerca);flex:1;display:flex;flex-direction:column}
.jugador-linea{display:flex;align-items:center;gap:7px;margin-bottom:6px;
               font-size:11px;color:var(--ink-2)}
.jugador-linea b{color:var(--ink);font-family:"Archivo Narrow",sans-serif;
                 font-size:13px;font-weight:700}
.marca{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
       font-variant-numeric:tabular-nums;white-space:nowrap}
.marca.al{color:var(--ok)} .marca.cr{color:var(--muerte,#5d6b74)}
.marca.su{color:var(--warn)}

/* la mesa: 3 columnas, igual que el tablero de papel */
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}

/* ── línea de mesa ──────────────────────────────────────────────────── */
.mesa-linea{flex:none;background:var(--mesa);padding:5px 10px;
            display:flex;align-items:center;gap:8px;
            font-family:"IBM Plex Mono",monospace;font-size:9.5px;
            letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
            border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mesa-linea .sep{flex:1;height:1px;background:var(--line)}

/* ── tira de tu zona: lo que en la mesa real está a tu lado ─────────── */
.tira{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;
      padding-top:8px;border-top:1px dashed var(--line)}
.ficha{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
       letter-spacing:.04em;padding:4px 8px;border-radius:99px;
       background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.ficha.sum{color:var(--warn);border-color:var(--warn)}
.ficha.pro{color:var(--acc);border-color:var(--acc)}
.ficha b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.tira .vacio{font-size:10px;color:var(--ink-3);font-style:italic}

/* ── carta de cama ──────────────────────────────────────────────────── */
.cama{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px 6px 6px 8px;position:relative;overflow:hidden;
      box-shadow:var(--sombra);text-align:left;width:100%;display:block}
.cama.vacia{background:transparent;border-style:dashed;box-shadow:none;
            color:var(--ink-3);text-align:center;padding:14px 4px;font-size:10px;
            letter-spacing:.1em;text-transform:uppercase;min-height:64px}
.cama.est{border-color:var(--ok);background:#f4fbf8}
.cama.blanco{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft),var(--sombra);
             cursor:pointer}
.cama.blanco:hover{transform:translateY(-1px)}
.raya{position:absolute;left:0;top:0;bottom:0;width:3px}
.pnom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11.5px;
      line-height:1.12;min-height:26px;display:block}
.grav{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
      color:var(--ink-3);display:block;margin-top:2px}
.corazones{display:flex;gap:1.5px;align-items:center;margin:4px 0 5px;flex-wrap:wrap}
.hp{width:5px;height:9px;border-radius:1.5px;background:var(--vida);flex:none}
.hp.off{background:var(--line)}
.hpnum{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--ink-2);
       margin-left:3px;font-variant-numeric:tabular-nums}
.reqs{display:flex;flex-direction:column;gap:2px}
.req{display:flex;align-items:center;gap:3px;font-size:9px;line-height:1}
.req.listo{opacity:.42}
.req .ic{font-size:9.5px;width:12px;flex:none}
.casillas{display:flex;gap:1.5px;flex-wrap:wrap}
.cas{width:6px;height:6px;border-radius:1.5px;border:1px solid var(--ink-3);flex:none}
.cas.full{background:var(--acc);border-color:var(--acc)}
.cas.extra{background:var(--ink-3);border-color:var(--ink-3)}
.sellos{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.sello{font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
       padding:1.5px 4px;border-radius:99px;border:1px solid currentColor;
       white-space:nowrap}
.sello.ok{color:var(--ok)} .sello.bas{color:var(--basura)}
.sello.esc{color:var(--acc)} .sello.pro{color:var(--ok);border-style:dashed}
.cama-btn{display:block;width:100%;margin-top:5px;padding:5px 4px;border-radius:6px;
          background:var(--acc);color:var(--acc-ink);font-size:10px;font-weight:700;
          letter-spacing:.04em;text-align:center}
.cama-btn.sec{background:var(--cerca);color:var(--ink-2);border:1px solid var(--line)}

/* ── pizarra: las 3 cartas del turno ────────────────────────────────── */
.pizarra-zona{flex:none;background:var(--mesa);padding:7px 10px;
              border-top:1px solid var(--line)}
.pizarra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prot{background:var(--paper);border:1px solid var(--line);border-radius:8px;
      padding:6px;text-align:left;box-shadow:var(--sombra);display:flex;
      flex-direction:column;gap:3px;min-height:96px}
.prot.no{opacity:.45}
.prot-cab{display:flex;align-items:baseline;gap:4px}
.coste{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--acc)}
.prot-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
           letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prot-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.prot-txt{font-size:8.5px;line-height:1.25;color:var(--ink-2)}

/* ── pie: mano + acciones ───────────────────────────────────────────── */
.pie{flex:none;position:sticky;bottom:0;background:var(--paper);
     border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(22,36,46,.09)}
.mano-rot{padding:8px 10px 0;font-size:9.5px;font-weight:700;letter-spacing:.11em;
          text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.mano-rot span{flex:1;height:1px;background:var(--line-2)}
.mano{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 8px;
      -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.mano::-webkit-scrollbar{height:5px}
.mano::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.carta{flex:none;width:104px;background:var(--paper);border:1px solid var(--line);
       border-radius:8px;padding:6px;text-align:left;scroll-snap-align:start;
       box-shadow:var(--sombra);display:flex;flex-direction:column;gap:2px;
       min-height:112px;transition:transform .12s ease}
.carta.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);
           transform:translateY(-6px)}
.carta.no{opacity:.38}
.carta-cab{display:flex;align-items:center;gap:3px}
.carta-ic{font-size:12px}
.carta-tipo{font-family:"IBM Plex Mono",monospace;font-size:7.5px;font-weight:600;
            letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.carta-nom{font-family:Petrona,Georgia,serif;font-weight:700;font-size:11px;line-height:1.15}
.etiq{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;padding:1.5px 4px;border-radius:99px;
      border:1px solid currentColor;align-self:flex-start;white-space:nowrap}
.etiq.w{color:var(--warn)} .etiq.s{color:var(--ok)}
.etiq.x2{color:var(--acc)} .etiq.r{color:var(--quir)}
.carta-pie{margin-top:auto;font-size:8.5px;color:var(--ink-3);line-height:1.2}

.acciones{display:flex;gap:6px;padding:0 10px 10px}
.btn{flex:1;padding:11px 8px;border-radius:8px;border:1px solid var(--line);
     background:var(--cerca);font-weight:600;font-size:13px;text-align:center}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.chico{flex:none;padding:7px 10px;font-size:11.5px}

/* ── hoja inferior y modales ────────────────────────────────────────── */
.velo{position:fixed;inset:0;z-index:60;background:rgba(14,26,33,.6);
      display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--paper);border-radius:16px 16px 0 0;max-width:600px;width:100%;
       max-height:88vh;overflow-y:auto;padding:16px 14px 22px;
       box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.modal h2{font-family:"Archivo Narrow",sans-serif;font-size:16px;margin:0 0 4px}
.modal p{font-size:13px;color:var(--ink-2);margin:0 0 12px;line-height:1.4}
.tirador{width:34px;height:4px;border-radius:99px;background:var(--line);
         margin:0 auto 12px}
.opciones{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.op{width:100%;text-align:left;padding:10px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--cerca)}
.op b{display:block;font-family:Petrona,Georgia,serif;font-size:14.5px}
.op small{color:var(--ink-2);font-size:11px;display:block;margin-top:2px}
.op.sel{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.marcador{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}
.mtile{background:var(--cerca);border:1px solid var(--line);border-radius:9px;padding:8px}
.mtile .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;
          font-variant-numeric:tabular-nums;line-height:1}
.mtile .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
          color:var(--ink-3);margin-top:3px}
.bloque{margin-bottom:14px}
.bloque h3{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
           color:var(--ink-3);margin:0 0 6px}
.log{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.45;
     max-height:200px;overflow-y:auto;color:var(--ink-2);
     border:1px solid var(--line);border-radius:8px;padding:8px}
.log div{padding:1.5px 0;border-bottom:1px solid var(--line-2)}
.log .r{color:var(--ink);font-weight:600;padding-top:6px}
.log .m{color:var(--vida)} .log .a{color:var(--ok)}
.nota{font-size:11px;color:var(--ink-3);line-height:1.4}

/* ── cortina de traspaso ────────────────────────────────────────────── */
.cortina{position:fixed;inset:0;z-index:70;background:var(--acc);color:#fff;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:14px;padding:24px;text-align:center}
.cortina h2{font-family:Petrona,Georgia,serif;font-size:26px;margin:0}
.cortina p{font-size:14px;opacity:.85;margin:0;max-width:22em}
.cortina .btn{flex:none;background:#fff;color:var(--acc);border-color:#fff;
              padding:13px 28px;font-size:15px}

/* ── inicio y final ─────────────────────────────────────────────────── */
.portada{padding:30px 16px 20px}
.portada h1{font-family:Petrona,Georgia,serif;font-weight:700;font-size:30px;
            line-height:1.05;margin:0}
.portada .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
              letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
              margin-top:6px}
.portada p{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:14px 0 0}
.pie-app{padding:12px 14px 22px;font-size:10.5px;color:var(--ink-3);
         line-height:1.4;text-align:center}
</style>

<script>
"use strict";
const D = /*__DATOS__*/{};

/* ══ constantes de reglas (v0.30 · REGLAMENTO-v030.md) ══════════════ */
const TIPOS = ["IMAGEN","FARMACOS","PERSONAL","PROCEDIMIENTOS"];
const IC = {IMAGEN:"🩻",FARMACOS:"💊",PERSONAL:"🧑‍⚕️",PROCEDIMIENTOS:"💉",COMODIN:"🃏"};
const TNOM = {IMAGEN:"Imagen",FARMACOS:"Fármacos",PERSONAL:"Personal",
              PROCEDIMIENTOS:"Procedim.",COMODIN:"Comodín"};
const SIS = {RESP:["🫁 Resp","var(--resp)"],CARD:["🫀 Card","var(--card)"],
             NEURO:["🧠 Neuro","var(--neuro)"],METAB:["🧪 Metab","var(--metab)"],
             QUIR:["🔪 Quir","var(--quir)"]};
const FASES = [["entrega","Entrega de Turno"],["pasillo","El Pasillo"],
               ["visita","Pase de Visita"],["fin","Fin de Guardia"]];
const RONDAS = 8, CAMAS = 3, ROBO = 4, MANO_MAX = 5, COLOCACIONES = 3;
const CLAVE = "vaya-turno-v030-partida";

/* ══ estado ═════════════════════════════════════════════════════════ */
let G = null;          // partida
let UI = {sel:null, selProt:null, modal:null, marcarDescartes:[]};

const uid = (()=>{ let n=0; return ()=> ++n; })();
function baraja(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function copiasDe(lista){ const out=[]; lista.forEach(c=>{ for(let i=0;i<(+c.copias||1);i++) out.push({...c,uid:uid()}); }); return out; }

/* ══ construir partida ══════════════════════════════════════════════ */
function nuevaPartida(modo, nombres){
  const mazoP = baraja(copiasDe(D.pacientes));
  const mazoG = baraja(copiasDe(D.recursos));
  const mazoA = baraja(copiasDe(D.acciones));
  const avat  = baraja(D.personajes.slice());
  const jug = nombres.map((nom,i)=>({
    nombre:nom, ia: modo==="ia" && i===1,
    avatar: avat[i], mano:[], camas:[null,null,null],
    altas:[], muertos:[], sumarios:0,
    protocolos:[], coloc:COLOCACIONES, compraHecha:false, accionHecha:false,
    roboMod:0, sinFarmacos:false, colocMod:0, habUsada:false
  }));
  G = { modo, ronda:1, turno:0, fase:0, mazoP, mazoG, descG:[], mazoA, descA:[],
        pizarra:[], sumariosLibres:6, log:[], fin:false, pendiente:null,
        sinAcciones:false, iniciado:false };
  // 2 pacientes por jugador, la tercera cama parte vacía
  jug.forEach(j=>{ for(let i=0;i<2;i++) j.camas[i] = nuevaCama(G.mazoP.pop()); });
  G.jug = jug;
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  for(let i=0;i<3;i++){ const a=G.mazoA.pop(); if(a) G.pizarra.push(a); }
  jug.forEach(j=>{ for(let i=0;i<ROBO;i++) robar(j); });
  anota("r", `RONDA 1 · empieza ${jug[0].nombre}`);
  G.iniciado = true;
  entrarFase(0);
}

function nuevaCama(p){
  if(!p) return null;
  return { p, uid:uid(), vida:p.vida, vidaMax:p.vida,
           pide:{...p.pide}, tiene:{IMAGEN:0,FARMACOS:0,PERSONAL:0,PROCEDIMIENTOS:0},
           puestos:[], basura:[], protege:[], estable:false, estableDesde:null,
           atacada:false, escudo:false, extraDeterioro:0 };
}

function robar(j){
  if(!G.mazoG.length){
    if(!G.descG.length) return null;
    G.mazoG = baraja(G.descG); G.descG = [];
    anota("", "Se acabó el Mazo de Guardia: se baraja el descarte.");
  }
  const c = G.mazoG.pop(); if(c) j.mano.push(c); return c;
}
function anota(cls, txt){ G.log.push({cls, txt, r:G.ronda}); }

/* ══ consultas ══════════════════════════════════════════════════════ */
const yo   = ()=> G.jug[G.turno];
const otros= ()=> G.jug.filter((_,i)=>i!==G.turno);
function falta(c,t){ return Math.max(0, c.pide[t]-c.tiene[t]); }
function faltanTotal(c){ return TIPOS.reduce((s,t)=>s+falta(c,t),0); }
function limiteMano(j){ return Math.max(1, MANO_MAX - j.sumarios); }

function revisar(c, ronda){
  const completo = faltanTotal(c)===0;
  if(completo && !c.estable){ c.estable=true; c.estableDesde=ronda; }
  else if(!completo && c.estable){ c.estable=false; c.estableDesde=null; }
}

/* aporte de una carta sobre una cama: 2 si sinergia o Cirujano, si no 1 */
function aporte(carta, cama, tipoElegido){
  if(carta.sistema && carta.sistema===cama.p.sistema) return 2;
  if(carta.cirujano && (tipoElegido||carta.tipo)==="PERSONAL") return 2;
  return 1;
}
/* ¿esta carta sirve al paciente? (define tratamiento vs basura) */
function leSirve(carta, cama){
  if(carta.comodin) return TIPOS.some(t=>falta(cama,t)>0);
  if(carta.sistema && carta.sistema===cama.p.sistema && falta(cama,carta.tipo)>0) return true;
  return TIPOS.includes(carta.tipo) && falta(cama,carta.tipo)>0;
}
function puedeColocarPropia(carta, cama){
  if(!cama) return false;
  if(carta.restriccion==="PERSONAL" && cama.tiene.PERSONAL===0) return false;
  if(yo().sinFarmacos && carta.tipo==="FARMACOS") return false;
  return leSirve(carta, cama);
}
function puedeSabotear(carta, cama){
  return carta.warn && cama && !cama.atacada && !cama.escudo;
}

/* ══ colocar ════════════════════════════════════════════════════════ */
function colocar(carta, cama, duenio, esSabotaje){
  const j = yo();
  j.mano.splice(j.mano.indexOf(carta),1);
  let tipo = carta.tipo;
  if(carta.comodin){
    tipo = TIPOS.filter(t=>falta(cama,t)>0)
                .sort((a,b)=>falta(cama,b)-falta(cama,a))[0] || "FARMACOS";
  }
  const sirve = leSirve(carta, cama);

  if(esSabotaje && !sirve){
    cama.basura.push(carta);
    anota("m", `${j.nombre} tira ${carta.nombre} sobre ${cama.p.nombre} (${duenio.nombre}): basura clínica.`);
  } else {
    const ap = aporte(carta, cama, tipo);
    cama.tiene[tipo] += ap;
    cama.puestos.push(carta);
    if(carta.previene) cama.protege.push(carta.previene);
    const doble = ap===2 ? " ×2" : "";
    anota("", esSabotaje
      ? `${j.nombre} le pone ${carta.nombre} a ${cama.p.nombre} (${duenio.nombre}) — le sirve${doble}.`
      : `${j.nombre} trata a ${cama.p.nombre} con ${carta.nombre}${doble}.`);
  }
  if(esSabotaje) cama.atacada = true;

  if(carta.warn) complicar(carta, cama, duenio);
  revisar(cama, G.ronda);
  G.descG.push(carta);

  j.coloc--;
  if(carta.restriccion==="TURNO"){ j.coloc = 0; anota("", "La Resonancia con Cupo cierra el Pase de Visita."); }
}

/* COLOCAR NUNCA MATA: piso universal de 1 ❤️ */
function complicar(carta, cama, duenio){
  const nom = carta.compNombre;
  if(nom && cama.protege.includes(nom)){
    anota("a", `🛡️ ${nom} prevenida en ${cama.p.nombre}.`); return;
  }
  const antes = cama.vida;
  cama.vida = Math.max(1, cama.vida - 1);
  if(cama.vida===antes) anota("", `⚠️ ${nom}: ${cama.p.nombre} ya estaba en 1 ❤️ — colocar nunca mata.`);
  else anota("m", `⚠️ ${nom}: ${cama.p.nombre} pierde 1 ❤️ (queda ${cama.vida}).`);
  if(carta.turno24 && duenio.mano.length){
    const b = duenio.mano.pop(); G.descG.push(b);
    anota("m", `El Turno Veinticuatro: ${duenio.nombre} descarta ${b.nombre}.`);
  }
}

/* ══ fases ══════════════════════════════════════════════════════════ */
function entrarFase(f){
  G.fase = f;
  const j = yo();
  if(f===0){ faseEntrega(); }
  if(f===2){ j.coloc = COLOCACIONES - (j.colocMod||0); j.colocMod = 0; }
  if(f===3){ faseFin(); }
  guardar(); render();
  if(j.ia && !G.fin && !G.pendiente) setTimeout(iaJuega, 550);
}

function faseEntrega(){
  const j = yo();
  // a) altas — con ✅ de antes de este turno y sin basura encima
  j.camas.forEach((c,i)=>{
    if(c && c.estable && c.estableDesde!==null && c.estableDesde < G.ronda){
      if(c.basura.length){
        anota("", `${c.p.nombre} está listo pero tiene basura clínica: el alta espera.`);
        return;
      }
      j.altas.push(c.p);
      c.puestos.forEach(x=>G.descG.push(x));
      anota("a", `ALTA · ${c.p.nombre} (+${c.p.alta}) — ${j.nombre}`);
      j.camas[i] = null;
    }
  });
  // b) admisión obligatoria → se resuelve en la UI (o por la IA)
  // c) robo → tras la admisión
  pedirAdmision();
}

function pedirAdmision(){
  const j = yo();
  const i = j.camas.findIndex(c=>c===null);
  if(i<0 || !G.mazoP.length){ hacerRobo(); return; }
  const ops = [G.mazoP.pop()]; if(G.mazoP.length) ops.push(G.mazoP.pop());
  if(j.ia){
    const mejor = ops.slice().sort((a,b)=>
      (b.alta-b.fallece)/Math.max(1,b.total) - (a.alta-a.fallece)/Math.max(1,a.total))[0];
    resolverAdmision(i, ops, mejor);
  } else {
    G.pendiente = {tipo:"admision", cama:i, ops};
    render();
  }
}
function resolverAdmision(i, ops, elegido){
  const j = yo();
  j.camas[i] = nuevaCama(elegido);
  ops.filter(o=>o!==elegido).forEach(o=>G.mazoP.unshift(o));
  G.informe = G.mazoP.length ? G.mazoP[G.mazoP.length-1] : null;
  anota("", `${j.nombre} admite a ${elegido.nombre} (${elegido.gravedad}).`);
  G.pendiente = null;
  pedirAdmision();
}
function hacerRobo(){
  const j = yo();
  const n = Math.max(0, ROBO + (j.roboMod||0)); j.roboMod = 0;
  for(let i=0;i<n;i++) robar(j);
  anota("", `${j.nombre} roba ${n}.`);
  G.pendiente = null;
  entrarFase(1);
}

function faseFin(){
  const j = yo();
  j.camas.forEach((c,i)=>{
    if(!c) return;
    if(!c.estable){
      c.vida -= 1 + (c.extraDeterioro||0);
      c.extraDeterioro = 0;
    }
    if(c.vida<=0){
      j.muertos.push(c.p);
      anota("m", `✝️ ALTA CELESTIAL · ${c.p.nombre} (${c.p.fallece}) — ${j.nombre}`);
      c.puestos.concat(c.basura).forEach(x=>G.descG.push(x));
      j.camas[i]=null;
      if(G.sumariosLibres>0){ j.sumarios++; G.sumariosLibres--; }
    }
  });
  j.camas.forEach(c=>{ if(c){ c.atacada=false; c.escudo=false; } });
  if(j.mano.length > limiteMano(j)){
    if(j.ia){
      while(j.mano.length>limiteMano(j)) G.descG.push(j.mano.pop());
      terminarTurno();
    } else { G.pendiente = {tipo:"descartar"}; UI.marcarDescartes=[]; render(); }
  } else terminarTurno();
}

function terminarTurno(){
  const j = yo();
  j.compraHecha=false; j.accionHecha=false; j.sinFarmacos=false;
  G.pendiente = null;
  G.turno++;
  if(G.turno >= G.jug.length){
    G.turno = 0; G.ronda++;
    G.sinAcciones = false;
    if(G.ronda > RONDAS){ G.fin = true; guardar(); render(); return; }
    anota("r", `RONDA ${G.ronda}`);
  }
  if(G.modo==="hotseat" && !yo().ia){ G.pendiente = {tipo:"pasa"}; guardar(); render(); }
  else entrarFase(0);
}

/* ══ puntuación ═════════════════════════════════════════════════════ */
function puntos(j){
  let p = j.altas.reduce((s,c)=>s+c.alta,0) + j.muertos.reduce((s,c)=>s+c.fallece,0);
  p -= j.camas.filter(c=>c===null).length;              // camas vacías al final
  if(!j.muertos.length) p += 3;
  else if(j.muertos.every(c=>c.gravedad==="III"||c.gravedad==="ROJO")) p += 1;
  return p;
}

/* ══ IA (misma heurística que tools/simular_v030.py) ════════════════ */
function iaElegirCamas(j){
  return j.camas.filter(c=>c && !c.estable && faltanTotal(c)>0)
    .map(c=>({c, alc: faltanTotal(c) <= c.vida*2.1,
              val:(c.p.alta-c.p.fallece)/faltanTotal(c)}))
    .sort((a,b)=> (a.alc===b.alc ? b.val-a.val : (a.alc?-1:1)))
    .map(x=>x.c);
}
function iaElegirCarta(j, cama){
  const cands = j.mano.filter(c=>puedeColocarPropia(c,cama));
  if(!cands.length) return null;
  // prioriza sinergia/doble, luego normal, comodín al final; limpia antes que ⚠️
  const puntua = c => (c.comodin?3:0) + (aporte(c,cama)===2?-2:0) + (c.warn?1:0);
  return cands.sort((a,b)=>puntua(a)-puntua(b))[0];
}
function iaSabotaje(j){
  const warns = j.mano.filter(c=>c.warn);
  if(!warns.length) return null;
  let best=null;
  otros().forEach(r=>r.camas.forEach(cama=>{
    if(!cama || cama.atacada || cama.escudo) return;
    warns.forEach(c=>{
      if(leSirve(c,cama)) return;               // sería un regalo
      const urg = -faltanTotal(cama) + (cama.estable?3:0);
      if(urg < -2) return;                       // solo si de verdad estorba
      if(!best || urg>best.urg) best = {urg, carta:c, cama, duenio:r};
    });
  }));
  return best;
}
function iaJuega(){
  const j = yo();
  if(G.fin || !j.ia) return;
  if(G.fase===1){ entrarFase(2); return; }        // la IA no usa la Pizarra
  if(G.fase===2){
    let guard = 30;
    while(j.coloc>0 && guard-- > 0){
      // limpiar basura que retiene un alta o bloquea un ✅ inminente
      const bloq = j.camas.find(c=>c && c.basura.length && (c.estable || faltanTotal(c)<=1));
      if(bloq){ G.descG.push(bloq.basura.pop()); j.coloc--;
        anota("", `${j.nombre} des-escala en ${bloq.p.nombre}.`); revisar(bloq,G.ronda); continue; }
      // sabotaje prioritario: negarle el ✅ al que está por cerrar
      const sab = iaSabotaje(j);
      if(sab && faltanTotal(sab.cama)<=1 && !sab.cama.estable){
        colocar(sab.carta, sab.cama, sab.duenio, true); continue;
      }
      let hecho=false;
      for(const cama of iaElegirCamas(j)){
        const carta = iaElegirCarta(j, cama);
        if(carta){ colocar(carta, cama, j, false); hecho=true; break; }
      }
      if(hecho) continue;
      if(sab){ colocar(sab.carta, sab.cama, sab.duenio, true); continue; }
      break;
    }
    while(j.sumarios>0 && j.mano.length>=2){
      G.descG.push(j.mano.pop()); G.descG.push(j.mano.pop()); j.sumarios--; G.sumariosLibres++;
      anota("a", `${j.nombre} cierra un Sumario.`);
    }
    entrarFase(3); return;
  }
}

function cargar(){

       const g=JSON.parse(s); if(!g||!g.jug) return false; G=g; return true; }

}

/* ══ render: tablero partido ════════════════════════════════════════ */
const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c;
                      if(h!==undefined) e.innerHTML=h; return e; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!G){ app.appendChild(pantallaInicio()); pintarCapa(); return; }
  if(G.fin){ app.appendChild(pantallaFinal()); pintarCapa(); return; }

  app.appendChild(barraEstado());
  const g = textoGuia();
  if(g) app.appendChild(el("div","guia",g));

  // ── mitad de arriba: el rival ──
  otros().forEach(r=>app.appendChild(zonaJugador(r,false)));

  app.appendChild(zonaJugador(yo(),true));
  // las 3 cartas del turno: se abren al empezar y se van en el Pase de Visita
  if(G.fase<=1) app.appendChild(zonaPizarra());
  app.appendChild(pie());
  pintarCapa();
}

function vistaCama(c, i, duenio, propio){
  if(!c) return el("div","cama vacia","cama vacía");
  const sel = UI.sel;
  const activo = G.fase===2 && !yo().ia && yo().coloc>0 && !G.pendiente;
  const objetivo = sel && activo &&
    (propio ? puedeColocarPropia(sel,c) : puedeSabotear(sel,c));

  let clase = "cama";
  if(c.estable) clase += " est";
  if(objetivo) clase += " blanco";
  const d = el(objetivo ? "button" : "div", clase);

  const col = SIS[c.p.sistema] ? SIS[c.p.sistema][1] : "var(--ink-3)";
  const raya = el("i","raya"); raya.style.background = col; d.appendChild(raya);
  d.appendChild(el("span","pnom",esc(c.p.nombre)));
  d.appendChild(el("span","grav",
    `${esc(c.p.gravedad)}${SIS[c.p.sistema]?" · "+SIS[c.p.sistema][0]:""}`));

  const hp = el("div","corazones");
  for(let k=0;k<c.vidaMax;k++) hp.appendChild(el("i", k<c.vida?"hp":"hp off"));
  hp.appendChild(el("span","hpnum",String(c.vida)));
  d.appendChild(hp);

  const rq = el("div","reqs");
  TIPOS.forEach(t=>{
    if(!c.pide[t] && !c.tiene[t]) return;
    const listo = falta(c,t)===0;
    const r = el("div", listo?"req listo":"req");
    r.appendChild(el("span","ic",IC[t]));
    const cas = el("span","casillas");
    const total = Math.max(c.pide[t], c.tiene[t]);
    for(let k=0;k<total;k++)
      cas.appendChild(el("i", k<c.tiene[t] ? (k<c.pide[t]?"cas full":"cas extra") : "cas"));
    r.appendChild(cas);
    rq.appendChild(r);
  });
  d.appendChild(rq);

  const sellos = el("div","sellos");
  if(c.estable) sellos.appendChild(el("span","sello ok","✅"));
  if(c.basura.length) sellos.appendChild(el("span","sello bas",`↯${c.basura.length} retiene alta`));
  if(c.escudo) sellos.appendChild(el("span","sello esc","🛡️"));
  c.protege.forEach(p=>sellos.appendChild(el("span","sello pro",`🛡️ ${esc(p.split(" ")[0])}`)));
  if(sellos.childNodes.length) d.appendChild(sellos);

  if(objetivo){
    d.appendChild(el("span","cama-btn",
      propio ? "Tratar" : (leSirve(sel,c) ? "Le sirve ⚠️" : "Sabotear")));
    d.onclick = ()=>{ colocar(sel, c, duenio, !propio); UI.sel=null; guardar(); render(); };
  } else if(activo && propio && !sel && c.basura.length){
    const b = el("button","cama-btn sec","Des-escalar");
    b.onclick = ()=>{ G.descG.push(c.basura.pop()); yo().coloc--;
      anota("",`Des-escalada en ${c.p.nombre}.`); revisar(c,G.ronda); guardar(); render(); };
    d.appendChild(b);
  }
  return d;
}

function barraAcciones(){
  const j = yo();
  const b = el("div","acciones");
  const add = (txt, cls, fn, dis)=>{
    const x = el("button","btn "+(cls||""),esc(txt));
    if(dis) x.disabled = true; else x.onclick = fn;
    b.appendChild(x); return x;
  };
  if(G.pendiente && G.pendiente.tipo==="descartar"){
    const faltan = j.mano.length - limiteMano(j) - UI.marcarDescartes.length;
    add(faltan>0?`Marca ${faltan} más`:"Descartar","pri",()=>{
      UI.marcarDescartes.forEach(u=>{
        const i = j.mano.findIndex(c=>c.uid===u);
        if(i>=0) G.descG.push(j.mano.splice(i,1)[0]);
      });
      UI.marcarDescartes=[]; terminarTurno();
    }, faltan!==0);
    return b;
  }
  if(j.ia){ add("La IA está jugando…","",null,true); return b; }
  if(G.fase===1){
    add("Limpiar Pizarra","",()=>{
      G.pizarra.forEach(a=>G.descA.push(a)); G.pizarra=[];
      for(let i=0;i<3;i++){ const a=G.mazoA.pop(); if(a) G.pizarra.push(a); }
      j.compraHecha=true; anota("",`${j.nombre} limpia la Pizarra.`); guardar(); render();
    }, j.compraHecha);
    add("Al Pase de Visita","pri",()=>entrarFase(2));
  }
  if(G.fase===2){
    if(j.sumarios>0)
      add("Cerrar Sumario","",()=>{
        G.descG.push(j.mano.pop()); G.descG.push(j.mano.pop());
        j.sumarios--; G.sumariosLibres++;
        anota("a",`${j.nombre} cierra un Sumario.`); guardar(); render();
      }, j.mano.length<2);
    if(UI.sel) add("Cancelar","",()=>{ UI.sel=null; render(); });
    add("Terminar turno","pri",()=>{ UI.sel=null; entrarFase(3); });
  }
  return b;
}

/* ── capa: cortina, admisión, compra, panel ─────────────────────────── */
function pintarCapa(){
  const capa = document.getElementById("capa");
  capa.innerHTML = "";
  if(UI.modal){ capa.appendChild(UI.modal); return; }
  if(!G || !G.pendiente) return;
  if(G.pendiente.tipo==="pasa"){ capa.appendChild(cortina()); return; }
  if(G.pendiente.tipo==="admision"){ capa.appendChild(modalAdmision()); return; }
}

function cortina(){
  const c = el("div","cortina");
  c.appendChild(el("h2",null,esc(yo().nombre)));
  c.appendChild(el("p",null,"Pásale el teléfono. Nadie más debería ver tu mano."));
  const b = el("button","btn","Estoy listo");
  b.onclick = ()=>{ G.pendiente=null; entrarFase(0); };
  c.appendChild(b);
  return c;
}

function modalAdmision(){
  const ops = G.pendiente.ops;
  const velo = el("div","velo");
  const m = el("div","modal");
  m.appendChild(el("div","tirador"));
  m.appendChild(el("h2","Admisión obligatoria"));
  m.appendChild(el("p","Elige a quién le das la cama. El otro vuelve al fondo de Urgencias."));
  const cont = el("div","opciones");
  ops.forEach(o=>{
    const b = el("button","op");
    const pide = TIPOS.filter(t=>o.pide[t]>0).map(t=>`${IC[t]}${o.pide[t]}`).join(" ");
    b.innerHTML = `<b>${esc(o.nombre)}</b><small>${esc(o.gravedad)} · ❤️${o.vida} · pide ${pide} · alta +${o.alta} / fallece ${o.fallece}</small>`;
    b.onclick = ()=> resolverAdmision(G.pendiente.cama, ops, o);
    cont.appendChild(b);
  });
  m.appendChild(cont);
  velo.appendChild(m);
  return velo;
}

function hoja(titulo, construir){
  const velo = el("div","velo");
  const m = el("div","modal");
  m.appendChild(el("div","tirador"));
  m.appendChild(el("h2",esc(titulo)));
  construir(m, ()=>{ UI.modal=null; render(); });
  velo.appendChild(m);
  velo.onclick = e => { if(e.target===velo){ UI.modal=null; render(); } };
  UI.modal = velo; render();
}

function abrirPanel(){
  hoja("Panel de guardia", (m, cerrar)=>{
    const g = el("div","marcador");
    G.jug.forEach(j=>{
      const t = el("div","mtile");
      t.appendChild(el("div","n",String(puntos(j))));
      t.appendChild(el("div","l",`${esc(j.nombre)} · ${j.altas.length} altas · ${j.muertos.length} ✝️`));
      g.appendChild(t);
    });
    m.appendChild(g);

    if(yo().protocolos.length){
      const bl = el("div","bloque");
      bl.appendChild(el("h3",null,"Tus Protocolos"));
      const ops = el("div","opciones");
      yo().protocolos.forEach((a,idx)=>{
        const b = el("button","op");
        b.innerHTML = `<b>${esc(a.nombre)}</b><small>${esc(a.texto)}</small>`;
        if(!yo().accionHecha && !G.sinAcciones){
          b.onclick = ()=>{
            yo().protocolos.splice(idx,1); G.descA.push(a); yo().accionHecha=true;
            anota("a",`${yo().nombre} juega ${a.nombre}. Aplícala a mano.`);
            guardar(); UI.modal=null; alertaJugada(a);
          };
        } else b.disabled = true;
        ops.appendChild(b);
      });
      bl.appendChild(ops);
      bl.appendChild(el("div","nota","Las Acciones se aplican a mano: la app las anota, tú mueves las fichas."));
      m.appendChild(bl);
    }

    const es = el("div","bloque");
    es.appendChild(el("h3",null,"Escudos 🛡️ (los pones a mano)"));
    const fil = el("div"); fil.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
    let hay = false;
    yo().camas.forEach(c=>{
      if(!c) return;
      hay = true;
      const b = el("button","btn chico", (c.escudo?"🛡️ ":"") + c.p.nombre.split(" ")[0]);
      if(c.escudo) b.classList.add("pri");
      b.onclick = ()=>{ c.escudo=!c.escudo;
        anota("a",`${c.escudo?"Escudo sobre":"Escudo fuera de"} ${c.p.nombre}.`);
        guardar(); UI.modal=null; render(); abrirPanel(); };
      fil.appendChild(b);
    });
    if(!hay) fil.appendChild(el("span","nota","No tienes pacientes en cama."));
    es.appendChild(fil);
    es.appendChild(el("div","nota","Marca aquí al jugar <i>El Que Guarda Siempre Tiene</i>: el árbitro no dejará que te saboteen esa cama hasta tu próximo turno."));
    m.appendChild(es);

    const av = el("div","bloque");
    av.appendChild(el("h3",null,"Tu avatar"));
    av.appendChild(el("p",`<b>${esc(yo().avatar.nombre)}</b> · ${esc(yo().avatar.frecuencia)}<br>${esc(yo().avatar.habilidad)}`));
    const bu = el("button","btn chico","Usé mi habilidad");
    bu.onclick = ()=>{ anota("a",`${yo().nombre} usa ${yo().avatar.nombre}.`); guardar(); cerrar(); };
    av.appendChild(bu);
    m.appendChild(av);

    const bl2 = el("div","bloque");
    bl2.appendChild(el("h3",null,`Bitácora · ${G.log.length}`));
    const l = el("div","log");
    G.log.slice(-100).reverse().forEach(x=> l.appendChild(el("div",x.cls,esc(x.txt))));
    bl2.appendChild(l);
    const bc = el("button","btn chico","Copiar bitácora");
    bc.style.marginTop="8px";
    bc.onclick = ()=>{
      const txt = G.log.map(x=>`R${x.r} · ${x.txt}`).join("\n");
      if(navigator.clipboard) navigator.clipboard.writeText(txt);
      bc.textContent = "Copiada ✓";
    };
    bl2.appendChild(bc);
    m.appendChild(bl2);

    const cerrarB = el("button","btn pri","Cerrar");
    cerrarB.onclick = cerrar;
    m.appendChild(cerrarB);
  });
}

function abrirCompra(idx){
  const j = yo(); const a = G.pizarra[idx]; const coste = +a.coste;
  const marcados = [];
  hoja(`Comprar · ${a.nombre}`, (m, cerrar)=>{
    m.appendChild(el("p",`Cuesta <b>${coste}</b> carta${coste>1?"s":""} de tu mano. Marca cuáles descartas.`));
    const cont = el("div","opciones");
    let confirmar;
    j.mano.forEach(c=>{
      const b = el("button","op");
      b.innerHTML = `<b>${IC[c.tipo]||"🃏"} ${esc(c.nombre)}</b><small>${TNOM[c.tipo]||""}${c.warn?" · ⚠️ "+esc(c.compNombre):""}</small>`;
      b.onclick = ()=>{
        const i = marcados.indexOf(c.uid);
        if(i>=0){ marcados.splice(i,1); b.className="op"; }
        else if(marcados.length<coste){ marcados.push(c.uid); b.className="op sel"; }
        confirmar.disabled = marcados.length!==coste;
      };
      cont.appendChild(b);
    });
    m.appendChild(cont);
    const fila = el("div","acciones"); fila.style.padding="0";
    const can = el("button","btn","Cancelar"); can.onclick = cerrar;
    confirmar = el("button","btn pri","Comprar"); confirmar.disabled = true;
    confirmar.onclick = ()=>{
      marcados.forEach(u=>{ const i=j.mano.findIndex(c=>c.uid===u);
                            if(i>=0) G.descG.push(j.mano.splice(i,1)[0]); });
      G.pizarra.splice(idx,1);
      const nueva = G.mazoA.pop(); if(nueva) G.pizarra.push(nueva);
      j.compraHecha = true;
      anota("a",`${j.nombre} compra ${a.nombre} (${coste}).`);
      UI.modal = null; alertaAccion(a);
    };
    fila.appendChild(can); fila.appendChild(confirmar);
    m.appendChild(fila);
  });
}

/* Las Acciones no se auto-resuelven: 21 efectos con targeting propio serían
   un motor aparte, y en playtest conviene leerlas en voz alta. */
function alertaAccion(a){
  hoja(a.nombre, (m, cerrar)=>{
    m.appendChild(el("p",`<b>${esc(a.tipo)}</b> · ${esc(a.texto)}`));
    m.appendChild(el("p",`<i>“${esc(a.frase)}”</i>`));
    m.appendChild(el("p","Guárdala para después o júgala ahora. <b>Las Acciones se aplican a mano</b>: mueve las fichas y la app lo anota."));
    const fila = el("div","acciones"); fila.style.padding="0";
    const g = el("button","btn","La guardo");
    g.onclick = ()=>{ yo().protocolos.push(a); guardar(); cerrar(); };
    const p = el("button","btn pri","La juego ahora");
    p.onclick = ()=>{ anota("a",`${yo().nombre} juega ${a.nombre}. Aplícala a mano.`);
                      G.descA.push(a); yo().accionHecha=true; guardar(); cerrar(); };
    fila.appendChild(g); fila.appendChild(p);
    m.appendChild(fila);
  });
}
function alertaJugada(a){
  hoja(a.nombre, (m, cerrar)=>{
    m.appendChild(el("p",`<b>${esc(a.tipo)}</b> · ${esc(a.texto)}`));
    m.appendChild(el("p","Aplica el efecto en el tablero. Queda en la bitácora."));
    const b = el("button","btn pri","Listo"); b.onclick = cerrar;
    m.appendChild(b);
  });
}

/* ── pantallas ─────────────────────────────────────────────────────── */
function pantallaInicio(){
  const w = el("div");
  const h = el("div","portada");
  h.appendChild(el("h1",null,"¡Vaya Turno!"));
  h.appendChild(el("div","sub","Guardia virtual · reglas v0.30"));
  h.appendChild(el("p",null,
    "Árbitro digital para probar el juego donde no puedas llevar las cartas. "+
    "Lleva el reloj, los ✅, la basura clínica y los Sumarios por ti; el mazo "+
    "y las reglas son los mismos del print-and-play."));
  w.appendChild(h);
  const s = el("div","portada"); s.style.paddingTop="14px";
  const ops = el("div","opciones");
  const mk = (tit, sub, fn)=>{
    const b = el("button","op");
    b.innerHTML = `<b>${tit}</b><small>${sub}</small>`;
    b.onclick = fn; ops.appendChild(b);
  };
  mk("Solo contra la IA",
     "La IA usa la heurística medida en el simulador. Para probar en cualquier parte.",
     ()=>nuevaPartida("ia",["Tú","Dr. Silicio"]));
  mk("Dos jugadores, un teléfono",
     "Por turnos, con cortina de traspaso entre uno y otro.",
     ()=>nuevaPartida("hotseat",["Jugador 1","Jugador 2"]));
  mk("Solitario a dos manos",
     "Juegas los dos lados sin cortina, como probaste en papel.",
     ()=>nuevaPartida("abierto",["Mano A","Mano B"]));
  s.appendChild(ops);
  if(localStorage.getItem(CLAVE)){
    const b = el("button","btn pri","Retomar la guardia guardada");
    b.onclick = ()=>{ if(cargar()) render(); };
    s.appendChild(b);
  }
  s.appendChild(el("div","nota",
    "<br>Las <b>Acciones</b> y las <b>habilidades de avatar</b> se aplican a mano: "+
    "la app te las muestra y las anota, pero no las automatiza. Todo lo demás "+
    "—deterioro, ✅, ventana de alta, ⚠️, 🛡️, basura, Sumarios, puntaje— lo lleva ella."));
  w.appendChild(s);
  w.appendChild(el("div","pie-app","El formato final del juego es físico. Esto existe para probar."));
  return w;
}

function pantallaFinal(){
  const w = el("div");
  const s = el("div","portada");
  const orden = G.jug.map(j=>({j, p:puntos(j)})).sort((a,b)=>b.p-a.p);
  s.appendChild(el("h1",null,"Fin de la guardia"));
  s.appendChild(el("p",null,
    `Ocho rondas. Gana <b>${esc(orden[0].j.nombre)}</b> con ${orden[0].p} puntos.`));
  const g = el("div","marcador"); g.style.marginTop="14px";
  orden.forEach(({j,p})=>{
    const t = el("div","mtile");
    t.appendChild(el("div","n",String(p)));
    const bonus = !j.muertos.length ? "¡Durante mi guardia no! +3"
      : (j.muertos.every(c=>c.gravedad==="III"||c.gravedad==="ROJO") ? "Se hizo todo +1" : "sin logro");
    t.appendChild(el("div","l",`${esc(j.nombre)} · ${j.altas.length} altas · ${j.muertos.length} ✝️`));
    t.appendChild(el("div","l",esc(bonus)));
    g.appendChild(t);
  });
  s.appendChild(g);
  const l = el("div","log"); l.style.marginTop="14px";
  G.log.slice(-140).reverse().forEach(x=> l.appendChild(el("div",x.cls,esc(x.txt))));
  s.appendChild(l);
  const bc = el("button","btn chico","Copiar bitácora"); bc.style.marginTop="8px";
  bc.onclick = ()=>{ const txt=G.log.map(x=>`R${x.r} · ${x.txt}`).join("\n");
    if(navigator.clipboard) navigator.clipboard.writeText(txt); bc.textContent="Copiada ✓"; };
  s.appendChild(bc);
  const b = el("button","btn pri","Nueva guardia"); b.style.marginTop="12px";
  b.onclick = ()=>{ borrar(); G=null;
    UI={sel:null,selProt:null,modal:null,marcarDescartes:[]}; render(); };
  s.appendChild(b);
  w.appendChild(s);
  return w;
}

render();
</script>
